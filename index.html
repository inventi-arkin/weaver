                       <h3 className="text-md font-semibold text-white flex items-center gap-2 mb-4"><ListTodo className="w-4 h-4 text-indigo-400" /> Assigned Task List</h3>
                       <div className="space-y-2">
                          {assigneeTasks.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
                       </div>
                    </div>
                 </div>
              </div>
           );
        };

        const allMotherTasks = activeWorkflows.flatMap(wf => wf.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
        let filteredMotherTasks = allMotherTasks.filter(checkGlobalFilter);
        const plottedScopeCount = filteredMotherTasks.length;
        
        const plottedScopeEstHours = Math.round(filteredMotherTasks.reduce((sum, t) => {
            const est = parseInt(t.time_estimate) || 0;
            const spent = parseInt(t.time_spent) || 0;
            return sum + Math.max(est, spent);
        }, 0) / 3600000);
        
        const completedMotherTasks = filteredMotherTasks.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase()));
        const completedMotherCount = completedMotherTasks.length;
        const completedMotherEstHours = Math.round(completedMotherTasks.reduce((sum, t) => sum + (parseInt(t.time_estimate) || 0), 0) / 3600000);

        const spillOverTasks = filteredMotherTasks.filter(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            if (isDone) return false;
            if (t.due_date && parseInt(t.due_date) < now) return true;
            if (t.tags?.some(tag => (tag.name || '').toLowerCase().includes('spill over'))) return true;
            return false;
        });
        const spillOverCount = spillOverTasks.length;
        const spillOverEstHours = Math.round(spillOverTasks.reduce((sum, t) => sum + (parseInt(t.time_estimate) || 0), 0) / 3600000);

        const devDemandHours = plottedScopeEstHours * 0.8;
        const qaDemandHours = plottedScopeEstHours * 0.2;

        const devUtilPct = devCapacityHours > 0 ? Math.round((devDemandHours / devCapacityHours) * 100) : 0;
        const qaUtilPct = qaCapacityHours > 0 ? Math.round((qaDemandHours / qaCapacityHours) * 100) : 0;
        const bucketUtilizationPct = devCapacityHours > 0 ? Math.round((plottedScopeEstHours / devCapacityHours) * 100) : 0;

        const totalBugsCount = allBugs.length;
        const resolvedBugsCount = allBugs.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase())).length;
        const activeBugsCount = totalBugsCount - resolvedBugsCount;
        const criticalBugsCount = allBugs.filter(t => ['high', 'urgent', 'critical'].includes((t.priority?.priority || '').toLowerCase())).length;
        const bugResolutionRate = totalBugsCount === 0 ? 0 : Math.round((resolvedBugsCount / totalBugsCount) * 100);

        let totalQualityScore = 0;
        let evaluatedMotherTasks = 0;
        filteredMotherTasks.forEach(motherTask => {
            evaluatedMotherTasks++;
            const taskBugs = extractBugs([motherTask]);
            if (taskBugs.length === 0) {
                totalQualityScore += 100;
            } else {
                let penalty = 0;
                taskBugs.forEach(bug => {
                    const priority = (bug.priority?.priority || 'normal').toLowerCase();
                    if (['critical', 'urgent'].includes(priority)) penalty += 20;
                    else if (priority === 'high') penalty += 15;
                    else if (priority === 'normal') penalty += 10;
                    else penalty += 5;
                });
                totalQualityScore += Math.max(0, 100 - penalty);
            }
        });
        const avgQualityRate = evaluatedMotherTasks > 0 ? Math.round(totalQualityScore / evaluatedMotherTasks) : 100;

        let fixVelocitySumMs = 0;
        let fixVelocityCount = 0;
        allBugs.forEach(b => {
          const statusName = (b.status?.status || 'open').toLowerCase();
          if (doneStatuses.includes(statusName)) {
            let completedDate = parseDateMs(b.date_closed);
            if (!completedDate && b.activity_logs && Array.isArray(b.activity_logs)) {
               const statusLogs = b.activity_logs.filter(log => log.field === 'status').sort((x, y) => parseDateMs(x.date) - parseDateMs(y.date));
               if (statusLogs.length > 0) {
                   const lastLog = statusLogs[statusLogs.length - 1];
                   const lastLogStatus = (lastLog.after?.status || lastLog.after || '').toString().toLowerCase();
                   if (doneStatuses.includes(lastLogStatus)) completedDate = parseDateMs(lastLog.date);
               }
            }
            if (!completedDate) completedDate = parseDateMs(b.date_updated) || minDate;
            const createdDate = parseDateMs(b.date_created) || minDate;
            if (createdDate > 0 && completedDate >= createdDate) {
              fixVelocitySumMs += (completedDate - createdDate);
              fixVelocityCount++;
            }
          }
        });
        
        let avgVelocityValue = "0";
        let avgVelocityUnit = "Hours";
        if (fixVelocityCount > 0) {
          const avgVelocityMs = fixVelocitySumMs / fixVelocityCount;
          if (avgVelocityMs < 3600000) {
            avgVelocityValue = `${Math.floor(avgVelocityMs / 60000)}`;
            avgVelocityUnit = "Mins"; 
          } else {
            avgVelocityValue = (avgVelocityMs / 3600000).toFixed(1);
            avgVelocityUnit = "Hours";
          }
        }

        let totalEstForAccuracyMs = 0;
        let totalActualForAccuracyMs = 0;
        const timeInStatusStats = {};
        const excludedStatusesForAccuracy = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'closed', 'complete', 'done', 'resolved'];

        filteredTasks.forEach(t => {
            const statusName = (t.status?.status || 'open').toLowerCase();
            const isDone = doneStatuses.includes(statusName);
            const referenceNow = isDone ? parseDateMs(t.date_closed) || now : now;

            if (!isDone && !excludedStatusesForAccuracy.includes(statusName)) {
                const lastUpdated = t.date_updated ? parseDateMs(t.date_updated) : (t.date_created ? parseDateMs(t.date_created) : referenceNow);
                const timeInCurrent = Math.max(0, referenceNow - lastUpdated);
                if (timeInCurrent > 0) {
                    if (!timeInStatusStats[statusName]) timeInStatusStats[statusName] = { sum: 0, count: 0 };
                    timeInStatusStats[statusName].sum += timeInCurrent;
                    timeInStatusStats[statusName].count++;
                }
            }

            if (isDone) {
                let actualRunningMs = 0;
                let parsedTimeInStatus = {};

                if (t.activity_logs && Array.isArray(t.activity_logs) && t.activity_logs.length > 0) {
                    const statusLogs = t.activity_logs.filter(log => log.field === 'status').sort((a, b) => parseDateMs(a.date) - parseDateMs(b.date));
                    if (statusLogs.length > 0) {
                        let lastDate = parseDateMs(t.start_date) || parseDateMs(t.date_created) || parseDateMs(statusLogs[0]?.date) || 0;
                        let currentStatus = (statusLogs[0]?.before?.status || statusLogs[0]?.before || 'open').toString().toLowerCase();

                        statusLogs.forEach(log => {
                            const changeDate = parseDateMs(log.date);
                            if (lastDate > 0 && changeDate >= lastDate) {
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + (changeDate - lastDate);
                            }
                            currentStatus = (log.after?.status || log.after || currentStatus).toString().toLowerCase();
                            lastDate = changeDate;
                        });

                        if (t.date_closed && lastDate > 0) {
                            const closedDate = parseDateMs(t.date_closed);
                            if (closedDate >= lastDate) {
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + (closedDate - lastDate);
                            }
                        }
                    }
                } 
                
                if (Object.keys(parsedTimeInStatus).length === 0 && t.time_in_status) {
                    if (Array.isArray(t.time_in_status)) {
                        t.time_in_status.forEach(item => {
                            const statusStr = (item.status?.status || item.status || 'open').toString().toLowerCase();
                            parsedTimeInStatus[statusStr] = (parsedTimeInStatus[statusStr] || 0) + parseDateMs(item.time || item.duration || item.total_time || 0);
                        });
                    } else if (typeof t.time_in_status === 'object') {
                        Object.entries(t.time_in_status).forEach(([statusStr, durationMs]) => {
                            parsedTimeInStatus[statusStr.toLowerCase()] = (parsedTimeInStatus[statusStr.toLowerCase()] || 0) + parseDateMs(durationMs);
                        });
                    }
                }

                if (Object.keys(parsedTimeInStatus).length > 0) {
                    Object.entries(parsedTimeInStatus).forEach(([statusStr, durationMs]) => {
                        const cleanStatus = statusStr.toLowerCase();
                        if (!excludedStatusesForAccuracy.includes(cleanStatus)) {
                            if (!timeInStatusStats[cleanStatus]) timeInStatusStats[cleanStatus] = { sum: 0, count: 0 };
                            timeInStatusStats[cleanStatus].sum += durationMs;
                            timeInStatusStats[cleanStatus].count++;
                            actualRunningMs += durationMs;
                        }
                    });
                } else {
                    const end_date = t.date_closed ? parseDateMs(t.date_closed) : (t.date_updated ? parseDateMs(t.date_updated) : minDate);
                    const start_date = t.start_date ? parseDateMs(t.start_date) : (t.date_created ? parseDateMs(t.date_created) : end_date);
                    actualRunningMs = Math.max(0, end_date - start_date);
                }

                const estimateMs = t.time_estimate ? parseDateMs(t.time_estimate) : 0;
                if (actualRunningMs > 0 && estimateMs > 0) {
                    totalEstForAccuracyMs += estimateMs;
                    totalActualForAccuracyMs += actualRunningMs;
                }
            }
        });

        let estimationAccuracyDisplay = "N/A";
        if (totalEstForAccuracyMs > 0) {
            const error = Math.abs(totalActualForAccuracyMs - totalEstForAccuracyMs) / totalEstForAccuracyMs;
            estimationAccuracyDisplay = `${Math.max(0, Math.round((1 - error) * 100))}%`;
        }

        const avgTimeInStatusList = Object.entries(timeInStatusStats).map(([status, data]) => {
            const avgMs = data.sum / data.count;
            const days = Math.floor(avgMs / 86400000);
            const hours = Math.floor((avgMs % 86400000) / 3600000);
            const mins = Math.floor((avgMs % 3600000) / 60000);
            let timeDisplay = days > 0 ? `${days}d ${hours}h` : (hours > 0 ? `${hours}h ${mins}m` : `${mins}m`);
            return { status, timeDisplay, avgMs };
        }).sort((a, b) => b.avgMs - a.avgMs);

        const stalledTasksCandidates = filteredTasks.filter(t => {
            const nameLower = (t.name || '').toLowerCase();
            const statusLower = (t.status?.status || '').toLowerCase();
            if (nameLower === 'ui bugs' || nameLower === 'qa bugs' || doneStatuses.includes(statusLower) || statusLower === 'sprint backlog') return false;
            const createdDate = parseInt(t.date_created);
            const estimateMs = parseInt(t.time_estimate);
            if (createdDate && estimateMs > 0 && (now - createdDate > estimateMs)) return true;
            return false;
        });

        const stalledTaskIds = new Set(stalledTasksCandidates.map(t => t.id));
        const hasStalledDescendant = (task) => task.subtasks?.some(sub => stalledTaskIds.has(sub.id) || hasStalledDescendant(sub)) || false;

        const stalledTasks = stalledTasksCandidates
          .filter(t => !hasStalledDescendant(t))
          .sort((a, b) => (now - (parseInt(b.date_created) || now)) - (now - (parseInt(a.date_created) || now)))
          .slice(0, 5);

        // --- STREAMING_CHUNK:CSV Export Logic ---
        const handleExportCSV = () => {
            const escapeCSV = (str) => {
                if (str === null || str === undefined) return '""';
                const s = String(str).replace(/"/g, '""');
                return `"${s}"`;
            };

            const formatHours = (ms) => {
                if (!ms || isNaN(ms)) return '0.00';
                return (ms / 3600000).toFixed(2);
            };

            const headers = [
                'Task Name', 'List/Workflow', 'Status', 'Priority', 
                'Estimated Hours', 'Logged Hours (ClickUp)', 'Logged Hours (Weaver)', 'Total Logged Hours',
                'Assignees', 'Tags', 'Date Created', 'Date Closed'
            ];

            const rows = [headers.join(',')];

            filteredTasks.forEach(task => {
                const parentWf = activeWorkflows.find(wf => flattenTasksDeep(wf.tasks).some(t => t.id === task.id)) || { list: 'Unknown' };

                const name = escapeCSV(task.name);
                const list = escapeCSV(parentWf.list);
                const status = escapeCSV(task.status?.status || 'Open');
                const priority = escapeCSV(task.priority?.priority || 'Normal');
                
                const estMs = task.directEstimate !== undefined ? task.directEstimate : (task.time_estimate ? parseInt(task.time_estimate) : 0);
                const clickupLoggedMs = task.directNativeSpent !== undefined ? task.directNativeSpent : (task.rawNativeSpent ? parseInt(task.rawNativeSpent) : 0);
                const weaverLoggedMs = task._totalLocalAddedMs || 0;
                const totalLoggedMs = clickupLoggedMs + weaverLoggedMs;

                const estHrs = escapeCSV(formatHours(estMs));
                const cuLoggedHrs = escapeCSV(formatHours(clickupLoggedMs));
                const wvrLoggedHrs = escapeCSV(formatHours(weaverLoggedMs));
                const totLoggedHrs = escapeCSV(formatHours(totalLoggedMs));

                const assignees = escapeCSV((task.assignees || []).map(a => a.username).join('; '));
                const tags = escapeCSV((task.tags || []).map(t => t.name).join('; '));
                
                const created = task.date_created ? escapeCSV(new Date(parseInt(task.date_created)).toLocaleDateString()) : '""';
                const closed = task.date_closed ? escapeCSV(new Date(parseInt(task.date_closed)).toLocaleDateString()) : '""';

                rows.push([name, list, status, priority, estHrs, cuLoggedHrs, wvrLoggedHrs, totLoggedHrs, assignees, tags, created, closed].join(','));
            });

            const csvContent = rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `weaver_export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        
        // --- STREAMING_CHUNK:Integration UI Output ---
        const integrationUI = (
          <div className="animate-in fade-in duration-500 w-full">
            {integrationStep === 'idle' && mappedWorkflows.length === 0 && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden flex flex-col md:flex-row items-center justify-between p-8">
                <div className="mb-4 md:mb-0">
                  <h2 className="text-lg font-semibold text-white">Connect your ticketing system</h2>
                  <p className="text-slate-400 mt-1 max-w-xl">To start weaving, connect Weaver to ClickUp. This allows us to automatically sync your support tickets with your development tasks.</p>
                </div>
                <button onClick={handleConnectClickUp} className="btn-neon btn-neon-indigo shrink-0">
                  <Settings className="h-4 w-4 mr-2 animate-spin-slow" /> Connect ClickUp
                </button>
              </div>
            )}

            {integrationStep === 'entering_token' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-8 animate-in fade-in slide-in-from-bottom-4">
                <div className="flex items-center mb-6">
                  <div className="bg-indigo-500/10 p-2.5 rounded-lg mr-4 border border-indigo-500/20"><Key className="h-6 w-6 text-indigo-400" /></div>
                  <div><h3 className="text-lg font-semibold text-white">Enter ClickUp API Token</h3><p className="text-sm text-slate-400">Provide your Personal Access Token to retrieve your Workspaces.</p></div>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">Personal Access Token</label>
                    <input type="password" value={tempToken} onChange={(e) => setTempToken(e.target.value)} placeholder="pk_123456789_..." className="w-full bg-slate-950/60 border border-transparent rounded-lg px-4 py-3 text-white neon-input neon-input-indigo" />
                  </div>
                  {clickUpError && (
                    <div className="p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-sm text-red-300">
                      <div className="flex items-start mb-3"><AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" /><span className="font-medium">{clickUpError}</span></div>
                      <button onClick={handleMockClickUpData} className="w-full flex justify-center py-2 px-4 border border-red-900/50 rounded-lg shadow-sm text-sm font-medium text-red-200 bg-red-950/40 hover:bg-red-900/30 transition-colors neon-border-rose">Bypass with Mock ClickUp Data (Preview)</button>
                    </div>
                  )}
                  <div className="flex justify-end space-x-3 pt-2">
                    <button onClick={handleCancelIntegration} className="px-4 py-2 text-sm font-medium text-slate-400 rounded-lg neon-border-slate transition-all">Cancel</button>
                    <button onClick={handleAuthenticateToken} disabled={!tempToken} className="btn-neon btn-neon-indigo">Authenticate</button>
                  </div>
                </div>
              </div>
            )}

            {integrationStep === 'connecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-12 flex flex-col items-center justify-center text-center animate-in fade-in">
                <RefreshCw className="h-8 w-8 text-indigo-400 animate-spin mb-4" />
                <h3 className="text-lg font-semibold text-white">Authenticating with ClickUp</h3>
                <p className="text-slate-400 mt-2 max-w-md">Securely connecting and fetching your hierarchy. Please wait...</p>
              </div>
            )}

            {integrationStep === 'selecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-indigo-500/20 shadow-2xl overflow-hidden animate-in fade-in slide-in-from-bottom-4">
                <div className="bg-indigo-500/10 px-6 py-4 border-b border-indigo-500/20 flex items-center">
                  <div className="bg-indigo-600 p-1.5 rounded-md mr-3 shadow-md"><SpiderNetworkIcon className="h-5 w-5 text-white" /></div>
                  <div><h3 className="text-lg font-semibold text-white">Map ClickUp Destination</h3><p className="text-sm text-indigo-300">Choose where Weaver tasks should be synced.</p></div>
                </div>
                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">1. Select Workspace</label>
                    <select value={selectedTeam} onChange={(e) => { setSelectedTeam(e.target.value); setSelectedSpace(''); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-white neon-input neon-input-indigo">
                      <option value="" className="bg-slate-900 text-slate-300">-- Choose a Workspace --</option>
                      {teams.map(t => <option key={t.id} value={t.id} className="bg-slate-900 text-white">{t.name}</option>)}
                    </select>
                  </div>
                  {selectedTeam && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">2. Select Space</label>
                      <select value={selectedSpace} onChange={(e) => { setSelectedSpace(e.target.value); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-white neon-input neon-input-indigo">
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a Space --</option>
                        {spaces.map(s => <option key={s.id} value={s.id} className="bg-slate-900 text-white">{s.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">3. Select Folder <span className="text-slate-500 font-normal">(Optional)</span></label>
                      <select value={selectedFolder} onChange={(e) => { setSelectedFolder(e.target.value); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-white neon-input neon-input-indigo">
                        <option value="" className="bg-slate-900 text-slate-300">-- Folderless / Direct to Space --</option>
                        {folders.map(f => <option key={f.id} value={f.id} className="bg-slate-900 text-white">{f.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">4. Select Task List</label>
                      <select value={selectedList} onChange={(e) => setSelectedList(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-white neon-input neon-input-indigo">
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a List --</option>
                        {availableLists.map(l => <option key={l.id} value={l.id} className="bg-slate-900 text-white">{l.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-white/5">
                    <button onClick={handleCancelIntegration} className="px-4 py-2 text-sm font-medium text-slate-400 rounded-lg neon-border-slate transition-all">Cancel</button>
                    <button disabled={!selectedList} onClick={handleAddMapping} className="btn-neon btn-neon-indigo"><CheckCircle2 className="h-4 w-4 mr-2" /> Add to Weaver</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        // --- STREAMING_CHUNK:Main Layout Return ---
        return (
          <div className="min-h-screen bg-slate-950 font-sans text-slate-100 relative">
            <WebNestBackground opacity={0.35} />

            {/* Dimension Warp Splash Screen */}
            {warpStage !== 'idle' && (
              <div className="fixed inset-0 z-[999999] pointer-events-none flex flex-col items-center justify-center overflow-hidden">
                
                {/* Main Dark Background - fades out during 'fade' */}
                <div className={`absolute inset-0 bg-slate-950 transition-opacity ${warpStage === 'fade' ? 'opacity-0 duration-[1500ms] ease-in-out' : 'opacity-100 duration-300'}`}></div>

                {/* The exploding bright light core (Behind Spider) */}
                <div className={`absolute rounded-full transition-all ease-in-out ${warpStage === 'flash' || warpStage === 'fade' ? 'w-[150vw] h-[150vw] bg-indigo-100 blur-[100px] opacity-100 duration-[400ms]' : 'w-[20vw] h-[20vw] bg-indigo-600/20 blur-[80px] opacity-100 animate-pulse duration-0'}`}></div>

                {/* Spider and Rings - fades out during 'fade' */}
                <div className={`relative flex items-center justify-center transition-opacity ${warpStage === 'fade' ? 'opacity-0 duration-[1000ms] ease-in-out' : 'opacity-100'}`}>
                    <div className={`absolute rounded-full border transition-all animate-[spin_4s_linear_infinite] ${warpStage === 'flash' || warpStage === 'fade' ? 'w-[120vw] h-[120vw] border-indigo-100/80 duration-[400ms]' : 'w-[40vw] h-[40vw] border-indigo-500/20 duration-0'}`}></div>
                    <div className={`absolute rounded-full border transition-all animate-[spin_3s_linear_infinite_reverse] ${warpStage === 'flash' || warpStage === 'fade' ? 'w-[90vw] h-[90vw] border-indigo-100/90 duration-[400ms]' : 'w-[30vw] h-[30vw] border-indigo-400/30 duration-0'}`}></div>
                    <div className={`absolute rounded-full border transition-all animate-[spin_2s_linear_infinite] ${warpStage === 'flash' || warpStage === 'fade' ? 'w-[60vw] h-[60vw] border-white duration-[400ms]' : 'w-[20vw] h-[20vw] border-indigo-300/40 duration-0'}`}></div>
                    
                    <div className={`relative p-8 rounded-full border-2 transition-all duration-[400ms] ${warpStage === 'flash' || warpStage === 'fade' ? 'border-white shadow-[0_0_150px_rgba(255,255,255,1)] bg-indigo-400' : 'bg-slate-900 border-indigo-500 shadow-[0_0_100px_rgba(99,102,241,1)]'}`}>
                      <SpiderNetworkIcon className={`h-24 w-24 transition-colors duration-[400ms] ${warpStage === 'flash' || warpStage === 'fade' ? 'text-white drop-shadow-[0_0_10px_rgba(255,255,255,1)]' : 'text-indigo-400'} ${warpStage === 'weaving' ? 'animate-pulse' : ''}`} />
                    </div>
                </div>

                {/* Text Elements - fades out during 'flash' */}
                <div className={`relative mt-12 flex flex-col items-center transition-opacity duration-300 ${warpStage === 'flash' || warpStage === 'fade' ? 'opacity-0' : 'opacity-100'}`}>
                  <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400 tracking-[0.2em] animate-pulse">
                    Weaving Dimension
                  </h2>
                  <p className="mt-4 text-indigo-300/70 font-mono text-sm tracking-widest uppercase">Synchronizing Neural Link...</p>
                </div>
                
                {/* Overpowering Light Wash - blends the screen brightly, then fades */}
                <div className={`absolute inset-0 transition-opacity pointer-events-none mix-blend-screen bg-[radial-gradient(circle_at_center,rgba(255,255,255,1)_0%,rgba(199,210,254,0.6)_40%,rgba(99,102,241,0)_100%)] ${warpStage === 'flash' ? 'opacity-100 duration-[400ms] ease-in' : warpStage === 'fade' ? 'opacity-0 duration-[1500ms] ease-out' : 'opacity-0 duration-0 hidden'}`}></div>
              </div>
            )}

            {/* Profile Update Modal */}
            {isProfileModalOpen && (
               <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                  <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden animate-in zoom-in-95">
                     <div className="flex items-center justify-between p-5 border-b border-slate-700/80 bg-slate-800/50">
                        <h2 className="text-lg font-bold text-white flex items-center gap-2"><ImageIcon className="w-5 h-5 text-indigo-400" /> Update Profile Picture</h2>
                        <button onClick={() => setIsProfileModalOpen(false)} className="p-1.5 rounded-lg text-slate-400 neon-border-slate transition-colors"><X className="w-5 h-5" /></button>
                     </div>
                     <div className="p-6 space-y-6">
                        <div className="flex flex-col items-center gap-4">
                           <img src={newProfilePicUrl || user.avatar} alt="Preview" className="w-24 h-24 rounded-full object-cover border-4 border-slate-800 shadow-[0_0_20px_rgba(99,102,241,0.2)]" referrerPolicy="no-referrer" />
                           <p className="text-xs text-slate-400 text-center">Paste a direct link to an image (URL ending in .jpg, .png, etc.)</p>
                        </div>
                        <div>
                           <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Image URL</label>
                           <input type="text" value={newProfilePicUrl} onChange={(e) => setNewProfilePicUrl(e.target.value)} placeholder="https://..." className="w-full bg-slate-950/60 border border-transparent rounded-lg px-4 py-3 text-sm text-white neon-input neon-input-indigo" />
                        </div>
                        {profileUpdateError && (
                           <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-xs text-rose-300 flex items-start gap-2">
                              <AlertTriangle className="w-4 h-4 shrink-0" /> <span>{profileUpdateError}</span>
                           </div>
                        )}
                        <div className="flex justify-end gap-3 pt-2">
                           <button onClick={() => setIsProfileModalOpen(false)} className="px-4 py-2 text-sm font-medium text-slate-400 rounded-lg neon-border-slate transition-all">Cancel</button>
                           <button onClick={handleProfilePhotoUpdate} disabled={!newProfilePicUrl} className="btn-neon btn-neon-indigo">Save Picture</button>
                        </div>
                     </div>
                  </div>
               </div>
            )}

            {/* Change Connection Modal */}
            {isSwitchModalOpen && mappedWorkflows.length > 0 && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                 <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden relative animate-in zoom-in-95 duration-200">
                    <button onClick={handleCancelIntegration} className="absolute top-4 right-4 text-slate-400 p-2 rounded z-10 neon-border-slate transition-all"><X /></button>
                    <div className="p-6">
                       <h2 className="text-xl font-bold text-white mb-6">Connect New Workflow</h2>
                       {integrationUI}
                    </div>
                 </div>
              </div>
            )}

            {/* Drill Down Modal */}
            {selectedDrillDownAssignee && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" onClick={() => setSelectedDrillDownAssignee(null)}>
                 {renderAssigneeDrillDown(selectedDrillDownAssignee)}
              </div>
            )}

            {/* Unified Tasks & Time Modal */}
            {isUnifiedModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-7xl h-[85vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                   <div className="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 shrink-0">
                      <h2 className="text-xl font-bold text-white flex items-center"><ListTodo className="mr-3 h-6 w-6 text-indigo-400"/> Unified Workspace & Time Ledger</h2>
                      <button onClick={() => setIsUnifiedModalOpen(false)} className="text-slate-400 p-2 rounded neon-border-slate transition-colors"><X className="h-6 w-6"/></button>
                   </div>
                   <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                      
                      {/* Left Pane: Task Tree */}
                      <div className="w-full lg:w-[55%] border-r border-slate-700/80 p-6 flex flex-col bg-slate-900/50">
                         <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center"><FolderOpen className="h-4 w-4 mr-2"/> Active Hierarchy</h3>
                         <div className="mb-4 space-y-3">
                            <input type="text" placeholder="Search tasks..." value={taskSearchQuery} onChange={e => setTaskSearchQuery(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg p-2.5 text-white text-sm neon-input neon-input-indigo" />
                            <label className="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer w-max select-none">
                               <input type="checkbox" checked={showMyTasksOnly} onChange={e => setShowMyTasksOnly(e.target.checked)} className="rounded border-transparent bg-slate-900/50 text-indigo-600 w-4 h-4 neon-input neon-input-indigo" />
                               <span>Show my tasks only</span>
                            </label>
                         </div>
                         <div className="overflow-y-auto flex-1 pr-2 space-y-6">
                            {mappedWorkflows.map(wf => {
                               const filterNodeForLedger = (node) => {
                                 const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                                 const isAssignedToMe = node.assignees && node.assignees.some(a => (a.username || '') === user?.name);
                                 const matchesMyTasks = !showMyTasksOnly || isAssignedToMe;
                                 
                                 const validSubtasks = (node.subtasks || []).map(filterNodeForLedger).filter(Boolean);
                                 
                                 if ((matchesSearch && matchesMyTasks) || validSubtasks.length > 0) {
                                     return { ...node, subtasks: validSubtasks };
                                 }
                                 return null;
                               };
                               
                               const rootTasks = (wf.tasks || []).map(filterNodeForLedger).filter(Boolean);

                               if (rootTasks.length === 0) return null;

                               const renderLedgerNode = (task, depth = 0) => {
                                  const loggedMs = getLoggedMsForTask(task.id);
                                  const isSelected = selectedTaskIdForTime === task.id;
                                  const hasSubtasks = task.subtasks && task.subtasks.length > 0;
                                  const isExpanded = !!expandedTasks[task.id] || (taskSearchQuery.trim() !== '' && hasSubtasks) || (showMyTasksOnly && hasSubtasks);
                                  
                                  return (
                                     <div key={task.id} className="mb-2">
                                        <div onClick={() => setSelectedTaskIdForTime(isSelected ? '' : task.id)} className={`p-3 rounded-lg border flex justify-between items-center cursor-pointer transition-all group ${isSelected ? 'bg-indigo-600/20 border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'bg-slate-800/40 border-slate-700/50 hover:border-indigo-500 hover:shadow-[0_0_10px_rgba(99,102,241,0.3)]'}`}>
                                           <div className="flex items-center space-x-3 min-w-0 flex-1 mr-4">
                                              {hasSubtasks ? (
                                                <button onClick={(e) => { e.stopPropagation(); toggleTaskExpand(task.id); }} className="p-0.5 text-slate-400 rounded flex-shrink-0 neon-text-indigo">
                                                   <ChevronRight className={`w-4 h-4 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                                                </button>
                                              ) : (
                                                <div className="w-5 h-4 flex-shrink-0" />
                                              )}
                                              <div className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: task.status?.color || '#cbd5e1' }} />
                                              
                                              {/* Truncated Name with Tooltip logic */}
                                              <div className="relative min-w-0 flex-1">
                                                 <span className={`block text-sm font-medium truncate ${isSelected ? 'text-indigo-100' : 'text-slate-200'}`} title={task.name}>{task.name}</span>
                                              </div>

                                           </div>
                                           <div className="text-xs font-medium bg-slate-950/60 px-2 py-1 rounded-md text-slate-400 shrink-0 border border-white/5">
                                              {loggedMs > 0 ? `${(loggedMs / 3600000).toFixed(1)}h` : '0h'}
                                           </div>
                                        </div>
                                        {isExpanded && hasSubtasks && (
                                           <div className="mt-2 border-l border-slate-700/50 ml-5 pl-4 border-dashed">
                                              {task.subtasks.map(sub => renderLedgerNode(sub, depth + 1))}
                                           </div>
                                        )}
                                     </div>
                                  );
                               };

                               return (
                                  <div key={wf.id} className="mb-6">
                                     <div className="text-indigo-400 font-semibold mb-3 flex items-center bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 w-max"><Box className="w-4 h-4 mr-2"/> {wf.list}</div>
                                     <div className="space-y-2">
                                        {rootTasks.map(task => renderLedgerNode(task, 0))}
                                     </div>
                                  </div>
                               );
                            })}
                            {mappedWorkflows.every(wf => {
                               const filterNodeForLedger = (node) => {
                                 const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                                 const isAssignedToMe = node.assignees && node.assignees.some(a => (a.username || '') === user?.name);
                                 const matchesMyTasks = !showMyTasksOnly || isAssignedToMe;
                                 const validSubtasks = (node.subtasks || []).map(filterNodeForLedger).filter(Boolean);
                                 if ((matchesSearch && matchesMyTasks) || validSubtasks.length > 0) return { ...node, subtasks: validSubtasks };
                                 return null;
                               };
                               return (wf.tasks || []).map(filterNodeForLedger).filter(Boolean).length === 0;
                            }) && <div className="text-slate-500 italic text-sm text-center mt-6">No tasks match your filter.</div>}
                         </div>
                      </div>

                      {/* Right Pane: Time Logging & Feed */}
                      <div className="w-full lg:w-[45%] flex flex-col bg-slate-950/30">
                         <div className="p-5 border-b border-slate-700/80 flex justify-between items-center bg-slate-900/60 shrink-0">
                            <div className="flex items-center space-x-3">
                               <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center">
                                  <Clock className="h-4 w-4 mr-2"/> 
                                  {selectedTaskIdForTime ? "Task Time Entries" : (user?.isMock ? "Local Live Feed" : "Global Live Feed")}
                               </h3>
                               {selectedTaskIdForTime && (
                                  <button onClick={() => setSelectedTaskIdForTime('')} className="text-[10px] uppercase font-bold text-slate-500 bg-slate-800 px-2 py-0.5 rounded transition-colors border border-transparent flex items-center neon-border-indigo">
                                     <X className="w-3 h-3 mr-1"/> Clear Selection
                                  </button>
                               )}
                            </div>
                            <button 
                               onClick={() => setIsLogFormOpen(!isLogFormOpen)} 
                               className={`btn-neon btn-neon-sm ${isLogFormOpen ? 'btn-neon-slate' : 'btn-neon-indigo'}`}
                            >
                               {isLogFormOpen ? <><X className="w-3.5 h-3.5 mr-1" /> Close</> : <><Plus className="w-3.5 h-3.5 mr-1" /> Log Time</>}
                            </button>
                         </div>

                         {isLogFormOpen && (
                            <div className="p-5 border-b border-slate-700/80 bg-slate-800/30 shadow-inner animate-in slide-in-from-top-2 shrink-0">
                               <div className="mb-4">
                                  <label className="text-xs text-slate-400 font-medium mb-1.5 block">Selected Target Task</label>
                                  <div className="text-sm text-slate-300 bg-slate-900 p-2.5 rounded-lg border border-slate-700/80">
                                     {selectedTaskIdForTime ? allFlatTasks.find(t => t.id === selectedTaskIdForTime)?.name : <span className="italic text-slate-500">← Select a task from the hierarchy</span>}
                                  </div>
                               </div>
                               <div className="mb-4 grid grid-cols-1 sm:grid-cols-3 gap-4">
                                  <div>
                                     <label className="text-xs text-slate-400 font-medium mb-1.5 block">Date</label>
                                     <input type="date" value={timeEntryDate} onChange={e => setTimeEntryDate(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg p-2.5 text-white text-sm neon-input neon-input-indigo" />
                                  </div>
                                  <div>
                                     <label className="text-xs text-slate-400 font-medium mb-1.5 block">Hours</label>
                                     <input type="number" step="0.1" value={timeEntryHours} onChange={e => setTimeEntryHours(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg p-2.5 text-white text-sm neon-input neon-input-indigo" placeholder="e.g. 2.5" />
                                  </div>
                                  <div>
                                     <label className="text-xs text-slate-400 font-medium mb-1.5 block">Assignee</label>
                                     <select value={timeAssignee || user?.name || ''} onChange={e => setTimeAssignee(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg p-2.5 text-white text-sm neon-input neon-input-indigo">
                                        {workspaceUsers.map(u => <option key={u} value={u}>{u}</option>)}
                                     </select>
                                  </div>
                               </div>
                               <div className="mb-4">
                                  <label className="text-xs text-slate-400 font-medium mb-1.5 block">Description / Note</label>
                                  <input type="text" value={timeEntryNote} onChange={e => setTimeEntryNote(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg p-2.5 text-white text-sm neon-input neon-input-indigo" placeholder="What did you work on?" />
                               </div>
                               <button onClick={() => { handleLogTime(); setIsLogFormOpen(false); }} disabled={!selectedTaskIdForTime || !timeEntryHours} className="w-full btn-neon btn-neon-indigo mt-2">
                                  Commit Time Entry
                               </button>
                            </div>
                         )}

                         <div className="p-5 flex-1 overflow-y-auto bg-slate-950/50">
                            <div className="space-y-3">
                               {(() => {
                                  const feedEntries = selectedTaskIdForTime 
                                        ? globalTimeLedger.filter(e => e.taskId === selectedTaskIdForTime)
                                        : globalTimeLedger;
                                        
                                      if (feedEntries.length === 0) {
                                         return <div className="text-slate-500 text-sm italic text-center py-8">No time entries recorded yet.</div>;
                                      }

                                      return [...feedEntries].sort((a,b) => b.timestamp - a.timestamp).map(entry => {
                                         const task = allFlatTasks.find(t => t.id === entry.taskId);
                                         return (
                                            <div key={entry.id} className="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 shadow-sm animate-in fade-in slide-in-from-top-2">
                                               <div className="flex justify-between items-start mb-2">
                                                  <div className="pr-4">
                                                     <span className="font-semibold text-indigo-300 text-sm leading-tight block mb-1">{task?.name || 'Unknown Task'}</span>
                                                     <div className="text-xs text-slate-400 flex items-center mb-0.5">
                                                        <Calendar className="w-3 h-3 mr-1.5 opacity-70" />
                                                        {new Date(entry.timestamp).toLocaleDateString()}
                                                        <span className="mx-2 text-slate-600">|</span>
                                                        <Users className="w-3 h-3 mr-1.5 opacity-70" />
                                                        {entry.userId}
                                                     </div>
                                                  </div>
                                                  <div className="flex items-center gap-2 shrink-0">
                                                    <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-1 rounded text-sm border border-emerald-500/20">+{entry.ms / 3600000}h</span>
                                                    <button onClick={(e) => { e.stopPropagation(); handleDeleteTimeEntry(entry); }} className="text-slate-500 p-1.5 rounded-md neon-border-rose transition-colors"><Trash2 className="w-4 h-4" /></button>
                                                  </div>
                                               </div>
                                               {entry.note && <div className="text-slate-300 bg-slate-900/80 p-2.5 rounded-lg text-sm border border-white/5 italic mt-2">"{entry.note}"</div>}
                                            </div>
                                         )
                                      });
                                   })()}
                                </div>
                             </div>
                          </div>
                       </div>
                    </div>
                  </div>
                )}

            {/* Capacity Settings Blocker Modal */}
            {isBlockerModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in zoom-in-95">
                   <div className="flex items-center justify-between p-5 border-b border-slate-700/80 bg-slate-800/50">
                     <h2 className="text-lg font-bold text-white flex items-center gap-2"><Calendar className="w-5 h-5 text-indigo-400" /> Sprint Capacity Settings</h2>
                     <button onClick={() => setIsBlockerModalOpen(false)} className="p-1.5 rounded-lg text-slate-400 neon-border-slate transition-colors"><X className="w-5 h-5" /></button>
                   </div>
                   <div className="p-5 space-y-6">
                     <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">
                           Daily Working Hours
                           <span className="text-[10px] text-indigo-400 font-bold bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">List-Specific</span>
                        </h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                             <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Developers</label>
                             <input type="number" min="1" max="24" value={devHoursPerDay} onChange={e => { const val = e.target.value; setDevHoursPerDay(val); const num = Number(val); if(!isNaN(num) && val !== '') saveSettings({ devHoursPerDay: num }); }} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-sm text-white neon-input neon-input-indigo" />
                          </div>
                          <div>
                             <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">QA Resources</label>
                             <input type="number" min="1" max="24" value={qaHoursPerDay} onChange={e => { const val = e.target.value; setQaHoursPerDay(val); const num = Number(val); if(!isNaN(num) && val !== '') saveSettings({ qaHoursPerDay: num }); }} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-sm text-white neon-input neon-input-indigo" />
                          </div>
                        </div>
                     </div>
                     <div className="space-y-3">
                       <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">Active Blockers<span className="text-indigo-400">{dateBlockers.length} Items</span></h3>
                       {dateBlockers.length === 0 ? (
                         <div className="text-sm text-slate-400 italic p-4 bg-slate-900/60 rounded-xl text-center border border-white/5">No blockers added.</div>
                       ) : (
                         <ul className="space-y-2 max-h-40 overflow-y-auto pr-1">
                           {dateBlockers.map(b => (
                             <li key={b.id} className="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-white/5 group">
                                <div className="flex flex-col"><span className="text-sm font-semibold text-slate-200">{b.remark} <span className="text-slate-400 font-normal">({b.days} day{b.days > 1 ? 's' : ''})</span></span>{b.remark === 'Leave' && <span className="text-xs text-indigo-400 font-medium mt-0.5">{b.assignee}</span>}</div>
                                <button onClick={() => { const newBlockers = dateBlockers.filter(x => x.id !== b.id); setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); logTransaction('Blocker Removed', `Removed ${b.remark} blocker`, 'trash'); }} className="text-slate-500 p-1.5 rounded-md neon-border-rose transition-colors"><Trash2 className="w-4 h-4" /></button>
                             </li>
                           ))}
                         </ul>
                       )}
                     </div>
                     <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Add New Blocker</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">No. of Days</label><input type="number" min="1" value={newBlockerDays} onChange={e => setNewBlockerDays(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-sm text-white neon-input neon-input-indigo" /></div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Remarks</label>
                            <select value={newBlockerRemark} onChange={e => setNewBlockerRemark(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-sm text-white neon-input neon-input-indigo">
                              <option value="Holiday">Holiday</option><option value="Company Event">Company Event</option><option value="Leave">Leave</option>
                            </select>
                          </div>
                        </div>
                        {newBlockerRemark === 'Leave' && (
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Team Member</label>
                            <select value={newBlockerAssignee || (assigneesList[0]?.username || '')} onChange={e => setNewBlockerAssignee(e.target.value)} className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2 text-sm text-white neon-input neon-input-indigo">
                              {assigneesList.map(a => <option key={a.username} value={a.username}>{a.username}</option>)}
                            </select>
                          </div>
                        )}
                        <button onClick={() => { if (!newBlockerDays || newBlockerDays <= 0) return; const newBlocker = { id: Date.now().toString(), days: parseInt(newBlockerDays), remark: newBlockerRemark, assignee: newBlockerRemark === 'Leave' ? (newBlockerAssignee || assigneesList[0]?.username) : null }; const newBlockers = [...dateBlockers, newBlocker]; setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); logTransaction('Blocker Added', `${newBlockerDays} day(s) for ${newBlockerRemark}`, 'info'); setNewBlockerDays(1); }} className="w-full btn-neon btn-neon-indigo mt-4">
                          <Plus className="w-4 h-4 mr-1.5" /> Add Date Blocker
                        </button>
                     </div>
                   </div>
                </div>
              </div>
            )}

            {/* Top Navigation */}
            <nav className="relative z-30 bg-slate-950/50 backdrop-blur-md border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button ref={bellButtonRef} onClick={() => { setIsNotificationsOpen(!isNotificationsOpen); setVisibleTxCount(10); }} className={`p-1.5 rounded-lg border border-transparent transition-all neon-border-indigo relative ${isNotificationsOpen ? 'text-white' : 'text-slate-400'}`}>
                      <Bell className="h-5 w-5" />
                      {transactions.length > 0 && <span className="absolute -top-1 -right-1 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-rose-500 border border-slate-950"></span></span>}
                    </button>
                    <div onClick={() => setIsProfileModalOpen(true)} className="h-8 w-8 rounded-full bg-indigo-950/50 flex items-center justify-center overflow-hidden border border-transparent transition-all neon-border-indigo cursor-pointer hover:border-indigo-400 hover:shadow-[0_0_10px_rgba(99,102,241,0.5)]" title="Update Profile Picture">
                      <img src={user.avatar} alt={user.name} className="h-full w-full object-cover" referrerPolicy="no-referrer" />
                    </div>
                    <button onClick={handleLogout} className="p-1.5 rounded-lg border border-transparent flex items-center text-sm font-medium text-slate-400 transition-all neon-border-slate"><LogOut className="h-4 w-4 sm:mr-1" /> <span className="hidden sm:block">Sign out</span></button>
                  </div>
                </div>
              </div>
            </nav>

            {/* Notifications Panel */}
            {isNotificationsOpen && (
              <div ref={notificationsRef} className="fixed top-16 right-4 sm:right-6 lg:right-8 w-80 bg-slate-900 border border-slate-700/80 rounded-xl shadow-[0_0_20px_rgba(99,102,241,0.3)] z-50 flex flex-col max-h-[80vh] overflow-hidden animate-in slide-in-from-top-4 duration-200">
                <div className="p-4 border-b border-slate-700/80 bg-slate-800/50 flex items-center justify-between shrink-0">
                  <h3 className="text-sm font-bold text-white flex items-center"><Bell className="w-4 h-4 mr-2 text-indigo-400" /> Recent Activity</h3>
                  {transactions.length > 0 && <span className="text-xs text-slate-500">{transactions.length} entries</span>}
                </div>
                <div className="overflow-y-auto flex-1">
                  {transactions.length === 0 ? (
                    <div className="p-6 text-center text-sm text-slate-500 italic">No recent activity.</div>
                  ) : (
                    <div className="divide-y divide-white/5">
                      {transactions.slice(0, visibleTxCount).map(tx => (
                        <div key={tx.id} className="p-4 hover:bg-white/5 transition-colors">
                          <div className="flex items-start gap-3">
                            <div className="mt-0.5 shrink-0">
                              {tx.iconType === 'clock' && <div className="p-1.5 bg-emerald-500/10 rounded border border-emerald-500/20"><Clock className="w-3.5 h-3.5 text-emerald-400" /></div>}
                              {tx.iconType === 'link' && <div className="p-1.5 bg-indigo-500/10 rounded border border-indigo-500/20"><Box className="w-3.5 h-3.5 text-indigo-400" /></div>}
                              {tx.iconType === 'unlink' && <div className="p-1.5 bg-rose-500/10 rounded border border-rose-500/20"><Trash2 className="w-3.5 h-3.5 text-rose-400" /></div>}
                              {tx.iconType === 'trash' && <div className="p-1.5 bg-rose-500/10 rounded border border-rose-500/20"><Trash2 className="w-3.5 h-3.5 text-rose-400" /></div>}
                              {tx.iconType === 'info' && <div className="p-1.5 bg-blue-500/10 rounded border border-blue-500/20"><InfoIcon className="w-3.5 h-3.5 text-blue-400" /></div>}
                            </div>
                            <div className="min-w-0">
                              <p className="text-sm font-medium text-slate-200">{tx.action}</p>
                              <p className="text-xs text-slate-400 mt-0.5 truncate">{tx.details}</p>
                              <div className="flex items-center gap-2 mt-1.5 text-[10px] font-medium text-slate-500">
                                <span>{new Date(tx.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                <span>•</span>
                                <span>{tx.user}</span>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {transactions.length > visibleTxCount && (
                  <div className="p-3 bg-slate-800/80 border-t border-slate-700/80 text-center shrink-0">
                    <button onClick={() => setVisibleTxCount(prev => prev + 10)} className="text-xs font-semibold text-slate-400 py-1.5 px-4 border border-transparent rounded-md transition-all neon-border-indigo w-full">View More Logs</button>
                  </div>
                )}
              </div>
            )}

            {mappedWorkflows.length === 0 ? (
          <main className="relative z-25 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div className="text-center mb-10">
