            )}

          </div>
        </div>
      );

    // --- Data Flattening and Extraction Engines ---
    const buildTaskTree = (flatTasks) => {
      const taskMap = {};
      const roots = [];
      flatTasks.forEach(task => { taskMap[task.id] = { ...task, subtasks: [] }; });
      flatTasks.forEach(task => {
        const parentId = task.parent;
        if (parentId && taskMap[parentId]) taskMap[parentId].subtasks.push(taskMap[task.id]);
        else roots.push(taskMap[task.id]);
      });
      return roots;
    };

    const flattenTasks = (tasks) => {
      return tasks.reduce((acc, task) => {
        acc.push(task);
        if (task.subtasks) acc.push(...flattenTasks(task.subtasks));
        return acc;
      }, []);
    };

    const extractBugs = (tasks, inBugContext = false) => {
      let bugs = [];
      tasks.forEach(t => {
          const taskNameLower = (t.name || '').toLowerCase();
          const isBugContainer = taskNameLower.includes('qa bugs') || taskNameLower.includes('ui bugs');
          const isContext = inBugContext || isBugContainer;
          const hasBugTag = t.tags?.some(tag => ['bug', 'defect'].includes((tag.name || '').toLowerCase()));
          
          if ((isContext && !isBugContainer) || hasBugTag) {
              if (!bugs.find(b => b.id === t.id)) bugs.push(t);
          }
          if (t.subtasks && t.subtasks.length > 0) {
              bugs.push(...extractBugs(t.subtasks, isContext));
          }
      });
      return bugs;
    };

    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false, onOpenTimeTrackModal }) => {

      const isExpanded = !!expandedTasks[task.id];

      const themeColor = task.status?.color || '#38bdf8';

      const estimateMs = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const spentMs = task.time_spent ? parseInt(task.time_spent) : (isDoneStatus ? estimateMs : 0);
      const hasTimeData = estimateMs > 0 || spentMs > 0;
      const displayHours = hasTimeData ? `${Math.round(spentMs / 3600000)}h / ${Math.round(estimateMs / 3600000)}h` : null;
      
      return (
        <div className={`transition-all overflow-hidden ${
          isParent ? 'bg-[#0f172a] border border-white/5 rounded-xl shadow-inner' : 'bg-white/5 rounded-r-lg border-l-2'
        }`}
        style={!isParent ? { borderLeftColor: `${themeColor}40` } : {}}
        >
          <div className={`flex flex-col lg:flex-row lg:items-center justify-between p-3 gap-3 ${!isParent ? 'pl-4' : ''}`}>
            <div className="flex items-center space-x-3 overflow-hidden min-w-0">
              <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg" style={{ backgroundColor: themeColor, boxShadow: `0 0 8px ${themeColor}` }} />
              <span className={`font-medium truncate ${isParent ? 'text-slate-200 text-sm' : 'text-slate-300 text-xs'}`}>{task.name}</span>
            </div>
            
            <div className="flex items-center shrink-0 space-x-3 sm:pl-4 pl-5 overflow-x-auto overflow-y-hidden py-1">
              {onOpenTimeTrackModal && (
                <button 
                  onClick={(e) => { e.stopPropagation(); onOpenTimeTrackModal(task); }}
                  className="flex items-center px-2 py-0.5 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-[10px] text-emerald-400 font-bold border border-emerald-500/20 transition-colors shrink-0"
                >
                  <Clock className="h-3 w-3 mr-1" /> Track
                </button>
              )}

              {hasSubtasks && (
                <button 
                  onClick={() => toggleTaskExpand(task.id)}
                  className="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-indigo-500/10 hover:bg-indigo-500/20 text-[10px] text-indigo-300 font-bold border border-indigo-500/20 transition-colors shrink-0"
                >
                  <span>Subtasks ({relevantSubtasks.length})</span>
                  <ChevronRight className={`h-3 w-3 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                </button>
              )}

              {hasTimeData && (
                <div className="flex items-center text-xs text-slate-400 whitespace-nowrap shrink-0">
                  <Clock className="h-3.5 w-3.5 mr-1.5 text-slate-500" />
                  {displayHours}
                </div>
              )}

              <span className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border shrink-0" style={{ color: themeColor, backgroundColor: `${themeColor}15`, borderColor: `${themeColor}30` }}>
                {task.status?.status || 'Open'}
              </span>

              {isParent && task.tags && task.tags.length > 0 && (
                <div className="flex items-center space-x-1 mr-2 hidden sm:flex shrink-0">
                  <Tag className="h-3 w-3 text-slate-500 mr-1" />
                  {task.tags.map((tag, i) => (
                    <span key={i} className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap" style={{ color: tag.color || '#6366f1', backgroundColor: `${tag.color || '#6366f1'}15`, border: `1px solid ${tag.color || '#6366f1'}30` }}>
                      {tag.name}
                    </span>
                  ))}
                </div>
              )}

              {task.assignees && task.assignees.length > 0 ? (
                <div className="flex -space-x-1.5 shrink-0">
                  {task.assignees.map((assignee, i) => (
                    <img key={i} src={assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee.username)}`} alt={assignee.username} className="w-6 h-6 rounded-full border border-slate-900 bg-slate-800 object-cover" />
                  ))}
                </div>
              ) : (
                <div className="flex items-center justify-center w-6 h-6 rounded-full border border-white/5 bg-slate-900 text-slate-500 shrink-0"><Users className="h-3 w-3" /></div>
              )}
            </div>
          </div>

          {isExpanded && hasSubtasks && (
            <div className="bg-slate-950/40 border-t border-white/5 p-3 space-y-2 ml-4 pl-3 border-l border-dashed border-white/10">
              {relevantSubtasks.map(sub => (
                <TaskItem key={sub.id} task={sub} depth={depth + 1} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={isDoneMode} onOpenTimeTrackModal={onOpenTimeTrackModal} />
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- Main App Component ---
    function App() {
      const [user, setUser] = useState(null);
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [authInitialized, setAuthInitialized] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);

      // Integration State
      const [integrationStep, setIntegrationStep] = useState('idle');
      const [clickUpToken, setClickUpToken] = useState('');
      const [tempToken, setTempToken] = useState('');
      const [clickUpError, setClickUpError] = useState(null);
      const [mappedWorkflows, setMappedWorkflows] = useState([]);
      const [isAutoSyncing, setIsAutoSyncing] = useState(false);
      
      const [completionFilterType, setCompletionFilterType] = useState('none');
      const [selectedTagFilter, setSelectedTagFilter] = useState('');
      const [selectedAssigneeFilter, setSelectedAssigneeFilter] = useState('');
      const [userRoles, setUserRoles] = useState({});

      // Time Tracking Ledger Engine
      const [localTimeLedger, setLocalTimeLedger] = useState({});
      const localTimeLedgerRef = useRef(localTimeLedger);
      useEffect(() => { localTimeLedgerRef.current = localTimeLedger; }, [localTimeLedger]);

      const [devHoursPerDay, setDevHoursPerDay] = useState(7);
      const [qaHoursPerDay, setQaHoursPerDay] = useState(7);
      const [isBlockerModalOpen, setIsBlockerModalOpen] = useState(false);
      const [dateBlockers, setDateBlockers] = useState([]);
      const [newBlockerDays, setNewBlockerDays] = useState(1);
      const [newBlockerRemark, setNewBlockerRemark] = useState('Holiday');
      const [newBlockerAssignee, setNewBlockerAssignee] = useState('');

      const [expandedTasks, setExpandedTasks] = useState({});
      const [workflowTabs, setWorkflowTabs] = useState({});
      
      const [timeTrackModalTask, setTimeTrackModalTask] = useState(null);
      const [timeHours, setTimeHours] = useState(0);
      const [timeMinutes, setTimeMinutes] = useState(0);
      const [timeDate, setTimeDate] = useState(new Date().toISOString().split('T')[0]);
      const [timeNotes, setTimeNotes] = useState('');
      const [timeAssignee, setTimeAssignee] = useState('me');

      const [selectedTicketForModal, setSelectedTicketForModal] = useState(null);
      const [commentText, setCommentText] = useState('');
      const [localMockComments, setLocalMockComments] = useState({});
      const [isSwitchModalOpen, setIsSwitchModalOpen] = useState(false);

      const mappedWorkflowsRef = useRef(mappedWorkflows);
      useEffect(() => { mappedWorkflowsRef.current = mappedWorkflows; }, [mappedWorkflows]);

      const [teams, setTeams] = useState([]);
      const [spaces, setSpaces] = useState([]);
      const [folders, setFolders] = useState([]);
      const [lists, setLists] = useState([]);
      const [folderlessLists, setFolderlessLists] = useState([]);
      const [selectedTeam, setSelectedTeam] = useState('');
      const [selectedSpace, setSelectedSpace] = useState('');
      const [selectedFolder, setSelectedFolder] = useState('');
      const [selectedList, setSelectedList] = useState('');

      const saveSettings = async (updates) => {
        const listId = mappedWorkflows[0]?.listId;
        if (!listId) return;

        const currentLocal = JSON.parse(localStorage.getItem(`weaver_settings_${listId}`) || '{}');
        localStorage.setItem(`weaver_settings_${listId}`, JSON.stringify({ ...currentLocal, ...updates }));

        if (auth.currentUser && !user?.isMock) {
          try {
            const docRef = db.collection('artifacts').doc(appId).collection('users').doc(auth.currentUser.uid).collection('listSettings').doc(listId);
            await docRef.set(updates, { merge: true });
          } catch(err) { console.error('Error saving settings to Firebase:', err); }
        }
      };

      useEffect(() => {
        const listId = mappedWorkflows[0]?.listId;
        if (!listId) return;

        const fetchSettings = async () => {
          let settingsData = null;
          if (auth.currentUser && !user?.isMock) {
            try {
              const docRef = db.collection('artifacts').doc(appId).collection('users').doc(auth.currentUser.uid).collection('listSettings').doc(listId);
              const snapshot = await docRef.get();
              if (snapshot.exists) settingsData = snapshot.data();
            } catch(e) { console.warn("Firebase fetch failed."); }
          }

          if (!settingsData) {
            settingsData = JSON.parse(localStorage.getItem(`weaver_settings_${listId}`) || '{}');
          }

          setDevHoursPerDay(settingsData.devHoursPerDay !== undefined ? settingsData.devHoursPerDay : 7);
          setQaHoursPerDay(settingsData.qaHoursPerDay !== undefined ? settingsData.qaHoursPerDay : 7);
          setDateBlockers(settingsData.dateBlockers || []);
          setUserRoles(settingsData.userRoles || {});
          setLocalTimeLedger(settingsData.localTimeLedger || {});
        };
        fetchSettings();
      }, [mappedWorkflows[0]?.listId, auth.currentUser, user?.isMock]);

      const handleMockClickUpData = () => {
        setTeams(MOCK_CLICKUP_DATA.teams);
        setClickUpToken('mock_token');
        localStorage.setItem('weaver_clickup_token', 'mock_token'); 
        setClickUpError(null);
        setIntegrationStep('selecting');
      };

      const toggleTaskExpand = (taskId) => {
        setExpandedTasks(prev => ({ ...prev, [taskId]: !prev[taskId] }));
      };

      const fetchClickUp = async (endpoint, token, method = 'GET', body = null) => {
        const targetUrl = `https://api.clickup.com/api/v2/${endpoint}`;
        const proxies = method === 'GET' 
          ? [`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`, `https://thingproxy.freeboard.io/fetch/${targetUrl}`]
          : [`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, `https://thingproxy.freeboard.io/fetch/${targetUrl}`];

        for (const proxyUrl of proxies) {
          try {
            const fetchOptions = { method, headers: { 'Authorization': token, 'Content-Type': 'application/json' } };
            if (body) fetchOptions.body = JSON.stringify(body);
            const res = await fetch(proxyUrl, fetchOptions);
            if (!res.ok) {
              let clickUpError = '';
              try { const errData = await res.json(); clickUpError = errData.err || errData.error || ''; } catch (e) {}
              throw new Error(clickUpError ? clickUpError : `HTTP ${res.status} via proxy`);
            }
            return await res.json();
          } catch (err) {
            if (err.message === 'Failed to fetch' || err.name === 'TypeError') continue;
            throw err;
          }
        }
        throw new Error('Connection blocked.');
      };

      const handleSendComment = async () => {
        if (!commentText.trim() || !selectedTicketForModal) return;
        const newComment = { id: Date.now().toString(), comment_text: commentText, date: Date.now().toString(), user: { username: user.name, profilePicture: user.avatar } };

        if (clickUpToken === 'mock_token') {
            setLocalMockComments(prev => ({ ...prev, [selectedTicketForModal.id]: [...(prev[selectedTicketForModal.id] || []), newComment] }));
        } else {
            try {
              await fetchClickUp(`task/${selectedTicketForModal.id}/comment`, clickUpToken, 'POST', { comment_text: commentText, notify_all: true });
              setLocalMockComments(prev => ({ ...prev, [selectedTicketForModal.id]: [...(prev[selectedTicketForModal.id] || []), newComment] }));
            } catch (err) { alert("Failed to sync comment with ClickUp. " + err.message); }
        }
        setCommentText('');
      };

      useEffect(() => {
        if (user) {
          const savedToken = localStorage.getItem('weaver_clickup_token');
          if (savedToken) {
            const verifyToken = async () => {
              try {
                if (savedToken === 'mock_token') { setTeams(MOCK_CLICKUP_DATA.teams); setClickUpToken(savedToken); return; }
                const data = await fetchClickUp('team', savedToken);
                setTeams(data.teams || []);
                setClickUpToken(savedToken);
              } catch (err) {
                localStorage.removeItem('weaver_clickup_token');
                setClickUpToken('');
              }
            };
            verifyToken();
          }
        }
      }, [user]);

      useEffect(() => {
        if (!selectedTeam || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setSpaces(MOCK_CLICKUP_DATA.spaces[selectedTeam] || []); return; }
        const fetchSpaces = async () => {
          try { const data = await fetchClickUp(`team/${selectedTeam}/space`, clickUpToken); setSpaces(data.spaces || []); } catch (err) { setClickUpError(err.message); }
        };
        fetchSpaces();
      }, [selectedTeam, clickUpToken]);

      useEffect(() => {
        if (!selectedSpace || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
          setFolders(MOCK_CLICKUP_DATA.folders[selectedSpace] || []);
          setFolderlessLists(MOCK_CLICKUP_DATA.folderlessLists[selectedSpace] || []);
          return;
        }
        const fetchSpaceData = async () => {
          try {
            const dataFolders = await fetchClickUp(`space/${selectedSpace}/folder`, clickUpToken); setFolders(dataFolders.folders || []);
            const dataLists = await fetchClickUp(`space/${selectedSpace}/list`, clickUpToken); setFolderlessLists(dataLists.lists || []);
          } catch (err) { setClickUpError(err.message); }
        };
        fetchSpaceData();
      }, [selectedSpace, clickUpToken]);

      useEffect(() => {
        if (!selectedFolder || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setLists(MOCK_CLICKUP_DATA.lists[selectedFolder] || []); return; }
        const fetchLists = async () => {
          try { const data = await fetchClickUp(`folder/${selectedFolder}/list`, clickUpToken); setLists(data.lists || []); } catch (err) { setClickUpError(err.message); }
        };
        fetchLists();
      }, [selectedFolder, clickUpToken]);

      const availableLists = selectedFolder ? lists : folderlessLists;

      const handleConnectClickUp = () => {
        if (clickUpToken && teams.length > 0) setIntegrationStep('selecting');
        else setIntegrationStep('entering_token');
      };

      const handleAuthenticateToken = async () => {
        if (!tempToken) return;
        setIntegrationStep('connecting');
        setClickUpError(null);
        try {
          const data = await fetchClickUp('team', tempToken);
          setTeams(data.teams || []);
          setClickUpToken(tempToken);
          localStorage.setItem('weaver_clickup_token', tempToken);
          setIntegrationStep('selecting');
        } catch (err) { setClickUpError(err.message); setIntegrationStep('entering_token'); }
      };

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;
        setIntegrationStep('connecting');

        const teamName = teams.find(t => t.id === selectedTeam)?.name || 'Workspace';
        const spaceName = spaces.find(s => s.id === selectedSpace)?.name || 'Space';
        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';
        const selectedListObj = availableLists.find(l => l.id === selectedList);
        const listName = selectedListObj?.name || 'Task List';

        let initialTasks = [];
        if (clickUpToken === 'mock_token') {
          initialTasks = MOCK_CLICKUP_DATA.tasks[selectedList] || [];
        } else {
          try {
            let page = 0; let hasMore = true; let allFetchedTasks = [];
            while (hasMore) {
                const data = await fetchClickUp(`list/${selectedList}/task?subtasks=true&include_closed=true&page=${page}`, clickUpToken);
                const tasksChunk = data.tasks || [];
                allFetchedTasks.push(...tasksChunk);
                if (tasksChunk.length === 100) page++; else hasMore = false;
            }
            initialTasks = buildTaskTree(allFetchedTasks);
          } catch (err) { console.error("Error fetching tasks", err); }
        }

        setMappedWorkflows([{
          id: Date.now().toString(),
          team: teamName, teamId: selectedTeam, space: spaceName, folder: folderName, list: listName, listId: selectedList,
          listStartDate: selectedListObj?.start_date || null, listDueDate: selectedListObj?.due_date || null,
          tasks: initialTasks, lastSynced: Date.now()
        }]);

        setSelectedTeam(''); setSelectedSpace(''); setSelectedFolder(''); setSelectedList('');
        setIntegrationStep('idle'); setIsSwitchModalOpen(false);
      };

      const removeMapping = (id) => setMappedWorkflows(mappedWorkflows.filter(w => w.id !== id));

      useEffect(() => {
        if (timeTrackModalTask && timeTrackModalTask.assignees && timeTrackModalTask.assignees.length > 0) {
            setTimeAssignee((timeTrackModalTask.assignees[0].id || timeTrackModalTask.assignees[0].username).toString());
        } else {
            setTimeAssignee('me');
        }
      }, [timeTrackModalTask]);

      // --- Time Tracking & Local Ledger Engine ---
      const handleLogTime = async () => {
        if ((!timeHours && !timeMinutes) || !timeTrackModalTask) return;
        const durationMs = (Number(timeHours) * 3600000) + (Number(timeMinutes) * 60000);
        const startMs = new Date(timeDate).getTime();
        const teamId = mappedWorkflows[0]?.teamId || teams.find(t => t.name === mappedWorkflows[0]?.team)?.id;

        // Regardless of API success, log to local ledger!
        const newLedger = { ...localTimeLedger, [timeTrackModalTask.id]: (localTimeLedger[timeTrackModalTask.id] || 0) + durationMs };
        setLocalTimeLedger(newLedger);
        saveSettings({ localTimeLedger: newLedger });

        // API Sync Attempt
        if (clickUpToken !== 'mock_token') {
            try {
              const payload = { start: startMs, duration: durationMs, tid: timeTrackModalTask.id, description: timeNotes };
              if (timeAssignee && timeAssignee !== 'me' && !isNaN(parseInt(timeAssignee))) {
                  payload.assignee = parseInt(timeAssignee);
              }
              await fetchClickUp(`team/${teamId}/time_entries`, clickUpToken, 'POST', payload);
            } catch (err) {
              console.warn("Failed to sync time to ClickUp. Time saved securely in Local Ledger.", err.message);
            }
        }

        setTimeTrackModalTask(null);
        setTimeHours(0); setTimeMinutes(0); setTimeNotes('');
      };

      // --- Ledger Overlay Engine for Background Syncs ---
      useEffect(() => {
        if (mappedWorkflows.length === 0) return;
        const syncInterval = setInterval(async () => {
          setIsAutoSyncing(true);
          const currentWorkflows = mappedWorkflowsRef.current;
          
          const updatedWorkflows = await Promise.all(currentWorkflows.map(async (workflow) => {
            let updatedTasks = workflow.tasks;
            
            if (clickUpToken === 'mock_token') {
              updatedTasks = MOCK_CLICKUP_DATA.tasks[workflow.listId] || [];
            } else {
              try {
                let page = 0; let hasMore = true; let allFetchedTasks = [];
                while (hasMore) {
                    const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=true&include_closed=true&page=${page}`, clickUpToken);
                    const tasksChunk = data.tasks || [];
                    allFetchedTasks.push(...tasksChunk);
                    if (tasksChunk.length === 100) page++; else hasMore = false;
                }
                updatedTasks = buildTaskTree(allFetchedTasks);
              } catch (err) { console.error("Sync error", err); }
            }
            
            return { ...workflow, tasks: updatedTasks, lastSynced: Date.now() };
          }));

          setMappedWorkflows(updatedWorkflows);
          setIsAutoSyncing(false);
        }, 15000);
        return () => clearInterval(syncInterval);
      }, [mappedWorkflows.length, clickUpToken]);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser({
              uid: currentUser.uid, name: currentUser.isAnonymous ? 'Preview User' : (currentUser.displayName || 'User'),
              email: currentUser.email || 'preview@weaver.app',
              avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.isAnonymous ? 'Preview+User' : encodeURIComponent(currentUser.displayName || 'User')}`,
              isAnonymous: currentUser.isAnonymous, isMock: false
            });
          } else { setUser((prev) => prev?.isMock ? prev : null); }
          setAuthInitialized(true);
        });
        return () => unsubscribe();
      }, []);

      const handleMockLogin = () => {
        setUser({
          uid: 'mock_user_' + Date.now(), name: 'Preview User', email: 'preview@weaver.app',
          avatar: 'https://ui-avatars.com/api/?name=Preview+User&background=indigo&color=fff',
          isAnonymous: true, isMock: true
        });
        setErrorMessage(null);
      };

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try { await auth.signInWithPopup(googleProvider); } 
        catch (error) { handleMockLogin(); } 
        finally { setIsLoggingIn(false); }
      };

      const handleLogout = () => {
        if (auth.currentUser) auth.signOut(); else setUser(null);
        localStorage.removeItem('weaver_clickup_token');
        setClickUpToken(''); setTeams([]); setMappedWorkflows([]); setIntegrationStep('idle'); setIsSwitchModalOpen(false);
      };

      if (!authInitialized) {
        return <div className="min-h-screen bg-[#050814] flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;
      }

      if (user) {
        // --- Core Math Engine with Ledger Overlay ---
        
        // Apply the Local Time Ledger to ALL tasks dynamically so everything updates
        const applyLedgerOverlay = (tasksArray) => {
           return tasksArray.map(t => {
               const taskLedgerTime = localTimeLedger[t.id] || 0;
               let updated = { ...t, time_spent: (parseInt(t.time_spent) || 0) + taskLedgerTime };
               if (t.subtasks) updated.subtasks = applyLedgerOverlay(t.subtasks);
               return updated;
           });
        };

        const ledgifiedWorkflows = mappedWorkflows.map(wf => ({
            ...wf,
            tasks: applyLedgerOverlay(wf.tasks || [])
        }));

        const allTasksFlattened = flattenTasks(ledgifiedWorkflows.flatMap(wf => wf.tasks || []));
        
        const allWorkspaceAssignees = [];
        const workspaceAssigneeMap = new Map();
        allTasksFlattened.forEach(t => {
           t.assignees?.forEach(a => {
              const safeId = a.id || a.username;
              if (safeId && !workspaceAssigneeMap.has(safeId)) {
                 workspaceAssigneeMap.set(safeId, a);
                 allWorkspaceAssignees.push({...a, id: safeId});
              }
           });
        });

        const uniqueTags = Array.from(new Set(allTasksFlattened.flatMap(t => t.tags?.map(tag => tag.name) || [])));
        const uniqueAssignees = Array.from(new Set(allTasksFlattened.flatMap(t => t.assignees?.map(a => a.username) || [])));

        let filteredTasks = allTasksFlattened;
        if (completionFilterType === 'tags' && selectedTagFilter) filteredTasks = allTasksFlattened.filter(t => t.tags?.some(tag => tag.name === selectedTagFilter));
        else if (completionFilterType === 'assignees' && selectedAssigneeFilter) filteredTasks = allTasksFlattened.filter(t => t.assignees?.some(a => a.username === selectedAssigneeFilter));

        let allBugs = extractBugs(ledgifiedWorkflows.flatMap(wf => wf.tasks || []));
        if (completionFilterType === 'tags' && selectedTagFilter) allBugs = allBugs.filter(t => t.tags?.some(tag => tag.name === selectedTagFilter));
        else if (completionFilterType === 'assignees' && selectedAssigneeFilter) allBugs = allBugs.filter(t => t.assignees?.some(a => a.username === selectedAssigneeFilter));
        
        const allBugIds = new Set(allBugs.map(t => t.id));
        const allMotherTaskIds = new Set(ledgifiedWorkflows.flatMap(wf => wf.tasks || []).map(t => t.id));

        const getBreakdown = (tasksArray) => {
            const validTasks = tasksArray.filter(t => {
                const n = t.name?.toLowerCase() || '';
                return !(n.includes('qa bugs') || n.includes('ui bugs'));
            });
            const mothers = validTasks.filter(t => allMotherTaskIds.has(t.id)).length;
            const subs = validTasks.filter(t => !allMotherTaskIds.has(t.id)).length;
            return { total: validTasks.length, mothers, subs };
        };

        const backlogStatuses = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'new', 'pending'];
        const doneStatuses = ['closed', 'complete', 'done', 'resolved'];

        const backlogTasks = filteredTasks.filter(t => backlogStatuses.includes(t.status?.status?.toLowerCase() || 'open'));
        const backlogBreakdown = getBreakdown(backlogTasks);
        const backlogTasksCount = backlogBreakdown.total;

        const activeTasks = filteredTasks.filter(t => {
            const s = t.status?.status?.toLowerCase() || 'open';
            return !doneStatuses.includes(s) && !backlogStatuses.includes(s);
        });
        const activeBreakdown = getBreakdown(activeTasks);
