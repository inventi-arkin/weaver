                        </div>
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-3 h-3 bg-indigo-500 rounded-full mr-2 shadow-lg shadow-indigo-500/50"></div>
                          Remaining Time
                        </div>
                      </div>
                    </div>
                    
                    <div className="relative h-48 w-full">
                      <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                        <span>{totalEstHours}h</span>
                        <span>{Math.round(totalEstHours * 0.75)}h</span>
                        <span>{Math.round(totalEstHours * 0.5)}h</span>
                        <span>{Math.round(totalEstHours * 0.25)}h</span>
                        <span>0h</span>
                      </div>
                      
                      <div className="absolute left-10 right-2 top-2 bottom-6">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                          <defs>
                            <linearGradient id="burndownGradient" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stopColor="#6366f1" stopOpacity="0.25" />
                              <stop offset="100%" stopColor="#6366f1" stopOpacity="0" />
                            </linearGradient>
                          </defs>
                          <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="100" y1="0" x2="100" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="100" y2="100" stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" />

                          <polygon
                            points={polygonPointsString}
                            fill="url(#burndownGradient)"
                          />

                          <polyline
                            points={linePointsString}
                            fill="none"
                            stroke="#6366f1"
                            strokeWidth="3"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            vectorEffect="non-scaling-stroke"
                            className="drop-shadow-lg shadow-indigo-500/50"
                          />
                        </svg>
                      </div>

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                        <span className="-ml-3">{dayLabels[0]}</span>
                        <span>{dayLabels[1]}</span>
                        <span>{dayLabels[2]}</span>
                        <span className="-mr-4">{dayLabels[3]}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 3. Team Workload Section */}
                {assigneesList.length > 0 && (
                  <div className="mb-8 animate-in fade-in">
                    <div className="flex items-center space-x-2 mb-4">
                        <Users className="h-5 w-5 text-indigo-400" />
                        <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                          Team Workload
                          <MetricTooltip align="left" text="Aggregated task status counts and tracked time limits per user." formula="Recursively checks all mapped workflows, tallies hours per active assignee, and groups tasks by status strings.">
                            <InfoIcon className="h-4 w-4 text-slate-500 cursor-help" />
                          </MetricTooltip>
                        </h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {assigneesList.map(assignee => {
                        const estHours = Math.round(assignee.totalEstMs / 3600000);
                        const spentHours = Math.round(assignee.totalSpentMs / 3600000);
                        const progressPct = estHours > 0 ? Math.min(100, Math.round((spentHours / estHours) * 100)) : (spentHours > 0 ? 100 : 0);
                        const totalTasksAssigned = Object.values(assignee.statusCounts).reduce((sum, s) => sum + s.count, 0);

                        return (
                          <div key={assignee.username} className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-50 flex flex-col justify-between">
                            <div>
                              <div className="flex items-center space-x-4 mb-4">
                                <img src={assignee.profilePicture} alt={assignee.username} className="w-12 h-12 rounded-full border-2 border-indigo-500/30 object-cover bg-slate-800" />
                                <div>
                                  <h3 className="text-lg font-semibold text-white">{assignee.username}</h3>
                                  <p className="text-xs text-slate-400">{totalTasksAssigned} Assigned Item{totalTasksAssigned !== 1 ? 's' : ''}</p>
                                </div>
                              </div>
                              
                              <div className="flex flex-wrap gap-2 mb-6">
                                {Object.entries(assignee.statusCounts).map(([status, {count, color}]) => (
                                  <span key={status} className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border flex items-center" style={{ color: color, backgroundColor: `${color}15`, borderColor: `${color}30` }}>
                                    {status} <span className="ml-1 opacity-75 bg-slate-900/40 px-1.5 py-[1px] rounded-sm">{count}</span>
                                  </span>
                                ))}
                              </div>
                            </div>

                            <div>
                              <div className="flex justify-between text-xs mb-1.5 font-medium">
                                <span className="text-slate-400 flex items-center"><Clock className="h-3 w-3 mr-1" /> Logged Time</span>
                                <span className="text-white">{spentHours}h <span className="text-slate-500 font-normal">/ {estHours}h</span></span>
                              </div>
                              <div className="w-full bg-slate-950 border border-white/5 rounded-full h-2 overflow-hidden shadow-inner">
                                <div 
                                  className="bg-gradient-to-r from-indigo-500 to-violet-500 h-full rounded-full transition-all duration-1000" 
                                  style={{ width: `${progressPct}%`, boxShadow: `0 0 8px rgba(99,102,241,0.5)` }}
                                ></div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 4. Bug Tracking Widgets */}
                {totalBugsCount > 0 && (
                  <div className="mb-8 animate-in fade-in">
                    <div className="flex items-center space-x-2 mb-4">
                        <Bug className="h-5 w-5 text-rose-400" />
                        <h2 className="text-lg font-semibold text-white">Quality & Defects</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 lg:gap-6">
                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-rose-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                        <div className="bg-rose-500/10 p-3 rounded-lg border border-rose-500/20 shrink-0">
                          <Bug className="h-6 w-6 text-rose-400" />
                        </div>
                        <div>
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                            Active Defects
                            <MetricTooltip align="left" text="Unresolved bugs or defects." formula="Total identified bugs (in QA/UI Bug lists or tagged 'bug') minus resolved bugs.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                            </MetricTooltip>
                          </p>
                          <p className="text-2xl font-bold text-white mt-1">{activeBugsCount}</p>
                        </div>
                      </div>
                      
                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-orange-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                        <div className="bg-orange-500/10 p-3 rounded-lg border border-orange-500/20 shrink-0">
                          <ShieldAlert className="h-6 w-6 text-orange-400" />
                        </div>
                        <div>
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                            High/Critical
                            <MetricTooltip align="center" text="Urgent defects requiring immediate attention." formula="Active defects with priority set to 'High', 'Urgent', or 'Critical'.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                            </MetricTooltip>
                          </p>
                          <p className="text-2xl font-bold text-white mt-1">{criticalBugsCount}</p>
                        </div>
                      </div>

                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-emerald-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                        <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 shrink-0">
                          <Activity className="h-6 w-6 text-emerald-400" />
                        </div>
                        <div>
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                            Resolution Rate
                            <MetricTooltip align="center" text="Percentage of total identified bugs that have been fixed." formula="(Resolved Bugs / Total Identified Bugs) × 100">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                            </MetricTooltip>
                          </p>
                          <div className="flex items-end space-x-2 mt-1">
                            <p className="text-2xl font-bold text-white">{bugResolutionRate}%</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-sky-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                        <div className="bg-sky-500/10 p-3 rounded-lg border border-sky-500/20 shrink-0">
                          <Zap className="h-6 w-6 text-sky-400" />
                        </div>
                        <div>
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                            Avg Fix Velocity
                            <MetricTooltip align="right" text="Average turnaround time to resolve a defect." formula="Sum of (Date Closed - Date Created) for all resolved bugs / Total number of resolved bugs.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                            </MetricTooltip>
                          </p>
                          <div className="flex items-end space-x-2 mt-1">
                            <p className="text-2xl font-bold text-white">{avgVelocityDays}</p>
                            <p className="text-xs text-slate-400 mb-1">Days</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 5. Stalled Tasks Section (Exceptions) */}
                <div className="w-full space-y-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl animate-in slide-in-from-bottom-4 relative z-10 hover:z-50">
                    <div className="px-5 py-4 border-b border-white/5 bg-amber-500/5 flex items-center justify-between rounded-t-2xl">
                      <div className="flex items-center space-x-2">
                        <ClockAlert className="h-5 w-5 text-amber-400" />
                        <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                          Needs Attention
                          <MetricTooltip align="left" text="Active items where logged/elapsed time exceeds originally estimated time." formula="Elapsed Time (Date Now - Date Created) > Estimated Hours OR Logged Hours > Estimated Hours">
                            <InfoIcon className="h-4 w-4 text-amber-500 cursor-help" />
                          </MetricTooltip>
                        </h2>
                      </div>
                      <span className="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 uppercase tracking-wider">Stalled</span>
                    </div>
                    
                    {stalledTasks.length > 0 ? (
                      <ul className="divide-y divide-white/5 rounded-b-2xl">
                        {stalledTasks.map(task => {
                          const themeColor = task.status?.color || '#94a3b8';
                          const createdDate = task.date_created ? parseInt(task.date_created) : Date.now();
                          const daysOld = Math.floor((Date.now() - createdDate) / 86400000);
                          const estimatedHours = Math.round((parseInt(task.time_estimate) || 0) / 3600000);
                          
                          return (
                            <li 
                              key={task.id} 
                              onClick={() => setSelectedTicketForModal(task)}
                              className="p-4 hover:bg-slate-800/50 cursor-pointer transition-colors group flex items-start justify-between gap-3"
                            >
                              <div className="min-w-0">
                                <div className="flex items-center space-x-2 mb-1">
                                  <div 
                                    className="w-2 h-2 rounded-full shrink-0" 
                                    style={{ backgroundColor: themeColor }} 
                                  />
                                  <span className="text-sm font-semibold text-slate-200 truncate group-hover:text-white transition-colors">{task.name}</span>
                                </div>
                                <div className="flex items-center text-xs text-slate-500 ml-4">
                                  <ClockAlert className="h-3 w-3 mr-1 text-amber-500/70" />
                                  Elapsed: {daysOld}d / Est: {estimatedHours}h
                                </div>
                              </div>
                              
                              {task.assignees && task.assignees.length > 0 ? (
                                <img 
                                  src={task.assignees[0].profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(task.assignees[0].username)}&background=random`} 
                                  alt={task.assignees[0].username} 
                                  className="w-6 h-6 rounded-full border border-slate-700 bg-slate-800 object-cover shrink-0 mt-0.5" 
                                  title={`Assigned to ${task.assignees[0].username}`} 
                                />
                              ) : (
                                <div className="flex items-center justify-center w-6 h-6 rounded-full border border-white/5 bg-slate-900 text-slate-500 shrink-0 mt-0.5" title="Unassigned">
                                  <Users className="h-3 w-3" />
                                </div>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                    ) : (
                      <div className="p-8 text-center text-sm text-slate-500 italic rounded-b-2xl">
                          All tasks are running on schedule.
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex flex-col space-y-8 mb-8">
                  {/* 6. Active Workflows List */}
                  <div className="w-full space-y-6">
                    <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-50">
                      <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-t-2xl">
                        <div className="flex items-center space-x-3">
                          <h2 className="text-lg font-semibold text-white">Active Workflows</h2>
                        </div>
                        <button 
                          onClick={() => {
                            setIsSwitchModalOpen(true);
                            handleConnectClickUp();
                          }}
                          className="text-sm font-medium text-indigo-400 hover:text-white flex items-center shrink-0 transition-colors"
                        >
                          <FolderOpen className="h-4 w-4 mr-1" /> Switch Connection
                        </button>
                    </div>
                    <ul className="divide-y divide-white/5 max-h-[600px] overflow-y-auto rounded-b-2xl">
                      {mappedWorkflows.map(workflow => {
                        const currentTab = workflowTabs[workflow.id] || 'all';

                        const rootTasksByTags = (workflow.tasks || []).filter(task => {
                          const isDone = ['closed', 'complete', 'done', 'resolved'].includes(task.status?.status?.toLowerCase());
                          if (isDone) return false;

                          if (completionFilterType === 'none') return true;
                          
                          const hasMatchDeep = (t) => {
                              if (completionFilterType === 'tags' && selectedTagFilter) {
                                  if (t.tags?.some(tag => tag.name === selectedTagFilter)) return true;
                              } else if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                                  if (t.assignees?.some(a => a.username === selectedAssigneeFilter)) return true;
                              }
                              if (t.subtasks && t.subtasks.length > 0) return t.subtasks.some(sub => hasMatchDeep(sub));
                              return false;
                          };
                          
                          return hasMatchDeep(task);
                        });

                        const uniqueStatuses = Array.from(new Set(rootTasksByTags.map(t => t.status?.status || 'Open')));

                          const displayedTasks = rootTasksByTags.filter(task => {
                            if (currentTab === 'all') return true;
                            return (task.status?.status || 'Open') === currentTab;
                          });

                          return (
                            <li key={workflow.id} className="p-6 hover:bg-white/5 transition-colors">
                              <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                                <div className="flex items-start space-x-4">
                                  <div className="bg-indigo-500/10 p-2.5 rounded-lg hidden sm:block mt-1 border border-indigo-500/20">
                                    <SpiderNetworkIcon className="h-5 w-5 text-indigo-400" />
                                  </div>
                                  <div className="flex flex-col space-y-1.5 w-full">
                                    <div className="flex flex-wrap items-center text-sm text-slate-300 gap-y-2">
                                      <span className="font-semibold text-white flex items-center">
                                        <Box className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.team} / {workflow.space}
                                      </span>
                                      {workflow.folder !== 'No Folder' && (
                                        <>
                                          <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                          <span className="flex items-center text-slate-300">
                                            <FolderOpen className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.folder}
                                          </span>
                                        </>
                                      )}
                                      <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                      <span className="font-semibold text-indigo-400 flex items-center bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20 shadow-sm">
                                        <ListTodo className="h-4 w-4 mr-1.5" /> {workflow.list}
                                      </span>
                                    </div>
                                    <div className="flex items-center text-xs text-slate-500">
                                      <Clock className="h-3 w-3 mr-1" />
                                      Last synced: {new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(workflow.lastSynced))}
                                    </div>
                                  </div>
                                </div>
                                <button 
                                  onClick={() => removeMapping(workflow.id)}
                                  className="text-slate-400 hover:text-red-400 transition-colors p-2 rounded-md hover:bg-red-950/20 shrink-0 self-end sm:self-start"
                                  title="Remove Mapping"
                                >
                                  <Trash2 className="h-5 w-5" />
                                </button>
                              </div>

                              <div className="mt-5 pt-4 border-t border-white/5 sm:ml-12 pl-1 sm:pl-0">
                                <div className="flex flex-wrap gap-2 mb-4 border-b border-white/5 pb-3">
                                  <button
                                    onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: 'all' }))}
                                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                                      currentTab === 'all'
                                        ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30'
                                        : 'bg-slate-900/60 text-slate-400 border border-transparent hover:text-slate-200'
                                    }`}
                                  >
                                    All ({rootTasksByTags.length})
                                  </button>
                                  {uniqueStatuses.map(status => {
                                    const count = rootTasksByTags.filter(t => (t.status?.status || 'Open') === status).length;
                                    const statusColor = rootTasksByTags.find(t => (t.status?.status || 'Open') === status)?.status?.color || '#94a3b8';
                                    const isSelected = currentTab === status;
                                    
                                    return (
                                      <button
                                        key={status}
                                        onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: status }))}
                                        className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 capitalize border ${
                                          isSelected
                                            ? 'bg-slate-900 text-white'
                                            : 'bg-slate-900/40 text-slate-400 border-transparent hover:text-slate-200'
                                        }`}
                                        style={isSelected ? { borderColor: `${statusColor}40`, boxShadow: `0 0 8px ${statusColor}15` } : {}}
                                      >
                                        <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: statusColor, boxShadow: `0 0 6px ${statusColor}` }} />
                                        {status} ({count})
                                      </button>
                                    );
                                  })}
                                </div>

                                <div className="flex items-center justify-between mb-3">
                                  <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Top-Level Tasks</h4>
                                  <span className="text-xs bg-slate-900/60 text-slate-400 border border-white/5 px-2.5 py-0.5 rounded-full font-medium">
                                    {currentTab !== 'all'
                                      ? `Showing ${displayedTasks.length} of ${rootTasksByTags.length} tasks`
                                      : `${rootTasksByTags.length} tasks`}
                                  </span>
                                </div>
                                
                                {displayedTasks && displayedTasks.length > 0 ? (
                                  <div className="space-y-3">
                                    {displayedTasks.map(task => (
                                      <TaskItem 
                                        key={task.id} 
                                        task={task} 
                                        expandedTasks={expandedTasks} 
                                        toggleTaskExpand={toggleTaskExpand} 
                                      />
                                    ))}
                                  </div>
                                ) : (
                                  <div className="text-sm text-slate-400 italic p-4 bg-slate-950/20 rounded-lg text-center border border-white/5">
                                    No tasks match this status tab filter.
                                 </div>
                                )}
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  </div>

                  {/* 7. Completed Workflows Section */}
                  <div className="w-full space-y-6">
                    <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-50">
                      <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-t-2xl">
                        <div className="flex items-center space-x-3">
                          <h2 className="text-lg font-semibold text-white">Completed Tasks</h2>
                          <span className="flex items-center text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20 transition-all">
                            <CheckCircle2 className="h-3 w-3 mr-1" /> {completedFilteredTasksCount} Resolved
                          </span>
                        </div>
                      </div>
                      <ul className="divide-y divide-white/5 max-h-[400px] overflow-y-auto rounded-b-2xl">
                        {mappedWorkflows.map(workflow => {
                          const rootTasksByTags = (workflow.tasks || []).filter(task => {
                            const isDone = ['closed', 'complete', 'done', 'resolved'].includes(task.status?.status?.toLowerCase());
                            if (!isDone) return false; // ONLY SHOW DONE

                            if (completionFilterType === 'none') return true;
                            
                            const hasMatchDeep = (t) => {
                                if (completionFilterType === 'tags' && selectedTagFilter) {
                                    if (t.tags?.some(tag => tag.name === selectedTagFilter)) return true;
                                } else if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                                    if (t.assignees?.some(a => a.username === selectedAssigneeFilter)) return true;
                                }
                                if (t.subtasks && t.subtasks.length > 0) return t.subtasks.some(sub => hasMatchDeep(sub));
                                return false;
                            };
                            
                            return hasMatchDeep(task);
                          });

                          if (rootTasksByTags.length === 0) return null;

                          return (
                            <li key={`completed-${workflow.id}`} className="p-6 hover:bg-white/5 transition-colors">
                              <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                                <div className="flex items-start space-x-4">
                                  <div className="bg-emerald-500/10 p-2.5 rounded-lg hidden sm:block mt-1 border border-emerald-500/20">
                                    <CheckCircle2 className="h-5 w-5 text-emerald-400" />
                                  </div>
                                  <div className="flex flex-col space-y-1.5 w-full">
                                    <div className="flex flex-wrap items-center text-sm text-slate-300 gap-y-2">
                                      <span className="font-semibold text-white flex items-center">
                                        <Box className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.team} / {workflow.space}
                                      </span>
                                      {workflow.folder !== 'No Folder' && (
                                        <>
                                          <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                          <span className="flex items-center text-slate-300">
                                            <FolderOpen className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.folder}
                                          </span>
                                        </>
                                      )}
                                      <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                      <span className="font-semibold text-emerald-400 flex items-center bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20 shadow-sm">
                                        <ListTodo className="h-4 w-4 mr-1.5" /> {workflow.list}
                                      </span>
                                    </div>
                                    <div className="flex items-center text-xs text-slate-500">
                                      <Clock className="h-3 w-3 mr-1" />
                                      Last synced: {new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(workflow.lastSynced))}
                                    </div>
                                  </div>
                                </div>
                              </div>

                              <div className="mt-5 pt-4 border-t border-white/5 sm:ml-12 pl-1 sm:pl-0">
                                <div className="space-y-3">
                                  {rootTasksByTags.map(task => (
                                    <TaskItem 
                                      key={task.id} 
                                      task={task} 
                                      expandedTasks={expandedTasks} 
                                      toggleTaskExpand={toggleTaskExpand}
                                      isDoneMode={true}
                                    />
                                  ))}
                                </div>
                              </div>
                            </li>
                          );
                        })}
                        {mappedWorkflows.every(workflow => {
                          const rootTasksByTags = (workflow.tasks || []).filter(task => {
                            const isDone = ['closed', 'complete', 'done', 'resolved'].includes(task.status?.status?.toLowerCase());
                            if (!isDone) return false;
                            if (completionFilterType === 'none') return true;
                            const hasMatchDeep = (t) => {
                                if (completionFilterType === 'tags' && selectedTagFilter) {
                                    if (t.tags?.some(tag => tag.name === selectedTagFilter)) return true;
                                } else if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                                    if (t.assignees?.some(a => a.username === selectedAssigneeFilter)) return true;
                                }
                                if (t.subtasks && t.subtasks.length > 0) return t.subtasks.some(sub => hasMatchDeep(sub));
                                return false;
                            };
                            return hasMatchDeep(task);
                          });
                          return rootTasksByTags.length === 0;
                        }) && (
                          <div className="p-8 text-center text-sm text-slate-500 italic rounded-b-2xl">
                            No completed tasks match your filters yet.
                          </div>
                        )}
                      </ul>
                    </div>
                  </div>
                </div>
              </main>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 flex font-sans relative overflow-hidden">
          <WebNestBackground opacity={0.85} />
          
          <div className="absolute inset-0 pointer-events-none z-10" style={{ background: 'radial-gradient(circle, transparent 30%, rgba(9, 13, 22, 0.4) 100%)' }}></div>

          <div className="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative z-20">
            <div className="max-w-md relative bg-slate-900/40 backdrop-blur-md p-8 rounded-[2rem] border border-white/5 shadow-2xl">
              <div className="flex items-center mb-8">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                  <SpiderNetworkIcon className="h-8 w-8 text-white" />
                </div>
                <span className="ml-3 text-3xl font-extrabold tracking-tight text-white">Weaver</span>
              </div>
              <h1 className="text-4xl font-bold text-white leading-tight mb-6">
                Thread your support and development together.
              </h1>
              <p className="text-lg text-slate-300 mb-8 leading-relaxed font-medium">
                Weaver creates a seamless bridge between your front-line ticketing apps and your back-office task managers. Resolve faster, together.
              </p>
              
              <div className="space-y-4">
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Native syncing with Zendesk & Jira</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Automated task creation from tickets</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Real-time status updates across teams</span>
                </div>
              </div>
            </div>
          </div>

          <div className="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 relative z-20 bg-slate-950/20 backdrop-blur-[4px] border-l border-white/10 shadow-[-20px_0_50px_rgba(0,0,0,0.3)]">
            <div className="absolute top-8 left-8 flex items-center lg:hidden bg-slate-900/60 backdrop-blur-xl px-4 py-2 rounded-2xl shadow-sm border border-white/10">
              <SpiderNetworkIcon className="h-6 w-6 text-indigo-400" />
              <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
            </div>

            <div className="w-full max-w-sm space-y-8 bg-slate-900/30 backdrop-blur-2xl p-8 sm:p-10 rounded-[2.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] border border-white/10">
              <div className="text-center lg:text-left">
                <h2 className="text-3xl font-bold text-white tracking-tight">Welcome back</h2>
                <p className="mt-2 text-sm text-slate-400 font-medium">
                  Please sign in to your account to continue.
                </p>
              </div>

              <div className="mt-8 space-y-6">
                <button
                  onClick={handleGoogleLogin}
                  disabled={isLoggingIn}
                  className="w-full flex items-center justify-center px-4 py-3 border border-slate-700/60 shadow-lg bg-slate-800/80 hover:bg-slate-800 text-sm font-medium text-slate-100 hover:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all disabled:opacity-70 disabled:cursor-not-allowed"
                >
                  {isLoggingIn ? (
                    <div className="flex items-center space-x-2">
                      <div className="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                      <span>Connecting...</span>
                    </div>
                  ) : (
                    <>
                      <svg className="h-5 w-5 mr-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                      </svg>
                      Sign in with Google
                    </>
                  )}
                </button>

                {errorMessage && (
                  <div className="mt-4 p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300 animate-in fade-in slide-in-from-top-2">
                    <p className="font-semibold mb-1">{errorMessage}</p>
                  </div>
                )}

                <p className="text-center text-xs text-slate-500 mt-8">
                  By clicking continue, you agree to our{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">
                    Terms of Service
                  </a>{' '}
                  and{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">
                    Privacy Policy
                  </a>.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render to Virtual DOM root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
