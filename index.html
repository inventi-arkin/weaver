    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false }) => {

              <span className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border shrink-0" style={{ color: themeColor, backgroundColor: `${themeColor}15`, borderColor: `${themeColor}30` }}>
                {task.status?.status || 'Open'}
              </span>
              {isParent && task.tags && task.tags.length > 0 && (
                <div className="flex items-center space-x-1 mr-2 hidden sm:flex shrink-0">
                  <Tag className="h-3 w-3 text-slate-500 mr-1" />
                  {task.tags.map((tag, i) => (
                    <span key={i} className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap" style={{ color: tag.color || '#6366f1', backgroundColor: `${tag.color || '#6366f1'}15`, border: `1px solid ${tag.color || '#6366f1'}30` }}>

    // --- HTML5 Canvas Background ---
    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initializeWebs();
        };
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];

          const webConfigs = [
            { cx: width * 0.28, cy: height * 0.5, radius: Math.min(width, height) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: width * 0.72, cy: height * 0.42, radius: Math.min(width, height) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];

            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });
            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                const x = cx + Math.cos(angle) * currentRadius;
                const y = cy + Math.sin(angle) * currentRadius;
                nodes.push({ id: nodes.length, x, y, spoke: s, ring: r, isHub: false });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });

            spiders.push({
              webIdx,
              currentNode: nodes[Math.floor(Math.random() * nodes.length)],
              targetNode: null,
              progress: 0,
              speed: 0.006 + Math.random() * 0.004,
              x: cx, y: cy, size: 7 + webIdx * 3, legCycle: 0, wovenPaths: []
            });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({ webIdx, from: edge.from, to: edge.to, progress: 0, speed: 0.015 + Math.random() * 0.02, size: 1.5 + Math.random() * 1.5 });
        };

        const animate = () => {
          ctx.clearRect(0, 0, width, height);

          webs.forEach(web => {
            web.edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${web.color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });
            web.nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${web.color}, 0.25)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) spawnPacket();

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) return packets.splice(idx, 1);
            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${webs[packet.webIdx].color}, 0.6)`;
            ctx.fill();
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];
            if (!spider.targetNode) {
              const neighbors = web.edges.filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id).map(e => e.from.id === spider.currentNode.id ? e.to : e.from);
              if (neighbors.length > 0) {
                spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)];
                spider.progress = 0;
              }
            }
            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;
              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;
              if (spider.progress >= 1) {
                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }
            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.beginPath();
            ctx.arc(0, 0, spider.size * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${web.color})`;
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block z-0 transition-opacity duration-1000" style={{ opacity }} />;
    };

    // --- MOCK DATA ---
    const MOCK_CLICKUP_DATA = {

    function App() {

      const [integrationStep, setIntegrationStep] = useState('idle');
      const [clickUpToken, setClickUpToken] = useState(() => localStorage.getItem(`weaver_clickup_token_${appId}`) || '');
      const [tempToken, setTempToken] = useState('');
      const [clickUpError, setClickUpError] = useState(null);
      const [mappedWorkflows, setMappedWorkflows] = useState(() => {
        try {
          const saved = localStorage.getItem(`weaver_workflows_${appId}`);
          return saved ? JSON.parse(saved) : [];

      });
      const [isAutoSyncing, setIsAutoSyncing] = useState(false);
      
      // Filtering & Settings State
      const [completionFilterType, setCompletionFilterType] = useState('none');
      const [selectedTagFilter, setSelectedTagFilter] = useState('');
      const [selectedAssigneeFilter, setSelectedAssigneeFilter] = useState('');
      const [userRoles, setUserRoles] = useState(() => {

      const [devHoursPerDay, setDevHoursPerDay] = useState(() => {

      const [qaHoursPerDay, setQaHoursPerDay] = useState(() => {

      const [teams, setTeams] = useState([]);
      const [spaces, setSpaces] = useState([]);
      const [folders, setFolders] = useState([]);
      const [lists, setLists] = useState([]);
      const [folderlessLists, setFolderlessLists] = useState([]);
      const [selectedTeam, setSelectedTeam] = useState('');
      const [selectedSpace, setSelectedSpace] = useState('');
      const [selectedFolder, setSelectedFolder] = useState('');
      const [selectedList, setSelectedList] = useState('');

      const mappedWorkflowsRef = useRef(mappedWorkflows);
      useEffect(() => { mappedWorkflowsRef.current = mappedWorkflows; }, [mappedWorkflows]);

      const handleMockClickUpData = () => {
        setTeams(MOCK_CLICKUP_DATA.teams);
        setClickUpToken('mock_token');
        setClickUpError(null);
        setIntegrationStep('selecting');
      };

      const fetchClickUp = async (endpoint, token) => {
        if (token === 'mock_token') return {};
        throw new Error('Connection blocked by CORS. Please use the Mock Data bypass to preview the UI.');
      };

      useEffect(() => {
        if (!selectedTeam || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setSpaces(MOCK_CLICKUP_DATA.spaces[selectedTeam] || []); return; }
      }, [selectedTeam, clickUpToken]);

      useEffect(() => {
        if (!selectedSpace || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
          setFolders(MOCK_CLICKUP_DATA.folders[selectedSpace] || []);
          setFolderlessLists(MOCK_CLICKUP_DATA.folderlessLists[selectedSpace] || []);
        }
      }, [selectedSpace, clickUpToken]);

      useEffect(() => {
        if (!selectedFolder || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
            setLists(MOCK_CLICKUP_DATA.lists[selectedFolder] || []);
            return;
        }
      }, [selectedFolder, clickUpToken]);

      const availableLists = selectedFolder ? lists : folderlessLists;

      const handleConnectClickUp = () => {
        setIsSwitchModalOpen(true);
        if (clickUpToken && teams.length > 0) {
          setIntegrationStep('selecting');
        } else {
          setIntegrationStep('entering_token');
        }
      };

      const handleCancelIntegration = () => {
        setIntegrationStep('idle');
        setTempToken('');
        setClickUpError(null);
        setIsSwitchModalOpen(false);
      };

      const handleAuthenticateToken = async () => {
        if (!tempToken) return;
        setIntegrationStep('connecting');
        setClickUpError(null);
        try {
          const data = await fetchClickUp('team', tempToken);
          setTeams(data.teams || []);
          setClickUpToken(tempToken);
          setIntegrationStep('selecting');
        } catch (err) {
          setClickUpError(err.message);
          setIntegrationStep('entering_token');
        }
      };

      const buildTaskTree = (flatTasks) => {
        const taskMap = {};
        const roots = [];
        flatTasks.forEach(task => { taskMap[task.id] = { ...task, subtasks: [] }; });
        flatTasks.forEach(task => {
          const parentId = task.parent;
          if (parentId && taskMap[parentId]) {
            taskMap[parentId].subtasks.push(taskMap[task.id]);
          } else {
            roots.push(taskMap[task.id]);
          }
        });
        return roots;
      };

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;
        setIntegrationStep('connecting');
        const teamName = teams.find(t => t.id === selectedTeam)?.name || 'Workspace';
        const spaceName = spaces.find(s => s.id === selectedSpace)?.name || 'Space';
        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';
        const listName = availableLists.find(l => l.id === selectedList)?.name || 'Task List';

        let initialTasks = [];
        if (clickUpToken === 'mock_token') {
          initialTasks = buildTaskTree(MOCK_CLICKUP_DATA.tasks[selectedList] || []);
        }
        
        const newWorkflows = [...mappedWorkflows, {
          id: Date.now().toString(), team: teamName, space: spaceName, folder: folderName, list: listName, listId: selectedList, tasks: initialTasks, lastSynced: Date.now()
        }];
        setMappedWorkflows(newWorkflows);
        localStorage.setItem(`weaver_workflows_${appId}`, JSON.stringify(newWorkflows));
        
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');
          try {
            await setDoc(docRef, { mappedWorkflows: newWorkflows }, { merge: true });
          } catch(err) {
            console.error("Error saving workflows to Firestore", err);
          }
        }

        setSelectedTeam(''); setSelectedSpace(''); setSelectedFolder(''); setSelectedList('');
        handleCancelIntegration();
      };

      const removeMapping = async (id) => {
        const newWorkflows = mappedWorkflows.filter(w => w.id !== id);
        setMappedWorkflows(newWorkflows);
        localStorage.setItem(`weaver_workflows_${appId}`, JSON.stringify(newWorkflows));
        
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');
          try {
            await setDoc(docRef, { mappedWorkflows: newWorkflows }, { merge: true });
          } catch(err) {
            console.error("Error deleting workflow from Firestore", err);
          }
        }
      };

      const runSyncSequence = async () => {
        if (mappedWorkflowsRef.current.length === 0 || !clickUpToken) return;
        setIsAutoSyncing(true);
        const updatedWorkflows = await Promise.all(mappedWorkflowsRef.current.map(async (workflow) => {
          let updatedTasks = workflow.tasks;
          let listStartDate = workflow.listStartDate || null;
          let listDueDate = workflow.listDueDate || null;

          if (clickUpToken === 'mock_token') {
            updatedTasks = buildTaskTree(MOCK_CLICKUP_DATA.tasks[workflow.listId] || MOCK_CLICKUP_DATA.tasks['mock_list_1']);
          } else {
            try {
              const listDetail = await fetchClickUp(`list/${workflow.listId}`, clickUpToken);
              if (listDetail.start_date) listStartDate = listDetail.start_date;
              if (listDetail.due_date) listDueDate = listDetail.due_date;

              let page = 0, hasMore = true, allFetchedTasks = [];
              while (hasMore) {
                  const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=true&include_closed=true&page=${page}`, clickUpToken);
                  const tasksChunk = data.tasks || [];
                  allFetchedTasks.push(...tasksChunk);
                  if (tasksChunk.length === 100) page++; else hasMore = false;
              }
              if (allFetchedTasks.length > 0) {
                  updatedTasks = buildTaskTree(allFetchedTasks);
              }
            } catch (err) { console.error("Sync error:", err); }
          }
          return { ...workflow, tasks: updatedTasks, lastSynced: Date.now(), listStartDate, listDueDate };
        }));
        
        setMappedWorkflows(updatedWorkflows);
        localStorage.setItem(`weaver_workflows_${appId}`, JSON.stringify(updatedWorkflows));
        
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');
          try {
            await setDoc(docRef, { mappedWorkflows: updatedWorkflows }, { merge: true });
          } catch(err) {
            console.error("Error saving synced workflows to Firestore", err);
          }
        }
        setIsAutoSyncing(false);
      };

      // Background synchronization loop
      useEffect(() => {
        if (mappedWorkflows.length === 0 || !clickUpToken) return;
        const syncInterval = setInterval(runSyncSequence, 30000); // 30 seconds
        return () => clearInterval(syncInterval);
      }, [mappedWorkflows.length, clickUpToken, user]);

      const saveSettings = async (updates) => {
        const currentLocal = JSON.parse(localStorage.getItem(`weaver_settings_${appId}`) || '{}');
        const newSettings = { ...currentLocal, ...updates };
        localStorage.setItem(`weaver_settings_${appId}`, JSON.stringify(newSettings));
        
        if (user && !user.isMock) {
          try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'capacity'), updates, { merge: true });
          } catch(err) {
             console.error("Error saving capacity settings to Firestore", err);
          }
        }
      };

      // Auth Initialization
      useEffect(() => {
        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            try {
              await signInWithCustomToken(auth, __initial_auth_token);
            } catch(err) {
              if (err.code !== 'auth/custom-token-mismatch') console.warn("Custom token sign in failed", err);
            }
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) {
            setUser({ 
              uid: currentUser.uid, 
              name: currentUser.isAnonymous ? 'Preview User' : (currentUser.displayName || 'User'), 
              email: currentUser.email || 'preview@weaver.app', 
              avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.isAnonymous ? 'Preview+User' : encodeURIComponent(currentUser.displayName || 'User')}`, 
              isMock: false,
              isAnonymous: currentUser.isAnonymous
            });
          } else {
            setUser((prev) => prev?.isMock ? prev : null);
          }
          setAuthInitialized(true);
        });
        return () => unsubscribe();
      }, []);

      // Global Time Ledger & Settings Sync
      useEffect(() => {
        if (!user || user.isMock) return;

        const ledgerRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
        const unsubLedger = onSnapshot(ledgerRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.entries) setGlobalTimeLedger(data.entries);
          }
        }, (error) => console.error("Error fetching global ledger:", error));

        const wfRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');
        const unsubWf = onSnapshot(wfRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.mappedWorkflows) setMappedWorkflows(data.mappedWorkflows);
          }
        }, (error) => console.error("Error fetching workflows:", error));

        const capRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'capacity');
        const unsubCap = onSnapshot(capRef, (snapshot) => {
          if (snapshot.exists()) {
            const d = snapshot.data();
            setDevHoursPerDay(d.devHoursPerDay !== undefined ? d.devHoursPerDay : 7);
            setQaHoursPerDay(d.qaHoursPerDay !== undefined ? d.qaHoursPerDay : 7);
            setDateBlockers(d.dateBlockers || []);
            setUserRoles(d.userRoles || {});
          }
        }, (error) => console.error("Error fetching capacity settings:", error));

        return () => { unsubLedger(); unsubWf(); unsubCap(); };
      }, [user]);

      const handleMockLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try {
          await signInAnonymously(auth);
        } catch (error) {
          console.warn("Firebase Auth blocked, falling back to fully local isolated session:", error);
          setUser({ name: 'Preview User', email: 'preview@weaver.app', avatar: 'https://ui-avatars.com/api/?name=Preview+User', isMock: true });
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain' || error.message.includes('iframe') || error.code === 'auth/popup-closed-by-user') {
            handleMockLogin();
          } else { 
            setErrorMessage(error.message); 
            handleMockLogin(); 
          }
        } finally { 
          setIsLoggingIn(false); 
        }
      };

      const handleLogout = () => {
        if (auth.currentUser) firebaseSignOut(auth);
        else setUser(null);
      };

      const handleLogTime = async () => {
        if (!selectedTaskIdForTime || !timeEntryHours) return;
        const ms = parseFloat(timeEntryHours) * 3600000;
        
        let entryTimestamp = Date.now();
        if (timeEntryDate) {
            const [y, m, d] = timeEntryDate.split('-');
            const dateObj = new Date(y, m - 1, d, 12, 0, 0); // Noon to avoid timezone date shifting
            entryTimestamp = dateObj.getTime();
        }

        const newEntry = {
          id: Date.now().toString(),
          taskId: selectedTaskIdForTime,
          ms: ms,
          timestamp: entryTimestamp,
          userId: timeAssignee || user?.name || 'unknown',
          note: timeEntryNote || 'Manual entry'
        };
        
        setGlobalTimeLedger(prev => {
          const updated = [...prev, newEntry];
          localStorage.setItem(`weaver_ledger_${appId}`, JSON.stringify(updated));
          return updated;
        });
        
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
          try {
            await updateDoc(docRef, { entries: arrayUnion(newEntry) });
          } catch (error) {
            if (error.code === 'not-found') await setDoc(docRef, { entries: [newEntry] });
            else console.error("Error saving time entry:", error);
          }
        }

        setTimeEntryHours('');
        setTimeEntryNote('');
      };

      const handleDeleteTimeEntry = async (entry) => {
        setGlobalTimeLedger(prev => {
          const updated = prev.filter(e => e.id !== entry.id);
          localStorage.setItem(`weaver_ledger_${appId}`, JSON.stringify(updated));
          return updated;
        });
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
          try {
            await updateDoc(docRef, { entries: arrayRemove(entry) });
          } catch (error) {
            console.error("Error deleting time entry:", error);
          }
        }
      };

      if (!authInitialized) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center">
            <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      // --- Authenticated Dashboard Scope ---
      if (user) {
        // Math & Filtering Bridge (Applies global time ledger logs seamlessly to computations)
        const applyLedger = (tasks) => {
          return tasks.map(t => {
            const processedSubtasks = t.subtasks ? applyLedger(t.subtasks) : [];
            const ledgerEntries = globalTimeLedger.filter(e => e.taskId === t.id);
            const directAddedTimeMs = ledgerEntries.reduce((sum, e) => sum + Number(e.ms || 0), 0);
            const rolledUpAddedTimeMs = processedSubtasks.reduce((sum, sub) => sum + Number(sub._totalLocalAddedMs || 0), 0);
            const totalLocalAddedMs = directAddedTimeMs + rolledUpAddedTimeMs;

            const rawNativeSpent = Number(t.time_spent || 0);
            const rolledUpNativeSpent = processedSubtasks.reduce((sum, sub) => sum + Number(sub.rawNativeSpent || 0), 0);
            const directNativeSpent = Math.max(0, rawNativeSpent - rolledUpNativeSpent);

            const rawEstimate = Number(t.time_estimate || 0);
            const rolledUpEstimate = processedSubtasks.reduce((sum, sub) => sum + Number(sub.rawEstimate || 0), 0);
            const directEstimate = Math.max(0, rawEstimate - rolledUpEstimate);

            return {
              ...t,
              rawNativeSpent,
              directNativeSpent,
              rawEstimate,
              directEstimate,
              localLedger: ledgerEntries,
              _totalLocalAddedMs: totalLocalAddedMs,
              _directAddedTimeMs: directAddedTimeMs,
              time_spent: rawNativeSpent + totalLocalAddedMs,
              _direct_time_spent: directNativeSpent + directAddedTimeMs,
              time_estimate: rawEstimate,
              subtasks: processedSubtasks
            };
          });
        };

        const activeWorkflows = mappedWorkflows.map(wf => ({
          ...wf,
          tasks: applyLedger(wf.tasks || [])
        }));

        const flattenTasksDeep = (tasks) => tasks.reduce((acc, task) => {
            acc.push(task);
            if (task.subtasks) acc.push(...flattenTasksDeep(task.subtasks));
            return acc;
        }, []);

        const allFlatTasks = flattenTasksDeep(activeWorkflows.flatMap(wf => wf.tasks || []));

        const totalGlobalHours = globalTimeLedger.reduce((acc, curr) => acc + curr.ms, 0) / 3600000;
        const getLoggedMsForTask = (taskId) => globalTimeLedger.filter(e => e.taskId === taskId).reduce((acc, curr) => acc + curr.ms, 0);

        const uniqueTags = Array.from(new Set(allFlatTasks.flatMap(t => t.tags?.map(tag => tag.name || '') || [])));
        const uniqueAssignees = Array.from(new Set(allFlatTasks.flatMap(t => [
            ...(t.assignees?.map(a => a.username || '') || []),
            ...(t.localLedger?.map(l => l.userId || '') || [])
        ]).filter(Boolean)));
        const workspaceUsers = Array.from(new Set([user?.name, ...uniqueAssignees])).filter(Boolean);

        const checkGlobalFilter = (t) => {
            if (completionFilterType === 'none') return true;
            if (completionFilterType === 'tags' && selectedTagFilter) return t.tags?.some(tag => (tag.name || '') === selectedTagFilter);
            if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                const nativelyAssigned = t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter);
                const locallyAssigned = t.localLedger?.some(l => (l.userId || '') === selectedAssigneeFilter);
                return nativelyAssigned || locallyAssigned;
            }
            return true;
        };
        
        let filteredTasks = allFlatTasks.filter(checkGlobalFilter);
        const doneStatuses = ['closed', 'complete', 'done', 'resolved'];
        const backlogStatuses = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'new', 'pending'];

        const buildFilteredTree = (tasks, isDoneMode) => {
            let result = [];
            tasks.forEach(task => {
                const isDone = doneStatuses.includes((task.status?.status || '').toLowerCase());
                const matchesMode = isDoneMode ? isDone : !isDone;
                const matchesFilter = checkGlobalFilter(task);
                let filteredSubtasks = task.subtasks ? buildFilteredTree(task.subtasks, isDoneMode) : [];
                if ((matchesMode && matchesFilter) || filteredSubtasks.length > 0) {
                    result.push({ ...task, subtasks: filteredSubtasks });
                }
            });
            return result;
        };

        const extractBugs = (tasks, inBugContext = false) => {
          let bugs = [];
          tasks.forEach(t => {
              const taskNameLower = (t.name || '').toLowerCase();
              const isBugContainer = taskNameLower.includes('qa bugs') || taskNameLower.includes('ui bugs');
              const isContext = inBugContext || isBugContainer;
              const hasBugTag = t.tags?.some(tag => ['bug', 'defect'].includes((tag.name || '').toLowerCase()));
              if ((isContext && !isBugContainer) || hasBugTag) { if (!bugs.find(b => b.id === t.id)) bugs.push(t); }
              if (t.subtasks && t.subtasks.length > 0) bugs.push(...extractBugs(t.subtasks, isContext));
          });
          return bugs;
        };

        let allBugs = extractBugs(activeWorkflows.flatMap(wf => wf.tasks || []));
        if (completionFilterType === 'tags' && selectedTagFilter) allBugs = allBugs.filter(t => t.tags?.some(tag => (tag.name || '') === selectedTagFilter));
        else if (completionFilterType === 'assignees' && selectedAssigneeFilter) allBugs = allBugs.filter(t => t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter));

        const allMotherTaskIds = new Set(activeWorkflows.flatMap(wf => wf.tasks || []).map(t => t.id));

        const getBreakdown = (tasksArray) => {
            const validTasks = tasksArray.filter(t => {
                const n = (t.name || '').toLowerCase();
                return !n.includes('qa bugs') && !n.includes('ui bugs');
            });
            const mothers = validTasks.filter(t => allMotherTaskIds.has(t.id)).length;
            const subs = validTasks.filter(t => !allMotherTaskIds.has(t.id)).length;
            return { total: validTasks.length, mothers, subs };
        };

        const backlogTasks = filteredTasks.filter(t => backlogStatuses.includes((t.status?.status || 'open').toLowerCase()));
        const backlogBreakdown = getBreakdown(backlogTasks);
        const backlogTasksCount = backlogBreakdown.total;

        const activeMainTasks = filteredTasks.filter(t => {
            const s = (t.status?.status || 'open').toLowerCase();
            return !doneStatuses.includes(s) && !backlogStatuses.includes(s);
        });
        const activeBreakdown = getBreakdown(activeMainTasks);
        const activeTasksCount = activeBreakdown.total;

        const completedTasks = filteredTasks.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase()));
        const completedBreakdown = getBreakdown(completedTasks);
        const completedFilteredTasksCount = completedBreakdown.total;

        const totalDistTasks = backlogBreakdown.total + activeBreakdown.total + completedBreakdown.total;
        const backlogDistPct = totalDistTasks > 0 ? (backlogBreakdown.total / totalDistTasks) * 100 : 0;
        const activeDistPct = totalDistTasks > 0 ? (activeBreakdown.total / totalDistTasks) * 100 : 0;
        const resolvedDistPct = totalDistTasks > 0 ? (completedBreakdown.total / totalDistTasks) * 100 : 0;

        const parseDateMs = (d) => {
            if (!d) return 0;
            const n = Number(d);
            return !isNaN(n) ? n : new Date(d).getTime() || 0;
        };

        const filteredTaskIds = new Set(filteredTasks.map(t => t.id));
        const independentTasks = filteredTasks.filter(t => !t.parent || !filteredTaskIds.has(t.parent));

        const assigneeStats = {};
        workspaceUsers.forEach(u => {
            assigneeStats[u] = {
                username: u,
                profilePicture: `https://ui-avatars.com/api/?name=${encodeURIComponent(u)}&background=random`,
                statusCounts: {}, totalEstMs: 0, totalSpentMs: 0
            };
        });

        filteredTasks.forEach(task => {
          const statusName = task.status?.status || 'Open';
          const statusColor = task.status?.color || '#94a3b8';
          const isDone = doneStatuses.includes(statusName.toLowerCase());
          
          let est = task.directEstimate !== undefined ? task.directEstimate : (task.time_estimate ? parseInt(task.time_estimate) : 0);
          const nativeSpent = task.directNativeSpent !== undefined ? task.directNativeSpent : (task.rawNativeSpent ? parseInt(task.rawNativeSpent) : (isDone ? est : 0));

          if (task.assignees && task.assignees.length > 0) {
            task.assignees.forEach(assignee => {
              const key = assignee.username || `User_${assignee.id}`;
              if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
              
              if (!assigneeStats[key]) {
                assigneeStats[key] = { username: key, profilePicture: assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(key)}&background=random`, statusCounts: {}, totalEstMs: 0, totalSpentMs: 0 };
              }
              if (!assigneeStats[key].statusCounts[statusName]) assigneeStats[key].statusCounts[statusName] = { count: 0, color: statusColor };
              assigneeStats[key].statusCounts[statusName].count++;
              assigneeStats[key].totalEstMs += est;
              assigneeStats[key].totalSpentMs += nativeSpent;
            });
          }

          if (task.localLedger && task.localLedger.length > 0) {
              task.localLedger.forEach(entry => {
                  const key = entry.userId;
                  if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
                  if (assigneeStats[key]) {
                      assigneeStats[key].totalSpentMs += Number(entry.ms);
                  }
              });
          }
        });
        
        const assigneesList = Object.values(assigneeStats).filter(a => a.totalEstMs > 0 || a.totalSpentMs > 0 || Object.keys(a.statusCounts).length > 0).sort((a,b) => b.totalEstMs - a.totalEstMs);
        const devCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'Developer').length;
        const qaCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'QA').length;

        let taskMinDate = Infinity;
        let taskMaxDate = 0;
        independentTasks.forEach(t => {
            if (t.start_date) taskMinDate = Math.min(taskMinDate, parseInt(t.start_date));
            if (t.due_date) taskMaxDate = Math.max(taskMaxDate, parseInt(t.due_date));
        });

        let minDate = Infinity;
        let maxDate = 0;
        activeWorkflows.forEach(wf => {
          if (wf.listStartDate) minDate = Math.min(minDate, parseInt(wf.listStartDate));
          if (wf.listDueDate) maxDate = Math.max(maxDate, parseInt(wf.listDueDate));
        });
        if (minDate === Infinity) minDate = taskMinDate;
        if (maxDate === 0) maxDate = taskMaxDate;
        
        const now = mappedWorkflows[0]?.lastSynced || Date.now();
        if (minDate === Infinity) minDate = now - (7 * 86400000);
        if (maxDate === 0) maxDate = now + (7 * 86400000);
        if (maxDate <= minDate) maxDate = minDate + (14 * 86400000);

        const sprintStart = new Date(minDate);
        sprintStart.setHours(0,0,0,0);
        const sprintEnd = new Date(maxDate);
        sprintEnd.setHours(0,0,0,0);
        
        let sprintWorkingDays = 0;
        let tempDate = new Date(sprintStart);
        while (tempDate <= sprintEnd) {
            const day = tempDate.getDay();
            if (day !== 0 && day !== 6) sprintWorkingDays++;

        });

        const stalledTaskIds = new Set(stalledTasksCandidates.map(t => t.id));
        const hasStalledDescendant = (task) => task.subtasks?.some(sub => stalledTaskIds.has(sub.id) || hasStalledDescendant(sub)) || false;

        const stalledTasks = stalledTasksCandidates
          .filter(t => !hasStalledDescendant(t))
          .sort((a, b) => (now - (parseInt(b.date_created) || now)) - (now - (parseInt(a.date_created) || now)))
          .slice(0, 5);

        const integrationUI = (
          <div className="animate-in fade-in duration-500 w-full">
            {integrationStep === 'idle' && mappedWorkflows.length === 0 && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden flex flex-col md:flex-row items-center justify-between p-8">
                <div className="mb-4 md:mb-0">
                  <h2 className="text-lg font-semibold text-white">Connect your ticketing system</h2>
                  <p className="text-slate-400 mt-1 max-w-xl">To start weaving, connect Weaver to ClickUp. This allows us to automatically sync your support tickets with your development tasks.</p>
                </div>
                <button onClick={handleConnectClickUp} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shrink-0">
                  <Settings className="h-4 w-4 mr-2 animate-spin-slow" /> Connect ClickUp
                </button>
              </div>
            )}

            {integrationStep === 'entering_token' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-8 animate-in fade-in slide-in-from-bottom-4">
                <div className="flex items-center mb-6">
                  <div className="bg-indigo-500/10 p-2.5 rounded-lg mr-4 border border-indigo-500/20"><Key className="h-6 w-6 text-indigo-400" /></div>
                  <div><h3 className="text-lg font-semibold text-white">Enter ClickUp API Token</h3><p className="text-sm text-slate-400">Provide your Personal Access Token to retrieve your Workspaces.</p></div>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">Personal Access Token</label>
                    <input type="password" value={tempToken} onChange={(e) => setTempToken(e.target.value)} placeholder="pk_123456789_..." className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono text-sm" />
                  </div>
                  {clickUpError && (
                    <div className="p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-sm text-red-300">
                      <div className="flex items-start mb-3"><AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" /><span className="font-medium">{clickUpError}</span></div>
                      <button onClick={handleMockClickUpData} className="w-full flex justify-center py-2 px-4 border border-red-900/50 rounded-lg shadow-sm text-sm font-medium text-red-200 bg-red-950/40 hover:bg-red-900/30 transition-colors">Bypass with Mock ClickUp Data (Preview)</button>
                    </div>
                  )}
                  <div className="flex justify-end space-x-3 pt-2">
                    <button onClick={handleCancelIntegration} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors focus:outline-none rounded-lg">Cancel</button>
                    <button onClick={handleAuthenticateToken} disabled={!tempToken} className="flex items-center px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-md disabled:opacity-50">Authenticate</button>
                  </div>
                </div>
              </div>
            )}

            {integrationStep === 'connecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-12 flex flex-col items-center justify-center text-center animate-in fade-in">
                <RefreshCw className="h-8 w-8 text-indigo-400 animate-spin mb-4" />
                <h3 className="text-lg font-semibold text-white">Authenticating with ClickUp</h3>
                <p className="text-slate-400 mt-2 max-w-md">Securely connecting and fetching your hierarchy. Please wait...</p>
              </div>
            )}

            {integrationStep === 'selecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-indigo-500/20 shadow-2xl overflow-hidden animate-in fade-in slide-in-from-bottom-4">
                <div className="bg-indigo-500/10 px-6 py-4 border-b border-indigo-500/20 flex items-center">
                  <div className="bg-indigo-600 p-1.5 rounded-md mr-3 shadow-md"><SpiderNetworkIcon className="h-5 w-5 text-white" /></div>
                  <div><h3 className="text-lg font-semibold text-white">Map ClickUp Destination</h3><p className="text-sm text-indigo-300">Choose where Weaver tasks should be synced.</p></div>
                </div>
                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">1. Select Workspace</label>
                    <select value={selectedTeam} onChange={(e) => { setSelectedTeam(e.target.value); setSelectedSpace(''); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white">
                      <option value="" className="bg-slate-900 text-slate-300">-- Choose a Workspace --</option>
                      {teams.map(t => <option key={t.id} value={t.id} className="bg-slate-900 text-white">{t.name}</option>)}
                    </select>
                  </div>
                  {selectedTeam && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">2. Select Space</label>
                      <select value={selectedSpace} onChange={(e) => { setSelectedSpace(e.target.value); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white">
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a Space --</option>
                        {spaces.map(s => <option key={s.id} value={s.id} className="bg-slate-900 text-white">{s.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">3. Select Folder <span className="text-slate-500 font-normal">(Optional)</span></label>
                      <select value={selectedFolder} onChange={(e) => { setSelectedFolder(e.target.value); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white">
                        <option value="" className="bg-slate-900 text-slate-300">-- Folderless / Direct to Space --</option>
                        {folders.map(f => <option key={f.id} value={f.id} className="bg-slate-900 text-white">{f.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">4. Select Task List</label>
                      <select value={selectedList} onChange={(e) => setSelectedList(e.target.value)} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white">
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a List --</option>
                        {availableLists.map(l => <option key={l.id} value={l.id} className="bg-slate-900 text-white">{l.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-white/5">
                    <button onClick={handleCancelIntegration} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white rounded-lg">Cancel</button>
                    <button disabled={!selectedList} onClick={handleAddMapping} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg disabled:opacity-50"><CheckCircle2 className="h-4 w-4 mr-2" /> Add to Weaver</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-slate-950 font-sans text-slate-100 relative">
            <WebNestBackground opacity={0.35} />

            {/* Change Connection / Onboarding Modal */}
            {isSwitchModalOpen && mappedWorkflows.length > 0 && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                 <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden relative animate-in zoom-in-95 duration-200">
                    <button onClick={handleCancelIntegration} className="absolute top-4 right-4 text-slate-400 hover:text-white z-10"><X /></button>
                    <div className="p-6">
                       <h2 className="text-xl font-bold text-white mb-6">Connect New Workflow</h2>
                       {integrationUI}
                    </div>
                 </div>
              </div>
            )}

            {/* Unified Tasks & Time Modal */}
            {isUnifiedModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-6xl h-[85vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                   <div className="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 shrink-0">
                      <h2 className="text-xl font-bold text-white flex items-center"><ListTodo className="mr-3 h-6 w-6 text-indigo-400"/> Unified Workspace & Time Ledger</h2>
                      <button onClick={() => setIsUnifiedModalOpen(false)} className="text-slate-400 hover:text-white transition-colors"><X className="h-6 w-6"/></button>
                   </div>
                   <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                      
                      {/* Left Pane: Task Tree */}
                      <div className="w-full lg:w-1/2 border-r border-slate-700/80 p-6 flex flex-col bg-slate-900/50">
                         <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center"><FolderOpen className="h-4 w-4 mr-2"/> Active Hierarchy</h3>
                         <div className="mb-4 space-y-3">
                            <input type="text" placeholder="Search tasks..." value={taskSearchQuery} onChange={e => setTaskSearchQuery(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                            <label className="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer w-max select-none">
                               <input type="checkbox" checked={showMyTasksOnly} onChange={e => setShowMyTasksOnly(e.target.checked)} className="rounded border-slate-700 bg-slate-900/50 text-indigo-600 focus:ring-indigo-500 w-4 h-4" />
                               <span>Show my tasks only</span>
                            </label>
                         </div>
                         <div className="overflow-y-auto flex-1 pr-2 space-y-6">
                            {mappedWorkflows.map(wf => {
                               const filterNodeForLedger = (node) => {
                                 const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                                 const isAssignedToMe = node.assignees && node.assignees.some(a => (a.username || '') === user?.name);
                                 const matchesMyTasks = !showMyTasksOnly || isAssignedToMe;
                                 
                                 const validSubtasks = (node.subtasks || []).map(filterNodeForLedger).filter(Boolean);
                                 
                                 if ((matchesSearch && matchesMyTasks) || validSubtasks.length > 0) {
                                     return { ...node, subtasks: validSubtasks };
                                 }
                                 return null;
                               };
                               
                               const rootTasks = (wf.tasks || []).map(filterNodeForLedger).filter(Boolean);

                               if (rootTasks.length === 0) return null;

                               const renderLedgerNode = (task, depth = 0) => {
                                  const loggedMs = getLoggedMsForTask(task.id);
                                  const isSelected = selectedTaskIdForTime === task.id;
                                  const hasSubtasks = task.subtasks && task.subtasks.length > 0;
                                  const isExpanded = !!expandedTasks[task.id] || (taskSearchQuery.trim() !== '' && hasSubtasks) || (showMyTasksOnly && hasSubtasks);
                                  
                                  return (
                                     <div key={task.id} className="mb-2">
                                        <div onClick={() => setSelectedTaskIdForTime(task.id)} className={`p-3 rounded-lg border flex justify-between items-center cursor-pointer transition-all ${isSelected ? 'bg-indigo-600/20 border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'bg-slate-800/40 border-slate-700/50 hover:border-slate-500'}`}>
                                           <div className="flex items-center space-x-3 truncate mr-4">
                                              {hasSubtasks ? (
                                                <button onClick={(e) => { e.stopPropagation(); toggleTaskExpand(task.id); }} className="p-0.5 text-slate-400 hover:text-white rounded flex-shrink-0">
                                                   <ChevronRight className={`w-4 h-4 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                                                </button>
                                              ) : (
                                                <div className="w-5 h-4 flex-shrink-0" />
                                              )}
                                              <div className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: task.status?.color || '#cbd5e1' }} />
                                              <div className={`text-sm font-medium truncate ${isSelected ? 'text-indigo-100' : 'text-slate-200'}`}>{task.name}</div>
                                           </div>
                                           <div className="text-xs font-medium bg-slate-950/60 px-2 py-1 rounded-md text-slate-400 shrink-0 border border-white/5">
                                              {loggedMs > 0 ? `${(loggedMs / 3600000).toFixed(1)}h` : '0h'}
                                           </div>
                                        </div>
                                        {isExpanded && hasSubtasks && (
                                           <div className="mt-2 border-l border-slate-700/50 ml-5 pl-4 border-dashed">
                                              {task.subtasks.map(sub => renderLedgerNode(sub, depth + 1))}
                                           </div>
                                        )}
                                     </div>
                                  );
                               };

                               return (
                                  <div key={wf.id} className="mb-6">
                                     <div className="text-indigo-400 font-semibold mb-3 flex items-center bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 w-max"><Box className="w-4 h-4 mr-2"/> {wf.list}</div>
                                     <div className="space-y-2">
                                        {rootTasks.map(task => renderLedgerNode(task, 0))}
                                     </div>
                                  </div>
                               );
                            })}
                            {mappedWorkflows.every(wf => {
                               const filterNodeForLedger = (node) => {
                                 const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                                 const isAssignedToMe = node.assignees && node.assignees.some(a => (a.username || '') === user?.name);
                                 const matchesMyTasks = !showMyTasksOnly || isAssignedToMe;
                                 const validSubtasks = (node.subtasks || []).map(filterNodeForLedger).filter(Boolean);
                                 if ((matchesSearch && matchesMyTasks) || validSubtasks.length > 0) return { ...node, subtasks: validSubtasks };
                                 return null;
                               };
                               return (wf.tasks || []).map(filterNodeForLedger).filter(Boolean).length === 0;
                            }) && <div className="text-slate-500 italic text-sm text-center mt-6">No tasks match your filter.</div>}
                         </div>
                      </div>

                      {/* Right Pane: Time Logging & Feed */}
                      <div className="w-full lg:w-1/2 flex flex-col bg-slate-950/30">
                         <div className="p-6 border-b border-slate-700/80">
                            <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center"><Activity className="h-4 w-4 mr-2"/> Log Activity</h3>
                            <div className="bg-slate-800/60 p-5 rounded-xl border border-slate-700 shadow-inner">
                               <div className="mb-4">
                                  <label className="text-xs text-slate-400 font-medium mb-1.5 block">Selected Target Task</label>
                                  <div className="text-sm text-slate-300 bg-slate-900 p-2.5 rounded-lg border border-slate-700/80">
                                     {selectedTaskIdForTime ? allFlatTasks.find(t => t.id === selectedTaskIdForTime)?.name : <span className="italic text-slate-500">← Select a task from the hierarchy</span>}
                                  </div>
                               </div>
                               <div className="mb-4 grid grid-cols-2 gap-4">
                                  <div>
                                     <label className="text-xs text-slate-400 font-medium mb-1.5 block">Hours</label>
                                     <input type="number" step="0.1" value={timeEntryHours} onChange={e => setTimeEntryHours(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" placeholder="e.g. 2.5" />
                                  </div>
                                  <div>
                                     <label className="text-xs text-slate-400 font-medium mb-1.5 block">Assignee</label>
                                     <select value={timeAssignee || user?.name || ''} onChange={e => setTimeAssignee(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow">
                                        {workspaceUsers.map(u => <option key={u} value={u}>{u}</option>)}
                                     </select>
                                  </div>
                               </div>
                               <div className="mb-4">
                                  <label className="text-xs text-slate-400 font-medium mb-1.5 block">Description / Note</label>
                                  <input type="text" value={timeEntryNote} onChange={e => setTimeEntryNote(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" placeholder="What did you work on?" />
                               </div>
                               <button onClick={handleLogTime} disabled={!selectedTaskIdForTime || !timeEntryHours} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:hover:bg-indigo-600 text-white rounded-lg p-2.5 text-sm font-medium transition-colors shadow-lg">
                                  Commit Time Entry
                               </button>
                            </div>
                         </div>

                         <div className="p-6 flex-1 overflow-y-auto">
                            <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center"><Clock className="h-4 w-4 mr-2"/> Global Live Feed</h3>
                            <div className="space-y-3">
                               {[...globalTimeLedger].reverse().map(entry => {
                                  const task = allFlatTasks.find(t => t.id === entry.taskId);
                                  return (
                                     <div key={entry.id} className="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 shadow-sm animate-in fade-in slide-in-from-top-2">
                                        <div className="flex justify-between items-start mb-2">
                                           <div className="pr-4">
                                              <span className="font-semibold text-indigo-300 text-sm leading-tight block mb-0.5">{task?.name || 'Unknown Task'}</span>
                                              <span className="text-slate-400 text-xs flex items-center"><Users className="h-3 w-3 mr-1"/> {entry.userId}</span>
                                           </div>
                                           <div className="flex items-center gap-2">
                                             <span className="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-1 rounded text-sm border border-emerald-500/20 shrink-0">+{entry.ms / 3600000}h</span>
                                             <button onClick={() => handleDeleteTimeEntry(entry)} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors"><Trash2 className="w-4 h-4" /></button>
                                           </div>
                                        </div>
                                        <div className="text-slate-300 bg-slate-900/80 p-2.5 rounded-lg text-sm border border-white/5 italic">"{entry.note}"</div>
                                     </div>
                                  )
                               })}
                               {globalTimeLedger.length === 0 && <div className="text-slate-500 text-sm italic text-center py-8">No time entries recorded yet.</div>}
                            </div>
                         </div>
                      </div>
                   </div>
                </div>
              </div>
            )}

            {/* Capacity Settings Blocker Modal */}
            {isBlockerModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
                <div className="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in zoom-in-95">
                   <div className="flex items-center justify-between p-5 border-b border-slate-700/80 bg-slate-800/50">
                     <h2 className="text-lg font-bold text-white flex items-center gap-2"><Calendar className="w-5 h-5 text-indigo-400" /> Sprint Capacity Settings</h2>
                     <button onClick={() => setIsBlockerModalOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><X className="w-5 h-5" /></button>
                   </div>
                   <div className="p-5 space-y-6">
                     <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Daily Working Hours</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                             <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Developers</label>
                             <input type="number" min="1" max="24" value={devHoursPerDay} onChange={e => { const val = e.target.value; setDevHoursPerDay(val); const num = Number(val); if(!isNaN(num) && val !== '') saveSettings({ devHoursPerDay: num }); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                          </div>
                          <div>
                             <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">QA Resources</label>
                             <input type="number" min="1" max="24" value={qaHoursPerDay} onChange={e => { const val = e.target.value; setQaHoursPerDay(val); const num = Number(val); if(!isNaN(num) && val !== '') saveSettings({ qaHoursPerDay: num }); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                          </div>
                        </div>
                     </div>
                     <div className="space-y-3">
                       <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">Active Blockers<span className="text-indigo-400">{dateBlockers.length} Items</span></h3>
                       {dateBlockers.length === 0 ? (
                         <div className="text-sm text-slate-400 italic p-4 bg-slate-900/60 rounded-xl text-center border border-white/5">No blockers added.</div>
                       ) : (
                         <ul className="space-y-2 max-h-40 overflow-y-auto pr-1">
                           {dateBlockers.map(b => (
                             <li key={b.id} className="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-white/5">
                                <div className="flex flex-col"><span className="text-sm font-semibold text-slate-200">{b.remark} <span className="text-slate-400 font-normal">({b.days} day{b.days > 1 ? 's' : ''})</span></span>{b.remark === 'Leave' && <span className="text-xs text-indigo-400 font-medium mt-0.5">{b.assignee}</span>}</div>
                                <button onClick={() => { const newBlockers = dateBlockers.filter(x => x.id !== b.id); setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); }} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors"><Trash2 className="w-4 h-4" /></button>
                             </li>
                           ))}
                         </ul>
                       )}
                     </div>
                     <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Add New Blocker</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">No. of Days</label><input type="number" min="1" value={newBlockerDays} onChange={e => setNewBlockerDays(e.target.value)} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-white outline-none" /></div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Remarks</label>

                        <div className="w-full bg-slate-900/60 border border-white/5 rounded-full h-3 flex overflow-hidden">

                          <div className="bg-indigo-500 h-full transition-all duration-1000 ease-out border-r border-slate-900/60" style={{ width: `${activeDistPct}%` }} title={`Active: ${activeBreakdown.total}`}></div>

                        <div className="flex items-center justify-between mt-3 text-[10px] font-bold uppercase tracking-wider px-1">
                          <div className="flex items-center text-emerald-400"><div className="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></div>Resolved</div>
                          <div className="flex items-center text-indigo-400"><div className="w-2 h-2 rounded-full bg-indigo-500 mr-1.5"></div>Active</div>
                          <div className="flex items-center text-blue-400"><div className="w-2 h-2 rounded-full bg-blue-500 mr-1.5"></div>Backlog</div>
                        </div>
                      </div>

                      {/* Right Pane - Metric Cards */}

                          <div className="flex items-start space-x-4">

                              <div className="text-sm font-medium text-slate-400 flex items-center gap-1">Backlog <MetricTooltip text="Tasks not started"><InfoIcon className="h-3 w-3 text-slate-500 hover:text-indigo-400" /></MetricTooltip></div>
                              <p className="text-2xl font-extrabold text-white mt-0.5">{backlogBreakdown.total}</p>

                          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                             <div className="absolute pointer-events-none z-20 flex flex-col items-center drop-shadow-lg"
