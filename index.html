                    const sliceDate = cDate + (duration * (i/slices));
                    if (sliceDate <= minDate) {
                        initialBurnedMs += (nativeSpent / slices);
                    } else {
                        validEvents.push({ date: sliceDate, burned: nativeSpent / slices });
                    }
                }
            }
        });

        const extractBurndownLedgerEntries = (tasks) => {
            tasks.forEach(t => {
                const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
                if (!isDone) {
                    const entries = t.localLedger || [];
                    entries.forEach(entry => {
                        const eDate = parseDateMs(entry.timestamp);
                        if (eDate <= minDate) {
                            initialBurnedMs += Number(entry.ms);
                        } else {
                            validEvents.push({ date: eDate, burned: Number(entry.ms) });
                        }
                    });
                }
                if (t.subtasks) extractBurndownLedgerEntries(t.subtasks);
            });
        };
        extractBurndownLedgerEntries(independentTasks);
        
        validEvents.sort((a,b) => a.date - b.date);

        let historicalBurnedMs = initialBurnedMs;
        const startY = totalEstimateMs > 0 ? (initialBurnedMs / totalEstimateMs) * 100 : 0;
        const burndownPointsData = [{ x: 0, y: Math.max(0, Math.min(100, startY)), date: minDate, value: totalEstimateMs - initialBurnedMs }];

        const oneDayMs = 86400000;
        const endChartDate = Math.min(now, maxDate);
        let currentDayMs = minDate + oneDayMs;

        while (currentDayMs <= endChartDate) {
            while (validEvents.length > 0 && validEvents[0].date <= currentDayMs) {
                historicalBurnedMs += validEvents.shift().burned;
            }
            const stepX = ((currentDayMs - minDate) / totalDurationMs) * 100;
            const stepY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;
            burndownPointsData.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentDayMs, value: totalEstimateMs - historicalBurnedMs });
            currentDayMs += oneDayMs;
        }

        while (validEvents.length > 0) {
            historicalBurnedMs += validEvents.shift().burned;
        }
        const burndownFinalX = now >= maxDate ? 100 : ((now - minDate) / totalDurationMs) * 100;
        const burndownFinalY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;

        if (burndownPointsData.length > 0 && (burndownFinalX - burndownPointsData[burndownPointsData.length - 1].x) < 2) {
            burndownPointsData[burndownPointsData.length - 1].y = Math.max(0, Math.min(100, burndownFinalY));
            burndownPointsData[burndownPointsData.length - 1].x = Math.max(0, Math.min(100, burndownFinalX));
            burndownPointsData[burndownPointsData.length - 1].date = now;
            burndownPointsData[burndownPointsData.length - 1].value = totalEstimateMs - historicalBurnedMs;
        } else {
            burndownPointsData.push({ x: Math.max(0, Math.min(100, burndownFinalX)), y: Math.max(0, Math.min(100, burndownFinalY)), date: now, value: totalEstimateMs - historicalBurnedMs });
        }

        const generateSmoothPath = (points) => {
            if (points.length === 0) return "";
            if (points.length === 1) return `M ${points[0].x},${points[0].y}`;
            if (points.length === 2) return `M ${points[0].x},${points[0].y} L ${points[1].x},${points[1].y}`;
            
            let d = `M ${points[0].x},${points[0].y}`;
            const tension = 0.25;
            
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i !== points.length - 2 ? points[i + 2] : p2;
                
                let cp1x = p1.x + (p2.x - p0.x) * tension;
                let cp1y = p1.y + (p2.y - p0.y) * tension;
                let cp2x = p2.x - (p3.x - p1.x) * tension;
                let cp2y = p2.y - (p3.y - p1.y) * tension;
                
                cp1x = Math.max(p1.x, Math.min(p2.x, cp1x));
                cp2x = Math.max(p1.x, Math.min(p2.x, cp2x));
                const minY = Math.min(p1.y, p2.y);
                const maxY = Math.max(p1.y, p2.y);
                cp1y = Math.max(minY, Math.min(maxY, cp1y));
                cp2y = Math.max(minY, Math.min(maxY, cp2y));
                
                d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
            }
            return d;
        };

        // Helper to prevent duplicate Y-axis labels
        const generateYAxisLabels = (maxVal, suffix = '') => {
            const vals = [maxVal, Math.round(maxVal * 0.75), Math.round(maxVal * 0.5), Math.round(maxVal * 0.25), 0];
            const result = [`${maxVal}${suffix}`, '', '', '', '0'];
            let lastShown = maxVal;
            for (let i = 1; i <= 3; i++) {
                if (vals[i] < lastShown && vals[i] > 0) {
                    result[i] = `${vals[i]}${suffix}`;
                    lastShown = vals[i];
                }
            }
            return result;
        };

        const smoothLinePath = generateSmoothPath(burndownPointsData);
        const latestX = burndownPointsData.length > 0 ? burndownPointsData[burndownPointsData.length-1].x : currentX;
        const areaPath = smoothLinePath ? smoothLinePath + ` L ${latestX},100 L 0,100 Z` : "";

        let initialCompletedTasks = 0;
        const completionEvents = [];
        
        filteredMotherTasks.forEach(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            if (isDone) {
                let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                if (dDate <= minDate) {
                    initialCompletedTasks += 1;
                } else {
                    completionEvents.push({ date: dDate, count: 1 });
                }
            }
        });
        
        completionEvents.sort((a,b) => a.date - b.date);

        const maxBurnupY = Math.max(plottedScopeCount, 1);

        let cumulativeCompletedTasks = initialCompletedTasks;
        const startBurnupY = 100 - (initialCompletedTasks / maxBurnupY) * 100;
        const burnupPointsData = [{ x: 0, y: Math.max(0, Math.min(100, startBurnupY)), date: minDate, value: initialCompletedTasks }];

        let currentBurnupDayMs = minDate + oneDayMs;
        let compEventIdx = 0;

        while (currentBurnupDayMs <= endChartDate) {
            while (compEventIdx < completionEvents.length && completionEvents[compEventIdx].date <= currentBurnupDayMs) {
                cumulativeCompletedTasks += completionEvents[compEventIdx].count;
                compEventIdx++;
            }
            const stepX = ((currentBurnupDayMs - minDate) / totalDurationMs) * 100;
            const stepY = 100 - (cumulativeCompletedTasks / maxBurnupY) * 100;
            burnupPointsData.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentBurnupDayMs, value: cumulativeCompletedTasks });
            currentBurnupDayMs += oneDayMs;
        }

        while (compEventIdx < completionEvents.length) {
            cumulativeCompletedTasks += completionEvents[compEventIdx].count;
            compEventIdx++;
        }
        const burnupFinalX = now >= maxDate ? 100 : ((now - minDate) / totalDurationMs) * 100;
        const burnupFinalY = 100 - (cumulativeCompletedTasks / maxBurnupY) * 100;

        if (burnupPointsData.length > 0 && (burnupFinalX - burnupPointsData[burnupPointsData.length - 1].x) < 2) {
            burnupPointsData[burnupPointsData.length - 1].y = Math.max(0, Math.min(100, burnupFinalY));
            burnupPointsData[burnupPointsData.length - 1].x = Math.max(0, Math.min(100, burnupFinalX));
            burnupPointsData[burnupPointsData.length - 1].date = now;
            burnupPointsData[burnupPointsData.length - 1].value = cumulativeCompletedTasks;
        } else {
            burnupPointsData.push({ x: Math.max(0, Math.min(100, burnupFinalX)), y: Math.max(0, Math.min(100, burnupFinalY)), date: now, value: cumulativeCompletedTasks });
        }

        const smoothBurnupLinePath = generateSmoothPath(burnupPointsData);
        const latestBurnupX = burnupPointsData.length > 0 ? burnupPointsData[burnupPointsData.length-1].x : currentX;
        const burnupAreaPath = smoothBurnupLinePath ? smoothBurnupLinePath + ` L ${latestBurnupX},100 L 0,100 Z` : "";
        
        const plottedPath = `M 0,0 L 100,0`;

        const getTaskStatusOnDate = (task, dateMs) => {
            const createdDate = parseDateMs(task.date_created);
            if (createdDate > 0 && dateMs < createdDate) return null; // Not created yet

            // Reconstruct timeline strictly from activity logs if they exist
            if (task.activity_logs && Array.isArray(task.activity_logs)) {
                 const statusLogs = task.activity_logs
                     .filter(l => l.field === 'status')
                     .sort((a,b) => parseDateMs(a.date) - parseDateMs(b.date));
                 
                 if (statusLogs.length > 0) {
                     let foundLog = null;
                     for (let i = statusLogs.length - 1; i >= 0; i--) {
                         if (parseDateMs(statusLogs[i].date) <= dateMs) {
                             foundLog = statusLogs[i];
                             break;
                         }
                     }
                     
                     if (foundLog) {
                         return {
                             status: (foundLog.after?.status || foundLog.after || 'open').toString().toLowerCase(),
                             color: foundLog.after?.color || task.status?.color || '#cbd5e1'
                         };
                     } else {
                         // Before the first status change, it was in the "before" state of the first log
                         return {
                             status: (statusLogs[0].before?.status || statusLogs[0].before || 'open').toString().toLowerCase(),
                             color: statusLogs[0].before?.color || '#cbd5e1'
                         };
                     }
                 }
            }
            
            // If no activity logs exist, use mathematical inference
            const currentStatusStr = (task.status?.status || 'open').toString().toLowerCase();
            const currentColor = task.status?.color || '#94a3b8';
            const isDone = doneStatuses.includes(currentStatusStr);
            
            const closedDate = parseDateMs(task.date_closed);
            const startDate = parseDateMs(task.start_date);
            const updatedDate = parseDateMs(task.date_updated);
            
            if (isDone && closedDate > 0) {
                if (dateMs >= closedDate) return { status: currentStatusStr, color: currentColor };
                
                // If it's before it closed, infer it was 'In Progress' for a period
                const activeMarker = startDate > 0 ? startDate : Math.floor(createdDate + (closedDate - createdDate) * 0.3);
                if (dateMs >= activeMarker) return { status: 'in progress', color: '#3b82f6' };
                
                return { status: 'open', color: '#cbd5e1' };
            }
            
            // Task is not done
            const transitionDate = startDate > 0 ? startDate : (updatedDate > 0 ? updatedDate : createdDate);
            
            if (dateMs >= transitionDate) {
                return { status: currentStatusStr, color: currentColor };
            }
            
            return { status: 'open', color: '#cbd5e1' };
        };

        const dailyStatusData = [];
        const allStatusesMap = new Map();
        let dDateMs = minDate;
        
        while (dDateMs <= endChartDate) {
            const endOfDayMs = dDateMs + 86399999;
            const dayBreakdown = {};
            let hasAnyTasks = false;
            
            filteredMotherTasks.forEach(t => {
                const sObj = getTaskStatusOnDate(t, endOfDayMs);
                if (sObj) {
                    hasAnyTasks = true;
                    const sName = sObj.status;
                    if (!dayBreakdown[sName]) dayBreakdown[sName] = { count: 0, color: sObj.color };
                    dayBreakdown[sName].count++;
                    
                    if (!allStatusesMap.has(sName) || (allStatusesMap.get(sName) === '#cbd5e1' && sObj.color !== '#cbd5e1')) {
                        allStatusesMap.set(sName, sObj.color);
                    }
                }
            });
            
            dailyStatusData.push({ date: dDateMs, breakdown: dayBreakdown, hasData: hasAnyTasks });
            dDateMs += oneDayMs;
        }
        
        const maxDailyTasks = Math.max(1, ...dailyStatusData.map(d => Object.values(d.breakdown).reduce((sum, item) => sum + item.count, 0)));
        const sortedStatuses = Array.from(allStatusesMap.keys()).sort();

        const handleBarChartMouseMove = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const xPct = (mouseX / rect.width) * 100;
            
            if (dailyStatusData.length === 0) return;
            
            const N = dailyStatusData.length;
            const dayWidthPct = 100 / N;
            
            let hoveredIndex = Math.floor(xPct / dayWidthPct);
            hoveredIndex = Math.max(0, Math.min(N - 1, hoveredIndex));
            
            const closestDay = dailyStatusData[hoveredIndex];
            
            if (closestDay && closestDay.hasData) {
                 setActiveChartHover({
                     chart: 'status-bar',
                     xPct: (hoveredIndex * dayWidthPct) + (dayWidthPct / 2),
                     yPct: 10,
                     dateMs: closestDay.date,
                     breakdown: closestDay.breakdown,
                     barWidth: dayWidthPct
                 });
            } else {
                 setActiveChartHover(null);
            }
        };

        const renderAssigneeDrillDown = (assigneeUsername) => {
           const assigneeTasks = allFlatTasks.filter(t => t.assignees?.some(a => a.username === assigneeUsername));
           if (!assigneeTasks || assigneeTasks.length === 0) return null;

           let estMs = 0;
           let spentMs = 0;
           let initialDrillLoggedMs = 0;
           const drillLogEvents = [];

           assigneeTasks.forEach(t => {
              const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
              let tEst = t.directEstimate !== undefined ? t.directEstimate : (t.time_estimate ? parseInt(t.time_estimate) : 0);
              let tSpent = t.directNativeSpent !== undefined ? t.directNativeSpent : (t.rawNativeSpent ? parseInt(t.rawNativeSpent) : (isDone ? tEst : 0));
              
              estMs += tEst;
              spentMs += tSpent;

              if (isDone && tSpent > 0) {
                 let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                 if (dDate <= minDate) initialDrillLoggedMs += tSpent;
                 else drillLogEvents.push({ date: dDate, logged: tSpent });
              } else if (!isDone && tSpent > 0) {
                 let cDate = parseDateMs(t.date_created) || minDate;
                 let uDate = parseDateMs(t.date_updated) || now;
                 if (cDate < minDate) cDate = minDate;
                 if (uDate > now) uDate = now;
                 if (uDate < cDate) uDate = cDate;
                 
                 const duration = Math.max(1, uDate - cDate);
                 const slices = 10;
                 for (let i = 1; i <= slices; i++) {
                     const sliceDate = cDate + (duration * (i/slices));
                     if (sliceDate <= minDate) initialDrillLoggedMs += (tSpent / slices);
                     else drillLogEvents.push({ date: sliceDate, logged: tSpent / slices });
                 }
              }

              const entries = t.localLedger || [];
              entries.forEach(entry => {
                 if(entry.userId === assigneeUsername) {
                     const eDate = parseDateMs(entry.timestamp);
                     spentMs += Number(entry.ms);
                     if (eDate <= minDate) initialDrillLoggedMs += Number(entry.ms);
                     else drillLogEvents.push({ date: eDate, logged: Number(entry.ms) });
                 }
              });
           });

           drillLogEvents.sort((a,b) => a.date - b.date);

           const userRole = userRoles[assigneeUsername] || 'Developer';
           const dailyHours = userRole === 'Developer' ? devHoursPerDay : qaHoursPerDay;
           let leaveDays = 0;
           dateBlockers.forEach(b => { if (b.remark === 'Leave' && b.assignee === assigneeUsername) leaveDays += b.days; });
           const individualCapacityMs = Math.max(0, ((bucketDurationDays * dailyHours) - (leaveDays * dailyHours)) * 3600000);

           const drillMaxBurnupMs = Math.max(estMs, individualCapacityMs, spentMs, 3600000);
           const drillMaxBurnupHours = Math.round(drillMaxBurnupMs / 3600000);

           let cumulativeMs = initialDrillLoggedMs;
           const drillStartY = 100 - (initialDrillLoggedMs / drillMaxBurnupMs) * 100;
           const drillPoints = [{ x: 0, y: Math.max(0, Math.min(100, drillStartY)), date: minDate, value: initialDrillLoggedMs }];

           let currentDayMs = minDate + oneDayMs;
           let eventIdx = 0;

           while (currentDayMs <= endChartDate) {
               while (eventIdx < drillLogEvents.length && drillLogEvents[eventIdx].date <= currentDayMs) {
                   cumulativeMs += drillLogEvents[eventIdx].logged;
                   eventIdx++;
               }
               const stepX = ((currentDayMs - minDate) / totalDurationMs) * 100;
               const stepY = 100 - (cumulativeMs / drillMaxBurnupMs) * 100;
               drillPoints.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentDayMs, value: cumulativeMs });
               currentDayMs += oneDayMs;
           }

           if (now > minDate && now < maxDate) {
               while (eventIdx < drillLogEvents.length && drillLogEvents[eventIdx].date <= now) {
                   cumulativeMs += drillLogEvents[eventIdx].logged;
                   eventIdx++;
               }
               const finalX = ((now - minDate) / totalDurationMs) * 100;
               const finalY = 100 - (cumulativeMs / drillMaxBurnupMs) * 100;
               if (drillPoints.length > 0 && (finalX - drillPoints[drillPoints.length - 1].x) < 2) {
                   drillPoints[drillPoints.length - 1].y = Math.max(0, Math.min(100, finalY));
                   drillPoints[drillPoints.length - 1].x = Math.max(0, Math.min(100, finalX));
                   drillPoints[drillPoints.length - 1].date = now;
                   drillPoints[drillPoints.length - 1].value = cumulativeMs;
               } else {
                   drillPoints.push({ x: Math.max(0, Math.min(100, finalX)), y: Math.max(0, Math.min(100, finalY)), date: now, value: cumulativeMs });
               }
           }

           const smoothDrillPath = generateSmoothPath(drillPoints);
           const latestDrillX = drillPoints.length > 0 ? drillPoints[drillPoints.length-1].x : currentX;
           const drillAreaPath = smoothDrillPath ? smoothDrillPath + ` L ${latestDrillX},100 L 0,100 Z` : "";
           
           const drillIdealY = 100 - (individualCapacityMs / drillMaxBurnupMs) * 100;
           const drillIdealPath = `M 0,${Math.max(0, Math.min(100, drillIdealY))} L 100,${Math.max(0, Math.min(100, drillIdealY))}`;
           
           const drillPlottedY = 100 - (estMs / drillMaxBurnupMs) * 100;
           const drillPlottedPath = `M 0,${Math.max(0, Math.min(100, drillPlottedY))} L 100,${Math.max(0, Math.min(100, drillPlottedY))}`;

           return (
              <div className="flex flex-col h-[85vh] bg-slate-900 border border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl relative w-full max-w-5xl animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                 <div className="p-6 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between shrink-0">
                     <div className="flex items-center space-x-4">
                       <img src={`https://ui-avatars.com/api/?name=${encodeURIComponent(assigneeUsername)}&background=random`} referrerPolicy="no-referrer" className="w-12 h-12 rounded-full border-2 border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.4)]" />
                       <div>
                           <h2 className="text-xl font-bold text-white">{assigneeUsername}'s Workload Drill-Down</h2>
                           <p className="text-sm text-indigo-300 font-medium uppercase tracking-wider">{userRole}</p>
                       </div>
                     </div>
                     <button onClick={() => setSelectedDrillDownAssignee(null)} className="text-slate-400 p-2 rounded transition-colors neon-border-slate"><X className="w-6 h-6"/></button>
                 </div>
                 
                 <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                    <div className="lg:w-1/2 p-6 border-r border-slate-700/80 bg-slate-900/40 overflow-y-auto space-y-6">
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                         <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                            <div className="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Capacity</div>
                            <div className="text-xl font-bold text-white">{Math.round(individualCapacityMs/3600000)}h</div>
                         </div>
                         <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                            <div className="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Assigned Scope</div>
                            <div className="text-xl font-bold text-white">{Math.round(estMs/3600000)}h</div>
                         </div>
                         <div className="bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20 col-span-2 sm:col-span-1">
                            <div className="text-xs text-emerald-400 font-semibold uppercase tracking-wider mb-1">Logged Time</div>
                            <div className="text-xl font-bold text-emerald-300">{Math.round(spentMs/3600000)}h</div>
                         </div>
                      </div>

                      <div className="bg-slate-800/40 p-6 rounded-2xl border border-slate-700 shadow-inner">
                          <div className="flex items-center justify-between mb-4">
                            <h3 className="text-md font-semibold text-white flex items-center gap-2"><TrendingUp className="w-4 h-4 text-emerald-400" /> Individual Effort Burnup</h3>
                          </div>
                          <div className="flex gap-4 text-xs font-medium text-slate-400 mb-6">
                               <span className="flex items-center"><div className="w-3 h-0 border-t-2 border-dashed border-slate-500 mr-1.5"></div> Capacity</span>
                               <span className="flex items-center"><div className="w-3 h-0 border-t-2 border-dotted border-blue-400 mr-1.5"></div> Scope</span>
                               <span className="flex items-center text-emerald-400"><div className="w-2 h-2 bg-emerald-500 rounded-full mr-1.5"></div> Logged</span>
                          </div>
                          <div className="relative h-48 w-full mt-2 group/chart">
                            <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                              {generateYAxisLabels(drillMaxBurnupHours, 'h').map((label, idx) => (<span key={idx}>{label}</span>))}
                            </div>
                            <div className="absolute left-10 right-2 top-2 bottom-6 cursor-crosshair z-10 group-hover/chart:z-[999999]"
                                 onMouseMove={(e) => handleChartMouseMove(e, 'drill', drillPoints)}
                                 onMouseLeave={() => setActiveChartHover(null)}>
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                                    <defs>
                                      <linearGradient id="drillGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#10b981" stopOpacity="0.3" />
                                        <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
                                      </linearGradient>
                                    </defs>
                                    <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                                    <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                    <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                    
                                    <path d={drillIdealPath} stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" fill="none" />
                                    <path d={drillPlottedPath} stroke="#60a5fa" strokeWidth="2" strokeDasharray="2 4" vectorEffect="non-scaling-stroke" fill="none" />
                                    
                                    {drillAreaPath && <path d={drillAreaPath} fill="url(#drillGradient)" />}
                                    {smoothDrillPath && <path d={smoothDrillPath} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />}
                                </svg>
                                
                                {activeChartHover?.chart === 'drill' && (
                                   <>
                                     <div className="absolute top-0 bottom-0 w-px bg-emerald-500/50 pointer-events-none" style={{ left: `${activeChartHover.xPct}%` }} />
                                     <div className="absolute w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pointer-events-none transform -translate-x-1/2 -translate-y-1/2 border-2 border-slate-900" style={{ left: `${activeChartHover.xPct}%`, top: `${activeChartHover.yPct}%` }} />
                                     <div className="absolute pointer-events-none flex flex-col items-center drop-shadow-lg"
                                          style={{ 
                                            left: `${activeChartHover.xPct}%`, 
                                            top: `${activeChartHover.yPct}%`,
                                            transform: 'translate(-50%, -100%)',
                                            marginTop: '-8px'
                                          }}>
                                        <div className="bg-slate-800 border border-emerald-500/50 text-white rounded-lg px-3 py-1.5 shadow-xl whitespace-nowrap flex flex-col items-center">
                                           <span className="font-bold text-[10px] uppercase tracking-wider text-emerald-400 mb-0.5">{new Date(activeChartHover.dateMs).toLocaleDateString()}</span>
                                           <span className="text-xs font-semibold text-slate-100">{Math.max(0, Math.round(activeChartHover.value / 3600000))}h Logged</span>
                                        </div>
                                        <div className="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[6px] border-t-emerald-500/50"></div>
                                     </div>
                                   </>
                                )}
                            </div>
                            <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                              <span className="-ml-3">{dayLabels[0]}</span>
                              <span>{dayLabels[2]}</span>
                              <span className="-mr-4">{dayLabels[3]}</span>
                            </div>
                          </div>
                      </div>
                    </div>

                    <div className="lg:w-1/2 p-6 overflow-y-auto bg-slate-900/20">
                       <h3 className="text-md font-semibold text-white flex items-center gap-2 mb-4"><ListTodo className="w-4 h-4 text-indigo-400" /> Assigned Task List</h3>
                       <div className="space-y-2">
                          {assigneeTasks.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
                       </div>
                    </div>
                 </div>
              </div>
           );
        };

        const spillOverTasks = filteredMotherTasks.filter(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            if (isDone) return false;
            if (t.due_date && parseInt(t.due_date) < now) return true;
            if (t.tags?.some(tag => (tag.name || '').toLowerCase().includes('spill over'))) return true;
            return false;
        });
        const spillOverCount = spillOverTasks.length;
        const spillOverEstHours = Math.round(spillOverTasks.reduce((sum, t) => sum + (parseInt(t.time_estimate) || 0), 0) / 3600000);

        const devDemandHours = plottedScopeEstHours * 0.8;
        const qaDemandHours = plottedScopeEstHours * 0.2;

        const devUtilPct = devCapacityHours > 0 ? Math.round((devDemandHours / devCapacityHours) * 100) : 0;
        const qaUtilPct = qaCapacityHours > 0 ? Math.round((qaDemandHours / qaCapacityHours) * 100) : 0;
        const bucketUtilizationPct = devCapacityHours > 0 ? Math.round((plottedScopeEstHours / devCapacityHours) * 100) : 0;

        const totalBugsCount = allBugs.length;
        const resolvedBugsCount = allBugs.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase())).length;
        const activeBugsCount = totalBugsCount - resolvedBugsCount;
        const criticalBugsCount = allBugs.filter(t => ['high', 'urgent', 'critical'].includes((t.priority?.priority || '').toLowerCase())).length;
        const bugResolutionRate = totalBugsCount === 0 ? 0 : Math.round((resolvedBugsCount / totalBugsCount) * 100);

        let totalQualityScore = 0;
        let evaluatedMotherTasks = 0;
        filteredMotherTasks.forEach(motherTask => {
            evaluatedMotherTasks++;
            const taskBugs = extractBugs([motherTask]);
            if (taskBugs.length === 0) {
                totalQualityScore += 100;
            } else {
                let penalty = 0;
                taskBugs.forEach(bug => {
                    const priority = (bug.priority?.priority || 'normal').toLowerCase();
                    if (['critical', 'urgent'].includes(priority)) penalty += 20;
                    else if (priority === 'high') penalty += 15;
                    else if (priority === 'normal') penalty += 10;
                    else penalty += 5;
                });
                totalQualityScore += Math.max(0, 100 - penalty);
            }
        });
        const avgQualityRate = evaluatedMotherTasks > 0 ? Math.round(totalQualityScore / evaluatedMotherTasks) : 100;

        let fixVelocitySumMs = 0;
        let fixVelocityCount = 0;
        allBugs.forEach(b => {
          const statusName = (b.status?.status || 'open').toLowerCase();
          if (doneStatuses.includes(statusName)) {
            let completedDate = parseDateMs(b.date_closed);
            if (!completedDate && b.activity_logs && Array.isArray(b.activity_logs)) {
               const statusLogs = b.activity_logs.filter(log => log.field === 'status').sort((x, y) => parseDateMs(x.date) - parseDateMs(y.date));
               if (statusLogs.length > 0) {
                   const lastLog = statusLogs[statusLogs.length - 1];
                   const lastLogStatus = (lastLog.after?.status || lastLog.after || '').toString().toLowerCase();
                   if (doneStatuses.includes(lastLogStatus)) completedDate = parseDateMs(lastLog.date);
               }
            }
            if (!completedDate) completedDate = parseDateMs(b.date_updated) || minDate;
            const createdDate = parseDateMs(b.date_created) || minDate;
            if (createdDate > 0 && completedDate >= createdDate) {
              fixVelocitySumMs += (completedDate - createdDate);
              fixVelocityCount++;
            }
          }
        });
        
        let avgVelocityValue = "0";
        let avgVelocityUnit = "Hours";
        if (fixVelocityCount > 0) {
          const avgVelocityMs = fixVelocitySumMs / fixVelocityCount;
          if (avgVelocityMs < 3600000) {
            avgVelocityValue = `${Math.floor(avgVelocityMs / 60000)}`;
            avgVelocityUnit = "Mins"; 
          } else {
            avgVelocityValue = (avgVelocityMs / 3600000).toFixed(1);
            avgVelocityUnit = "Hours";
          }
        }

        let totalEstForAccuracyMs = 0;
        let totalActualForAccuracyMs = 0;
        const timeInStatusStats = {};
        const excludedStatusesForAccuracy = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'closed', 'complete', 'done', 'resolved'];

        filteredTasks.forEach(t => {
            const statusName = (t.status?.status || 'open').toLowerCase();
            const isDone = doneStatuses.includes(statusName);
            const referenceNow = isDone ? parseDateMs(t.date_closed) || now : now;

            if (!isDone && !excludedStatusesForAccuracy.includes(statusName)) {
                const lastUpdated = t.date_updated ? parseDateMs(t.date_updated) : (t.date_created ? parseDateMs(t.date_created) : referenceNow);
                const timeInCurrent = calculateWorkingMs(lastUpdated, referenceNow);
                if (timeInCurrent > 0) {
                    if (!timeInStatusStats[statusName]) timeInStatusStats[statusName] = { sum: 0, count: 0 };
                    timeInStatusStats[statusName].sum += timeInCurrent;
                    timeInStatusStats[statusName].count++;
                }
            }

            if (isDone) {
                let actualRunningMs = 0;
                let parsedTimeInStatus = {};

                if (t.activity_logs && Array.isArray(t.activity_logs) && t.activity_logs.length > 0) {
                    const statusLogs = t.activity_logs.filter(log => log.field === 'status').sort((a, b) => parseDateMs(a.date) - parseDateMs(b.date));
                    if (statusLogs.length > 0) {
                        let lastDate = parseDateMs(t.start_date) || parseDateMs(t.date_created) || parseDateMs(statusLogs[0]?.date) || 0;
                        let currentStatus = (statusLogs[0]?.before?.status || statusLogs[0]?.before || 'open').toString().toLowerCase();

                        statusLogs.forEach(log => {
                            const changeDate = parseDateMs(log.date);
                            if (lastDate > 0 && changeDate >= lastDate) {
                                const workingMs = calculateWorkingMs(lastDate, changeDate);
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + workingMs;
                            }
                            currentStatus = (log.after?.status || log.after || currentStatus).toString().toLowerCase();
                            lastDate = changeDate;
                        });

                        if (t.date_closed && lastDate > 0) {
                            const closedDate = parseDateMs(t.date_closed);
                            if (closedDate >= lastDate) {
                                const workingMs = calculateWorkingMs(lastDate, closedDate);
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + workingMs;
                            }
                        }
                    }
                } 
                
                if (Object.keys(parsedTimeInStatus).length === 0 && t.time_in_status) {
                    if (Array.isArray(t.time_in_status)) {
                        t.time_in_status.forEach(item => {
                            const statusStr = (item.status?.status || item.status || 'open').toString().toLowerCase();
                            parsedTimeInStatus[statusStr] = (parsedTimeInStatus[statusStr] || 0) + parseDateMs(item.time || item.duration || item.total_time || 0);
                        });
                    } else if (typeof t.time_in_status === 'object') {
                        Object.entries(t.time_in_status).forEach(([statusStr, durationMs]) => {
                            parsedTimeInStatus[statusStr.toLowerCase()] = (parsedTimeInStatus[statusStr.toLowerCase()] || 0) + parseDateMs(durationMs);
                        });
                    }
                }

                if (Object.keys(parsedTimeInStatus).length > 0) {
                    let ongoingDevMs = 0;
                    Object.entries(parsedTimeInStatus).forEach(([statusStr, durationMs]) => {
                        const cleanStatus = statusStr.toLowerCase().trim();
                        if (!excludedStatusesForAccuracy.includes(cleanStatus)) {
                            if (!timeInStatusStats[cleanStatus]) timeInStatusStats[cleanStatus] = { sum: 0, count: 0 };
                            timeInStatusStats[cleanStatus].sum += durationMs;
                            timeInStatusStats[cleanStatus].count++;
                        }
                        // Explicitly target Ongoing Dev for the Accuracy calculation
                        if (cleanStatus === 'ongoing dev' || cleanStatus === 'in progress') {
                            ongoingDevMs += durationMs;
                        }
                    });
                    actualRunningMs = ongoingDevMs;
                } else {
                    const end_date = t.date_closed ? parseDateMs(t.date_closed) : (t.date_updated ? parseDateMs(t.date_updated) : minDate);
                    const start_date = t.start_date ? parseDateMs(t.start_date) : (t.date_created ? parseDateMs(t.date_created) : end_date);
                    actualRunningMs = calculateWorkingMs(start_date, end_date);
                }

                const estimateMs = t.time_estimate ? parseDateMs(t.time_estimate) : 0;
                if (actualRunningMs > 0 && estimateMs > 0) {
                    totalEstForAccuracyMs += estimateMs;
                    totalActualForAccuracyMs += actualRunningMs;
                }
            }
        });

        let estimationAccuracyDisplay = "N/A";
        if (totalEstForAccuracyMs > 0) {
            const error = Math.abs(totalActualForAccuracyMs - totalEstForAccuracyMs) / totalEstForAccuracyMs;
            estimationAccuracyDisplay = `${Math.max(0, Math.round((1 - error) * 100))}%`;
        }

        const avgTimeInStatusList = Object.entries(timeInStatusStats).map(([status, data]) => {
            const avgMs = data.sum / data.count;
            // A "working day" is 7 hours (10am to 5pm)
            const workingDayMs = 7 * 60 * 60 * 1000;
            const days = Math.floor(avgMs / workingDayMs);
            const hours = Math.floor((avgMs % workingDayMs) / 3600000);
            const mins = Math.floor((avgMs % 3600000) / 60000);
            let timeDisplay = days > 0 ? `${days}d ${hours}h` : (hours > 0 ? `${hours}h ${mins}m` : `${mins}m`);
            return { status, timeDisplay, avgMs };
        }).sort((a, b) => b.avgMs - a.avgMs);

        const stalledTasksCandidates = filteredTasks.filter(t => {
            const nameLower = (t.name || '').toLowerCase();
            const statusLower = (t.status?.status || '').toLowerCase();
            if (nameLower === 'ui bugs' || nameLower === 'qa bugs' || doneStatuses.includes(statusLower) || statusLower === 'sprint backlog') return false;
            const createdDate = parseInt(t.date_created);
            const estimateMs = parseInt(t.time_estimate);
            if (createdDate && estimateMs > 0 && (now - createdDate > estimateMs)) return true;
            return false;
        });

        const stalledTaskIds = new Set(stalledTasksCandidates.map(t => t.id));
        const hasStalledDescendant = (task) => task.subtasks?.some(sub => stalledTaskIds.has(sub.id) || hasStalledDescendant(sub)) || false;

        const stalledTasks = stalledTasksCandidates
          .filter(t => !hasStalledDescendant(t))
          .sort((a, b) => (now - (parseInt(b.date_created) || now)) - (now - (parseInt(a.date_created) || now)))
          .slice(0, 5);

        const handleExportCSV = () => {
            const escapeCSV = (str) => {
                if (str === null || str === undefined) return '""';
                const s = String(str).replace(/"/g, '""');
                return `"${s}"`;
            };

            const formatHours = (ms) => {
                if (!ms || isNaN(ms)) return '0.00';
                return (ms / 3600000).toFixed(2);
            };

            const headers = [
                'Task Name', 'Task ID', 'List/Workflow', 'Status', 'Priority', 
                'Estimated Hours', 'Logged Hours (ClickUp)', 'Logged Hours (Weaver)', 'Total Logged Hours',
                'Assignees', 'Tags', 'Date Created', 'Date Closed', 'Parent Task ID'
            ];

            const rows = [headers.join(',')];

            const taskToWorkflowMap = {};
            activeWorkflows.forEach(wf => {
                flattenTasksDeep(wf.tasks || []).forEach(t => {
                    taskToWorkflowMap[t.id] = wf.list;
                });
                flattenTasksDeep(wf.archivedTasks || []).forEach(t => { taskToWorkflowMap[t.id] = wf.list; });
            });

            [...allFlatTasks, ...archivedFlatTasks].forEach(task => { // FR-25: archived tasks keep their logged hours in the CSV
                const listName = taskToWorkflowMap[task.id] || 'Unknown';
                const name = escapeCSV(task.name);
                const id = escapeCSV(task.id);
                const list = escapeCSV(listName);
                const status = escapeCSV((task.status?.status || 'Open') + (task._archived ? ' (archived)' : ''));
                const priority = escapeCSV(task.priority?.priority || 'Normal');
                
                const estMs = task.directEstimate !== undefined ? task.directEstimate : (task.time_estimate ? parseInt(task.time_estimate) : 0);
                const clickupLoggedMs = task.directNativeSpent !== undefined ? task.directNativeSpent : (task.rawNativeSpent ? parseInt(task.rawNativeSpent) : 0);
                const weaverLoggedMs = task._totalLocalAddedMs || 0;
                const totalLoggedMs = clickupLoggedMs + weaverLoggedMs;

                const estHrs = escapeCSV(formatHours(estMs));
                const cuLoggedHrs = escapeCSV(formatHours(clickupLoggedMs));
                const wvrLoggedHrs = escapeCSV(formatHours(weaverLoggedMs));
                const totLoggedHrs = escapeCSV(formatHours(totalLoggedMs));

                const assignees = escapeCSV((task.assignees || []).map(a => a.username).join('; '));
                const tags = escapeCSV((task.tags || []).map(t => t.name).join('; '));
                
                const created = task.date_created ? escapeCSV(new Date(parseInt(task.date_created)).toLocaleDateString()) : '""';
                const closed = task.date_closed ? escapeCSV(new Date(parseInt(task.date_closed)).toLocaleDateString()) : '""';
                const parentId = task.parent ? escapeCSV(task.parent) : '""';

                rows.push([name, id, list, status, priority, estHrs, cuLoggedHrs, wvrLoggedHrs, totLoggedHrs, assignees, tags, created, closed, parentId].join(','));
            });

            const csvContent = rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `weaver_export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        
        const downloadChartAsImage = async (chartContainerId, fileName) => {
            const element = document.getElementById(chartContainerId);
            if (!element) return;
            
            try {
                // Ensure chart renders completely before snapshot
                await new Promise(resolve => setTimeout(resolve, 50));
                
                const canvas = await html2canvas(element, {
                    backgroundColor: '#0f172a', // Tailwind slate-950
                    scale: 2, // High resolution
                    logging: false,
                    onclone: (clonedDoc) => {
                       const clonedElement = clonedDoc.getElementById(chartContainerId);
                       if(clonedElement) {
                           clonedElement.style.borderRadius = '16px';
                           clonedElement.style.padding = '24px';
                       }
                    }
                });
                
                const dataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `${fileName}.png`;
                link.href = dataUrl;
                link.click();
            } catch (err) {
                console.error("Error capturing chart:", err);
            }
        };
        
        // ---- Central sync UI: header pill, Portfolio token row, failure banners (central-sync FR-17 to FR-20, FR-24) ----
        const fmtClock = (ts) => new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric' }).format(new Date(ts));
        const activeConn = activeConnection;
        const reconnectActive = () => { activeConn ? handleReconnect(activeConn) : handleConnectClickUp(); };

        const SYNC_TONES = {
          slate: ['bg-slate-800/50 border-white/10 text-slate-300', 'border-white/20'],
          indigo: ['bg-indigo-900/30 border-indigo-500/30 text-indigo-300', 'border-indigo-500/30'],
          emerald: ['bg-emerald-900/30 border-emerald-500/30 text-emerald-400', 'border-emerald-500/30'],
          amber: ['bg-amber-900/30 border-amber-500/30 text-amber-400', 'border-amber-500/30'],
          rose: ['bg-rose-900/30 border-rose-500/30 text-rose-400', 'border-rose-500/30'],
        };

        const renderSyncPill = () => {
          const connectionMissing = (!clickUpToken || needsReconnect) && mappedWorkflows.length > 0;
          const s = connectionMissing && syncState.state !== 'paused' ? { state: 'paused', reason: 'reconnect' } : syncState;
          const secs = s.until ? Math.max(0, Math.ceil((s.until - Date.now()) / 1000)) : 0;
          const reasonShort = (s.reason || '').length > 40 ? s.reason.slice(0, 39) + '…' : (s.reason || '');
          const [tone, Icon, text, spin] = ({
            idle: ['slate', CloudOff, 'Not syncing'],
            syncing: ['indigo', RefreshCw, 'Syncing...', true],
            checking: ['indigo', RefreshCw, 'Checking token...', true],
            synced: ['emerald', null, `Synced ${fmtClock(s.at || mappedWorkflows[0]?.lastSynced || Date.now())}`],
            retrying: ['amber', RefreshCw, `Retrying ${s.k || 1}/${REJECT_TRIES}`],
            rate_limited: ['amber', Clock, `Rate limited, retry in ${secs}s`],
            offline: ['slate', WifiOff, "Can't reach server, retrying"],
            unreachable: ['slate', CloudOff, 'ClickUp unreachable, retrying'],
            paused: ['rose', PauseCircle, s.hint || (s.reason === 'reconnect' ? 'Paused: reconnect needed' : 'Paused: token rejected')],
            failed: ['rose', AlertTriangle, `Sync failed: ${reasonShort}`],
          }[s.state] || ['slate', CloudOff, 'Not syncing']);
          const [box, divider] = SYNC_TONES[tone];
          const btn = `ml-2 pl-2 border-l ${divider} transition-opacity hover:opacity-70`;
          return (
            <span role="status" aria-live="polite" title={s.state === 'failed' ? s.reason : undefined} className={`inline-flex items-center px-3 py-1 rounded-full border text-xs font-medium cursor-default transition-colors duration-500 ${box}`}>
              {Icon
                ? <Icon className={`h-3.5 w-3.5 mr-2 ${spin ? 'animate-spin motion-reduce:animate-none' : ''}`} aria-hidden="true" />
                : <span className="h-2 w-2 rounded-full mr-2 bg-emerald-400 animate-pulse motion-reduce:animate-none" aria-hidden="true"></span>}
              {text}
              {s.state === 'synced' && (
                <button onClick={runSyncSequence} disabled={isAutoSyncing} className={`${btn} disabled:opacity-50`} title="Sync Now" aria-label="Sync now"><RefreshCw className="h-3.5 w-3.5" /></button>
              )}
              {(s.state === 'offline' || s.state === 'unreachable' || s.state === 'failed') && (
                <button onClick={runSyncSequence} disabled={isAutoSyncing} className={btn} aria-label="Retry sync">Retry</button>
              )}
              {s.state === 'paused' && (
                <>
                  {s.reason !== 'reconnect' && <button onClick={handleRecheck} className={btn} title="Check the token again" aria-label="Check the token again"><RefreshCw className="h-3.5 w-3.5" /></button>}
                  <button onClick={reconnectActive} className={btn} aria-label="Reconnect ClickUp">Reconnect</button>
                </>
              )}
            </span>
          );
        };

        const renderTokenRow = (conn) => {
          if (!UUID_RE.test(conn.token || '')) return null;
          const ts = tokenStatuses[conn.token];
          if (!ts && tokenStatusLoading) return (
            <div className="rounded-lg px-3 py-2 border bg-slate-800/40 border-white/5 animate-pulse motion-reduce:animate-none">
              <span className="sr-only">Checking token...</span><div className="h-3 w-40 rounded bg-slate-700/60"></div>
            </div>
          );
          const sameDay = ts?.checkedAt && new Date(ts.checkedAt).toDateString() === new Date().toDateString();
          const checked = ts?.checkedAt ? ` · checked ${sameDay ? fmtClock(ts.checkedAt) : new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(new Date(ts.checkedAt))}` : '';
          if (ts?.status === 'valid') return (
            <div title={ts.checkedAt ? new Date(ts.checkedAt).toLocaleString() : undefined} className="flex items-center text-xs rounded-lg px-3 py-2 border bg-emerald-500/10 border-emerald-500/20 text-emerald-400">
              <ShieldCheck className="h-3.5 w-3.5 mr-2" aria-hidden="true" /> Token OK{checked}
            </div>
          );
          if (ts?.status === 'rejected') return (
            <div className="flex flex-wrap items-center justify-between gap-2 text-xs rounded-lg px-3 py-2 border bg-rose-950/30 border-rose-900/50 text-rose-300">
              <span className="flex items-center"><ShieldX className="h-3.5 w-3.5 mr-2" aria-hidden="true" /> Token rejected</span>
              <button onClick={() => handleReconnect(conn)} className="px-2.5 py-1 rounded-md border border-rose-500/30 text-rose-300 neon-border-rose">Reconnect</button>
            </div>
          );
          return (
            <div className="flex items-center text-xs rounded-lg px-3 py-2 border bg-slate-800/40 border-white/5 text-slate-400">
              <Clock className="h-3.5 w-3.5 mr-2" aria-hidden="true" /> Not checked yet
            </div>
          );
        };

        // team-data FR-14, FR-15: team events of my lists, unread = by someone else and newer than my read marker
        const myListIds = mappedWorkflows.map(w => String(w.listId));
        const teamEvents = user.isTeam ? myListIds.flatMap(id => eventsByList[id] || []).sort((a, b) => b.at - a.at) : [];
        const unreadEvents = teamEvents.filter(e => e.actorUid !== user.uid && e.at > (teamSeen[e.listId] || 0));
        const unreadLabel = unreadEvents.length > 9 ? '9+' : String(unreadEvents.length);
        const toggleBell = () => {
          if (isNotificationsOpen) { setIsNotificationsOpen(false); return; }
          setOpenUnreadIds(unreadEvents.map(e => e.id));
          setTeamVisibleCount(10);
          setVisibleTxCount(10);
          setIsNotificationsOpen(true);
          if (user.isTeam && myListIds.length) { // FR-7: opening the panel marks every shown list as read
            const now = Date.now();
            const seen = Object.fromEntries(myListIds.map(id => [id, Math.max(now, ...(eventsByList[id] || []).map(e => e.at))])); // a teammate clock running ahead must not leave events unread
            setTeamSeen(prev => ({ ...prev, ...seen }));
            teamWrite(() => setDoc(userDoc(user.uid), { seen }, { merge: true }), 'read markers', 'seen');
          }
        };
        const eventRow = (e, { unread = false, meta } = {}) => {
          const st = EVENT_STYLE[e.type] || TX_STYLE[e.iconType] || TX_STYLE.info;
          return (
            <div key={e.id} className={`p-3 flex items-start gap-3 hover:bg-white/5 border-l-2 ${unread ? 'border-indigo-400 bg-indigo-500/5' : 'border-transparent'}`}>
              <div className={`mt-0.5 shrink-0 p-1.5 rounded border ${st.chip}`}><st.Icon className={`w-3.5 h-3.5 ${st.icon}`} aria-hidden="true" /></div>
              <div className="min-w-0">
                {unread && <span className="sr-only">Unread. </span>}
                <p className="text-sm font-medium text-slate-200 line-clamp-2 break-words" title={e.summary || e.action}>{e.summary || e.action}</p>
                <p className="text-[11px] text-slate-500 mt-0.5">{meta}</p>
              </div>
            </div>
          );
        };
        const teamPanelBody = !user.isTeam ? (
          <p className="m-3 p-3 rounded-lg text-xs bg-slate-800/60 border border-white/10 text-slate-300">Team notifications need an inventi.ph sign-in. Preview shows your own activity only.</p>
        ) : myListIds.length === 0 ? (
          <p className="p-5 text-center text-sm text-slate-500">Link a ClickUp list to see your team's activity. <button onClick={() => { setIsNotificationsOpen(false); handleConnectClickUp(); }} className="text-indigo-300 underline">Link a list</button></p>
        ) : !myListIds.every(id => eventsByList[id]) ? (
          teamLoadFailed

          const items = [];

          // team-data FR-23 (design S5): no access first, it explains every other team-data failure
          if (teamDenied) items.unshift({ key: 'team-denied', tone: 'rose', role: 'alert', text: "You don't have access to Weaver's team data. Sign in with your inventi.ph account.", action: { label: 'Switch account', onClick: handleLogout } });
          else {

            if (teamLoadFailed) items.push({ key: 'team-load', tone: 'amber', role: 'status', text: "Couldn't load team data. Showing the last loaded values." });

          return items.filter(i => !dismissedBanners.includes(i.key));
        })();
        const bannersUI = bannerItems.length === 0 ? null : (
          <div className="relative z-30 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-3">

                {reconnecting && hasKeys

                {picked && <p className="text-xs text-slate-400 -mt-3 mb-5">For: <span className="text-slate-200">{picked.names || 'Saved key'}</span>{picked.cards.length > 0 && ` · used by ${picked.cards.map(c => c.name).join(', ')}`}</p>}
                {hasKeys && (showPasteField || reconnecting) && (
                  <button onClick={backToSavedKeys} className="text-sm text-indigo-300 hover:text-indigo-200 mb-4 inline-flex items-center"><ChevronLeft className="h-4 w-4 mr-1" aria-hidden="true" />Back to saved keys</button>

            {integrationStep === 'connecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-12 flex flex-col items-center justify-center text-center animate-in fade-in">
                <RefreshCw className="h-8 w-8 text-indigo-400 animate-spin mb-4" />
                <h3 className="text-lg font-semibold text-white">Authenticating with ClickUp</h3>

        const viewing = portfolios.find(p => p.id === viewingPortfolioId) || currentPortfolio;

                      <div className="p-5 flex-1 space-y-3">

                        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 pt-1 text-[11px] text-slate-500">

                          <span className="flex items-center"><Clock className="h-3 w-3 mr-1" /> Last used {new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(conn.lastUsed || conn.savedAt || Date.now()))}</span>

                      <div className="px-5 py-4 border-t border-white/5 flex items-center gap-2 relative">
                        <span title={isActive ? 'Switch to another dashboard before removing this one' : `Remove from ${viewing.name}`}>

                        </span>
                        {user?.isTeam && (
                          <button onClick={() => setMoveMenuFor(m => m === conn.id ? null : conn.id)} aria-haspopup="menu" aria-expanded={moveMenuFor === conn.id} aria-label={`Move ${conn.name} to another Portfolio`} className="px-3 py-2 rounded-md text-xs font-medium text-slate-300 neon-border-slate inline-flex items-center"><ArrowRightLeft className="h-4 w-4" /><span className="hidden sm:inline ml-1.5">Move</span></button>

                        <span className="ml-auto">
                          {connNeedsReconnect ? (

                            <button onClick={() => setActiveView('dashboard')} className="btn-neon btn-neon-emerald btn-neon-sm"><LayoutDashboard className="h-3.5 w-3.5 mr-1.5" /> Open Dashboard</button>
                          ) : (
                            <button onClick={() => handleSwitchConnection(conn)} disabled={warpStage !== 'idle'} className="btn-neon btn-neon-indigo btn-neon-sm"><ArrowRight className="h-3.5 w-3.5 mr-1.5" /> Switch to this</button>

                            ))}
                            <div className="border-t border-slate-700/80 mt-1 pt-1">
                              <button role="menuitem" autoFocus={others.length === 0} onClick={() => { setMoveMenuFor(null); openPortfolioDialog({ type: 'new', value: '', error: null, moveCardId: conn.id }); }} className="w-full h-10 px-4 flex items-center text-sm text-left text-indigo-300 hover:bg-white/5 focus:bg-indigo-500/10 focus:outline-none"><Plus className="h-4 w-4 mr-2" /> New Portfolio...</button>

            <p className="sr-only" aria-live="polite">{portfolioLiveMsg}</p>

        // ---- portfolios design P1, P2: one fixed-size header button, menu with the current Portfolio's dashboards and the other Portfolios ----
        const pickerUI = (() => {
          if (!user?.isTeam) return null;

            <div aria-busy="true" className="ml-2 sm:ml-4 px-3 py-2 rounded-lg border border-white/5"><div className="h-3 w-24 sm:w-32 rounded bg-slate-700/60 animate-pulse motion-reduce:animate-none"></div><span className="sr-only">Loading Portfolios</span></div>

          const open = activeConnection && activeConnection.portfolioId === cur.id ? activeConnection : (activeConnection || null);
          const q = pickerQuery.trim().toLowerCase();
          const match = (s) => !q || (s || '').toLowerCase().includes(q);
          const dashboards = [...cur.cards].sort(byLastUsed).filter(c => match(c.name) || match(cur.name));
          const others = portfolios.filter(p => p.id !== cur.id)
            .map(p => ({ p, hit: q && !match(p.name) ? p.cards.find(c => match(c.name)) : null }))
            .filter(x => !q || match(x.p.name) || x.hit);
          const badge = (c) => {
            if (!c.token || isLegacyToken(c.token)) return <span className="ml-2 shrink-0 text-[10px] px-1.5 py-0.5 rounded-full border bg-amber-950/30 border-amber-900/50 text-amber-300">Reconnect needed</span>;
            if (tokenStatuses[c.token]?.status === 'rejected') return <span className="ml-2 shrink-0 text-[10px] px-1.5 py-0.5 rounded-full border bg-rose-950/30 border-rose-900/50 text-rose-300">Token rejected</span>;
            return null;
          };
          const onMenuKey = (e) => {
            const items = [...(pickerMenuRef.current?.querySelectorAll('[role="menuitem"]') || [])];
            const i = items.indexOf(document.activeElement);
            const go = (n) => { e.preventDefault(); items[(n + items.length) % items.length]?.focus(); };
            if (e.key === 'ArrowDown') go(i + 1);
            else if (e.key === 'ArrowUp') go(i < 0 ? items.length - 1 : i - 1);
            else if (e.key === 'Home') go(0);
            else if (e.key === 'End') go(items.length - 1);
            else if (e.key === 'Escape') { e.preventDefault(); closePicker(); }
            else if (e.key === 'Tab') closePicker(false);
          };
          const label = `${cur.name} / ${open ? open.name : 'No dashboard'}`;
          return (
            <div className="relative ml-2 sm:ml-4 min-w-0">
              <button ref={pickerBtnRef} onClick={() => { setPickerQuery(''); setPickerOpen(o => !o); }} aria-haspopup="menu" aria-expanded={pickerOpen}
                aria-label={`Switch Portfolio or dashboard. Current: ${cur.name}, ${open ? open.name : 'no dashboard'}`} title={label}
                className={`px-3 py-1.5 rounded-lg border text-sm font-medium flex items-center gap-2 transition-all neon-border-indigo min-w-0 ${pickerOpen ? 'text-white bg-indigo-500/10 border-indigo-500/30' : 'text-slate-300 border-white/10'}`}>
                <Briefcase className="h-4 w-4 shrink-0 text-indigo-400" aria-hidden="true" />
                <span className="hidden sm:inline truncate max-w-[12rem] lg:max-w-[18rem]">
                  <span className="text-slate-400">{cur.name}</span> / {open
                    ? <><span className="inline-block h-2 w-2 rounded-full bg-emerald-400 mr-1 align-middle"></span><span className="text-white">{open.name}</span></>
                    : <span className="text-slate-500 italic">No dashboard</span>}
                </span>
                <ChevronDown className="h-4 w-4 shrink-0 text-slate-500" aria-hidden="true" />
              </button>
              {pickerOpen && (
                <div ref={pickerMenuRef} role="menu" aria-label="Switch Portfolio or dashboard" onKeyDown={onMenuKey}
                  className="fixed sm:absolute top-16 sm:top-11 left-4 right-4 sm:left-0 sm:right-auto sm:w-80 bg-slate-900 border border-slate-700/80 rounded-xl shadow-[0_0_20px_rgba(99,102,241,0.3)] z-50 overflow-hidden animate-in slide-in-from-top-4 duration-200">
                  {portfolios.length > 8 && (
                    <div className="p-2 border-b border-slate-700/80">
                      <div className="relative">
                        <Search className="h-4 w-4 text-slate-500 absolute left-3 top-2.5" aria-hidden="true" />

                          className="w-full bg-slate-950/60 border border-transparent rounded-lg pl-9 pr-3 py-2 text-sm text-white neon-input neon-input-indigo" />
                      </div>

                    {others.map(({ p, hit }) => (

                      </button>

                    {q && dashboards.length === 0 && others.length === 0 && <p className="px-4 py-3 text-sm text-slate-500">No Portfolio or dashboard matches "{pickerQuery}".</p>}

                    <button role="menuitem" onClick={() => { closePicker(false); openPortfolioDialog({ type: 'new', value: '', error: null }); }} className="w-full h-10 px-4 flex items-center text-sm text-left text-indigo-300 hover:bg-white/5 focus:bg-indigo-500/10 focus:outline-none"><Plus className="h-4 w-4 mr-2" aria-hidden="true" /> New Portfolio</button>
                    <button role="menuitem" onClick={() => { closePicker(false); showPortfolio(cur.id); }} className="w-full h-10 px-4 flex items-center text-sm text-left text-slate-300 hover:bg-white/5 focus:bg-indigo-500/10 focus:text-white focus:outline-none"><Settings className="h-4 w-4 mr-2 text-slate-500" aria-hidden="true" /> Manage Portfolios</button>
                  </div>
                </div>

        })();

        // ---- portfolios design P5, P7, P10: New Portfolio, Delete Portfolio, Add list ----
        const portfolioDialogUI = (() => {
          const d = portfolioDialog;
          if (!d) return null;
          const panel = (title, body) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" onKeyDown={e => { if (e.key === 'Escape') { e.stopPropagation(); closePortfolioDialog(); } }}>
              <div role="dialog" aria-modal="true" aria-labelledby="portfolio-dialog-title" className={`bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl w-full ${d.type === 'addlist' ? 'max-w-lg' : 'max-w-md'} p-6 relative animate-in zoom-in-95 duration-200`}>
                <button onClick={closePortfolioDialog} className="absolute top-4 right-4 text-slate-400 p-2 rounded neon-border-slate transition-all" aria-label="Close"><X className="h-4 w-4" /></button>

                {body}
              </div>
            </div>
          );
          if (d.type === 'new') {
            const len = d.value.length;
            return panel('New Portfolio', <>
              <label htmlFor="new-portfolio-name" className="block text-sm font-medium text-slate-300 mb-1">Name</label>
              <input id="new-portfolio-name" autoFocus type="text" maxLength={PORTFOLIO_NAME_MAX} value={d.value}
                onChange={e => setPortfolioDialog({ ...d, value: e.target.value, error: null })}
                onKeyDown={e => { if (e.key === 'Enter' && d.value.trim()) handleCreatePortfolio(); }}
                className="w-full bg-slate-950/60 border border-transparent rounded-lg px-3 py-2.5 text-white neon-input neon-input-indigo" />
              <p className={`text-right text-xs mt-1 ${len >= 50 ? 'text-amber-300' : 'text-slate-500'}`}>{len}/{PORTFOLIO_NAME_MAX}</p>
              {d.error && <p role="alert" className="flex items-center gap-2 text-sm text-rose-300 mt-1"><AlertTriangle className="h-4 w-4 shrink-0" aria-hidden="true" />{d.error}</p>}
              <div className="flex justify-end gap-3 mt-5">
                <button onClick={closePortfolioDialog} className="px-4 py-2 text-sm font-medium text-slate-400 rounded-lg neon-border-slate transition-all">Cancel</button>
                <button onClick={handleCreatePortfolio} disabled={!d.value.trim()} className="btn-neon btn-neon-indigo disabled:opacity-40">Create</button>
              </div>
            </>);
          }
          if (d.type === 'delete') {
            const p = portfolios.find(x => x.id === d.id);
            if (!p) return null;
            return panel('Delete Portfolio', <>
              <p className="text-sm text-slate-200">Delete Portfolio "{p.name}" and its {p.cards.length} dashboard{p.cards.length === 1 ? '' : 's'}? Your ClickUp keys stay saved.</p>
              <div className="flex justify-end gap-3 mt-6">
                <button autoFocus onClick={closePortfolioDialog} className="px-4 py-2 text-sm font-medium text-slate-300 rounded-lg neon-border-slate transition-all">Cancel</button>
                <button onClick={handleDeletePortfolio} disabled={d.busy} className="btn-neon btn-neon-rose disabled:opacity-60">{d.busy ? 'Deleting...' : 'Delete'}</button>
              </div>
            </>);
          }

                    {archivedFlatTasks.length > 0 && (
                      <button onClick={() => { setShowArchived(v => { savePref('show_archived', !v); return !v; }); }} aria-pressed={showArchived} aria-label={`${showArchived ? 'Hide' : 'Show'} archived tasks, ${archivedFlatTasks.length}`} className={`px-2.5 py-1 rounded-full border border-slate-600 text-xs font-medium flex items-center gap-1.5 neon-border-slate transition-all ${showArchived ? 'bg-slate-700/40 text-white' : 'text-slate-300'}`}>
                        <Archive className="w-3.5 h-3.5" aria-hidden="true" /><span className="hidden sm:inline">{showArchived ? 'Hide archived' : 'Show archived'}</span><span className="bg-slate-700/60 px-1.5 rounded-full text-[10px]">{archivedFlatTasks.length}</span>
                      </button>
                    )}
                    <span className="text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">{completedFilteredTasksCount} Resolved</span>
                    </div>
                  </div>
                  {(() => {
                    const sections = activeWorkflows.map(workflow => {
                      const mainTasksOnly = [...(workflow.tasks || []), ...(showArchived ? workflow.archivedTasks || [] : [])].filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      const groupedByStatus = {};
                      buildFilteredTree(mainTasksOnly, 'all').forEach(task => {
                        const status = task.status?.status || 'Open';
                        if (!groupedByStatus[status]) groupedByStatus[status] = [];
                        groupedByStatus[status].push(task);
                      });
                                                                  const groups = Object.keys(groupedByStatus).map(status => ({ status, color: groupedByStatus[status][0]?.status?.color || '#38bdf8', tasks: groupedByStatus[status] })); // the carousel puts done statuses after the open ones unless the user saved an order
                      return { workflow, groups };
                    }).filter(s => s.groups.length > 0);
                    if (sections.length === 0) return <div className="text-center text-sm text-slate-500 italic py-8">No tasks match your filters.</div>;
                    return sections.map(({ workflow, groups }) => (
                      <div key={workflow.id} className="pb-2">
                        {activeWorkflows.length > 1 && <div className="px-6 pt-4 text-[11px] uppercase tracking-wide text-slate-500">{workflow.list}</div>}
                        <StatusCarousel key={workflow.listId} groups={groups} storageKey={`weaver_status_order_${appId}_${portfolioUserKey || 'guest'}_${workflow.listId}_active`} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />
                      </div>
                    ));
                  })()}
                </div>
              </main>
            )}
            <footer className="relative z-10 pb-6 text-center text-[11px] text-slate-500">Weaver v{APP_VERSION}</footer>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center relative overflow-hidden text-slate-100 font-sans p-4">
          <WebNestBackground opacity={0.25} />
          
          <div className="relative z-10 max-w-md w-full px-8 py-10 bg-slate-900/60 backdrop-blur-xl rounded-3xl border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.5)] animate-in fade-in zoom-in-95 duration-500">
            <div className="flex flex-col items-center mb-10">
              <div className="p-4 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 mb-6 shadow-[0_0_30px_rgba(99,102,241,0.25)]">
                <SpiderNetworkIcon className="h-14 w-14 text-indigo-400" />
              </div>
              <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-emerald-300 tracking-tight">Weaver</h1>
              <p className="text-slate-400 text-sm mt-3 text-center font-medium max-w-[280px]">Thread Support and Development together in one unified dimension.</p>
            </div>

            <div className="space-y-5">
              {notTeam && (
                <div role="alert" className="p-3.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-200 flex items-start gap-2 mb-2">
                  <ShieldAlert className="w-5 h-5 shrink-0" aria-hidden="true" />
                  <span className="mt-0.5 leading-relaxed">{NOT_TEAM_MSG}{notTeam.email && <><br /><span className="text-amber-200/80">You tried: {notTeam.email}</span></>}</span>
                </div>
              )}
              {errorMessage && (
                <div className="p-3.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300 flex items-start gap-2 mb-2">
                  <AlertTriangle className="w-5 h-5 shrink-0" /> <span className="mt-0.5 leading-relaxed">{errorMessage}</span>
                </div>
              )}
              
              <button
                onClick={handleGoogleLogin}
                disabled={isLoggingIn}
                className="w-full relative group flex items-center justify-center space-x-3 bg-white text-slate-900 px-5 py-3.5 rounded-xl font-bold transition-all hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]"
              >
                {isLoggingIn ? (
                  <div className="w-6 h-6 border-2 border-slate-400 border-t-slate-900 rounded-full animate-spin" />
                ) : (
                  <>
                    <svg className="w-5 h-5" viewBox="0 0 24 24">
                      <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span className="text-[15px]">Continue with Google</span>
                  </>
                )}
              </button>

              <div className="relative flex items-center py-2">
                <div className="flex-grow border-t border-slate-700/50"></div>
                <span className="flex-shrink-0 mx-4 text-xs text-slate-500 font-bold uppercase tracking-widest">Or</span>
                <div className="flex-grow border-t border-slate-700/50"></div>
              </div>

              <button
                onClick={handleMockLogin}
                disabled={isLoggingIn}
                className="w-full relative group flex items-center justify-center space-x-2.5 bg-slate-900 text-slate-200 px-5 py-3.5 rounded-xl font-bold transition-all border border-slate-700 hover:border-indigo-500 hover:bg-slate-800 hover:shadow-[0_0_20px_rgba(99,102,241,0.2)] disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {isLoggingIn ? (
                  <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin" />
                ) : (
                  <>
                    <ShieldAlert className="w-5 h-5 text-indigo-400 group-hover:text-indigo-300 transition-colors" />
                    <span className="text-[15px]">Preview Local Offline Mode</span>
                  </>
                )}
              </button>
            </div>
            <div className="mt-8 text-center text-xs text-slate-600 font-medium">
              By continuing, you agree to the terms of service.
            </div>
            <div className="mt-2 text-center text-[11px] text-slate-500">Weaver v{APP_VERSION}</div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
