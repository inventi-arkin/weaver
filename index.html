                  )}

                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-white/5">
                    <button onClick={() => { setIntegrationStep('idle'); setSelectedTeam(''); setSelectedSpace(''); setSelectedFolder(''); setSelectedList(''); setIsSwitchModalOpen(false); }} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors focus:outline-none rounded-lg">Cancel</button>
                    <button disabled={!selectedList} onClick={handleAddMapping} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"><CheckCircle2 className="h-4 w-4 mr-2" /> Connect to Weaver</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-[#050814] font-sans text-slate-100 relative">

            {isSwitchModalOpen && mappedWorkflows.length > 0 && (
              <div className="fixed inset-0 bg-[#050814]/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                 <div className="w-full max-w-2xl relative">
                    <button onClick={() => setIsSwitchModalOpen(false)} className="absolute -top-12 right-0 text-slate-400 hover:text-red-400 transition-colors p-2"><XIcon className="w-8 h-8" /></button>
                    {integrationUI}
                 </div>
              </div>
            )}

            {isBlockerModalOpen && (
              <div className="fixed inset-0 bg-[#050814]/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-[#0b1120] border border-white/10 rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                   <div className="flex items-center justify-between p-5 border-b border-white/5 bg-[#0f172a]">
                     <h2 className="text-lg font-bold text-white flex items-center gap-2"><Calendar className="w-5 h-5 text-indigo-400" /> Sprint Capacity Settings</h2>
                     <button onClick={() => setIsBlockerModalOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white transition-colors"><XIcon className="w-5 h-5" /></button>
                   </div>
                   
                   <div className="p-5 space-y-6">
                     <div className="bg-[#0f172a] p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Daily Working Hours</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Developers</label>
                            <input type="number" min="1" max="24" value={devHoursPerDay} onChange={e => { const val = Number(e.target.value); setDevHoursPerDay(val); saveSettings({ devHoursPerDay: val }); }} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                          </div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">QA Resources</label>
                            <input type="number" min="1" max="24" value={qaHoursPerDay} onChange={e => { const val = Number(e.target.value); setQaHoursPerDay(val); saveSettings({ qaHoursPerDay: val }); }} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                          </div>
                        </div>
                     </div>

                     <div className="space-y-3">
                       <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">Active Blockers<span className="text-indigo-400">{dateBlockers.length} Items</span></h3>
                       {dateBlockers.length === 0 ? (
                         <div className="text-sm text-slate-400 italic p-4 bg-[#0f172a] rounded-xl text-center border border-white/5">No blockers added.</div>
                       ) : (
                         <ul className="space-y-2 max-h-40 overflow-y-auto pr-1">
                           {dateBlockers.map(b => (
                             <li key={b.id} className="flex items-center justify-between bg-[#0f172a] p-3 rounded-xl border border-white/5">
                                <div className="flex flex-col"><span className="text-sm font-semibold text-slate-200">{b.remark} <span className="text-slate-400 font-normal">({b.days} day{b.days > 1 ? 's' : ''})</span></span>{b.remark === 'Leave' && <span className="text-xs text-indigo-400 font-medium mt-0.5">{b.assignee}</span>}</div>
                                <button onClick={() => { const newBlockers = dateBlockers.filter(x => x.id !== b.id); setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); }} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors"><Trash2 className="w-4 h-4" /></button>
                             </li>
                           ))}
                         </ul>
                       )}
                     </div>

                     <div className="bg-[#0f172a] p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Add New Blocker</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">No. of Days</label><input type="number" min="1" value={newBlockerDays} onChange={e => setNewBlockerDays(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" /></div>
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Remarks</label><select value={newBlockerRemark} onChange={e => setNewBlockerRemark(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer"><option value="Holiday">Holiday</option><option value="Company Event">Company Event</option><option value="Leave">Leave</option></select></div>
                        </div>
                        {newBlockerRemark === 'Leave' && (
                          <div className="animate-in fade-in slide-in-from-top-1"><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Team Member</label><select value={newBlockerAssignee || (assigneesList[0]?.username || '')} onChange={e => setNewBlockerAssignee(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">{assigneesList.map(a => <option key={a.username} value={a.username}>{a.username}</option>)}</select></div>
                        )}
                        <button onClick={() => { if (!newBlockerDays || newBlockerDays <= 0) return; const newBlocker = { id: Date.now().toString(), days: parseInt(newBlockerDays), remark: newBlockerRemark, assignee: newBlockerRemark === 'Leave' ? (newBlockerAssignee || assigneesList[0]?.username) : null }; const newBlockers = [...dateBlockers, newBlocker]; setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); setNewBlockerDays(1); }} className="w-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors shadow-sm"><Plus className="w-4 h-4 mr-1.5" /> Add Date Blocker</button>
                     </div>
                   </div>
                </div>
              </div>
            )}

            {timeTrackModalTask && (
              <div className="fixed inset-0 bg-[#050814]/80 backdrop-blur-sm z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-[#0b1120] border border-white/10 rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                  <div className="flex items-center justify-between p-5 border-b border-white/5 bg-[#0f172a]">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2"><Clock className="w-5 h-5 text-emerald-400" /> Track Time</h2>
                    <button onClick={() => setTimeTrackModalTask(null)} className="p-1.5 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white transition-colors"><XIcon className="w-5 h-5" /></button>
                  </div>
                  
                  <div className="p-5 space-y-5">
                    <div className="bg-[#0f172a] p-3 rounded-xl border border-white/5">
                      <p className="text-xs text-slate-500 uppercase tracking-wider font-semibold mb-1">Logging time for task</p>
                      <p className="text-sm font-medium text-slate-200">{timeTrackModalTask.name}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Hours</label><input type="number" min="0" value={timeHours} onChange={e => setTimeHours(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" /></div>
                      <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Minutes</label><input type="number" min="0" max="59" value={timeMinutes} onChange={e => setTimeMinutes(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" /></div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Date</label><input type="date" value={timeDate} onChange={e => setTimeDate(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 [color-scheme:dark]" /></div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Team Member</label>
                        <select value={timeAssignee} onChange={e => setTimeAssignee(e.target.value)} className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer">
                          <option value="me">Myself</option>
                          {allWorkspaceAssignees.map(a => (<option key={a.id} value={a.id.toString()}>{a.username}</option>))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Notes / Description (Optional)</label>
                      <textarea value={timeNotes} onChange={e => setTimeNotes(e.target.value)} placeholder="What did you work on?" className="w-full bg-[#050814] border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 resize-none h-20" />
                    </div>

                    <button onClick={handleLogTime} disabled={(!timeHours && !timeMinutes)} className="w-full flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"><CheckCircle2 className="w-4 h-4 mr-1.5" /> Save Time Entry</button>
                  </div>
                </div>
              </div>
            )}

            {selectedTicketForModal && (
              <div className="fixed inset-0 bg-[#050814]/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-[#0b1120] border border-white/10 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                  <div className="flex items-center justify-between p-6 border-b border-white/5 bg-[#0f172a]">
                    <div>
                      <div className="flex items-center space-x-2 mb-2">
                        <span className="text-xs font-mono text-slate-500 uppercase">#{selectedTicketForModal.id}</span>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border" style={{ color: selectedTicketForModal.status?.color || '#94a3b8', backgroundColor: `${selectedTicketForModal.status?.color || '#94a3b8'}15`, borderColor: `${selectedTicketForModal.status?.color || '#94a3b8'}30` }}>{selectedTicketForModal.status?.status || 'Open'}</span>
                      </div>
                      <h2 className="text-xl font-bold text-white">{selectedTicketForModal.name}</h2>
                    </div>
                    <button onClick={() => setSelectedTicketForModal(null)} className="p-2 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white transition-colors"><XIcon className="h-5 w-5" /></button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-6 space-y-6">
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Description</h3>
                      <div className="bg-[#0f172a] border border-white/5 p-4 rounded-xl text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">{selectedTicketForModal.description || "No description provided."}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-[#0f172a] border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Time Estimate</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300"><Clock className="h-4 w-4 mr-2 text-indigo-400" />{selectedTicketForModal.time_estimate ? `${Math.round(parseInt(selectedTicketForModal.time_estimate)/3600000)} Hours` : 'Not set'}</div>
                      </div>
                      <div className="bg-[#0f172a] border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Priority</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300 capitalize"><Flag className="h-4 w-4 mr-2" style={{ color: selectedTicketForModal.priority?.color || '#94a3b8' }} />{selectedTicketForModal.priority?.priority || 'None'}</div>
                      </div>
                    </div>
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center"><MessageSquare className="h-4 w-4 mr-2" /> Comments</h3>
                      <div className="space-y-4">
                        {(!localMockComments[selectedTicketForModal.id] || localMockComments[selectedTicketForModal.id].length === 0) ? (
                          <p className="text-sm text-slate-500 italic p-4 bg-[#0f172a] rounded-xl text-center border border-white/5">No comments yet. Start the conversation!</p>
                        ) : (
                          localMockComments[selectedTicketForModal.id].map(comment => (
                            <div key={comment.id} className="bg-[#0f172a] border border-white/5 p-4 rounded-xl flex space-x-3">
                              <img src={comment.user?.profilePicture} alt="User" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800" />
                              <div>
                                <div className="flex items-baseline space-x-2 mb-1"><span className="font-semibold text-sm text-slate-200">{comment.user?.username}</span><span className="text-xs text-slate-500">{new Date(parseInt(comment.date)).toLocaleString()}</span></div>
                                <p className="text-sm text-slate-300">{comment.comment_text}</p>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                  <div className="p-4 border-t border-white/5 bg-[#0b1120]">
                    <div className="flex items-start space-x-3">
                      <img src={user.avatar} alt="You" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800 shrink-0" />
                      <div className="flex-1 relative">
                        <textarea value={commentText} onChange={(e) => setCommentText(e.target.value)} placeholder="Write a comment or status update..." className="w-full bg-[#050814] border border-slate-700/60 rounded-xl px-4 py-3 pr-12 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-16" />
                        <button onClick={handleSendComment} disabled={!commentText.trim()} className="absolute right-2 bottom-2 p-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg></button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <nav className="relative z-30 bg-[#0b1120] border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button className="text-slate-400 hover:text-white transition-colors"><Bell className="h-5 w-5" /></button>
                    <div className="h-8 w-8 rounded-full bg-[#0f172a] flex items-center justify-center overflow-hidden border border-white/10 cursor-pointer"><img src={user.avatar} alt={user.name} className="h-full w-full object-cover" /></div>
                    <button onClick={handleLogout} className="flex items-center text-sm font-medium text-slate-400 hover:text-white transition-colors"><LogOut className="h-4 w-4 mr-1" /> Sign out</button>
                  </div>
                </div>
              </div>
            </nav>

            {mappedWorkflows.length === 0 ? (
              <main className="relative z-25 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#0f172a] mb-6 border border-white/5 shadow-inner"><SpiderNetworkIcon className="h-8 w-8 text-indigo-400 animate-pulse" /></div>
                  <h1 className="text-3xl font-bold text-white tracking-tight">Welcome to Weaver, {user.name.split(' ')[0]}!</h1>
                  <p className="text-slate-400 mt-3 text-lg max-w-xl mx-auto">Before we build your dashboard, let's connect your task tracking system to pull in your assignments.</p>
                </div>
                {integrationUI}
              </main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-in fade-in duration-500">
                
                {/* Connection Path Overlay */}
                <div className="mb-6 bg-[#0b1120] p-4 rounded-2xl border border-indigo-500/30 shadow-lg flex flex-col lg:flex-row lg:items-center justify-between gap-4 relative z-[80] animate-in slide-in-from-top-4">
                  <div className="flex items-center gap-3 w-full min-w-0">
                    <div className="bg-[#0f172a] p-2 rounded-lg border border-indigo-500/30 shadow-inner hidden sm:block shrink-0"><SpiderNetworkIcon className="h-5 w-5 text-indigo-400" /></div>
                    <div className="flex items-center flex-wrap text-sm text-slate-400 gap-1.5 min-w-0 flex-1">
                      <span className="flex items-center shrink-0"><Box className="h-4 w-4 mr-1.5 text-slate-500" /><span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].team}</span></span><ChevronRight className="h-4 w-4 text-slate-600" />
                      <span className="flex items-center shrink-0"><span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].space}</span></span>
                      {mappedWorkflows[0].folder !== 'No Folder' && (<><ChevronRight className="h-4 w-4 text-slate-600" /><span className="flex items-center shrink-0"><FolderOpen className="h-4 w-4 mr-1.5 text-slate-500" /><span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].folder}</span></span></>)}
                      <ChevronRight className="h-4 w-4 text-slate-600" />
                      <span className="font-bold text-indigo-300 flex items-center bg-[#0f172a] px-2.5 py-0.5 rounded-md border border-indigo-500/20 shadow-sm shrink-0"><ListTodo className="h-4 w-4 mr-1.5" /><span className="truncate">{mappedWorkflows[0].list}</span></span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                     <button onClick={() => { setIsSwitchModalOpen(true); handleConnectClickUp(); }} className="flex items-center px-4 py-2 bg-[#0f172a] hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition-colors border border-white/10 shadow-sm"><RefreshCw className="h-3.5 w-3.5 mr-2 text-indigo-400" /> Switch Connection</button>
                     <button onClick={() => removeMapping(mappedWorkflows[0].id)} className="flex items-center justify-center p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors border border-red-500/20"><LogOut className="h-4 w-4" /></button>
                  </div>
                </div>

                {/* Header */}
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 relative z-20">
                  <div>
                    <h1 className="text-3xl font-extrabold text-white flex items-center gap-4 mb-1">
                      Sprint 18
                      <div className={`flex items-center px-2.5 py-1 rounded-full border text-[10px] font-bold uppercase tracking-widest shadow-sm ${isAutoSyncing ? 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'}`}>
                        {isAutoSyncing ? <RefreshCw className="h-3 w-3 mr-1.5 animate-spin" /> : <div className="h-1.5 w-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></div>}
                        {isAutoSyncing ? 'Syncing...' : `Synced: ${new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(mappedWorkflows[0].lastSynced))}`}
                      </div>
                    </h1>
                    <p className="text-slate-400 text-sm">Dashboard metrics are dynamically synced and globally filtered.</p>
                  </div>
                  
                  <div className="flex items-center space-x-3 bg-[#0b1120] p-2 rounded-xl border border-white/5">
                    <span className="text-sm text-slate-400 font-medium pl-2 flex items-center"><svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 00-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg> Global Filter:</span>
                    <select value={completionFilterType} onChange={(e) => { setCompletionFilterType(e.target.value); if (e.target.value === 'tags' && uniqueTags.length > 0) setSelectedTagFilter(uniqueTags[0]); if (e.target.value === 'assignees' && uniqueAssignees.length > 0) setSelectedAssigneeFilter(uniqueAssignees[0]); }} className="border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-[#0f172a] shadow-sm">
                      <option value="none">All Data</option>
                      <option value="tags">By Tag</option>
                      <option value="assignees">By Assignee</option>
                    </select>

                    {completionFilterType === 'tags' && (
                      <select value={selectedTagFilter} onChange={(e) => setSelectedTagFilter(e.target.value)} className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-[#0f172a] shadow-sm">
                        {uniqueTags.length === 0 && <option value="">No tags found</option>}
                        {uniqueTags.map(tag => <option key={tag} value={tag}>{tag}</option>)}
                      </select>
                    )}
                    {completionFilterType === 'assignees' && (
                      <select value={selectedAssigneeFilter} onChange={(e) => setSelectedAssigneeFilter(e.target.value)} className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-[#0f172a] shadow-sm">
                        {uniqueAssignees.length === 0 && <option value="">No assignees found</option>}
                        {uniqueAssignees.map(a => <option key={a} value={a}>{a}</option>)}
                      </select>
                    )}
                  </div>
                </div>

                {/* Metrics Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                  <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-[#0f172a] p-3 rounded-lg border border-blue-500/20 shrink-0"><Box className="h-6 w-6 text-blue-400" /></div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1"><p className="text-sm font-medium text-slate-400">Backlog</p><InfoIcon className="h-3 w-3 text-slate-600" /></div>
                        <p className="text-4xl font-extrabold text-white mt-1 tracking-tight">{backlogTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Main</span><span className="text-sm font-bold text-slate-200">{backlogBreakdown.mothers}</span></div>
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Sub</span><span className="text-sm font-bold text-slate-200">{backlogBreakdown.subs}</span></div>
                    </div>
                  </div>

                  <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-[#0f172a] p-3 rounded-lg border border-indigo-500/20 shrink-0"><CheckSquare className="h-6 w-6 text-indigo-400" /></div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1"><p className="text-sm font-medium text-slate-400">Active Tasks</p><InfoIcon className="h-3 w-3 text-slate-600" /></div>
                        <p className="text-4xl font-extrabold text-white mt-1 tracking-tight">{activeTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Main</span><span className="text-sm font-bold text-slate-200">{activeBreakdown.mothers}</span></div>
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Sub</span><span className="text-sm font-bold text-slate-200">{activeBreakdown.subs}</span></div>
                    </div>
                  </div>

                  <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-[#0f172a] p-3 rounded-lg border border-emerald-500/20 shrink-0"><CheckCircle2 className="h-6 w-6 text-emerald-400" /></div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1"><p className="text-sm font-medium text-slate-400">Total Resolved</p><InfoIcon className="h-3 w-3 text-slate-600" /></div>
                        <p className="text-4xl font-extrabold text-white mt-1 tracking-tight">{completedFilteredTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Main</span><span className="text-sm font-bold text-slate-200">{completedBreakdown.mothers}</span></div>
                      <div className="bg-[#0f172a] border border-white/5 rounded-lg px-3 py-1 flex items-center justify-between min-w-[80px]"><span className="text-[10px] font-bold text-slate-500 uppercase mr-3">Sub</span><span className="text-sm font-bold text-slate-200">{completedBreakdown.subs}</span></div>
                    </div>
                  </div>
                </div>

                {/* Progress / Burndown */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                  <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex flex-col justify-between">
                    <div>
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                        <div>
                          <div className="flex items-center space-x-2 mb-1"><Target className="h-5 w-5 text-indigo-400" /><h2 className="text-lg font-bold text-white">Overall Progress <InfoIcon className="inline h-4 w-4 ml-1 text-slate-600" /></h2></div>
                          <p className="text-sm text-slate-400">Aggregated progress across all active mapped items.</p>
                        </div>
                      </div>
                      
                      <div className="flex items-end justify-between mb-4">
                        <span className="text-6xl font-extrabold text-white leading-none">{completionPercentage}%</span>
                        <div className="flex flex-col items-end space-y-1.5">
                          <div className="flex items-center text-xs text-slate-300 bg-[#0f172a] px-2.5 py-1 rounded-md border border-white/5"><CheckCircle2 className="h-3.5 w-3.5 mr-1.5 text-emerald-400" /><span className="font-bold text-white mr-1">{completedFilteredTasksCount}</span> / {totalFilteredCount} Items</div>
                          <div className="flex items-center text-xs text-slate-300 bg-[#0f172a] px-2.5 py-1 rounded-md border border-white/5"><Clock className="h-3.5 w-3.5 mr-1.5 text-indigo-400" /><span className="font-bold text-white mr-1">{totalSpentHours}h</span> / {totalEstHours}h Logged</div>
                        </div>
                      </div>
                      
                      <div className="w-full bg-[#050814] border border-white/5 rounded-full h-4 overflow-hidden mb-2 shadow-inner">
                        <div className="bg-gradient-to-r from-indigo-500 to-violet-500 h-4 rounded-full transition-all duration-1000 shadow-[0_0_12px_rgba(99,102,241,0.4)]" style={{ width: `${completionPercentage}%` }}></div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                      <div>
                        <div className="flex items-center space-x-2 mb-1"><TrendingDown className="h-5 w-5 text-indigo-400" /><h2 className="text-lg font-bold text-white">Sprint Burndown <InfoIcon className="inline h-4 w-4 ml-1 text-slate-600" /></h2></div>
                        <p className="text-sm text-slate-400">Tracking actual time remaining over scheduled timeline.</p>
                      </div>
                      <div className="flex flex-row sm:flex-col gap-4 sm:gap-1.5 text-sm bg-[#0f172a] px-3 py-2 rounded-lg border border-white/5 shrink-0">
                        <div className="flex items-center text-slate-400 font-medium"><div className="w-4 h-0 border-t-2 border-dashed border-slate-500 mr-2"></div> Ideal Effort</div>
                        <div className="flex items-center text-slate-400 font-medium"><div className="w-3 h-3 bg-indigo-500 rounded-full mr-2 shadow-indigo-500/50"></div> Remaining Time</div>
                      </div>
                    </div>
                    
                    <div className="relative h-48 w-full">
                      <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                        <span>{totalEstHours}h</span><span>{Math.round(totalEstHours * 0.75)}h</span><span>{Math.round(totalEstHours * 0.5)}h</span><span>{Math.round(totalEstHours * 0.25)}h</span><span>0h</span>
                      </div>
                      <div className="absolute left-10 right-2 top-2 bottom-6">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                          <defs><linearGradient id="bdg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#6366f1" stopOpacity="0.2" /><stop offset="100%" stopColor="#6366f1" stopOpacity="0" /></linearGradient></defs>
                          <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="0" x2="100" y2="100" stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" />
                          <polygon points={polygonPointsString} fill="url(#bdg)" />
                          <polyline points={linePointsString} fill="none" stroke="#6366f1" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
                        </svg>
                      </div>
                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                        <span className="-ml-3">{dayLabels[0]}</span><span>{dayLabels[1]}</span><span>{dayLabels[2]}</span><span className="-mr-4">{dayLabels[3]}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Utilization Breakdown */}
                <div className="mb-8">
                  <div className="flex items-center space-x-2 mb-4"><Activity className="h-5 w-5 text-indigo-400 shrink-0" /><h2 className="text-lg font-bold text-white">Utilization Breakdown</h2></div>
                  
                  <div className="bg-[#0b1120] rounded-2xl border border-white/5 shadow-xl">
                    <div className="p-6 md:p-8 flex flex-col lg:flex-row gap-8 lg:gap-12">
                      <div className="flex-shrink-0 lg:w-1/3 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-white/10 pb-6 lg:pb-0 lg:pr-8">
                        <div className="flex items-center space-x-3 mb-3">
                          <div className="bg-[#0f172a] p-2.5 rounded-lg border border-indigo-500/20 shrink-0"><Target className="h-6 w-6 text-indigo-400" /></div>
                          <h3 className="text-lg font-bold text-white flex items-center gap-2">Bucket Utilization <InfoIcon className="h-4 w-4 text-slate-600" /></h3>
                        </div>
                        <p className="text-sm text-slate-400 mb-5 leading-relaxed">Measures the total demand of your planned scope against the capacity of your tagged Developer resources.</p>
                        <div className="flex items-end mb-2"><span className="text-7xl font-extrabold text-white tracking-tight leading-none">{bucketUtilizationPct}%</span></div>
                        <div className="w-full bg-[#050814] border border-white/5 rounded-full h-3 overflow-hidden shadow-inner mt-2 mb-8">
                          <div className={`h-full rounded-full transition-all duration-1000 ${bucketUtilizationPct > 100 ? 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.4)]' : 'bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.4)]'}`} style={{ width: `${Math.min(bucketUtilizationPct, 100)}%` }}></div>
                        </div>

                        <div className="space-y-4">
                          <div>
                             <div className="flex justify-between items-center mb-1.5"><span className="text-xs font-medium text-slate-400">Developer Util (80% Demand) <InfoIcon className="inline h-3 w-3 text-slate-600" /></span><span className="text-xs font-bold text-white">{devUtilPct}%</span></div>
                             <div className="w-full bg-[#050814] border border-white/5 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all ${devUtilPct > 100 ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(devUtilPct, 100)}%` }}></div></div>
                          </div>
                          <div>
                             <div className="flex justify-between items-center mb-1.5"><span className="text-xs font-medium text-slate-400">QA Util (20% Demand) <InfoIcon className="inline h-3 w-3 text-slate-600" /></span><span className="text-xs font-bold text-white">{qaUtilPct}%</span></div>
                             <div className="w-full bg-[#050814] border border-white/5 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all ${qaUtilPct > 100 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(qaUtilPct, 100)}%` }}></div></div>
                          </div>
                        </div>
                      </div>

                      <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-8">
                        <div className="space-y-4">
                          <div className="flex items-center justify-between">
                            <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">Capacity Limits <InfoIcon className="h-4 w-4 text-slate-600" /></h4>
                            <button onClick={() => setIsBlockerModalOpen(true)} className="p-1.5 rounded-lg bg-[#0f172a] hover:bg-slate-800 text-slate-400 border border-white/5 transition-all shadow-sm"><Settings className="w-4 h-4" /></button>
                          </div>
                          <div className="grid grid-cols-1 gap-3">
                            <div className="bg-[#0f172a] p-3.5 rounded-xl border border-white/5 flex items-center justify-between"><div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-blue-400" /><span className="text-sm font-medium">Developers</span></div><span className="text-lg font-bold text-white">{devCount}</span></div>
                            <div className="bg-[#0f172a] p-3.5 rounded-xl border border-white/5 flex items-center justify-between"><div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-emerald-400" /><span className="text-sm font-medium">QA Resources</span></div><span className="text-lg font-bold text-white">{qaCount}</span></div>
                            <div className="bg-[#0f172a] p-3.5 rounded-xl border border-white/5 flex items-center justify-between"><div className="flex items-center text-slate-300"><Calendar className="w-4 h-4 mr-2 text-sky-400" /><span className="text-sm font-medium">Sprint Days</span></div><span className="text-lg font-bold text-white">{bucketDurationDays}</span></div>
                          </div>
                        </div>

                        <div className="space-y-4">
                          <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">Scope (Main Tasks) <InfoIcon className="h-4 w-4 text-slate-600" /></h4>
                          <div className="space-y-3">
                            <div className="bg-[#0f172a] p-3 rounded-xl border border-white/5 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-slate-300 flex items-center font-medium"><Box className="w-3.5 h-3.5 mr-1.5 text-slate-500"/> Plotted</span><span className="text-sm font-bold text-white">{plottedScopeCount}</span></div>
                              <div className="text-xs text-slate-500 text-right">{plottedScopeEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-emerald-950/20 p-3 rounded-xl border border-emerald-500/10 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-emerald-200 flex items-center font-medium"><CheckCircle2 className="w-3.5 h-3.5 mr-1.5 text-emerald-400"/> Completed</span><span className="text-sm font-bold text-white">{completedMotherCount}</span></div>
                              <div className="text-xs text-emerald-500/70 text-right">{completedMotherEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-amber-950/20 p-3 rounded-xl border border-amber-500/10 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-amber-200 flex items-center font-medium"><ClockAlert className="w-3.5 h-3.5 mr-1.5 text-amber-400"/> Spill Over</span><span className="text-sm font-bold text-white">{spillOverCount}</span></div>
                              <div className="text-xs text-amber-500/70 text-right">{spillOverEstHours} Est. Hours</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Est. Accuracy */}
                <div className="bg-[#0b1120] rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="p-6 md:p-8 flex flex-col md:flex-row md:items-center gap-8 lg:gap-12">
                    <div className="flex-shrink-0 md:w-1/3">
                      <div className="flex items-center flex-wrap space-x-3 mb-3">
                        <div className="bg-[#0f172a] p-2.5 rounded-lg border border-purple-500/20 shrink-0"><Target className="h-6 w-6 text-purple-400" /></div>
                        <h2 className="text-lg font-bold text-white flex items-center flex-wrap gap-2">Est. Accuracy <InfoIcon className="h-4 w-4 text-slate-600" /></h2>
                      </div>
                      <p className="text-sm text-slate-400 mb-5 leading-relaxed">Measures how closely the initial time estimates match the actual duration it takes to complete tasks.</p>
                      <div className="flex items-end"><span className="text-6xl font-extrabold text-white tracking-tight leading-none">{estimationAccuracyDisplay}</span></div>
                    </div>
                    <div className="flex-1 border-t md:border-t-0 md:border-l border-white/10 pt-6 md:pt-0 md:pl-8 lg:pl-12">
                      <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">Average Time in Status <InfoIcon className="h-4 w-4 text-slate-600" /></h3>
                      {avgTimeInStatusList.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                          {avgTimeInStatusList.map(stat => (
                            <div key={stat.status} className="flex justify-between items-center text-sm p-3 bg-[#0f172a] rounded-xl border border-white/5">
                              <span className="text-slate-300 capitalize font-medium">{stat.status}</span>
                              <span className="text-indigo-300 font-mono font-bold bg-indigo-500/10 px-2 py-1 rounded-md border border-indigo-500/20">{stat.timeDisplay}</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="text-sm text-slate-500 italic p-6 bg-[#0f172a] rounded-xl border border-white/5 text-center">No status timing data is available for completed tasks yet.</div>
                      )}
                    </div>
                  </div>
                </div>

                {/* Team Workload & Roles */}
                {assigneesList.length > 0 && (
                  <div className="mb-8">
                    <div className="flex items-center flex-wrap space-x-2 mb-4"><Users className="h-5 w-5 text-indigo-400 shrink-0" /><h2 className="text-lg font-bold text-white">Team Workload & Roles <InfoIcon className="inline h-4 w-4 text-slate-600 ml-1" /></h2></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {assigneesList.map(assignee => {
                        const estHours = Math.round(assignee.totalEstMs / 3600000);
                        const spentHours = Math.round(assignee.totalSpentMs / 3600000);
                        const progressPct = estHours > 0 ? Math.min(100, Math.round((spentHours / estHours) * 100)) : (spentHours > 0 ? 100 : 0);
                        const totalTasksAssigned = Object.values(assignee.statusCounts).reduce((sum, s) => sum + s.count, 0);

                        return (
                          <div key={assignee.username} className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex flex-col justify-between">
                            <div>
                              <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center space-x-3">
                                  <div className="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center font-bold text-slate-900 bg-[#c4f1a4]" style={{ backgroundColor: (assignee.profilePicture || '').includes('ui-avatars') ? assignee.profilePicture.split('background=')[1]?.substring(0,6) ? `#${assignee.profilePicture.split('background=')[1]?.substring(0,6)}` : '#c4f1a4' : 'transparent', backgroundImage: (assignee.profilePicture || '').includes('ui-avatars') ? 'none' : `url(${assignee.profilePicture})`, backgroundSize: 'cover' }}>
                                      {(!assignee.profilePicture || (assignee.profilePicture || '').includes('ui-avatars')) && (assignee.username || 'U').substring(0,2).toUpperCase()}
                                  </div>
                                  <div>
                                    <h3 className="text-md font-bold text-white">{assignee.username}</h3>
                                    <p className="text-xs text-slate-400">{totalTasksAssigned} Assigned Item{totalTasksAssigned !== 1 ? 's' : ''}</p>
                                  </div>
                                </div>
                                <select
                                  value={userRoles[assignee.username] || 'Developer'}
                                  onChange={(e) => { const val = e.target.value; setUserRoles(prev => { const nextRoles = {...prev, [assignee.username]: val}; saveSettings({ userRoles: nextRoles }); return nextRoles; }); }}
                                  className="bg-[#0f172a] border border-white/10 text-indigo-300 text-[10px] font-bold tracking-widest uppercase rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer"
                                >
                                  <option value="Developer">DEVELOPER</option>
                                  <option value="QA">QA</option>
                                </select>
                              </div>
                              
                              <div className="flex flex-wrap gap-2 mb-6">
                                {Object.entries(assignee.statusCounts).map(([status, {count, color}]) => (
                                  <span key={status} className="px-2.5 py-1 text-[10px] font-bold rounded-md capitalize border flex items-center" style={{ color: color, backgroundColor: `${color}10`, borderColor: `${color}20` }}>
                                    {status} <span className="ml-1.5 opacity-60">{count}</span>
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div>
                              <div className="flex justify-between text-xs mb-1.5 font-medium">
                                <span className="text-slate-400 flex items-center"><Clock className="h-3 w-3 mr-1" /> Logged Time</span>
                                <span className="text-white font-bold">{spentHours}h <span className="text-slate-500 font-medium">/ {estHours}h</span></span>
                              </div>
                              <div className="w-full bg-[#050814] border border-white/5 rounded-full h-1.5 overflow-hidden shadow-inner">
                                <div className="bg-indigo-500 h-full rounded-full transition-all duration-1000" style={{ width: `${progressPct}%`, boxShadow: `0 0 8px rgba(99,102,241,0.5)` }}></div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Bug Tracking */}
                {totalBugsCount > 0 && (
                  <div className="mb-8">
                    <div className="flex items-center space-x-2 mb-4"><Bug className="h-5 w-5 text-rose-400 shrink-0" /><h2 className="text-lg font-bold text-white">Quality & Defects</h2></div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 lg:gap-6">
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                        <div className="bg-[#0f172a] p-3 rounded-lg border border-purple-500/20 shrink-0"><Target className="h-6 w-6 text-purple-400" /></div>
                        <div><div className="flex items-center gap-1.5 mb-1"><p className="text-sm font-bold text-slate-400">Avg Quality Rate</p><InfoIcon className="h-3 w-3 text-slate-600" /></div><p className="text-3xl font-extrabold text-white mt-1">{avgQualityRate}%</p></div>
                      </div>
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                        <div className="bg-[#0f172a] p-3 rounded-lg border border-rose-500/20 shrink-0"><Bug className="h-6 w-6 text-rose-400" /></div>
                        <div><div className="flex items-center gap-1.5 mb-1"><p className="text-sm font-bold text-slate-400">Active Defects</p><InfoIcon className="h-3 w-3 text-slate-600" /></div><p className="text-3xl font-extrabold text-white mt-1">{activeBugsCount}</p></div>
                      </div>
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                        <div className="bg-[#0f172a] p-3 rounded-lg border border-orange-500/20 shrink-0"><ShieldAlert className="h-6 w-6 text-orange-400" /></div>
                        <div><div className="flex items-center gap-1.5 mb-1"><p className="text-sm font-bold text-slate-400">High/Critical</p><InfoIcon className="h-3 w-3 text-slate-600" /></div><p className="text-3xl font-extrabold text-white mt-1">{criticalBugsCount}</p></div>
                      </div>
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                        <div className="bg-[#0f172a] p-3 rounded-lg border border-emerald-500/20 shrink-0"><Activity className="h-6 w-6 text-emerald-400" /></div>
                        <div><div className="flex items-center gap-1.5 mb-1"><p className="text-sm font-bold text-slate-400">Resolution Rate</p><InfoIcon className="h-3 w-3 text-slate-600" /></div><p className="text-3xl font-extrabold text-white mt-1">{bugResolutionRate}%</p></div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Stalled Tasks */}
                <div className="w-full space-y-6 mb-8">
                  <div className="bg-[#0b1120] rounded-2xl border border-white/5 shadow-xl">
                    <div className="px-5 py-4 border-b border-white/5 bg-[#0f172a] flex items-center justify-between rounded-t-2xl">
                      <div className="flex items-center space-x-2"><ClockAlert className="h-5 w-5 text-amber-400" /><h2 className="text-lg font-bold text-white flex items-center gap-2">Needs Attention <InfoIcon className="h-4 w-4 text-slate-600" /></h2></div>
                      <span className="text-[10px] font-bold text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded uppercase tracking-widest">Stalled</span>
                    </div>
                    {stalledTasks.length > 0 ? (
                      <ul className="divide-y divide-white/5">
                        {stalledTasks.map(task => {
                          const createdDate = task.date_created ? parseInt(task.date_created) : Date.now();
                          const daysOld = Math.floor((Date.now() - createdDate) / 86400000);
                          const estimatedHours = Math.round((parseInt(task.time_estimate) || 0) / 3600000);
                          return (
                            <li key={task.id} onClick={() => setSelectedTicketForModal(task)} className="p-4 hover:bg-white/5 cursor-pointer flex items-center justify-between">
                              <div>
                                <div className="flex items-center space-x-2 mb-1"><div className="w-2 h-2 rounded-full bg-blue-500" /><span className="text-sm font-bold text-slate-200">{task.name}</span></div>
                                <div className="flex items-center text-xs text-slate-500 ml-4"><ClockAlert className="h-3 w-3 mr-1 text-amber-500" /> Elapsed: {daysOld}d / Est: {estimatedHours}h</div>
                              </div>
                              {task.assignees && task.assignees.length > 0 ? (
                                <div className="w-8 h-8 rounded-full flex items-center justify-center font-bold text-slate-900 bg-[#ffb4b4] text-xs" style={{ backgroundImage: (task.assignees[0].profilePicture || '').includes('ui-avatars') ? 'none' : `url(${task.assignees[0].profilePicture})`, backgroundSize: 'cover' }}>
                                    {(!task.assignees[0].profilePicture || (task.assignees[0].profilePicture || '').includes('ui-avatars')) && (task.assignees[0].username || 'U').substring(0,2).toUpperCase()}
                                </div>
                              ) : (<div className="flex items-center justify-center w-8 h-8 rounded-full bg-[#0f172a] text-slate-500"><Users className="h-3 w-3" /></div>)}
                            </li>
                          );
                        })}
                      </ul>
                    ) : (<div className="p-8 text-center text-sm text-slate-500 italic">All tasks are running on schedule.</div>)}
                  </div>
                </div>

                {/* Explorers */}
                <div className="flex flex-col space-y-8 mb-8">
                  <div className="bg-[#0b1120] rounded-2xl border border-white/5 shadow-xl">
                    <div className="px-6 py-4 border-b border-white/5 bg-[#0f172a] rounded-t-2xl"><h2 className="text-lg font-bold text-white flex items-center"><ListTodo className="h-5 w-5 mr-2 text-indigo-400" /> Active Tasks Explorer</h2></div>
                    <div className="divide-y divide-white/5 max-h-[600px] overflow-y-auto">
                      {ledgifiedWorkflows.map(workflow => {
                        const currentTab = workflowTabs[workflow.id] || 'all';
                        const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name?.toLowerCase() || '').includes('qa bugs') && !(t.name?.toLowerCase() || '').includes('ui bugs'));
                        const rootTasksByTags = buildFilteredTree(mainTasksOnly, false);
                        const uniqueStatuses = Array.from(new Set(rootTasksByTags.map(t => t.status?.status || 'Open')));
                        const displayedTasks = rootTasksByTags.filter(task => currentTab === 'all' || (task.status?.status || 'Open') === currentTab);

                        return (
                          <div key={workflow.id} className="p-6">
                            <div className="flex flex-wrap gap-2 mb-4 border-b border-white/5 pb-3">
                              <button onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: 'all' }))} className={`px-3 py-1.5 text-xs font-bold rounded-lg border ${currentTab === 'all' ? 'bg-indigo-600/20 text-indigo-300 border-indigo-500/30' : 'bg-[#0f172a] text-slate-400 border-transparent'}`}>All ({rootTasksByTags.length})</button>
                              {uniqueStatuses.map(status => {
                                const count = rootTasksByTags.filter(t => (t.status?.status || 'Open') === status).length;
                                const statusColor = rootTasksByTags.find(t => (t.status?.status || 'Open') === status)?.status?.color || '#94a3b8';
                                const isSelected = currentTab === status;
                                return (
                                  <button key={status} onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: status }))} className={`px-3 py-1.5 text-xs font-bold rounded-lg flex items-center gap-1.5 capitalize border ${isSelected ? 'bg-[#050814] text-white' : 'bg-[#0f172a] text-slate-400 border-transparent'}`} style={isSelected ? { borderColor: `${statusColor}40` } : {}}>
                                    <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: statusColor }} /> {status} ({count})
                                  </button>
                                );
                              })}
                            </div>
                            {displayedTasks.length > 0 ? (
                              <div className="space-y-3">{displayedTasks.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} onOpenTimeTrackModal={setTimeTrackModalTask} />)}</div>
                            ) : (<div className="text-sm text-slate-500 italic p-4 bg-[#0f172a] rounded-lg text-center border border-white/5">No tasks match this filter.</div>)}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-[#0b1120] rounded-2xl border border-white/5 shadow-xl">
                    <div className="px-6 py-4 border-b border-white/5 bg-[#0f172a] rounded-t-2xl flex justify-between items-center"><h2 className="text-lg font-bold text-white flex items-center"><CheckCircle2 className="h-5 w-5 mr-2 text-emerald-400" /> Completed Tasks Explorer</h2><span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">{completedFilteredTasksCount} Resolved</span></div>
                    <div className="divide-y divide-white/5 max-h-[400px] overflow-y-auto">
                      {ledgifiedWorkflows.map(workflow => {
                        const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name?.toLowerCase() || '').includes('qa bugs') && !(t.name?.toLowerCase() || '').includes('ui bugs'));
                        const completedTasksTree = buildFilteredTree(mainTasksOnly, true);
                        if (completedTasksTree.length === 0) return null;
                        return (
                          <div key={`comp-${workflow.id}`} className="p-6">
                            <div className="space-y-3">{completedTasksTree.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={true} onOpenTimeTrackModal={setTimeTrackModalTask} />)}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

              </main>
            )}
          </div>
        );
      }

      // --- Login View (Rendered when user is NOT logged in) ---
      return (
        <div className="min-h-screen bg-[#050814] flex font-sans relative overflow-hidden">
          {/* Radial overlay to dim corners */}
          <div className="absolute inset-0 pointer-events-none z-10" style={{ background: 'radial-gradient(circle, transparent 30%, rgba(5, 8, 20, 0.8) 100%)' }}></div>

          {/* Left side - Branding/Hero */}
          <div className="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative z-20">
            <div className="max-w-md relative bg-[#0b1120] p-8 rounded-[2rem] border border-white/5 shadow-2xl">
              <div className="flex items-center mb-8">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                  <SpiderNetworkIcon className="h-8 w-8 text-white" />
                </div>
                <span className="ml-3 text-3xl font-extrabold tracking-tight text-white">Weaver</span>
              </div>
              <h1 className="text-4xl font-bold text-white leading-tight mb-6">
                Thread your support and development together.
              </h1>
              <p className="text-lg text-slate-300 mb-8 leading-relaxed font-medium">
                Weaver creates a seamless bridge between your front-line ticketing apps and your back-office task managers. Resolve faster, together.
              </p>
              
              <div className="space-y-4">
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Native syncing with Zendesk & Jira</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Automated task creation from tickets</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Real-time status updates across teams</span>
                </div>
              </div>
            </div>
          </div>

          {/* Right side - Login Form */}
          <div className="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 relative z-20 bg-[#050814] border-l border-white/5 shadow-[-20px_0_50px_rgba(0,0,0,0.5)]">
            <div className="absolute top-8 left-8 flex items-center lg:hidden bg-[#0b1120] px-4 py-2 rounded-2xl shadow-sm border border-white/5">
              <SpiderNetworkIcon className="h-6 w-6 text-indigo-400" />
              <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
            </div>

            <div className="w-full max-w-sm space-y-8 bg-[#0b1120] p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-white/5">
              <div className="text-center lg:text-left">
                <h2 className="text-3xl font-bold text-white tracking-tight">Welcome back</h2>
                <p className="mt-2 text-sm text-slate-400 font-medium">
                  Please sign in to your account to continue.
                </p>
              </div>

              <div className="mt-8 space-y-6">
                <button
                  onClick={handleGoogleLogin}
                  disabled={isLoggingIn}
                  className="w-full flex items-center justify-center px-4 py-3 border border-slate-700/60 shadow-lg bg-[#0f172a] hover:bg-slate-800 text-sm font-medium text-slate-100 hover:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-[#050814] transition-all disabled:opacity-70 disabled:cursor-not-allowed"
                >
                  {isLoggingIn ? (
                    <div className="flex items-center space-x-2">
                      <div className="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                      <span>Connecting...</span>
                    </div>
                  ) : (
                    <>
                      <svg className="h-5 w-5 mr-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                      </svg>
                      Sign in with Google
                    </>
                  )}
                </button>

                <button
                  onClick={handleMockLogin}
                  className="w-full flex items-center justify-center px-4 py-3 border border-indigo-500/30 shadow-lg bg-indigo-500/10 hover:bg-indigo-500/20 text-sm font-medium text-indigo-300 hover:text-indigo-200 rounded-xl focus:outline-none transition-all mt-4"
                >
                  <svg className="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                  Bypass Login (Preview Mode)
                </button>

                {errorMessage && (
                  <div className="mt-4 p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300 flex items-start">
                    <AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" />
                    <p className="font-medium">{errorMessage}</p>
                  </div>
                )}

                <p className="text-center text-xs text-slate-500 mt-8">
                  By clicking continue, you agree to our{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">Terms of Service</a>
                  {' '}and{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">Privacy Policy</a>.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
