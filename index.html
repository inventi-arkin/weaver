    // --- Metric Tooltip Component ---
    const MetricTooltip = ({ text, formula, align = 'center', children }) => {

            )}

          </div>
        </div>
      );
    };

    // --- Helper to parse flat ClickUp API arrays into a nested tree ---
    const buildTaskTree = (flatTasks) => {
      const taskMap = {};
      const roots = [];

      flatTasks.forEach(task => {
        taskMap[task.id] = { ...task, subtasks: [] };
      });

      flatTasks.forEach(task => {
        const parentId = task.parent;
        if (parentId && taskMap[parentId]) {
          taskMap[parentId].subtasks.push(taskMap[task.id]);
        } else {
          roots.push(taskMap[task.id]);
        }
      });

      return roots;
    };

    // Flatten all tasks and their children into a single array
    const flattenTasks = (tasks) => {
      return tasks.reduce((acc, task) => {
        acc.push(task);
        if (task.subtasks) {
          acc.push(...flattenTasks(task.subtasks));
        }
        return acc;
      }, []);
    };

    // Helper to specifically extract QA, UI, and Bug tasks from the tree
    const extractBugs = (tasks, inBugContext = false) => {
      let bugs = [];
      tasks.forEach(t => {
          const taskNameLower = t.name.toLowerCase();
          // Flag as a bug container if it mentions QA Bugs or UI Bugs
          const isBugContainer = taskNameLower.includes('qa bugs') || taskNameLower.includes('ui bugs');
          const isContext = inBugContext || isBugContainer;
          
          const hasBugTag = t.tags?.some(tag => ['bug', 'defect'].includes(tag.name.toLowerCase()));
          
          // Add task if it's inside a bug container (but isn't the container itself) or has a bug tag
          if ((isContext && !isBugContainer) || hasBugTag) {
              if (!bugs.find(b => b.id === t.id)) {
                  bugs.push(t);
              }
          }
          
          if (t.subtasks && t.subtasks.length > 0) {
              bugs.push(...extractBugs(t.subtasks, isContext));
          }
      });
      return bugs;
    };

    // HTML5 Canvas Web Nest background
    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initializeWebs();
        };
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];

          const webConfigs = [
            { cx: width * 0.28, cy: height * 0.5, radius: Math.min(width, height) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: width * 0.72, cy: height * 0.42, radius: Math.min(width, height) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];

            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });

            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                const x = cx + Math.cos(angle) * currentRadius;
                const y = cy + Math.sin(angle) * currentRadius;
                nodes.push({
                  id: nodes.length,
                  x,
                  y,
                  spoke: s,
                  ring: r,
                  isHub: false
                });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });

            spiders.push({
              webIdx,
              currentNode: nodes[Math.floor(Math.random() * nodes.length)],
              targetNode: null,
              progress: 0,
              speed: 0.006 + Math.random() * 0.004,
              x: cx,
              y: cy,
              size: 7 + webIdx * 3,
              legCycle: 0,
              wovenPaths: []
            });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({
            webIdx,
            from: edge.from,
            to: edge.to,
            progress: 0,
            speed: 0.015 + Math.random() * 0.02,
            size: 1.5 + Math.random() * 1.5
          });
        };

        const animate = () => {
          ctx.clearRect(0, 0, width, height);

          webs.forEach(web => {
            const { nodes, edges, color } = web;
            edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });

            nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, 0.25)`;
              ctx.fill();

              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 7 : 4) + pulse, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, 0.05)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) {
            spawnPacket();
          }

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) {
              packets.splice(idx, 1);
              return;
            }

            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            const color = webs[packet.webIdx].color;

            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color}, 0.6)`;
            ctx.shadowColor = `rgb(${color})`;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];

            if (!spider.targetNode) {
              const neighbors = web.edges
                .filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id)
                .map(e => e.from.id === spider.currentNode.id ? e.to : e.from);

              if (neighbors.length > 0) {
                spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)];
                spider.progress = 0;
              }
            }

            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;

              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;

              if (spider.progress >= 1) {
                spider.wovenPaths.push({
                  from: spider.currentNode,
                  to: spider.targetNode,
                  alpha: 1.0,
                  time: Date.now()
                });

                if (spider.wovenPaths.length > 12) {
                  spider.wovenPaths.shift();
                }

                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }

            spider.wovenPaths.forEach((path, pathIdx) => {
              const age = Date.now() - path.time;
              path.alpha = Math.max(0, 1.0 - age / 7000);

              if (path.alpha > 0) {
                ctx.beginPath();
                ctx.moveTo(path.from.x, path.from.y);
                ctx.lineTo(path.to.x, path.to.y);
                ctx.strokeStyle = `rgba(${web.color}, ${path.alpha * 0.35})`;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = `rgb(${web.color})`;
                ctx.shadowBlur = 8 * path.alpha;
                ctx.stroke();
                ctx.shadowBlur = 0;
              } else {
                spider.wovenPaths.splice(pathIdx, 1);
              }
            });

            let angle = 0;
            if (spider.targetNode) {
              angle = Math.atan2(spider.targetNode.y - spider.currentNode.y, spider.targetNode.x - spider.currentNode.x);
            }

            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.rotate(angle);

            const spiderColor = `rgb(${web.color})`;
            const legCount = 8;
            for (let i = 0; i < legCount; i++) {
              const side = i < 4 ? -1 : 1;
              const legIdx = i % 4;
              const offset = legIdx * 0.6;
              const cycle = Math.sin(spider.legCycle + offset) * 0.3;

              let angleOffset = 0;
              let legLength = spider.size * 1.7;

              switch (legIdx) {
                case 0: angleOffset = -Math.PI / 3; break;
                case 1: angleOffset = -Math.PI / 8; break;
                case 2: angleOffset = Math.PI / 8; break;
                case 3: angleOffset = Math.PI / 3; break;
              }

              const targetAngle = (angleOffset + cycle) * side;
              const kx1 = Math.cos(targetAngle) * (legLength * 0.5);
              const ky1 = Math.sin(targetAngle) * (legLength * 0.5) * side;

              const kx2 = Math.cos(targetAngle - 0.2 * side) * legLength;
              const ky2 = Math.sin(targetAngle - 0.2 * side) * legLength * side;

              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(kx1, ky1, kx2, ky2);
              ctx.strokeStyle = `rgba(${web.color}, 0.55)`;
              ctx.lineWidth = 1.2;
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(kx2, ky2, 1, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${web.color}, 0.8)`;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.moveTo(-spider.size, 0);
            ctx.lineTo(-spider.size * 2, 0);
            ctx.strokeStyle = `rgba(${web.color}, 0.35)`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(-spider.size * 0.4, 0, spider.size * 0.6, spider.size * 0.45, 0, 0, Math.PI * 2);
            ctx.fillStyle = spiderColor;
            ctx.shadowColor = spiderColor;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(spider.size * 0.35, 0, spider.size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${web.color})`;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(spider.size * 0.55, -spider.size * 0.1, 0.8, 0, Math.PI * 2);
            ctx.arc(spider.size * 0.55, spider.size * 0.1, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 3;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 w-full h-full block z-0 transition-opacity duration-1000" style={{ opacity }} />;
    };

    // --- Recursive Task & Subtask Item Component ---
    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false }) => {
      const relevantSubtasks = (task.subtasks || []).filter(sub => {
        const isDone = ['closed', 'complete', 'done', 'resolved'].includes(sub.status?.status?.toLowerCase());
        return isDoneMode ? isDone : !isDone;
      });
      const hasSubtasks = relevantSubtasks.length > 0;
      const isExpanded = !!expandedTasks[task.id];
      const isParent = depth === 0;

      const themeColor = task.status?.color || '#38bdf8';
      const isDoneStatus = ['closed', 'complete', 'done', 'resolved'].includes(task.status?.status?.toLowerCase());
      
      const estimateMs = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const spentMs = task.time_spent ? parseInt(task.time_spent) : (isDoneStatus ? estimateMs : 0);
      const hasTimeData = estimateMs > 0 || spentMs > 0;
      const displayHours = hasTimeData ? `${Math.round(spentMs / 3600000)}h / ${Math.round(estimateMs / 3600000)}h` : null;
      
      return (
        <div className={`transition-all overflow-hidden ${
          isParent 
            ? 'bg-slate-950/30 border border-white/5 rounded-xl shadow-inner hover:border-indigo-500/20'

                <button 
                  onClick={() => toggleTaskExpand(task.id)}
                  className="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-indigo-500/10 hover:bg-indigo-500/20 text-[10px] text-indigo-300 font-bold border border-indigo-500/20 transition-colors shrink-0"

                <div className="flex items-center text-xs text-slate-400 whitespace-nowrap shrink-0" title="Tracked Time">
                  <Clock className="h-3.5 w-3.5 mr-1.5 text-slate-500" />
                  {displayHours}
                </div>
              )}

              {/* Dynamic Status Text Badge */}
              <span 
                className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border shrink-0"
                style={{ 
                  color: themeColor, 
                  backgroundColor: `${themeColor}15`, 
                  borderColor: `${themeColor}30` 
                }}
              >
                {task.status?.status || 'Open'}
              </span>

              {/* Render Tags */}
              {isParent && task.tags && task.tags.length > 0 && (
                <div className="flex items-center space-x-1 mr-2 hidden sm:flex shrink-0">
                  <Tag className="h-3 w-3 text-slate-500 mr-1" />
                  {task.tags.map((tag, i) => {

                    return (
                      <span 
                        key={i} 
                        className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap"
                        style={{ color: tagColor, backgroundColor: `${tagColor}15`, border: `1px solid ${tagColor}30` }}
                      >
                        {tag.name}
                      </span>
                    )
                  })}
                </div>
              )}

              {/* Due Date */}
              {task.due_date && (
                <div className="flex items-center text-xs text-slate-400 whitespace-nowrap shrink-0" title="Due Date">
                  <Calendar className="h-3.5 w-3.5 mr-1.5 text-slate-500" />
                  {new Date(parseInt(task.due_date)).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                </div>
              )}

              {/* Priority */}
              {task.priority && (
                <div className="flex items-center text-xs text-slate-400 capitalize whitespace-nowrap shrink-0" title={`Priority: ${task.priority.priority}`}>
                  <Flag className="h-3.5 w-3.5 mr-1.5" style={{ color: task.priority.color }} />
                  {task.priority.priority}
                </div>
              )}

              {/* Assignees */}
              {isParent && (
                task.assignees && task.assignees.length > 0 ? (
                  <div className="flex -space-x-1.5 shrink-0">

                    <Users className="h-3 w-3" />

                )
              )}
            </div>
          </div>

          {/* Recursive Nested Subtasks Container */}
          {isExpanded && hasSubtasks && (
            <div className="bg-slate-950/40 border-t border-white/5 p-3 space-y-2 animate-in slide-in-from-top-2 duration-200 ml-4 pl-3 border-l border-dashed border-white/10">

                  key={sub.id} 
                  task={sub} 
                  depth={depth + 1} 
                  expandedTasks={expandedTasks} 
                  toggleTaskExpand={toggleTaskExpand} 
                  isDoneMode={isDoneMode}
                />
              ))}
            </div>
          )}
        </div>
      );
    };

      const toggleTaskExpand = (taskId) => {
        setExpandedTasks(prev => ({
          ...prev,
          [taskId]: !prev[taskId]
        }));
      };

      // Support generic methods including POST for comments
      const fetchClickUp = async (endpoint, token, method = 'GET', body = null) => {
        const targetUrl = `https://api.clickup.com/api/v2/${endpoint}`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://thingproxy.freeboard.io/fetch/${targetUrl}`
        ];

        for (const proxyUrl of proxies) {
          try {
            const fetchOptions = {
              method,
              headers: { 
                'Authorization': token,
                'Content-Type': 'application/json' 
              }
            };
            if (body) {
              fetchOptions.body = JSON.stringify(body);
            }

            const res = await fetch(proxyUrl, fetchOptions);
            if (!res.ok) {
              throw new Error('Invalid Token or unauthorized request. Please verify your token.');
            }
            return await res.json();
          } catch (err) {
            if (err.message === 'Failed to fetch' || err.name === 'TypeError') {
              console.warn(`Proxy failed, trying next backup... (${proxyUrl})`);
              continue;
            }
            throw err;
          }
        }
        throw new Error('Connection blocked. Browsers prevent direct API calls (CORS), and public proxies are being blocked by your network. Please use the Mock Data bypass below to preview the UI.');
      };

      // Send Comment Logic
      const handleSendComment = async () => {
        if (!commentText.trim() || !selectedTicketForModal) return;
        
        const newComment = {
          id: Date.now().toString(),
          comment_text: commentText,
          date: Date.now().toString(),
          user: { username: user.name, profilePicture: user.avatar }
        };

        if (clickUpToken === 'mock_token') {
            // Update UI optimistically for offline preview
            setLocalMockComments(prev => ({
              ...prev,
              [selectedTicketForModal.id]: [...(prev[selectedTicketForModal.id] || []), newComment]
            }));
        } else {
            try {
              // Real ClickUp API Call
              await fetchClickUp(`task/${selectedTicketForModal.id}/comment`, clickUpToken, 'POST', { 
                  comment_text: commentText, 
                  notify_all: true 
              });
              setLocalMockComments(prev => ({
                ...prev,
                [selectedTicketForModal.id]: [...(prev[selectedTicketForModal.id] || []), newComment]
              }));
            } catch (err) {
              console.error("Failed to post comment to ClickUp", err);
              alert("Failed to sync comment with ClickUp. " + err.message);
            }
        }
        setCommentText('');
      };

      useEffect(() => {
        if (user) {
          const savedToken = localStorage.getItem('weaver_clickup_token');
          if (savedToken) {
            const verifyToken = async () => {
              try {
                if (savedToken === 'mock_token') {
                  setTeams(MOCK_CLICKUP_DATA.teams);
                  setClickUpToken(savedToken);
                  return;
                }
                const data = await fetchClickUp('team', savedToken);
                setTeams(data.teams || []);
                setClickUpToken(savedToken);
              } catch (err) {
                console.warn('Saved ClickUp token is invalid or expired. Clearing...');
                localStorage.removeItem('weaver_clickup_token');
                setClickUpToken('');
              }
            };
            verifyToken();
          }
        }
      }, [user]);

      useEffect(() => {
        if (!selectedTeam || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
          setSpaces(MOCK_CLICKUP_DATA.spaces[selectedTeam] || []);
          return;
        }

        const fetchSpaces = async () => {
          try {
            const data = await fetchClickUp(`team/${selectedTeam}/space`, clickUpToken);
            setSpaces(data.spaces || []);
          } catch (err) {
            console.error("Error fetching spaces", err);
            setClickUpError(err.message);
          }
        };
        fetchSpaces();
      }, [selectedTeam, clickUpToken]);

      useEffect(() => {
        if (!selectedSpace || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
          setFolders(MOCK_CLICKUP_DATA.folders[selectedSpace] || []);
          setFolderlessLists(MOCK_CLICKUP_DATA.folderlessLists[selectedSpace] || []);
          return;
        }

        const fetchSpaceData = async () => {
          try {
            const dataFolders = await fetchClickUp(`space/${selectedSpace}/folder`, clickUpToken);
            setFolders(dataFolders.folders || []);

            const dataLists = await fetchClickUp(`space/${selectedSpace}/list`, clickUpToken);
            setFolderlessLists(dataLists.lists || []);
          } catch (err) {
            console.error("Error fetching space data", err);
            setClickUpError(err.message);
          }
        };
        fetchSpaceData();
      }, [selectedSpace, clickUpToken]);

      // Fetch Lists when Folder changes
      useEffect(() => {
        if (!selectedFolder || !clickUpToken) return;
        if (clickUpToken === 'mock_token') {
          setLists(MOCK_CLICKUP_DATA.lists[selectedFolder] || []);
          return;
        }

        const fetchLists = async () => {
          try {
            const data = await fetchClickUp(`folder/${selectedFolder}/list`, clickUpToken);
            setLists(data.lists || []);
          } catch (err) {
            console.error("Error fetching lists", err);
            setClickUpError(err.message);
          }
        };
        fetchLists();
      }, [selectedFolder, clickUpToken]);

      const availableLists = selectedFolder ? lists : folderlessLists;

      const handleConnectClickUp = () => {
        if (clickUpToken && teams.length > 0) {
          setIntegrationStep('selecting');
        } else {
          setIntegrationStep('entering_token');
        }
      };

      const handleAuthenticateToken = async () => {
        if (!tempToken) return;
        setIntegrationStep('connecting');
        setClickUpError(null);
        try {
          const data = await fetchClickUp('team', tempToken);
          setTeams(data.teams || []);
          setClickUpToken(tempToken);
          localStorage.setItem('weaver_clickup_token', tempToken);
          setIntegrationStep('selecting');
        } catch (err) {
          setClickUpError(err.message);
          setIntegrationStep('entering_token');
        }
      };

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;

        setIntegrationStep('connecting');

        const teamName = teams.find(t => t.id === selectedTeam)?.name || 'Workspace';
        const spaceName = spaces.find(s => s.id === selectedSpace)?.name || 'Space';
        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';
        const selectedListObj = availableLists.find(l => l.id === selectedList);
        const listName = selectedListObj?.name || 'Task List';
        const listStartDate = selectedListObj?.start_date || null;
        const listDueDate = selectedListObj?.due_date || null;

        let initialTasks = [];
        if (clickUpToken === 'mock_token') {
          initialTasks = MOCK_CLICKUP_DATA.tasks[selectedList] || [];
        } else {
          try {
            const data = await fetchClickUp(`list/${selectedList}/task?subtasks=true`, clickUpToken);
            initialTasks = buildTaskTree(data.tasks || []);
          } catch (err) {
            console.error("Error fetching tasks for list", err);
          }
        }

        // Replaces the existing workflow to switch the connection
        setMappedWorkflows([{
          id: Date.now().toString(),
          team: teamName,
          space: spaceName,
          folder: folderName,
          list: listName,
          listId: selectedList,
          listStartDate: listStartDate,
          listDueDate: listDueDate,
          tasks: initialTasks,
          lastSynced: Date.now()
        }]);

        setSelectedTeam('');
        setSelectedSpace('');
        setSelectedFolder('');
        setSelectedList('');
        setIntegrationStep('idle');
        setIsSwitchModalOpen(false);
      };

      const removeMapping = (id) => {
        setMappedWorkflows(mappedWorkflows.filter(w => w.id !== id));
      };

      // Simulated Auto-Sync Engine
      useEffect(() => {
        if (mappedWorkflows.length === 0) return;

        const syncInterval = setInterval(async () => {
          setIsAutoSyncing(true);
          const currentWorkflows = mappedWorkflowsRef.current;
          
          const updatedWorkflows = await Promise.all(currentWorkflows.map(async (workflow) => {
            let updatedTasks = workflow.tasks;
            
            if (clickUpToken === 'mock_token') {
              updatedTasks = MOCK_CLICKUP_DATA.tasks[workflow.listId] || [];
            } else {
              try {
                const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=true`, clickUpToken);
                updatedTasks = buildTaskTree(data.tasks || []);
              } catch (err) {
                console.error(`Error syncing tasks for list ${workflow.listId}`, err);
              }
            }
            
            return {
              ...workflow,
              tasks: updatedTasks,
              lastSynced: Date.now()
            };
          }));

          setMappedWorkflows(updatedWorkflows);
          setIsAutoSyncing(false);
        }, 15000);

        return () => clearInterval(syncInterval);
      }, [mappedWorkflows.length, clickUpToken]);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser({
              name: currentUser.displayName || 'User',
              email: currentUser.email,
              avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'User'}`,
              isMock: false
            });
          } else {
            setUser((prev) => prev?.isMock ? prev : null);
          }
          setAuthInitialized(true);
        });
        return () => unsubscribe();
      }, []);

      const handleMockLogin = () => {
        setUser({
          name: 'Preview User',
          email: 'preview@weaver.app',
          avatar: 'https://ui-avatars.com/api/?name=Preview+User',
          isMock: true
        });
        setErrorMessage(null);
      };

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (error) {
          console.warn("Google authentication is restricted in this sandboxed preview environment. Launching Weaver in Offline Preview Mode.", error);
          handleMockLogin();
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (auth.currentUser) {
          auth.signOut();
        } else {
          setUser(null);
        }
        
        localStorage.removeItem('weaver_clickup_token');
        setClickUpToken('');
        setTeams([]);
        setMappedWorkflows([]);
        setIntegrationStep('idle');
        setIsSwitchModalOpen(false);
      };

      if (!authInitialized) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center">
            <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      if (user) {
        // Flatten all nested subtasks for accurate, deep global math metrics
        const allTasksFlattened = flattenTasks(mappedWorkflows.flatMap(wf => wf.tasks || []));
        
        const uniqueTags = Array.from(new Set(allTasksFlattened.flatMap(t => t.tags?.map(tag => tag.name) || [])));
        const uniqueAssignees = Array.from(new Set(allTasksFlattened.flatMap(t => t.assignees?.map(a => a.username) || [])));

        // Apply Global Filter to the core task list
        let filteredTasks = allTasksFlattened;
        if (completionFilterType === 'tags' && selectedTagFilter) {
          filteredTasks = allTasksFlattened.filter(t => t.tags?.some(tag => tag.name === selectedTagFilter));
        } else if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
          filteredTasks = allTasksFlattened.filter(t => t.assignees?.some(a => a.username === selectedAssigneeFilter));
        }

        const activeTasksCount = filteredTasks.filter(t => !['closed', 'complete', 'done', 'resolved'].includes(t.status?.status?.toLowerCase())).length;
        const totalFilteredCount = filteredTasks.length;
        const completedFilteredTasksCount = filteredTasks.filter(t => ['closed', 'complete', 'done', 'resolved'].includes(t.status?.status?.toLowerCase())).length;

        // Global Completion Widget Math
        let totalEstimateMs = 0;
        let totalRemainingMs = 0;
        
        let taskMinDate = Infinity;
        let taskMaxDate = 0;

        filteredTasks.forEach(t => {
          const isDone = ['closed', 'complete', 'done', 'resolved'].includes(t.status?.status?.toLowerCase());
          
          if (t.start_date) taskMinDate = Math.min(taskMinDate, parseInt(t.start_date));
          if (t.due_date) taskMaxDate = Math.max(taskMaxDate, parseInt(t.due_date));
          
          const estimate = t.time_estimate ? parseInt(t.time_estimate) : 0; 
          
          let spent = 0;
          if (t.time_spent) {
            spent = parseInt(t.time_spent);
          } else if (t.progress !== undefined) {
            spent = estimate * (t.progress / 100);
          } else if (isDone) {
            spent = estimate;
          }

          const remaining = isDone ? 0 : Math.max(0, estimate - spent);

          totalEstimateMs += estimate;
          totalRemainingMs += remaining;
        });
        
        // Bug & Defect Velocity & KPI Math
        let allBugs = extractBugs(mappedWorkflows.flatMap(wf => wf.tasks || []));
        
        // Apply Global Filter to Extracted Bugs
        if (completionFilterType === 'tags' && selectedTagFilter) {
          allBugs = allBugs.filter(t => t.tags?.some(tag => tag.name === selectedTagFilter));
        } else if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
          allBugs = allBugs.filter(t => t.assignees?.some(a => a.username === selectedAssigneeFilter));
        }

        const totalBugsCount = allBugs.length;
        const resolvedBugsCount = allBugs.filter(t => ['closed', 'complete', 'done', 'resolved'].includes(t.status?.status?.toLowerCase())).length;
        const activeBugsCount = totalBugsCount - resolvedBugsCount;
        const criticalBugsCount = allBugs.filter(t => ['high', 'urgent', 'critical'].includes(t.priority?.priority?.toLowerCase())).length;
        const bugResolutionRate = totalBugsCount === 0 ? 0 : Math.round((resolvedBugsCount / totalBugsCount) * 100);

        // Velocity Math: Calculate average time to fix bugs
        let fixVelocitySumMs = 0;
        let fixVelocityCount = 0;
        allBugs.forEach(b => {
          if (['closed', 'complete', 'done', 'resolved'].includes(b.status?.status?.toLowerCase()) && b.date_closed && b.date_created) {
            fixVelocitySumMs += (parseInt(b.date_closed) - parseInt(b.date_created));
            fixVelocityCount++;
          }
        });
        const avgVelocityDays = fixVelocityCount > 0 ? (fixVelocitySumMs / fixVelocityCount / 86400000).toFixed(1) : "0";

        // Top 5 Stalled Tasks Math (Active tasks sorted by age descending, filtered by estimated time vs duration)
        const stalledTasksCandidates = filteredTasks
          .filter(t => {
            const nameLower = t.name.toLowerCase();
            const statusLower = t.status?.status?.toLowerCase() || '';
            
            // Exclude specific container tasks
            if (nameLower === 'ui bugs' || nameLower === 'qa bugs') return false;
            
            // Exclude closed/done and sprint backlog tasks
            if (['closed', 'complete', 'done', 'resolved', 'sprint backlog'].includes(statusLower)) return false;
            
            // Include specific active development statuses
            const isActiveStatus = ['ongoing dev', 'in progress', 'open', 'review'].includes(statusLower);
            
            if (isActiveStatus) {
              const createdDate = parseInt(t.date_created);
              const estimateMs = parseInt(t.time_estimate);
              
              // Stalled if duration since creation exceeds estimated time
              if (createdDate && estimateMs > 0) {
                const durationMs = Date.now() - createdDate;
                if (durationMs > estimateMs) {
                  return true;
                }
              }
            }
            return false;
          });

        const stalledTaskIds = new Set(stalledTasksCandidates.map(t => t.id));

        const hasStalledDescendant = (task) => {
          if (!task.subtasks || task.subtasks.length === 0) return false;
          return task.subtasks.some(sub => stalledTaskIds.has(sub.id) || hasStalledDescendant(sub));
        };

        const stalledTasks = stalledTasksCandidates
          .filter(t => !hasStalledDescendant(t))
          .sort((a, b) => {
             const ageA = Date.now() - (parseInt(a.date_created) || Date.now());
             const ageB = Date.now() - (parseInt(b.date_created) || Date.now());
             return ageB - ageA; 
          })
          .slice(0, 5);

        // Timeline processing for Burndown
        let minDate = Infinity;
        let maxDate = 0;

        // 1. Prioritize List boundaries if defined
        mappedWorkflows.forEach(wf => {
          if (wf.listStartDate) minDate = Math.min(minDate, parseInt(wf.listStartDate));
          if (wf.listDueDate) maxDate = Math.max(maxDate, parseInt(wf.listDueDate));
        });

        // 2. Fallback to task-level bounds
        if (minDate === Infinity) minDate = taskMinDate;
        if (maxDate === 0) maxDate = taskMaxDate;

        // 3. Fallback to dynamic window if absolutely no dates exist
        const now = Date.now();
        if (minDate === Infinity) minDate = now - (7 * 86400000);
        if (maxDate === 0) maxDate = now + (7 * 86400000);
        if (maxDate <= minDate) maxDate = minDate + (14 * 86400000);

        const totalDurationMs = maxDate - minDate;
        const elapsedMs = Math.max(0, now - minDate);
        let currentX = (elapsedMs / totalDurationMs) * 100;
        currentX = Math.max(0, Math.min(100, currentX));
        
        const formatDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const dayLabels = [
            formatDate(minDate),
            formatDate(minDate + totalDurationMs * 0.33),
            formatDate(minDate + totalDurationMs * 0.66),
            formatDate(maxDate)
        ];

        const totalEstHours = Math.round(totalEstimateMs / 3600000) || 1;
        const totalRemHours = Math.round(totalRemainingMs / 3600000);
        const totalSpentHours = totalEstHours - totalRemHours;
        const completionPercentage = Math.round((totalSpentHours / totalEstHours) * 100);
        
        const currentY = 100 - ((totalRemHours / totalEstHours) * 100);
        
        const burndownPointsData = [
          [0, 0],
          [currentX * 0.33, currentY * 0.25],
          [currentX * 0.66, currentY * 0.60],
          [currentX, currentY]
        ];
        
        const linePointsString = burndownPointsData.map(p => `${p[0]},${p[1]}`).join(' ');
        const polygonPointsString = `0,100 ${linePointsString} ${currentX},100 0,100`;

        // Team Workload Math
        const assigneeStats = {};
        filteredTasks.forEach(task => {
          if (task.assignees && task.assignees.length > 0) {
            task.assignees.forEach(assignee => {
              // If filter is active for a specific assignee, skip others in the same task
              if (completionFilterType === 'assignees' && selectedAssigneeFilter && assignee.username !== selectedAssigneeFilter) {
                return;
              }

              const key = assignee.username;
              if (!assigneeStats[key]) {
                assigneeStats[key] = {
                  username: assignee.username,
                  profilePicture: assignee.profilePicture,
                  statusCounts: {},
                  totalEstMs: 0,
                  totalSpentMs: 0
                };
              }
              const statusName = task.status?.status || 'Open';
              const statusColor = task.status?.color || '#94a3b8';
              
              if (!assigneeStats[key].statusCounts[statusName]) {
                assigneeStats[key].statusCounts[statusName] = { count: 0, color: statusColor };
              }
              assigneeStats[key].statusCounts[statusName].count++;

              const est = task.time_estimate ? parseInt(task.time_estimate) : 0;
              const isDone = ['closed', 'complete', 'done', 'resolved'].includes(statusName.toLowerCase());
              let spent = 0;
              if (task.time_spent) {
                spent = parseInt(task.time_spent);
              } else if (task.progress !== undefined) {
                spent = est * (task.progress / 100);
              } else if (isDone) {
                spent = est;
              }

              assigneeStats[key].totalEstMs += est;
              assigneeStats[key].totalSpentMs += spent;
            });
          }
        });
        const assigneesList = Object.values(assigneeStats).sort((a,b) => b.totalEstMs - a.totalEstMs);

        const integrationUI = (
          <div className="animate-in fade-in duration-500 w-full">
            {integrationStep === 'idle' && mappedWorkflows.length === 0 && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden flex flex-col md:flex-row items-center justify-between p-8">
                <div className="mb-4 md:mb-0">
                  <h2 className="text-lg font-semibold text-white">Connect your ticketing system</h2>
                  <p className="text-slate-400 mt-1 max-w-xl">To start weaving, connect Weaver to ClickUp. This allows us to automatically sync your support tickets with your development tasks.</p>
                </div>
                <button 
                  onClick={() => {
                    setIsSwitchModalOpen(true);
                    handleConnectClickUp();
                  }}
                  className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shrink-0"
                >
                  <Settings className="h-4 w-4 mr-2 animate-spin-slow" />
                  Connect ClickUp
                </button>
              </div>
            )}

            {integrationStep === 'entering_token' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-8 animate-in fade-in slide-in-from-bottom-4">
                <div className="flex items-center mb-6">
                  <div className="bg-indigo-500/10 p-2.5 rounded-lg mr-4 border border-indigo-500/20">
                    <Key className="h-6 w-6 text-indigo-400" />
                  </div>
                  <div>
                    <h3 className="text-lg font-semibold text-white">Enter ClickUp API Token</h3>
                    <p className="text-sm text-slate-400">Provide your Personal Access Token to retrieve your Workspaces.</p>
                  </div>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">Personal Access Token</label>
                    <input 
                      type="password" 
                      value={tempToken} 
                      onChange={(e) => setTempToken(e.target.value)}
                      placeholder="pk_123456789_..."
                      className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono text-sm"
                    />
                    <p className="text-xs text-slate-500 mt-2">
                      You can generate this in ClickUp by clicking your Avatar &gt; Settings &gt; Apps.
                    </p>
                  </div>
                  {clickUpError && (
                    <div className="p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-sm text-red-300 animate-in fade-in slide-in-from-top-2">
                      <div className="flex items-start mb-3">
                        <AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" />
                        <span className="font-medium">{clickUpError}</span>
                      </div>
                      <button
                        onClick={handleMockClickUpData}
                        className="w-full flex justify-center py-2 px-4 border border-red-900/50 rounded-lg shadow-sm text-sm font-medium text-red-200 bg-red-950/40 hover:bg-red-900/30 transition-colors"
                      >
                        Bypass with Mock ClickUp Data (Preview)
                      </button>
                    </div>
                  )}
                  <div className="flex justify-end space-x-3 pt-2">
                    <button 
                      onClick={() => { 
                        setIntegrationStep('idle'); 
                        setTempToken(''); 
                        setClickUpError(null); 
                        setIsSwitchModalOpen(false);
                      }}
                      className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors focus:outline-none rounded-lg"
                    >
                      Cancel
                    </button>
                    <button 
                      onClick={handleAuthenticateToken}
                      disabled={!tempToken}
                      className="flex items-center px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                    >
                      Authenticate
                    </button>
                  </div>
                </div>
              </div>
            )}

            {integrationStep === 'connecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-12 flex flex-col items-center justify-center text-center animate-in fade-in">
                <RefreshCw className="h-8 w-8 text-indigo-400 animate-spin mb-4" />
                <h3 className="text-lg font-semibold text-white">Authenticating with ClickUp</h3>
                <p className="text-slate-400 mt-2 max-w-md">Securely connecting and fetching your hierarchy. Please wait...</p>
              </div>
            )}

            {integrationStep === 'selecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-indigo-500/20 shadow-2xl overflow-hidden animate-in fade-in slide-in-from-bottom-4">
                <div className="bg-indigo-500/10 px-6 py-4 border-b border-indigo-500/20 flex items-center">
                  <div className="bg-indigo-600 p-1.5 rounded-md mr-3 shadow-md">
                    <svg viewBox="0 0 100 100" className="h-5 w-5 text-white" fill="currentColor">
                      <path d="M43.8 28.2C54.1 28.2 62.5 36.6 62.5 46.9L62.5 65.6L43.8 65.6C33.4 65.6 25 57.2 25 46.9C25 36.6 33.4 28.2 43.8 28.2ZM43.8 15.6C26.5 15.6 12.5 29.6 12.5 46.9C12.5 64.1 26.5 78.1 43.8 78.1L75 78.1C81.9 78.1 87.5 72.5 87.5 65.6L87.5 46.9C87.5 29.6 67.9 15.6 43.8 15.6Z"/>
                    </svg>
                  </div>
                  <div>
                    <h3 className="text-lg font-semibold text-white">Map ClickUp Destination</h3>
                    <p className="text-sm text-indigo-300">Choose where Weaver tasks should be synced.</p>
                  </div>
                </div>
                
                <div className="p-6 space-y-5">
                  {clickUpError && (
                    <div className="p-4 bg-red-950/30 border border-red-900/50 rounded-lg text-sm text-red-300 font-medium flex items-start mb-4">
                      <AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" />
                      <span>{clickUpError}</span>
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">1. Select Workspace</label>
                    <select 
                      value={selectedTeam} 
                      onChange={(e) => { 
                        setSelectedTeam(e.target.value); 
                        setSelectedSpace(''); 
                        setSelectedFolder(''); 
                        setSelectedList(''); 
                      }}
                      className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    >
                      <option value="" className="bg-slate-900 text-slate-300">-- Choose a Workspace --</option>
                      {teams.map(team => (
                        <option key={team.id} value={team.id} className="bg-slate-900 text-white">{team.name}</option>
                      ))}
                    </select>
                  </div>

                  {selectedTeam && (
                    <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                      <label className="block text-sm font-medium text-slate-300 mb-1">2. Select Space</label>
                      <select 
                        value={selectedSpace} 
                        onChange={(e) => { 
                          setSelectedSpace(e.target.value); 
                          setSelectedFolder(''); 
                          setSelectedList(''); 
                        }}
                        className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                      >
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a Space --</option>
                        {spaces.map(space => (
                          <option key={space.id} value={space.id} className="bg-slate-900 text-white">{space.name}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {selectedSpace && (
                    <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                      <label className="block text-sm font-medium text-slate-300 mb-1">3. Select Folder <span className="text-slate-500 font-normal">(Optional)</span></label>
                      <select 
                        value={selectedFolder} 
                        onChange={(e) => { 
                          setSelectedFolder(e.target.value); 
                          setSelectedList(''); 
                        }}
                        className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                      >
                        <option value="" className="bg-slate-900 text-slate-300">-- Folderless / Direct to Space --</option>
                        {folders.map(folder => (
                          <option key={folder.id} value={folder.id} className="bg-slate-900 text-white">{folder.name}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {selectedSpace && (
                    <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                      <label className="block text-sm font-medium text-slate-300 mb-1">4. Select Task List</label>
                      <select 
                        value={selectedList} 
                        onChange={(e) => setSelectedList(e.target.value)}
                        className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                      >
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a List --</option>
                        {availableLists.map(list => (
                          <option key={list.id} value={list.id} className="bg-slate-900 text-white">{list.name}</option>
                        ))}
                      </select>
                      {availableLists.length === 0 && (
                         <p className="text-xs text-amber-500 mt-2">No lists found in this location.</p>
                      )}
                    </div>
                  )}

                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-white/5">
                    <button 
                      onClick={() => {
                        setIntegrationStep('idle');
                        setSelectedTeam('');
                        setSelectedSpace('');
                        setSelectedFolder('');
                        setSelectedList('');
                        setIsSwitchModalOpen(false);
                      }}
                      className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors focus:outline-none rounded-lg"
                    >
                      Cancel
                    </button>
                    <button 
                      disabled={!selectedList}
                      onClick={handleAddMapping}
                      className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                    >
                      <CheckCircle2 className="h-4 w-4 mr-2" />
                      Connect to Weaver
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-slate-950 font-sans text-slate-100 relative">
            <WebNestBackground opacity={0.35} />

            {/* Switch Connection Modal Overlay */}
            {isSwitchModalOpen && mappedWorkflows.length > 0 && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                 <div className="w-full max-w-2xl relative">
                    <button 
                      onClick={() => setIsSwitchModalOpen(false)} 
                      className="absolute -top-12 right-0 text-slate-400 hover:text-red-400 transition-colors p-2"
                      title="Close"
                    >
                      <XIcon className="w-8 h-8" />
                    </button>
                    {integrationUI}
                 </div>
              </div>
            )}

            {/* Modal for Ticket Details & Comments */}
            {selectedTicketForModal && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                  {/* Modal Header */}
                  <div className="flex items-center justify-between p-6 border-b border-white/5 bg-slate-900/50">
                    <div>
                      <div className="flex items-center space-x-2 mb-2">
                        <span className="text-xs font-mono text-slate-500 uppercase">#{selectedTicketForModal.id}</span>
                        <span 
                          className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border"
                          style={{ 
                            color: selectedTicketForModal.status?.color || '#94a3b8', 
                            backgroundColor: `${selectedTicketForModal.status?.color || '#94a3b8'}15`, 
                            borderColor: `${selectedTicketForModal.status?.color || '#94a3b8'}30` 
                          }}
                        >
                          {selectedTicketForModal.status?.status || 'Open'}
                        </span>
                      </div>
                      <h2 className="text-xl font-bold text-white">{selectedTicketForModal.name}</h2>
                    </div>
                    <button 
                      onClick={() => setSelectedTicketForModal(null)}
                      className="p-2 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white transition-colors"
                    >
                      <XIcon className="h-5 w-5" />
                    </button>
                  </div>

                  {/* Modal Body (Scrollable) */}
                  <div className="flex-1 overflow-y-auto p-6 space-y-6">
                    {/* Description Section */}
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Description</h3>
                      <div className="bg-slate-950/50 border border-white/5 p-4 rounded-xl text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                        {selectedTicketForModal.description || "No description provided."}
                      </div>
                    </div>

                    {/* Metadata Section */}
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-slate-950/30 border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Time Estimate</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300">
                           <Clock className="h-4 w-4 mr-2 text-indigo-400" />
                           {selectedTicketForModal.time_estimate ? `${Math.round(parseInt(selectedTicketForModal.time_estimate)/3600000)} Hours` : 'Not set'}
                         </div>
                      </div>
                      <div className="bg-slate-950/30 border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Priority</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300 capitalize">
                           <Flag className="h-4 w-4 mr-2" style={{ color: selectedTicketForModal.priority?.color || '#94a3b8' }} />
                           {selectedTicketForModal.priority?.priority || 'None'}
                         </div>
                      </div>
                    </div>

                    {/* Comments Thread */}
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center">
                        <MessageSquare className="h-4 w-4 mr-2" /> Comments
                      </h3>
                      <div className="space-y-4">
                        {(!localMockComments[selectedTicketForModal.id] || localMockComments[selectedTicketForModal.id].length === 0) ? (
                          <p className="text-sm text-slate-500 italic p-4 bg-slate-950/30 rounded-xl text-center border border-white/5">No comments yet. Start the conversation!</p>
                        ) : (
                          localMockComments[selectedTicketForModal.id].map(comment => (
                            <div key={comment.id} className="bg-slate-950/50 border border-white/5 p-4 rounded-xl flex space-x-3">
                              <img src={comment.user?.profilePicture} alt="User" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800" />
                              <div>
                                <div className="flex items-baseline space-x-2 mb-1">
                                  <span className="font-semibold text-sm text-slate-200">{comment.user?.username}</span>
                                  <span className="text-xs text-slate-500">{new Date(parseInt(comment.date)).toLocaleString()}</span>
                                </div>
                                <p className="text-sm text-slate-300">{comment.comment_text}</p>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Modal Footer / Comment Input */}
                  <div className="p-4 border-t border-white/5 bg-slate-950">
                    <div className="flex items-start space-x-3">
                      <img src={user.avatar} alt="You" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800 shrink-0" />
                      <div className="flex-1 relative">
                        <textarea 
                          value={commentText}
                          onChange={(e) => setCommentText(e.target.value)}
                          placeholder="Write a comment or status update..."
                          className="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-3 pr-12 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-16"
                        />
                        <button 
                          onClick={handleSendComment}
                          disabled={!commentText.trim()}
                          className="absolute right-2 bottom-2 p-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {user.isMock && (
              <div className="relative z-30 bg-amber-950/30 border-b border-amber-900/50 px-4 py-3 text-amber-300 text-sm flex justify-center items-center text-center backdrop-blur-md">
                <span className="font-semibold mr-2">Preview Mode:</span> 
                You are logged in with a mock account because this preview domain is not authorized in your Firebase console.
              </div>
            )}

            <nav className="relative z-30 bg-slate-950/50 backdrop-blur-md border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button className="text-slate-400 hover:text-white transition-colors">
                      <Bell className="h-5 w-5" />
                    </button>
                    <div className="h-8 w-8 rounded-full bg-indigo-950/50 flex items-center justify-center overflow-hidden border border-white/10 cursor-pointer">
                      <img src={user.avatar} alt={user.name} className="h-full w-full object-cover" />
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="flex items-center text-sm font-medium text-slate-400 hover:text-white transition-colors"
                    >
                      <LogOut className="h-4 w-4 mr-1" />
                      Sign out
                    </button>
                  </div>
                </div>
              </div>
            </nav>

            {mappedWorkflows.length === 0 ? (
              <main className="relative z-25 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 mb-6 border border-indigo-500/20 shadow-inner">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400 animate-pulse" />
                  </div>
                  <h1 className="text-3xl font-bold text-white tracking-tight">Welcome to Weaver, {user.name.split(' ')[0]}!</h1>
                  <p className="text-slate-400 mt-3 text-lg max-w-xl mx-auto">
                    Before we build your dashboard, let's connect your task tracking system to pull in your assignments.
                  </p>
                </div>
                {integrationUI}
              </main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-in fade-in duration-500">
                
                {/* Dashboard Command Center Header */}
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 bg-slate-900/40 p-6 rounded-2xl border border-white/5 backdrop-blur-md shadow-xl relative z-20">
                  <div>
                    <h1 className="text-2xl font-bold text-white flex items-center gap-3">
                      Your Workspace
                      {isAutoSyncing ? (
                        <span className="flex items-center text-xs font-medium text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20 transition-all">
                          <RefreshCw className="h-3 w-3 mr-1 animate-spin" /> Live Syncing
                        </span>
                      ) : (
                        <span className="flex items-center text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20 transition-all">
                          <div className="h-2 w-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></div> Real-time Updates On
                        </span>
                      )}
                    </h1>
                    <p className="text-slate-400 mt-1 text-sm">Dashboard metrics are dynamically synced and globally filtered.</p>
                  </div>
                  
                  <div className="flex items-center space-x-3 bg-slate-950/50 p-2 rounded-xl border border-white/5">
                    <span className="text-sm text-slate-400 font-medium pl-2 flex items-center">
                      <svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                      Global Filter:
                    </span>
                    <select
                      value={completionFilterType}
                      onChange={(e) => {
                        setCompletionFilterType(e.target.value);
                        if (e.target.value === 'tags' && uniqueTags.length > 0) {
                          setSelectedTagFilter(uniqueTags[0]);
                        }
                        if (e.target.value === 'assignees' && uniqueAssignees.length > 0) {
                          setSelectedAssigneeFilter(uniqueAssignees[0]);
                        }
                      }}
                      className="border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-900 shadow-sm"
                    >
                      <option value="none">All Data</option>
                      <option value="tags">By Tag</option>
                      <option value="assignees">By Assignee</option>
                    </select>

                    {completionFilterType === 'tags' && (
                      <select
                        value={selectedTagFilter}
                        onChange={(e) => setSelectedTagFilter(e.target.value)}
                        className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-950/30 shadow-sm min-w-[120px]"
                      >
                        {uniqueTags.length === 0 && <option value="">No tags found</option>}
                        {uniqueTags.map(tag => (
                          <option key={tag} value={tag}>{tag}</option>
                        ))}
                      </select>
                    )}
                    
                    {completionFilterType === 'assignees' && (
                      <select
                        value={selectedAssigneeFilter}
                        onChange={(e) => setSelectedAssigneeFilter(e.target.value)}
                        className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-950/30 shadow-sm min-w-[120px]"
                      >
                        {uniqueAssignees.length === 0 && <option value="">No assignees found</option>}
                        {uniqueAssignees.map(a => (
                          <option key={a} value={a}>{a}</option>
                        ))}
                      </select>
                    )}
                  </div>
                </div>

                {/* 1. Metrics */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                    <div className="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">
                      <Ticket className="h-6 w-6 text-blue-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                        Open Tickets
                        <MetricTooltip align="left" text="Unassigned or inbound support tickets pending triage." formula="Count of incoming items from connected support endpoints (e.g. Zendesk)">
                          <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                        </MetricTooltip>
                      </p>
                      <p className="text-2xl font-bold text-white mt-1">14</p>
                    </div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                    <div className="bg-indigo-500/10 p-3 rounded-lg border border-indigo-500/20">
                      <CheckSquare className="h-6 w-6 text-indigo-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                        Active Tasks
                        <MetricTooltip align="center" text="Count of tracked tasks currently being worked on." formula="Total Flattened Tasks - Tasks with status 'Closed', 'Complete', 'Done', or 'Resolved'">
                          <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                        </MetricTooltip>
                      </p>
                      <p className="text-2xl font-bold text-white mt-1">{activeTasksCount}</p>
                    </div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4 relative z-10 hover:z-50">
                    <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20">
                      <CheckCircle2 className="h-6 w-6 text-emerald-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                        Total Resolved
                        <MetricTooltip align="right" text="Tasks completed across all mapped workflows." formula="Count of tasks with status 'Closed', 'Complete', 'Done', or 'Resolved'">
                          <InfoIcon className="h-3.5 w-3.5 text-slate-500 cursor-help" />
                        </MetricTooltip>
                      </p>
                      <p className="text-2xl font-bold text-white mt-1">{completedFilteredTasksCount}</p>
                    </div>
                  </div>
                </div>

                {/* 2. Progress / Burndown */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex flex-col justify-between relative z-10 hover:z-50">
                    <div>
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                        <div>
                          <div className="flex items-center space-x-2 mb-1">
                            <Target className="h-5 w-5 text-indigo-400" />
                            <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                              Overall Progress
                              <MetricTooltip align="left" text="Weighted completion percentage based on tracked time estimates." formula="((Total Estimated Hours - Total Remaining Hours) / Total Estimated Hours) × 100">
                                <InfoIcon className="h-4 w-4 text-slate-500 cursor-help" />
                              </MetricTooltip>
                            </h2>
                          </div>
                          <p className="text-sm text-slate-400">Aggregated progress across all active mapped items.</p>
                        </div>
                      </div>
                      
                      <div className="flex items-end justify-between mb-4">
                        <div className="flex flex-col">
                          <span className="text-5xl font-extrabold text-white leading-none">{completionPercentage}%</span>
                        </div>
                        <div className="flex flex-col items-end space-y-1.5">
                          <div className="flex items-center text-xs text-slate-400 bg-slate-950/50 px-2.5 py-1 rounded-md border border-white/5" title="Completed vs Total Items">
                            <CheckCircle2 className="h-3.5 w-3.5 mr-1.5 text-emerald-400" />
                            <span className="text-white font-medium mr-1">{completedFilteredTasksCount}</span> / {totalFilteredCount} Items
                          </div>
                          <div className="flex items-center text-xs text-slate-400 bg-slate-950/50 px-2.5 py-1 rounded-md border border-white/5" title="Logged vs Estimated Hours">
                            <Clock className="h-3.5 w-3.5 mr-1.5 text-indigo-400" />
                            <span className="text-white font-medium mr-1">{totalSpentHours}h</span> / {totalEstHours}h Logged
                          </div>
                        </div>
                      </div>
                      
                      <div className="w-full bg-slate-950 border border-white/5 rounded-full h-4 overflow-hidden mb-2 shadow-inner">
                        <div 
                          className="bg-gradient-to-r from-indigo-500 to-violet-500 h-4 rounded-full transition-all duration-1000 ease-out shadow-[0_0_12px_rgba(99,102,241,0.4)]" 
                          style={{ width: `${completionPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                    {completionFilterType === 'tags' && uniqueTags.length === 0 && (
                      <div className="mt-4 p-3 bg-amber-950/20 rounded-lg border border-amber-900/40 flex items-start text-sm text-amber-300">
                        <AlertTriangle className="h-4 w-4 mr-2 shrink-0 mt-0.5 text-amber-500" />
                        <span>No tags were found in the tasks you mapped.</span>
                      </div>
                    )}
                    {completionFilterType === 'assignees' && uniqueAssignees.length === 0 && (
                      <div className="mt-4 p-3 bg-amber-950/20 rounded-lg border border-amber-900/40 flex items-start text-sm text-amber-300">
                        <AlertTriangle className="h-4 w-4 mr-2 shrink-0 mt-0.5 text-amber-500" />
                        <span>No assignees were found in the tasks you mapped.</span>
                      </div>
                    )}
                  </div>

                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-50">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                      <div>
                        <div className="flex items-center space-x-2 mb-1">
                          <TrendingDown className="h-5 w-5 text-indigo-400" />
                          <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                            Sprint Burndown
                            <MetricTooltip align="right" text="Tracks remaining task effort versus your ideal timeline." formula="Y-Axis: Remaining tracked hours. X-Axis: Elapsed time between earliest Start Date and latest Due Date.">
                              <InfoIcon className="h-4 w-4 text-slate-500 cursor-help" />
                            </MetricTooltip>
                          </h2>
                        </div>
                        <p className="text-sm text-slate-400">Tracking actual time remaining over scheduled timeline.</p>
                      </div>
                      <div className="flex flex-row sm:flex-col gap-4 sm:gap-1.5 text-sm bg-slate-950/40 px-3 py-2 rounded-lg border border-white/5 shrink-0">
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-4 h-0 border-t-2 border-dashed border-slate-500 mr-2"></div>
                          Ideal Effort
