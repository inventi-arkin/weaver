    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initializeWebs();
        };
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];
          const webConfigs = [
            { cx: width * 0.28, cy: height * 0.5, radius: Math.min(width, height) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: width * 0.72, cy: height * 0.42, radius: Math.min(width, height) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];
            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });

            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                nodes.push({ id: nodes.length, x: cx + Math.cos(angle) * currentRadius, y: cy + Math.sin(angle) * currentRadius, spoke: s, ring: r, isHub: false });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });
            spiders.push({ webIdx, currentNode: nodes[Math.floor(Math.random() * nodes.length)], targetNode: null, progress: 0, speed: 0.006 + Math.random() * 0.004, x: cx, y: cy, size: 7 + webIdx * 3, legCycle: 0, wovenPaths: [] });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({ webIdx, from: edge.from, to: edge.to, progress: 0, speed: 0.015 + Math.random() * 0.02, size: 1.5 + Math.random() * 1.5 });
        };

        const animate = () => {
          ctx.clearRect(0, 0, width, height);

          webs.forEach(web => {
            const { nodes, edges, color } = web;
            edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });
            nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, 0.25)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) spawnPacket();

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) { packets.splice(idx, 1); return; }
            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            const color = webs[packet.webIdx].color;
            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color}, 0.6)`;
            ctx.fill();
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];
            if (!spider.targetNode) {
              const neighbors = web.edges.filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id).map(e => e.from.id === spider.currentNode.id ? e.to : e.from);
              if (neighbors.length > 0) { spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)]; spider.progress = 0; }
            }
            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;
              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;
              if (spider.progress >= 1) {
                spider.wovenPaths.push({ from: spider.currentNode, to: spider.targetNode, alpha: 1.0, time: Date.now() });
                if (spider.wovenPaths.length > 12) spider.wovenPaths.shift();
                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }

            spider.wovenPaths.forEach((path, pathIdx) => {
              const age = Date.now() - path.time;
              path.alpha = Math.max(0, 1.0 - age / 7000);
              if (path.alpha > 0) {
                ctx.beginPath();
                ctx.moveTo(path.from.x, path.from.y);
                ctx.lineTo(path.to.x, path.to.y);
                ctx.strokeStyle = `rgba(${web.color}, ${path.alpha * 0.35})`;
                ctx.lineWidth = 2.5;
                ctx.stroke();
              } else {
                spider.wovenPaths.splice(pathIdx, 1);
              }
            });

            let angle = spider.targetNode ? Math.atan2(spider.targetNode.y - spider.currentNode.y, spider.targetNode.x - spider.currentNode.x) : 0;
            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.rotate(angle);

            for (let i = 0; i < 8; i++) {
              const side = i < 4 ? -1 : 1;
              const legIdx = i % 4;
              const offset = legIdx * 0.6;
              const cycle = Math.sin(spider.legCycle + offset) * 0.3;
              let angleOffset = [-Math.PI / 3, -Math.PI / 8, Math.PI / 8, Math.PI / 3][legIdx];
              const targetAngle = (angleOffset + cycle) * side;
              const kx1 = Math.cos(targetAngle) * (spider.size * 1.7 * 0.5);
              const ky1 = Math.sin(targetAngle) * (spider.size * 1.7 * 0.5) * side;
              const kx2 = Math.cos(targetAngle - 0.2 * side) * (spider.size * 1.7);
              const ky2 = Math.sin(targetAngle - 0.2 * side) * (spider.size * 1.7) * side;
              ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(kx1, ky1, kx2, ky2); ctx.strokeStyle = `rgba(${web.color}, 0.55)`; ctx.lineWidth = 1.2; ctx.stroke();
            }

            ctx.beginPath(); ctx.moveTo(-spider.size, 0); ctx.lineTo(-spider.size * 2, 0); ctx.strokeStyle = `rgba(${web.color}, 0.35)`; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(-spider.size * 0.4, 0, spider.size * 0.6, spider.size * 0.45, 0, 0, Math.PI * 2); ctx.fillStyle = `rgb(${web.color})`; ctx.fill();
            ctx.beginPath(); ctx.arc(spider.size * 0.35, 0, spider.size * 0.3, 0, Math.PI * 2); ctx.fillStyle = `rgb(${web.color})`; ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        return () => { cancelAnimationFrame(animationFrameId); window.removeEventListener('resize', handleResize); };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block z-0 transition-opacity duration-1000 pointer-events-none" style={{ opacity }} />;
    };

    const MOCK_CLICKUP_DATA = {
      teams: [{ id: 'mock_team_1', name: 'Acme Corp Workspace' }],
      spaces: { 'mock_team_1': [{ id: 'mock_space_1', name: 'Engineering' }] },

            status: { status: 'closed', color: '#10b981' },

    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false, onOpenTimeTrackModal, unsyncedTime = {} }) => {
      const relevantSubtasks = task.subtasks || [];
      const hasSubtasks = relevantSubtasks.length > 0;
      const isExpanded = !!expandedTasks[task.id];
      const isParent = depth === 0;

      const themeColor = task.status?.color || '#38bdf8';
      const isDoneStatus = ['closed', 'complete', 'done', 'resolved'].includes(task.status?.status?.toLowerCase());
      
      const estimateMs = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const baseSpentMs = task.time_spent ? parseInt(task.time_spent) : (isDoneStatus ? estimateMs : 0);
      const spentMs = baseSpentMs + (unsyncedTime[task.id] || 0);
      const hasTimeData = estimateMs > 0 || spentMs > 0;
      
      let displayTime = '';
      if (hasTimeData) {
        const spentHrs = (spentMs / 3600000).toFixed(1).replace(/\.0$/, '');
        const estHrs = (estimateMs / 3600000).toFixed(1).replace(/\.0$/, '');
        displayTime = `${spentHrs}h / ${estHrs}h`;
      }

      return (
        <div className={`transition-all overflow-hidden ${isParent ? 'bg-slate-900/60 border border-white/5 rounded-xl shadow-sm mb-3' : 'border-l border-white/10 ml-4 pl-3 mt-2'}`}>
          <div className={`flex flex-col sm:flex-row sm:items-center justify-between p-3 gap-3 ${isParent ? 'hover:bg-slate-800/50' : 'hover:bg-slate-800/30 rounded-lg'} transition-colors cursor-pointer`} onClick={(e) => { if (e.target.closest('button')) return; if (hasSubtasks) toggleTaskExpand(task.id); }}>
            <div className="flex items-center space-x-3 min-w-0">
              {hasSubtasks ? (
                <button className="text-slate-500 hover:text-white transition-colors shrink-0 p-1">
                  {isExpanded ? <ChevronDown className="h-4 w-4" /> : <ChevronRight className="h-4 w-4" />}
                </button>
              ) : (
                <div className="w-6 shrink-0"></div>
              )}
              
              <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg" style={{ backgroundColor: themeColor, boxShadow: `0 0 8px ${themeColor}60` }} title={`Status: ${task.status?.status || 'Unknown'}`} />
              
              <span className={`text-sm font-medium truncate ${isDoneStatus ? 'text-slate-400 line-through' : 'text-slate-200'}`}>
                {task.name}
              </span>
            </div>

            <div className="flex items-center shrink-0 space-x-4 sm:pl-4 pl-12 overflow-x-auto">
              {hasTimeData && (
                <div className="flex flex-col items-end shrink-0" title="Time Tracked vs Estimated">
                  <span className="text-xs font-mono text-slate-300 bg-slate-950/50 px-2 py-0.5 rounded border border-white/5">
                    {displayTime}
                  </span>
                  {estimateMs > 0 && (
                    <div className="w-16 h-1 mt-1.5 bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full transition-all duration-500" style={{ width: `${Math.min(100, (spentMs / estimateMs) * 100)}%`, backgroundColor: themeColor }}></div>
                    </div>
                  )}
                </div>
              )}

              {!isDoneStatus && (
                <button 
                  onClick={(e) => { e.stopPropagation(); onOpenTimeTrackModal(task); }}
                  className="flex items-center px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 text-emerald-400 text-xs font-medium rounded transition-colors shrink-0"
                >
                  <Play className="w-3 h-3 mr-1" /> Track
                </button>
              )}

              {task.assignees && task.assignees.length > 0 ? (
                <div className="flex -space-x-1.5 shrink-0">
                  {task.assignees.map((assignee, i) => (
                    <img key={i} src={assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee.username)}`} alt={assignee.username} className="w-6 h-6 rounded-full border border-slate-900 bg-slate-800 object-cover" title={`Assigned to ${assignee.username}`} />
                  ))}
                </div>
              ) : (
                <div className="flex items-center justify-center w-6 h-6 rounded-full border border-white/5 bg-slate-900 text-slate-500 shrink-0" title="Unassigned">
                  <Users className="h-3 w-3" />
                </div>
              )}
            </div>
          </div>

          {hasSubtasks && isExpanded && (
            <div className={`pb-3 pr-3 ${isParent ? 'bg-slate-950/30 rounded-b-xl' : ''}`}>
              {relevantSubtasks.map(sub => (
                <TaskItem key={sub.id} task={sub} depth={depth + 1} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={isDoneMode} onOpenTimeTrackModal={onOpenTimeTrackModal} unsyncedTime={unsyncedTime} />
              ))}
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [authInitialized, setAuthInitialized] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);

      const [integrationStep, setIntegrationStep] = useState('idle');
      const [clickUpToken, setClickUpToken] = useState('');
      const [tempToken, setTempToken] = useState('');
      const [clickUpError, setClickUpError] = useState(null);
      const [mappedWorkflows, setMappedWorkflows] = useState([]);
      const [isAutoSyncing, setIsAutoSyncing] = useState(false);
      
      const [devHoursPerDay, setDevHoursPerDay] = useState(7);
      const [qaHoursPerDay, setQaHoursPerDay] = useState(7);
      const [dateBlockers, setDateBlockers] = useState([]);
      const [userRoles, setUserRoles] = useState({});
      const [isBlockerModalOpen, setIsBlockerModalOpen] = useState(false);
      const [newBlockerDays, setNewBlockerDays] = useState(1);
      const [newBlockerRemark, setNewBlockerRemark] = useState('Holiday');
      const [newBlockerAssignee, setNewBlockerAssignee] = useState('');
      const [isSwitchModalOpen, setIsSwitchModalOpen] = useState(false);

      const [expandedTasks, setExpandedTasks] = useState({});
      const [workflowTabs, setWorkflowTabs] = useState({});
      const [unsyncedTime, setUnsyncedTime] = useState({});
      
      const [timeTrackModalTask, setTimeTrackModalTask] = useState(null);
      const [timeHours, setTimeHours] = useState('');
      const [timeMinutes, setTimeMinutes] = useState('');
      const [timeNotes, setTimeNotes] = useState('');
      const [timeDate, setTimeDate] = useState(new Date().toISOString().split('T')[0]);
      const [timeAssignee, setTimeAssignee] = useState('');
      
      const [searchQuery, setSearchQuery] = useState('');

      const mappedWorkflowsRef = useRef(mappedWorkflows);
      useEffect(() => { mappedWorkflowsRef.current = mappedWorkflows; }, [mappedWorkflows]);

      const [teams, setTeams] = useState([]); 
      const [spaces, setSpaces] = useState([]);
      const [folders, setFolders] = useState([]);
      const [lists, setLists] = useState([]); 
      const [folderlessLists, setFolderlessLists] = useState([]); 

      const [selectedTeam, setSelectedTeam] = useState('');
      const [selectedSpace, setSelectedSpace] = useState('');
      const [selectedFolder, setSelectedFolder] = useState('');
      const [selectedList, setSelectedList] = useState('');

      // --- Dual Persistence Engine ---
      const saveSettings = async (updates) => {
        if (mappedWorkflows.length === 0) return;
        const listId = mappedWorkflows[0].listId;
        
        const currentLocal = JSON.parse(localStorage.getItem(`weaver_settings_${listId}`) || '{}');
        const merged = { ...currentLocal, ...updates };
        localStorage.setItem(`weaver_settings_${listId}`, JSON.stringify(merged));

        if (user?.uid && !user.isMock) {
          try {
            const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('listSettings').doc(listId);
            await docRef.set(updates, { merge: true });
          } catch(err) {
             console.error('Firebase save failed (using local):', err);
          }
        }
      };

      // --- Initialization & Local Load ---
      useEffect(() => {
        const storedToken = localStorage.getItem('weaver_clickup_token');
        const storedWorkflows = JSON.parse(localStorage.getItem('weaver_workflows') || '[]');
        
        if (storedToken && storedWorkflows.length > 0) {
          setClickUpToken(storedToken);
          setMappedWorkflows(storedWorkflows);
          
          const listId = storedWorkflows[0].listId;
          const localSettings = JSON.parse(localStorage.getItem(`weaver_settings_${listId}`) || '{}');
          
          setDevHoursPerDay(localSettings.devHoursPerDay !== undefined ? localSettings.devHoursPerDay : 7);
          setQaHoursPerDay(localSettings.qaHoursPerDay !== undefined ? localSettings.qaHoursPerDay : 7);
          setDateBlockers(localSettings.dateBlockers || []);
          setUserRoles(localSettings.userRoles || {});
          setUnsyncedTime(localSettings.unsyncedTime || {});
        }
      }, []);

      // --- Firebase Load (Overrides Local) ---
      useEffect(() => {
        const listId = mappedWorkflows[0]?.listId;
        if (listId && user?.uid && !user.isMock) {
          const fetchSettings = async () => {
            try {
              const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('listSettings').doc(listId);
              const snapshot = await docRef.get();
              if (snapshot.exists) {
                const data = snapshot.data();
                if (data.devHoursPerDay !== undefined) setDevHoursPerDay(data.devHoursPerDay);
                if (data.qaHoursPerDay !== undefined) setQaHoursPerDay(data.qaHoursPerDay);
                if (data.dateBlockers !== undefined) setDateBlockers(data.dateBlockers);
                if (data.userRoles !== undefined) setUserRoles(data.userRoles);
                if (data.unsyncedTime !== undefined) setUnsyncedTime(data.unsyncedTime);
              }
            } catch(e) {
               console.error("Firebase load failed (using local):", e);
            }
          };
          fetchSettings();
        } else if (listId) {
          // If switching to a new list, reset to defaults if nothing found in local storage
          const localSettings = JSON.parse(localStorage.getItem(`weaver_settings_${listId}`) || 'null');
          if (!localSettings) {
             setDevHoursPerDay(7);
             setQaHoursPerDay(7);
             setDateBlockers([]);
             setUserRoles({});
             setUnsyncedTime({});
          }
        }
      }, [mappedWorkflows[0]?.listId, user?.uid, user?.isMock]);

      const handleMockClickUpData = () => {
        setTeams(MOCK_CLICKUP_DATA.teams);
        setClickUpToken('mock_token');
        localStorage.setItem('weaver_clickup_token', 'mock_token');
        setClickUpError(null);
        setIntegrationStep('selecting');
      };

      const fetchClickUp = async (endpoint, token, method = 'GET', body = null) => {
        const targetUrl = `https://api.clickup.com/api/v2/${endpoint}`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          method === 'GET' ? `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}` : null,
          `https://thingproxy.freeboard.io/fetch/${targetUrl}`
        ].filter(Boolean);

        for (const proxyUrl of proxies) {
          try {
            const options = { headers: { 'Authorization': token, 'Content-Type': 'application/json' }, method };
            if (body) options.body = JSON.stringify(body);
            
            const res = await fetch(proxyUrl, options);
            if (!res.ok) {
              const errTxt = await res.text();
              throw new Error(`ClickUp API Error: ${errTxt || res.statusText}`);
            }
            return await res.json();
          } catch (err) {
            if (err.message.includes('ClickUp API Error') || err.message.includes('Invalid Token')) throw err;
            continue;
          }
        }
        throw new Error('Connection blocked. Browsers prevent direct API calls (CORS). Please use the Mock Data bypass to preview the UI.');
      };

      useEffect(() => {
        if (!selectedTeam || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setSpaces(MOCK_CLICKUP_DATA.spaces[selectedTeam] || []); return; }
        fetchClickUp(`team/${selectedTeam}/space`, clickUpToken).then(data => setSpaces(data.spaces || [])).catch(err => setClickUpError(err.message));
      }, [selectedTeam, clickUpToken]);

      useEffect(() => {
        if (!selectedSpace || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setFolders(MOCK_CLICKUP_DATA.folders[selectedSpace] || []); setFolderlessLists(MOCK_CLICKUP_DATA.folderlessLists[selectedSpace] || []); return; }
        fetchClickUp(`space/${selectedSpace}/folder`, clickUpToken).then(data => setFolders(data.folders || [])).catch(err => setClickUpError(err.message));
        fetchClickUp(`space/${selectedSpace}/list`, clickUpToken).then(data => setFolderlessLists(data.lists || [])).catch(err => setClickUpError(err.message));
      }, [selectedSpace, clickUpToken]);

      useEffect(() => {
        if (!selectedFolder || !clickUpToken) return;
        if (clickUpToken === 'mock_token') { setLists(MOCK_CLICKUP_DATA.lists[selectedFolder] || []); return; }
        fetchClickUp(`folder/${selectedFolder}/list`, clickUpToken).then(data => setLists(data.lists || [])).catch(err => setClickUpError(err.message));
      }, [selectedFolder, clickUpToken]);

      const availableLists = selectedFolder ? lists : folderlessLists;

      const buildTaskTree = (flatTasks) => {
        const taskMap = {};
        const rootTasks = [];
        flatTasks.forEach(task => { taskMap[task.id] = { ...task, subtasks: [] }; });
        flatTasks.forEach(task => {
          if (task.parent && taskMap[task.parent]) {
            taskMap[task.parent].subtasks.push(taskMap[task.id]);
          } else {
            rootTasks.push(taskMap[task.id]);
          }
        });
        return rootTasks;
      };

      const handleConnectClickUp = () => {
        if (clickUpToken && teams.length > 0) setIntegrationStep('selecting');
        else setIntegrationStep('entering_token');
      };

      const handleAuthenticateToken = async () => {
        if (!tempToken) return;
        setIntegrationStep('connecting');
        setClickUpError(null);
        try {
          const data = await fetchClickUp('team', tempToken);
          setTeams(data.teams || []);
          setClickUpToken(tempToken);
          localStorage.setItem('weaver_clickup_token', tempToken);
          setIntegrationStep('selecting');
        } catch (err) {
          setClickUpError(err.message);
          setIntegrationStep('entering_token');
        }
      };

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;
        setIntegrationStep('connecting'); 
        
        const teamName = teams.find(t => t.id === selectedTeam)?.name || 'Workspace';
        const spaceName = spaces.find(s => s.id === selectedSpace)?.name || 'Space';
        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';
        const listName = availableLists.find(l => l.id === selectedList)?.name || 'Task List';

        let initialTasks = [];
        let initialMembers = [];
        if (clickUpToken === 'mock_token') {
          initialTasks = buildTaskTree(MOCK_CLICKUP_DATA.tasks[selectedList] || []);
        } else {
          try {
            const data = await fetchClickUp(`list/${selectedList}/task?subtasks=true&include_closed=true`, clickUpToken);
            initialTasks = buildTaskTree(data.tasks || []);
            const memberData = await fetchClickUp(`list/${selectedList}/member`, clickUpToken);
            initialMembers = memberData.members || [];
          } catch (err) {
            console.error("Error fetching data for list", err);
          }
        }

        const newWorkflow = {
          id: Date.now().toString(),
          teamId: selectedTeam,
          team: teamName,
          space: spaceName,
          folder: folderName,
          list: listName,
          listId: selectedList,
          tasks: initialTasks,
          members: initialMembers,
          lastSynced: Date.now()
        };

        setMappedWorkflows([newWorkflow]);
        localStorage.setItem('weaver_workflows', JSON.stringify([newWorkflow]));

        setDevHoursPerDay(7);
        setQaHoursPerDay(7);
        setDateBlockers([]);
        setUserRoles({});
        setUnsyncedTime({});

        setSelectedTeam(''); setSelectedSpace(''); setSelectedFolder(''); setSelectedList('');
        setIntegrationStep('idle');
        setIsSwitchModalOpen(false);
      };

      // --- Auto-Sync Engine ---
      useEffect(() => {
        if (mappedWorkflows.length === 0) return;
        const syncInterval = setInterval(async () => {
          setIsAutoSyncing(true);
          const currentWorkflows = mappedWorkflowsRef.current;
          
          const updatedWorkflows = await Promise.all(currentWorkflows.map(async (workflow) => {
            let updatedTasks = workflow.tasks;
            if (clickUpToken === 'mock_token') {
              updatedTasks = buildTaskTree(MOCK_CLICKUP_DATA.tasks[workflow.listId] || []);
            } else {
              try {
                let page = 0, hasMore = true, allFetchedTasks = [];
                while (hasMore) {
                    const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=true&include_closed=true&page=${page}`, clickUpToken);
                    const tasksChunk = data.tasks || [];
                    allFetchedTasks.push(...tasksChunk);
                    if (tasksChunk.length === 100) page++; else hasMore = false;
                }
                updatedTasks = buildTaskTree(allFetchedTasks);
              } catch (err) {
                console.error(`Error syncing list ${workflow.listId}`, err);
              }
            }
            return { ...workflow, tasks: updatedTasks, lastSynced: Date.now() };
          }));

          setMappedWorkflows(updatedWorkflows);
          localStorage.setItem('weaver_workflows', JSON.stringify(updatedWorkflows));
          setIsAutoSyncing(false);
        }, 15000);
        return () => clearInterval(syncInterval);
      }, [mappedWorkflows.length, clickUpToken]);

      // --- Authentication Engine ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            setUser({
              uid: currentUser.uid,
              name: currentUser.isAnonymous ? 'Preview User' : (currentUser.displayName || 'User'),
              email: currentUser.email || 'preview@weaver.app',
              avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.isAnonymous ? 'Preview+User' : encodeURIComponent(currentUser.displayName || 'User')}`,
              isAnonymous: currentUser.isAnonymous
            });
          } else {
            setUser(null);
          }
          setAuthInitialized(true);
        });
        return () => unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true); setErrorMessage(null);
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain' || error.message.includes('iframe') || error.code === 'auth/popup-closed-by-user') {
            console.warn("Popup blocked. Falling back to Anonymous Auth for persistence.");
            try { await auth.signInAnonymously(); } catch (anonErr) { setErrorMessage(anonErr.message); }
          } else { setErrorMessage(error.message); }
        } finally { setIsLoggingIn(false); }
      };

      const handleMockLoginBypass = async () => {
         setIsLoggingIn(true); setErrorMessage(null);
         try { await auth.signInAnonymously(); } catch (err) { setErrorMessage(err.message); } finally { setIsLoggingIn(false); }
      };

      const handleLogout = () => {
        if (auth.currentUser) auth.signOut();
        localStorage.removeItem('weaver_clickup_token');
        localStorage.removeItem('weaver_workflows');
        setClickUpToken(''); setTeams([]); setMappedWorkflows([]);
        setIntegrationStep('idle'); setIsSwitchModalOpen(false);
      };

      const toggleTaskExpand = (taskId) => {
        setExpandedTasks(prev => ({ ...prev, [taskId]: !prev[taskId] }));
      };

      const handleLogTime = async () => {
        if ((!timeHours && !timeMinutes) || !timeTrackModalTask) return;
        const durationMs = (Number(timeHours) * 3600000) + (Number(timeMinutes) * 60000);
        const startMs = new Date(timeDate).getTime();
        const teamId = mappedWorkflows[0]?.teamId || teams.find(t => t.name === mappedWorkflows[0]?.team)?.id;

        let isSyncSuccess = false;

        if (clickUpToken !== 'mock_token') {
            if (!teamId) { alert("Workspace ID missing. Please reconnect list."); return; }
            try {
              const payload = { start: startMs, duration: durationMs, tid: timeTrackModalTask.id, description: timeNotes };
              if (timeAssignee && timeAssignee !== 'me') {
                  const parsed = parseInt(timeAssignee);
                  if (!isNaN(parsed)) payload.assignee = parsed;
              }
              await fetchClickUp(`team/${teamId}/time_entries`, clickUpToken, 'POST', payload);
              isSyncSuccess = true;
            } catch (err) {
              console.error("Failed to log time to ClickUp", err);
              alert("Failed to sync with ClickUp.\nError: " + err.message + "\n\nDon't worry! Time was saved locally.");
            }
        }

        if (isSyncSuccess) {
            setMappedWorkflows(prev => prev.map(wf => {
                const updateTree = (tasks) => tasks.map(t => {
                    if (t.id === timeTrackModalTask.id) return { ...t, time_spent: (parseInt(t.time_spent) || 0) + durationMs };
                    if (t.subtasks && t.subtasks.length > 0) return { ...t, subtasks: updateTree(t.subtasks) };
                    return t;
                });
                return { ...wf, tasks: updateTree(wf.tasks) };
            }));
        } else {
            setUnsyncedTime(prev => {
                const newState = { ...prev, [timeTrackModalTask.id]: (prev[timeTrackModalTask.id] || 0) + durationMs };
                saveSettings({ unsyncedTime: newState });
                return newState;
            });
        }
        setTimeTrackModalTask(null); setTimeHours(''); setTimeMinutes(''); setTimeNotes('');
      };

      if (!authInitialized) {
        return <div className="min-h-screen bg-slate-950 flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;
      }

      if (user) {
        const doneStatuses = ['closed', 'complete', 'done', 'resolved'];
        
        let totalEstimateMs = 0;
        let totalRemainingMs = 0;
        let totalSpentMs = 0;
        let activeTasksCount = 0;
        let resolvedTodayCount = 0;
        
        const assigneeStats = {};
        let minDate = Infinity;
        let maxDate = 0;

        mappedWorkflows.forEach(wf => {
          const processTask = (t) => {
            const isDone = doneStatuses.includes(t.status?.status?.toLowerCase());
            if (!isDone) activeTasksCount++;
            
            if (isDone && t.date_closed) {
              const closedDate = new Date(parseInt(t.date_closed));
              const today = new Date();
              if (closedDate.toDateString() === today.toDateString()) resolvedTodayCount++;
            }

            if (t.start_date) minDate = Math.min(minDate, parseInt(t.start_date));
            if (t.due_date) maxDate = Math.max(maxDate, parseInt(t.due_date));

            const estimate = t.time_estimate ? parseInt(t.time_estimate) : 0;
            let spent = 0;
            if (t.time_spent) spent = parseInt(t.time_spent);
            else if (isDone) spent = estimate;
            spent += (unsyncedTime[t.id] || 0);

            const remaining = isDone ? 0 : Math.max(0, estimate - spent);
            totalEstimateMs += estimate;
            totalRemainingMs += remaining;
            totalSpentMs += spent;

            if (t.assignees) {
              t.assignees.forEach(assignee => {
                const username = assignee.username;
                if (!assigneeStats[username]) {
                  assigneeStats[username] = { username, profilePicture: assignee.profilePicture, statusCounts: {}, totalEstMs: 0, totalSpentMs: 0, assignedTasks: [] };
                }
                const statusName = t.status?.status || 'Open';
                if (!assigneeStats[username].statusCounts[statusName]) assigneeStats[username].statusCounts[statusName] = { count: 0, color: t.status?.color };
                assigneeStats[username].statusCounts[statusName].count++;
                assigneeStats[username].totalEstMs += estimate;
                assigneeStats[username].totalSpentMs += spent;
                assigneeStats[username].assignedTasks.push(t);
              });
            }

            if (t.subtasks && t.subtasks.length > 0) t.subtasks.forEach(processTask);
          };
          (wf.tasks || []).forEach(processTask);
        });

        if (minDate === Infinity) minDate = Date.now() - (7 * 86400000);
        if (maxDate === 0) maxDate = Date.now() + (7 * 86400000);
        const totalDurationDays = Math.max(1, Math.ceil((maxDate - minDate) / 86400000));
        const blockerDays = dateBlockers.reduce((acc, b) => acc + parseInt(b.days || 0), 0);
        const bucketDurationDays = Math.max(1, totalDurationDays - blockerDays);

        const assigneesList = Object.values(assigneeStats).sort((a,b) => b.totalEstMs - a.totalEstMs);
        
        let devCount = 0;
        let qaCount = 0;
        assigneesList.forEach(a => {
           if ((userRoles[a.username] || 'Developer') === 'Developer') devCount++;
           else qaCount++;
        });

        // --- MATH ENGINE: DYNAMIC UTILIZATION ---
        const devCapacityMs = devCount * devHoursPerDay * bucketDurationDays * 3600000;
        const qaCapacityMs = qaCount * qaHoursPerDay * bucketDurationDays * 3600000;
        const totalCapacityMs = devCapacityMs + qaCapacityMs;

        const devDemandMs = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'Developer').reduce((sum, a) => sum + a.totalEstMs, 0);
        const qaDemandMs = assigneesList.filter(a => userRoles[a.username] === 'QA').reduce((sum, a) => sum + a.totalEstMs, 0);
        const totalDemandMs = totalEstimateMs;

        const devUtilPct = devCapacityMs > 0 ? Math.round((devDemandMs / devCapacityMs) * 100) : 0;
        const qaUtilPct = qaCapacityMs > 0 ? Math.round((qaDemandMs / qaCapacityMs) * 100) : 0;
        const totalUtilPct = totalCapacityMs > 0 ? Math.round((totalDemandMs / totalCapacityMs) * 100) : 0;

        const integrationUI = (
          <div className="animate-in fade-in duration-500 w-full">
            {integrationStep === 'idle' && mappedWorkflows.length === 0 && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden flex flex-col md:flex-row items-center justify-between p-8">
                <div className="mb-4 md:mb-0">
                  <h2 className="text-lg font-semibold text-white">Connect your ticketing system</h2>
                  <p className="text-slate-400 mt-1 max-w-xl">Automatically sync your tickets with your development tasks.</p>
                </div>
                <div className="flex gap-3">
                  <button onClick={handleMockClickUpData} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg transition-colors border border-white/10 shadow-lg shrink-0">Try Demo</button>
                  <button onClick={() => { setIsSwitchModalOpen(true); handleConnectClickUp(); }} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors shadow-lg shrink-0">
                    <Settings className="h-4 w-4 mr-2" /> Connect ClickUp
                  </button>
                </div>
              </div>
            )}

            {integrationStep === 'entering_token' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-8">
                <div className="flex items-center mb-6">
                  <div className="bg-indigo-500/10 p-2.5 rounded-lg mr-4 border border-indigo-500/20"><Key className="h-6 w-6 text-indigo-400" /></div>
                  <div><h3 className="text-lg font-semibold text-white">Enter ClickUp API Token</h3></div>
                </div>
                <div className="space-y-4">
                  <input type="password" value={tempToken} onChange={(e) => setTempToken(e.target.value)} placeholder="pk_123456789_..." className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm" />
                  {clickUpError && (
                    <div className="p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-sm text-red-300">
                      <div className="flex items-start mb-3"><AlertTriangle className="h-5 w-5 text-red-400 mr-2 shrink-0 mt-0.5" /><span className="font-medium">{clickUpError}</span></div>
                    </div>
                  )}
                  <div className="flex justify-end space-x-3 pt-2">
                    <button onClick={handleMockClickUpData} className="px-4 py-2 text-sm font-medium text-emerald-400 hover:text-white transition-colors bg-emerald-900/20 rounded-lg border border-emerald-900/50">Try Demo Bypass</button>
                    <button onClick={() => { setIntegrationStep('idle'); setTempToken(''); setClickUpError(null); setIsSwitchModalOpen(false); }} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors rounded-lg">Cancel</button>
                    <button onClick={handleAuthenticateToken} disabled={!tempToken} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50">Authenticate</button>
                  </div>
                </div>
              </div>
            )}

            {integrationStep === 'connecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl p-12 flex flex-col items-center justify-center text-center">
                <RefreshCw className="h-8 w-8 text-indigo-400 animate-spin mb-4" />
                <h3 className="text-lg font-semibold text-white">Fetching Workspace Data</h3>
              </div>
            )}

            {integrationStep === 'selecting' && (
              <div className="bg-slate-900/40 backdrop-blur-md rounded-xl border border-indigo-500/20 shadow-2xl overflow-hidden">
                <div className="bg-indigo-500/10 px-6 py-4 border-b border-indigo-500/20 flex items-center">
                  <div><h3 className="text-lg font-semibold text-white">Map ClickUp Destination</h3></div>
                </div>
                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-1">1. Select Workspace</label>
                    <select value={selectedTeam} onChange={(e) => { setSelectedTeam(e.target.value); setSelectedSpace(''); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                      <option value="">-- Choose a Workspace --</option>
                      {teams.map(team => <option key={team.id} value={team.id}>{team.name}</option>)}
                    </select>
                  </div>
                  {selectedTeam && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">2. Select Space</label>
                      <select value={selectedSpace} onChange={(e) => { setSelectedSpace(e.target.value); setSelectedFolder(''); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Choose a Space --</option>
                        {spaces.map(space => <option key={space.id} value={space.id}>{space.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">3. Select Folder (Optional)</label>
                      <select value={selectedFolder} onChange={(e) => { setSelectedFolder(e.target.value); setSelectedList(''); }} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Folderless --</option>
                        {folders.map(folder => <option key={folder.id} value={folder.id}>{folder.name}</option>)}
                      </select>
                    </div>
                  )}
                  {selectedSpace && (
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">4. Select Task List</label>
                      <select value={selectedList} onChange={(e) => setSelectedList(e.target.value)} className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Choose a List --</option>
                        {availableLists.map(list => <option key={list.id} value={list.id}>{list.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="pt-4 flex justify-end space-x-3 border-t border-white/5">
                    <button onClick={() => { setIntegrationStep('idle'); setIsSwitchModalOpen(false); }} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white rounded-lg">Cancel</button>
                    <button disabled={!selectedList} onClick={handleAddMapping} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg disabled:opacity-50 flex items-center"><CheckCircle2 className="h-4 w-4 mr-2" /> Select List</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-slate-950 font-sans text-slate-100 relative">
            <WebNestBackground opacity={0.35} />
            {user.isAnonymous && (
              <div className="relative z-30 bg-amber-950/30 border-b border-amber-900/50 px-4 py-3 text-amber-300 text-sm flex justify-center items-center text-center backdrop-blur-md">
                <span className="font-semibold mr-2">Preview Mode:</span> Logged in anonymously to ensure capacity settings persist locally.
              </div>
            )}

            <nav className="relative z-30 bg-slate-950/50 backdrop-blur-md border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button className="text-slate-400 hover:text-white"><Bell className="h-5 w-5" /></button>
                    <div className="h-8 w-8 rounded-full bg-indigo-950/50 overflow-hidden border border-white/10">
                      <img src={user.avatar} alt="Avatar" className="h-full w-full object-cover" />
                    </div>
                    <button onClick={handleLogout} className="flex items-center text-sm font-medium text-slate-400 hover:text-white"><LogOut className="h-4 w-4 mr-1" /> Sign out</button>
                  </div>
                </div>
              </div>
            </nav>

            {mappedWorkflows.length === 0 ? (
              <main className="relative z-25 max-w-3xl mx-auto px-4 py-16">
                <div className="text-center mb-10">
                  <h1 className="text-3xl font-bold text-white tracking-tight">Welcome to Weaver!</h1>
                  <p className="text-slate-400 mt-3 text-lg">Connect your task tracking system to pull in your assignments.</p>
                </div>
                {integrationUI}
              </main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 py-8 animate-in fade-in duration-500">
                <div className="flex justify-between items-center mb-8">
                  <div>
                    <h1 className="text-2xl font-bold text-white">Your Workspace</h1>
                    <p className="text-slate-400 mt-1 flex items-center">
                      <FolderOpen className="w-4 h-4 mr-2" />
                      {mappedWorkflows[0]?.team} / {mappedWorkflows[0]?.space} / {mappedWorkflows[0]?.list}
                    </p>
                  </div>
                  <div className="flex items-center space-x-3">
                    {isAutoSyncing ? (
                      <span className="flex items-center text-xs font-medium text-indigo-400 bg-indigo-500/10 px-3 py-1.5 rounded-full border border-indigo-500/20"><RefreshCw className="h-3.5 w-3.5 mr-1.5 animate-spin" /> Syncing...</span>
                    ) : (
                      <span className="flex items-center text-xs font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20"><div className="h-2 w-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></div> Auto-sync On</span>
                    )}
                    <button onClick={() => setIsSwitchModalOpen(true)} className="flex items-center px-4 py-2 bg-slate-900 border border-white/10 hover:bg-slate-800 text-white text-sm font-medium rounded-lg transition-colors">
                      <RefreshCw className="h-4 w-4 mr-2" /> Switch Connection
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-indigo-500/10 p-3 rounded-lg border border-indigo-500/20"><CheckSquare className="h-6 w-6 text-indigo-400" /></div>
                    <div><p className="text-sm font-medium text-slate-400">Active Tasks</p><p className="text-2xl font-bold text-white mt-1">{activeTasksCount}</p></div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20"><CheckCircle2 className="h-6 w-6 text-emerald-400" /></div>
                    <div><p className="text-sm font-medium text-slate-400">Resolved Today</p><p className="text-2xl font-bold text-white mt-1">{resolvedTodayCount}</p></div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20"><Clock className="h-6 w-6 text-blue-400" /></div>
                    <div><p className="text-sm font-medium text-slate-400">Total Tracked Hours</p><p className="text-2xl font-bold text-white mt-1">{Math.round(totalSpentMs / 3600000)}h</p></div>
                  </div>
                </div>

                {/* Utilization Section */}
                <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="flex items-center space-x-2 mb-6">
                    <Target className="h-5 w-5 text-indigo-400" />
                    <h2 className="text-lg font-semibold text-white">Utilization Breakdown</h2>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
                      {/* Overall Utilization */}
                      <div className="bg-slate-950/30 p-5 rounded-xl border border-white/5 flex flex-col justify-between">
                        <div className="flex justify-between items-start mb-4">
                          <span className="text-sm font-medium text-slate-300">Bucket Utilization</span>
                          <MetricTooltip position="bottom" text={`How much of the total team capacity is consumed by estimated tasks.`} formula={`(${Math.round(totalDemandMs/3600000)} Demand Hrs) / (${Math.round(totalCapacityMs/3600000)} Capacity Hrs)`}>
                            <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <div>
                          <div className="text-4xl font-extrabold text-white mb-2">{totalUtilPct}%</div>
                          <div className="w-full bg-slate-900 border border-white/10 rounded-full h-2.5 mb-1 overflow-hidden">
                            <div className={`h-2.5 rounded-full ${totalUtilPct > 100 ? 'bg-red-500' : 'bg-indigo-500'}`} style={{ width: `${Math.min(totalUtilPct, 100)}%` }}></div>
                          </div>
                          <div className="flex justify-between text-[10px] text-slate-400 uppercase tracking-wider font-semibold">
                            <span>Demand: {Math.round(totalDemandMs / 3600000)}h</span>
                            <span>Cap: {Math.round(totalCapacityMs / 3600000)}h</span>
                          </div>
                        </div>
                      </div>

                      {/* Developer Utilization */}
                      <div className="bg-slate-950/30 p-5 rounded-xl border border-white/5 flex flex-col justify-between">
                        <div className="flex justify-between items-start mb-4">
                          <span className="text-sm font-medium text-slate-300">Developer Load</span>
                          <MetricTooltip position="bottom" text={`Load on users tagged as "Developer".`} formula={`(${Math.round(devDemandMs/3600000)} Demand Hrs) / (${devCount} Devs * ${devHoursPerDay} hrs * ${bucketDurationDays} days)`}>
                            <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <div>
                          <div className="text-4xl font-extrabold text-white mb-2">{devUtilPct}%</div>
                          <div className="w-full bg-slate-900 border border-white/10 rounded-full h-2.5 mb-1 overflow-hidden">
                            <div className={`h-2.5 rounded-full ${devUtilPct > 100 ? 'bg-red-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(devUtilPct, 100)}%` }}></div>
                          </div>
                          <div className="flex justify-between text-[10px] text-slate-400 uppercase tracking-wider font-semibold">
                            <span>Demand: {Math.round(devDemandMs / 3600000)}h</span>
                            <span>Cap: {Math.round(devCapacityMs / 3600000)}h</span>
                          </div>
                        </div>
                      </div>

                      {/* QA Utilization */}
                      <div className="bg-slate-950/30 p-5 rounded-xl border border-white/5 flex flex-col justify-between">
                        <div className="flex justify-between items-start mb-4">
                          <span className="text-sm font-medium text-slate-300">QA Load</span>
                          <MetricTooltip position="bottom" text={`Load on users tagged as "QA".`} formula={`(${Math.round(qaDemandMs/3600000)} Demand Hrs) / (${qaCount} QA * ${qaHoursPerDay} hrs * ${bucketDurationDays} days)`}>
                            <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <div>
                          <div className="text-4xl font-extrabold text-white mb-2">{qaUtilPct}%</div>
                          <div className="w-full bg-slate-900 border border-white/10 rounded-full h-2.5 mb-1 overflow-hidden">
                            <div className={`h-2.5 rounded-full ${qaUtilPct > 100 ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(qaUtilPct, 100)}%` }}></div>
                          </div>
                          <div className="flex justify-between text-[10px] text-slate-400 uppercase tracking-wider font-semibold">
                            <span>Demand: {Math.round(qaDemandMs / 3600000)}h</span>
                            <span>Cap: {Math.round(qaCapacityMs / 3600000)}h</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Capacity Limits & Settings Widget */}
                    <div className="border-l border-white/5 pl-8 space-y-4">
                       <div className="flex items-center justify-between">
                          <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            Capacity Limits
                            <MetricTooltip align="center" position="bottom" text="Available resource limits for the sprint." formula="Resources = Unique Assignees. Duration = Working Days - (Holidays + Events).">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </h4>
                          <button onClick={() => setIsBlockerModalOpen(true)} className="p-1.5 bg-slate-800 hover:bg-indigo-600 rounded-md transition-colors shadow-sm border border-white/10 group" title="Configure Capacity Settings">
                            <Settings className="w-4 h-4 text-slate-300 group-hover:text-white" />
                          </button>
                       </div>
                       <div className="grid grid-cols-1 gap-3">
                         <div className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                           <div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-blue-400" /><span className="text-sm">Developers</span></div>
                           <span className="text-lg font-bold text-white">{devCount} <span className="text-xs text-slate-500">({devHoursPerDay}h)</span></span>
                         </div>
                         <div className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                           <div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-emerald-400" /><span className="text-sm">QA Resources</span></div>
                           <span className="text-lg font-bold text-white">{qaCount} <span className="text-xs text-slate-500">({qaHoursPerDay}h)</span></span>
                         </div>
                         <div className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                           <div className="flex items-center text-slate-300"><Calendar className="w-4 h-4 mr-2 text-sky-400" /><span className="text-sm">Sprint Days</span></div>
                           <span className="text-lg font-bold text-white">{bucketDurationDays}</span>
                         </div>
                       </div>
                    </div>
                  </div>
                </div>

                {/* Task Explorer */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl overflow-hidden">
                  <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex justify-between items-center">
                    <h2 className="text-lg font-semibold text-white flex items-center">
                      <ListTodo className="h-5 w-5 mr-2 text-indigo-400" /> Active Tasks Explorer
                    </h2>
                    <div className="relative">
                      <Search className="h-4 w-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                      <input 
                        type="text" 
                        placeholder="Search tasks..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="pl-9 pr-4 py-2 bg-slate-950/60 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 w-64"
                      />
                    </div>
                  </div>
                  <div className="p-4">
                    {mappedWorkflows.map(wf => {
                      let tasksToShow = wf.tasks || [];
                      if (searchQuery) {
                        const q = searchQuery.toLowerCase();
                        const filterTree = (nodes) => {
                          return nodes.map(n => {
                            const match = n.name.toLowerCase().includes(q);
                            const children = filterTree(n.subtasks || []);
                            if (match || children.length > 0) return { ...n, subtasks: children };
                            return null;
                          }).filter(Boolean);
                        };
                        tasksToShow = filterTree(tasksToShow);
                      }

                      return (
                        <div key={wf.id}>
                          {tasksToShow.length > 0 ? (
                            tasksToShow.map(task => (
                              <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} onOpenTimeTrackModal={setTimeTrackModalTask} unsyncedTime={unsyncedTime} />
                            ))
                          ) : (
                            <div className="text-center py-8 text-slate-500 text-sm">No tasks match your search or current view.</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </main>
            )}

            {/* --- Modals --- */}
            {isSwitchModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl relative">
                   <div className="p-6 border-b border-white/5 sticky top-0 bg-slate-900/95 backdrop-blur-md z-10 flex justify-between items-center">
                      <h2 className="text-xl font-bold text-white flex items-center"><RefreshCw className="h-5 w-5 mr-2 text-indigo-400" /> Switch Workspace</h2>
                      <button onClick={() => setIsSwitchModalOpen(false)} className="text-slate-400 hover:text-white">&times;</button>
                   </div>
                   <div className="p-6">
                      {integrationUI}
                   </div>
                </div>
              </div>
            )}

            {isBlockerModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl">
                  <div className="p-6 border-b border-white/5 sticky top-0 bg-slate-900/95 backdrop-blur-md z-10 flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white flex items-center"><Settings className="h-5 w-5 mr-2 text-indigo-400" /> Capacity Settings</h2>
                    <button onClick={() => setIsBlockerModalOpen(false)} className="text-slate-400 hover:text-white p-1">&times;</button>
                  </div>
                  <div className="p-6 space-y-8">
                    <div>
                      <h3 className="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">1. Daily Working Hours</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-[10px] text-slate-400 mb-1.5 uppercase font-semibold">Developers</label>
                          <input type="number" min="1" max="24" value={devHoursPerDay} onChange={e => { const val = Number(e.target.value); setDevHoursPerDay(val); saveSettings({ devHoursPerDay: val }); }} className="w-full bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-white focus:ring-1 focus:ring-indigo-500" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-400 mb-1.5 uppercase font-semibold">QA Resources</label>
                          <input type="number" min="1" max="24" value={qaHoursPerDay} onChange={e => { const val = Number(e.target.value); setQaHoursPerDay(val); saveSettings({ qaHoursPerDay: val }); }} className="w-full bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-white focus:ring-1 focus:ring-indigo-500" />
                        </div>
                      </div>
                    </div>

                    <div className="border-t border-white/5 pt-6">
                      <h3 className="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">2. Manage Blockers</h3>
                      <div className="flex gap-3 mb-4">
                        <input type="number" min="1" value={newBlockerDays} onChange={(e) => setNewBlockerDays(e.target.value)} className="w-20 bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-white text-sm" placeholder="Days" />
                        <select value={newBlockerRemark} onChange={(e) => setNewBlockerRemark(e.target.value)} className="flex-1 bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-white text-sm">
                          <option value="Holiday">Holiday (Global)</option>
                          <option value="Event">Event (Global)</option>
                        </select>
                        <button onClick={() => { if (!newBlockerDays || newBlockerDays <= 0) return; const newBlockers = [...dateBlockers, { id: Date.now().toString(), days: parseInt(newBlockerDays), remark: newBlockerRemark }]; setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); setNewBlockerDays(1); }} className="bg-indigo-600 hover:bg-indigo-500 px-4 rounded-lg text-white font-medium text-sm transition-colors shadow-sm">Add</button>
                      </div>
                      <ul className="space-y-2">
                        {dateBlockers.map(b => (
                          <li key={b.id} className="bg-slate-950/50 p-3 rounded-lg border border-white/5 flex justify-between items-center text-sm">
                            <span className="font-semibold text-slate-200">{b.remark} <span className="text-slate-400 font-normal">({b.days} days)</span></span>
                            <button onClick={() => { const newBlockers = dateBlockers.filter(x => x.id !== b.id); setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); }} className="text-slate-500 hover:text-red-400"><Trash2 className="w-4 h-4" /></button>
                          </li>
                        ))}
                      </ul>
                    </div>

                    <div className="border-t border-white/5 pt-6">
                      <h3 className="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">3. Team Roles</h3>
                      <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                        {assigneesList.map(a => (
                          <div key={a.username} className="flex items-center justify-between p-3 bg-slate-950/30 rounded-xl border border-white/5">
                            <div className="flex items-center space-x-3">
                              <img src={a.profilePicture} alt="" className="w-8 h-8 rounded-full border border-white/10 bg-slate-800 object-cover" />
                              <span className="text-sm font-semibold text-white">{a.username}</span>
                            </div>
                            <select value={userRoles[a.username] || 'Developer'} onChange={(e) => { const nextRoles = {...userRoles, [a.username]: e.target.value}; setUserRoles(nextRoles); saveSettings({ userRoles: nextRoles }); }} className="bg-slate-900 border border-white/10 text-indigo-300 text-xs font-semibold uppercase rounded-lg px-2 py-1 cursor-pointer outline-none">
                              <option value="Developer">Developer</option>
                              <option value="QA">QA</option>
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {timeTrackModalTask && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-md shadow-2xl">
                  <div className="p-5 border-b border-white/5 flex justify-between items-center">
                    <h2 className="text-lg font-bold text-white flex items-center"><Play className="h-4 w-4 mr-2 text-emerald-400" /> Log Time</h2>
                    <button onClick={() => setTimeTrackModalTask(null)} className="text-slate-400 hover:text-white">&times;</button>
                  </div>
                  <div className="p-6 space-y-4">
                    <div className="bg-slate-950/50 p-3 rounded-lg border border-white/5 mb-4">
                      <p className="text-xs text-slate-400 mb-1">Task</p>
                      <p className="text-sm font-semibold text-slate-200">{timeTrackModalTask.name}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Hours</label>
                        <input type="number" min="0" value={timeHours} onChange={(e) => setTimeHours(e.target.value)} className="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Minutes</label>
                        <input type="number" min="0" max="59" value={timeMinutes} onChange={(e) => setTimeMinutes(e.target.value)} className="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="0" />
                      </div>
                    </div>

                    <div>
                       <label className="block text-xs font-medium text-slate-300 mb-1">Assign To</label>
                       <select value={timeAssignee} onChange={(e) => setTimeAssignee(e.target.value)} className="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 text-sm">
                         <option value="me">Myself</option>
                         {mappedWorkflows[0]?.members?.map(m => (
                           <option key={m.user?.id} value={m.user?.id}>{m.user?.username}</option>
                         ))}
                       </select>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Date</label>
                      <input type="date" value={timeDate} onChange={(e) => setTimeDate(e.target.value)} className="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" />
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Notes (Optional)</label>
                      <textarea value={timeNotes} onChange={(e) => setTimeNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 text-sm h-20" placeholder="What did you work on?"></textarea>
                    </div>

                    <div className="pt-4 flex justify-end space-x-3">
                      <button onClick={() => setTimeTrackModalTask(null)} className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white rounded-lg">Cancel</button>
                      <button onClick={handleLogTime} disabled={!timeHours && !timeMinutes} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg disabled:opacity-50">Save Time</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      // --- LOGIN VIEW ---
      return (
        <div className="min-h-screen bg-slate-900 flex font-sans relative overflow-hidden">
          <WebNestBackground opacity={0.85} />
          <div className="absolute inset-0 bg-radial-vignette pointer-events-none z-10"></div>

          <div className="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative z-20">
            <div className="max-w-md bg-slate-900/40 backdrop-blur-md p-8 rounded-[2rem] border border-white/5 shadow-2xl">
              <div className="flex items-center mb-8">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20"><SpiderNetworkIcon className="h-8 w-8 text-white" /></div>
                <span className="ml-3 text-3xl font-extrabold text-white">Weaver</span>
              </div>
              <h1 className="text-4xl font-bold text-white leading-tight mb-6">Thread your support and development together.</h1>
              <p className="text-lg text-slate-300 mb-8 leading-relaxed font-medium">Weaver creates a seamless bridge between your front-line ticketing apps and your back-office task managers.</p>
            </div>
          </div>

          <div className="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-24 relative z-20 bg-slate-950/20 backdrop-blur-[4px] border-l border-white/10 shadow-[-20px_0_50px_rgba(0,0,0,0.3)]">
            <div className="absolute top-8 left-8 flex items-center lg:hidden bg-slate-900/60 backdrop-blur-xl px-4 py-2 rounded-2xl border border-white/10">
              <SpiderNetworkIcon className="h-6 w-6 text-indigo-400" /><span className="ml-2 text-xl font-bold text-white">Weaver</span>
            </div>

            <div className="w-full max-w-sm space-y-8 bg-slate-900/30 backdrop-blur-2xl p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-white/10">
              <div>
                <h2 className="text-3xl font-bold text-white">Welcome back</h2>
                <p className="mt-2 text-sm text-slate-400">Sign in to your account to continue.</p>
              </div>

              <div className="mt-8 space-y-4">
                <button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full flex items-center justify-center px-4 py-3 border border-slate-700/60 bg-slate-800/80 hover:bg-slate-800 text-sm font-medium text-slate-100 rounded-xl transition-all disabled:opacity-70">
                  {isLoggingIn ? <span className="animate-pulse">Connecting...</span> : 'Sign in with Google'}
                </button>

                <button onClick={handleMockLoginBypass} disabled={isLoggingIn} className="w-full flex items-center justify-center px-4 py-3 border border-indigo-500/30 bg-indigo-900/20 hover:bg-indigo-900/40 text-sm font-medium text-indigo-300 rounded-xl transition-all">
                  Bypass Login (Preview Mode)
                </button>

                {errorMessage && (
                  <div className="p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300">
                    <p className="font-semibold">{errorMessage}</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
