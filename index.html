                                <button onClick={() => setDateBlockers(prev => prev.filter(x => x.id !== b.id))} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors">
                                  <Trash2 className="w-4 h-4" />
                                </button>
                             </li>
                           ))}
                         </ul>
                       )}
                     </div>

                     <div className="bg-slate-950/40 p-4 rounded-xl border border-white/5 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Add New Blocker</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">No. of Days</label>
                            <input 
                              type="number" 
                              min="1" 
                              value={newBlockerDays} 
                              onChange={e => setNewBlockerDays(e.target.value)} 
                              className="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" 
                            />
                          </div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Remarks</label>
                            <select 
                              value={newBlockerRemark} 
                              onChange={e => setNewBlockerRemark(e.target.value)} 
                              className="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer"
                            >
                              <option value="Holiday">Holiday</option>
                              <option value="Company Event">Company Event</option>
                              <option value="Leave">Leave</option>
                            </select>
                          </div>
                        </div>
                        {newBlockerRemark === 'Leave' && (
                          <div className="animate-in fade-in slide-in-from-top-1">
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Team Member</label>
                            <select 
                              value={newBlockerAssignee || (assigneesList[0]?.username || '')} 
                              onChange={e => setNewBlockerAssignee(e.target.value)} 
                              className="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer"
                            >
                              {assigneesList.map(a => <option key={a.username} value={a.username}>{a.username}</option>)}
                            </select>
                          </div>
                        )}
                        <button 
                          onClick={() => {
                            if (!newBlockerDays || newBlockerDays <= 0) return;
                            setDateBlockers(prev => [...prev, {
                              id: Date.now().toString(),
                              days: parseInt(newBlockerDays),
                              remark: newBlockerRemark,
                              assignee: newBlockerRemark === 'Leave' ? (newBlockerAssignee || assigneesList[0]?.username) : null
                            }]);
                            setNewBlockerDays(1); // Reset day count for UX
                          }}
                          className="w-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors shadow-sm"
                        >
                          <Plus className="w-4 h-4 mr-1.5" /> Add Date Blocker
                        </button>
                     </div>
                   </div>
                </div>
              </div>
            )}

            {/* Modal for Ticket Details & Comments */}
            {selectedTicketForModal && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                  {/* Modal Header */}
                  <div className="flex items-center justify-between p-6 border-b border-white/5 bg-slate-900/50">
                    <div>
                      <div className="flex items-center space-x-2 mb-2">
                        <span className="text-xs font-mono text-slate-500 uppercase">#{selectedTicketForModal.id}</span>
                        <span 
                          className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border"
                          style={{ 
                            color: selectedTicketForModal.status?.color || '#94a3b8', 
                            backgroundColor: `${selectedTicketForModal.status?.color || '#94a3b8'}15`, 
                            borderColor: `${selectedTicketForModal.status?.color || '#94a3b8'}30` 
                          }}
                        >
                          {selectedTicketForModal.status?.status || 'Open'}
                        </span>
                      </div>
                      <h2 className="text-xl font-bold text-white">{selectedTicketForModal.name}</h2>
                    </div>
                    <button 
                      onClick={() => setSelectedTicketForModal(null)}
                      className="p-2 rounded-lg text-slate-400 hover:bg-white/5 hover:text-white transition-colors"
                    >
                      <XIcon className="h-5 w-5" />
                    </button>
                  </div>

                  {/* Modal Body (Scrollable) */}
                  <div className="flex-1 overflow-y-auto p-6 space-y-6">
                    {/* Description Section */}
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Description</h3>
                      <div className="bg-slate-950/50 border border-white/5 p-4 rounded-xl text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                        {selectedTicketForModal.description || "No description provided."}
                      </div>
                    </div>

                    {/* Metadata Section */}
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-slate-950/30 border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Time Estimate</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300">
                           <Clock className="h-4 w-4 mr-2 text-indigo-400" />
                           {selectedTicketForModal.time_estimate ? `${Math.round(parseInt(selectedTicketForModal.time_estimate)/3600000)} Hours` : 'Not set'}
                         </div>
                      </div>
                      <div className="bg-slate-950/30 border border-white/5 p-4 rounded-xl">
                         <h3 className="text-xs font-semibold text-slate-500 mb-2 uppercase">Priority</h3>
                         <div className="flex items-center text-sm font-medium text-slate-300 capitalize">
                           <Flag className="h-4 w-4 mr-2" style={{ color: selectedTicketForModal.priority?.color || '#94a3b8' }} />
                           {selectedTicketForModal.priority?.priority || 'None'}
                         </div>
                      </div>
                    </div>

                    {/* Comments Thread */}
                    <div>
                      <h3 className="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider flex items-center">
                        <MessageSquare className="h-4 w-4 mr-2" /> Comments
                      </h3>
                      <div className="space-y-4">
                        {(!localMockComments[selectedTicketForModal.id] || localMockComments[selectedTicketForModal.id].length === 0) ? (
                          <p className="text-sm text-slate-500 italic p-4 bg-slate-950/30 rounded-xl text-center border border-white/5">No comments yet. Start the conversation!</p>
                        ) : (
                          localMockComments[selectedTicketForModal.id].map(comment => (
                            <div key={comment.id} className="bg-slate-950/50 border border-white/5 p-4 rounded-xl flex space-x-3">
                              <img src={comment.user?.profilePicture} alt="User" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800" />
                              <div>
                                <div className="flex items-baseline space-x-2 mb-1">
                                  <span className="font-semibold text-sm text-slate-200">{comment.user?.username}</span>
                                  <span className="text-xs text-slate-500">{new Date(parseInt(comment.date)).toLocaleString()}</span>
                                </div>
                                <p className="text-sm text-slate-300">{comment.comment_text}</p>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Modal Footer / Comment Input */}
                  <div className="p-4 border-t border-white/5 bg-slate-950">
                    <div className="flex items-start space-x-3">
                      <img src={user.avatar} alt="You" className="w-8 h-8 rounded-full border border-slate-700 bg-slate-800 shrink-0" />
                      <div className="flex-1 relative">
                        <textarea 
                          value={commentText}
                          onChange={(e) => setCommentText(e.target.value)}
                          placeholder="Write a comment or status update..."
                          className="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-3 pr-12 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-16"
                        />
                        <button 
                          onClick={handleSendComment}
                          disabled={!commentText.trim()}
                          className="absolute right-2 bottom-2 p-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {user.isMock && (
              <div className="relative z-30 bg-amber-950/30 border-b border-amber-900/50 px-4 py-3 text-amber-300 text-sm flex justify-center items-center text-center backdrop-blur-md">
                <span className="font-semibold mr-2">Preview Mode:</span> 
                You are logged in with a mock account because this preview domain is not authorized in your Firebase console.
              </div>
            )}

            <nav className="relative z-30 bg-slate-950/50 backdrop-blur-md border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button className="text-slate-400 hover:text-white transition-colors">
                      <Bell className="h-5 w-5" />
                    </button>
                    <div className="h-8 w-8 rounded-full bg-indigo-950/50 flex items-center justify-center overflow-hidden border border-white/10 cursor-pointer">
                      <img src={user.avatar} alt={user.name} className="h-full w-full object-cover" />
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="flex items-center text-sm font-medium text-slate-400 hover:text-white transition-colors"
                    >
                      <LogOut className="h-4 w-4 mr-1" />
                      Sign out
                    </button>
                  </div>
                </div>
              </div>
            </nav>

            {mappedWorkflows.length === 0 ? (
              <main className="relative z-25 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 mb-6 border border-indigo-500/20 shadow-inner">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400 animate-pulse" />
                  </div>
                  <h1 className="text-3xl font-bold text-white tracking-tight">Welcome to Weaver, {user.name.split(' ')[0]}!</h1>
                  <p className="text-slate-400 mt-3 text-lg max-w-xl mx-auto">
                    Before we build your dashboard, let's connect your task tracking system to pull in your assignments.
                  </p>
                </div>
                {integrationUI}
              </main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-in fade-in duration-500">
                
                {/* 0. Connection Path & Source (TOP MOST) */}
                {mappedWorkflows.length > 0 && (
                  <div className="mb-6 bg-slate-900/60 p-4 rounded-2xl border border-indigo-500/30 shadow-lg backdrop-blur-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4 relative z-[80] animate-in slide-in-from-top-4">
                    <div className="flex items-center gap-3 w-full min-w-0">
                      <div className="bg-indigo-500/20 p-2 rounded-lg border border-indigo-500/30 shadow-inner hidden sm:block shrink-0">
                        <SpiderNetworkIcon className="h-5 w-5 text-indigo-400" />
                      </div>

                      <div className="flex items-center flex-wrap text-sm text-slate-400 gap-1.5 min-w-0 flex-1">
                        <span className="flex items-center shrink-0 max-w-[100px] sm:max-w-[200px]" title={mappedWorkflows[0].team}>
                          <Box className="h-4 w-4 mr-1.5 text-slate-500 shrink-0" /> 
                          <span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].team}</span>
                        </span>
                        <ChevronRight className="h-4 w-4 text-slate-600 shrink-0" />
                        <span className="flex items-center shrink-0 max-w-[100px] sm:max-w-[200px]" title={mappedWorkflows[0].space}>
                          <span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].space}</span>
                        </span>
                        {mappedWorkflows[0].folder !== 'No Folder' && (
                          <>
                            <ChevronRight className="h-4 w-4 text-slate-600 shrink-0" />
                            <span className="flex items-center shrink-0 max-w-[100px] sm:max-w-[200px]" title={mappedWorkflows[0].folder}>
                              <FolderOpen className="h-4 w-4 mr-1.5 text-slate-500 shrink-0" /> 
                              <span className="truncate text-slate-300 font-medium">{mappedWorkflows[0].folder}</span>
                            </span>
                          </>
                        )}
                        <ChevronRight className="h-4 w-4 text-slate-600 shrink-0" />
                        <span className="font-bold text-indigo-300 flex items-center bg-indigo-500/10 px-2.5 py-0.5 rounded-md border border-indigo-500/20 shadow-sm shrink-0 max-w-[140px] sm:max-w-[250px]" title={mappedWorkflows[0].list}>
                          <ListTodo className="h-4 w-4 mr-1.5 shrink-0" /> 
                          <span className="truncate">{mappedWorkflows[0].list}</span>
                        </span>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                       <button
                         onClick={() => {
                           setIsSwitchModalOpen(true);
                           handleConnectClickUp();
                         }}
                         className="flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition-colors border border-white/10 shadow-sm"
                       >
                         <RefreshCw className="h-3.5 w-3.5 mr-2 text-indigo-400" />
                         Switch Connection
                       </button>
                       <button 
                         onClick={() => removeMapping(mappedWorkflows[0].id)}
                         className="flex items-center justify-center p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors border border-red-500/20"
                         title="Disconnect"
                       >
                         <LogOut className="h-4 w-4" />
                       </button>
                    </div>
                  </div>
                )}

                {/* Dashboard Command Center Header */}
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 bg-slate-900/40 p-6 rounded-2xl border border-white/5 backdrop-blur-md shadow-xl relative z-20">
                  <div>
                    <h1 className="text-2xl font-bold text-white flex flex-wrap items-center gap-3 mb-2">
                      {mappedWorkflows[0]?.list || 'Your Workspace'}
                      <div className="flex flex-wrap items-center gap-2">
                        <MetricTooltip 
                          align="left" 
                          position="bottom" 
                          text={isAutoSyncing ? "Fetching latest data from ClickUp..." : "Real-time updates are active."} 
                          formula="Dashboard automatically syncs every 15 seconds."
                        >
                          <div className={`flex items-center px-3 py-1.5 rounded-full border transition-all shadow-sm cursor-help ${isAutoSyncing ? 'bg-indigo-500/10 border-indigo-500/20 text-indigo-300' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'}`}>
                            {isAutoSyncing ? (
                              <RefreshCw className="h-3.5 w-3.5 mr-2 animate-spin" /> 
                            ) : (
                              <div className="h-2 w-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></div> 
                            )}
                            {mappedWorkflows.length > 0 && (
                              <div className="flex items-center text-xs font-medium">
                                <span className="tracking-wide">
                                  {isAutoSyncing ? 'Syncing...' : `Synced: ${new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(mappedWorkflows[0].lastSynced))}`}
                                </span>
                              </div>
                            )}
                          </div>
                        </MetricTooltip>
                      </div>
                    </h1>
                    <p className="text-slate-400 text-sm">Dashboard metrics are dynamically synced and globally filtered.</p>
                  </div>
                  
                  <div className="flex items-center space-x-3 bg-slate-950/50 p-2 rounded-xl border border-white/5">
                    <span className="text-sm text-slate-400 font-medium pl-2 flex items-center">
                      <svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                      Global Filter:
                    </span>
                    <select
                      value={completionFilterType}
                      onChange={(e) => {
                        setCompletionFilterType(e.target.value);
                        if (e.target.value === 'tags' && uniqueTags.length > 0) {
                          setSelectedTagFilter(uniqueTags[0]);
                        }
                        if (e.target.value === 'assignees' && uniqueAssignees.length > 0) {
                          setSelectedAssigneeFilter(uniqueAssignees[0]);
                        }
                      }}
                      className="border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-900 shadow-sm"
                    >
                      <option value="none">All Data</option>
                      <option value="tags">By Tag</option>
                      <option value="assignees">By Assignee</option>
                    </select>

                    {completionFilterType === 'tags' && (
                      <select
                        value={selectedTagFilter}
                        onChange={(e) => setSelectedTagFilter(e.target.value)}
                        className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-950/30 shadow-sm min-w-[120px]"
                      >
                        {uniqueTags.length === 0 && <option value="">No tags found</option>}
                        {uniqueTags.map(tag => (
                          <option key={tag} value={tag}>{tag}</option>
                        ))}
                      </select>
                    )}
                    
                    {completionFilterType === 'assignees' && (
                      <select
                        value={selectedAssigneeFilter}
                        onChange={(e) => setSelectedAssigneeFilter(e.target.value)}
                        className="border border-indigo-500/30 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-950/30 shadow-sm min-w-[120px]"
                      >
                        {uniqueAssignees.length === 0 && <option value="">No assignees found</option>}
                        {uniqueAssignees.map(a => (
                          <option key={a} value={a}>{a}</option>
                        ))}
                      </select>
                    )}
                  </div>
                </div>

                {/* 1. Metrics */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70] flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20 shrink-0">
                        <Box className="h-6 w-6 text-blue-400" />
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1">
                          <p className="text-sm font-medium text-slate-400">Backlog</p>
                          <MetricTooltip align="left" position="bottom" text="Tasks that are not yet started." formula="Count of tasks and subtasks with status 'Open', 'To Do', or 'Backlog'. (Excludes bug containers)">
                            <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <p className="text-3xl font-extrabold text-white mt-1 tracking-tight">{backlogTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Main Tasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Main</span>
                        <span className="text-sm font-bold text-slate-300">{backlogBreakdown.mothers}</span>
                      </div>
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Subtasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Sub</span>
                        <span className="text-sm font-bold text-slate-300">{backlogBreakdown.subs}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70] flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-indigo-500/10 p-3 rounded-lg border border-indigo-500/20 shrink-0">
                        <CheckSquare className="h-6 w-6 text-indigo-400" />
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1">
                          <p className="text-sm font-medium text-slate-400">Active Tasks</p>
                          <MetricTooltip align="center" position="bottom" text="Tasks currently being worked on." formula="Tasks and subtasks with active development statuses. (Excludes bug containers)">
                            <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <p className="text-3xl font-extrabold text-white mt-1 tracking-tight">{activeTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Main Tasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Main</span>
                        <span className="text-sm font-bold text-slate-300">{activeBreakdown.mothers}</span>
                      </div>
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Subtasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Sub</span>
                        <span className="text-sm font-bold text-slate-300">{activeBreakdown.subs}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70] flex items-center justify-between gap-4">
                    <div className="flex items-start space-x-4 min-w-0">
                      <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 shrink-0">
                        <CheckCircle2 className="h-6 w-6 text-emerald-400" />
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5 mb-1">
                          <p className="text-sm font-medium text-slate-400">Total Resolved</p>
                          <MetricTooltip align="right" position="bottom" text="Tasks completed across mapped workflows." formula="Count of tasks and subtasks with status 'Closed', 'Complete', 'Done', or 'Resolved'. (Excludes bug containers)">
                            <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </div>
                        <p className="text-3xl font-extrabold text-white mt-1 tracking-tight">{completedFilteredTasksCount}</p>
                      </div>
                    </div>
                    <div className="flex flex-col gap-2 shrink-0">
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Main Tasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Main</span>
                        <span className="text-sm font-bold text-slate-300">{completedBreakdown.mothers}</span>
                      </div>
                      <div className="bg-slate-950/40 border border-white/5 rounded-lg px-3 py-1.5 flex items-center justify-between min-w-[80px]" title="Subtasks">
                        <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mr-3">Sub</span>
                        <span className="text-sm font-bold text-slate-300">{completedBreakdown.subs}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 2. Progress / Burndown */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex flex-col justify-between relative z-10 hover:z-[70]">
                    <div>
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                        <div>
                          <div className="flex items-center flex-wrap space-x-2 mb-1">
                            <Target className="h-5 w-5 text-indigo-400 shrink-0" />
                            <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                              Overall Progress
                              <MetricTooltip align="left" position="bottom" text="Weighted completion percentage based on tracked time estimates." formula="((Total Estimated Hours - Total Remaining Hours) / Total Estimated Hours) × 100">
                                <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                              </MetricTooltip>
                            </h2>
                          </div>
                          <p className="text-sm text-slate-400">Aggregated progress across all active mapped items.</p>
                        </div>
                      </div>
                      
                      <div className="flex items-end justify-between mb-4">
                        <div className="flex flex-col">
                          <span className="text-5xl font-extrabold text-white leading-none">{completionPercentage}%</span>
                        </div>
                        <div className="flex flex-col items-end space-y-1.5">
                          <div className="flex items-center text-xs text-slate-400 bg-slate-950/50 px-2.5 py-1 rounded-md border border-white/5" title="Completed vs Total Items">
                            <CheckCircle2 className="h-3.5 w-3.5 mr-1.5 text-emerald-400" />
                            <span className="text-white font-medium mr-1">{completedFilteredTasksCount}</span> / {totalFilteredCount} Items
                          </div>
                          <div className="flex items-center text-xs text-slate-400 bg-slate-950/50 px-2.5 py-1 rounded-md border border-white/5" title="Logged vs Estimated Hours">
                            <Clock className="h-3.5 w-3.5 mr-1.5 text-indigo-400" />
                            <span className="text-white font-medium mr-1">{totalSpentHours}h</span> / {totalEstHours}h Logged
                          </div>
                        </div>
                      </div>
                      
                      <div className="w-full bg-slate-950 border border-white/5 rounded-full h-4 overflow-hidden mb-2 shadow-inner">
                        <div 
                          className="bg-gradient-to-r from-indigo-500 to-violet-500 h-4 rounded-full transition-all duration-1000 ease-out shadow-[0_0_12px_rgba(99,102,241,0.4)]" 
                          style={{ width: `${completionPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70]">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                      <div>
                        <div className="flex items-center flex-wrap space-x-2 mb-1">
                          <TrendingDown className="h-5 w-5 text-indigo-400 shrink-0" />
                          <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                            Sprint Burndown
                            <MetricTooltip align="right" position="bottom" text="Tracks remaining task effort versus your ideal timeline." formula="Y-Axis: Remaining tracked hours. X-Axis: Elapsed time between earliest Start Date and latest Due Date.">
                              <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </h2>
                        </div>
                        <p className="text-sm text-slate-400">Tracking actual time remaining over scheduled timeline.</p>
                      </div>
                      <div className="flex flex-row sm:flex-col gap-4 sm:gap-1.5 text-sm bg-slate-950/40 px-3 py-2 rounded-lg border border-white/5 shrink-0">
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-4 h-0 border-t-2 border-dashed border-slate-500 mr-2"></div>
                          Ideal Effort
                        </div>
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-3 h-3 bg-indigo-500 rounded-full mr-2 shadow-lg shadow-indigo-500/50"></div>
                          Remaining Time
                        </div>
                      </div>
                    </div>
                    
                    <div className="relative h-48 w-full">
                      <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                        <span>{totalEstHours}h</span>
                        <span>{Math.round(totalEstHours * 0.75)}h</span>
                        <span>{Math.round(totalEstHours * 0.5)}h</span>
                        <span>{Math.round(totalEstHours * 0.25)}h</span>
                        <span>0h</span>
                      </div>
                      
                      <div className="absolute left-10 right-2 top-2 bottom-6">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                          <defs>
                            <linearGradient id="burndownGradient" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stopColor="#6366f1" stopOpacity="0.25" />
                              <stop offset="100%" stopColor="#6366f1" stopOpacity="0" />
                            </linearGradient>
                          </defs>
                          <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="100" y1="0" x2="100" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="100" y2="100" stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" />

                          <polygon
                            points={polygonPointsString}
                            fill="url(#burndownGradient)"
                          />

                          <polyline
                            points={linePointsString}
                            fill="none"
                            stroke="#6366f1"
                            strokeWidth="3"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            vectorEffect="non-scaling-stroke"
                            className="drop-shadow-lg shadow-indigo-500/50"
                          />
                        </svg>
                      </div>

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                        <span className="-ml-3">{dayLabels[0]}</span>
                        <span>{dayLabels[1]}</span>
                        <span>{dayLabels[2]}</span>
                        <span className="-mr-4">{dayLabels[3]}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 3. Estimation Accuracy Section */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl mb-8 relative z-10 hover:z-[70]">
                  <div className="p-6 md:p-8 flex flex-col md:flex-row md:items-center gap-8 lg:gap-12">
                    {/* Left side: Emphasis */}
                    <div className="flex-shrink-0 md:w-1/3">
                      <div className="flex items-center flex-wrap space-x-3 mb-3">
                        <div className="bg-purple-500/10 p-2.5 rounded-lg border border-purple-500/20 shrink-0">
                          <Target className="h-6 w-6 text-purple-400" />
                        </div>
                        <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                          Est. Accuracy
                          <MetricTooltip align="left" position="top" text="Measures the accuracy of time estimates against actual time spent." formula="100 - (|Actual Duration - Estimated Time| / Estimated Time * 100) for completed tasks.">
                            <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </h2>
                      </div>
                      <p className="text-sm text-slate-400 mb-5 leading-relaxed">
                        Measures how closely the initial time estimates match the actual duration it takes to complete tasks.
                      </p>
                      <div className="flex items-end">
                        <span className="text-6xl font-extrabold text-white tracking-tight leading-none">{estimationAccuracyDisplay}</span>
                      </div>
                    </div>

                    {/* Right side: Detailed Breakdown */}
                    <div className="flex-1 border-t md:border-t-0 md:border-l border-white/10 pt-6 md:pt-0 md:pl-8 lg:pl-12">
                      <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center flex-wrap gap-2">
                        Average Time in Status
                        <MetricTooltip align="center" position="top" text="Average time completed tasks spend in intermediate phases." formula="Parses the task's Activity Logs timeline, calculates duration between status changes, and averages it.">
                          <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                        </MetricTooltip>
                      </h3>
                      
                      {avgTimeInStatusList.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                          {avgTimeInStatusList.map(stat => (
                            <div key={stat.status} className="flex justify-between items-center text-sm p-3 bg-slate-950/30 rounded-xl border border-white/5 transition-colors hover:bg-slate-900/60">
                              <span className="text-slate-300 capitalize truncate pr-4">{stat.status}</span>
                              <span className="text-indigo-300 font-mono font-medium shrink-0 bg-indigo-500/10 px-2 py-1 rounded-md border border-indigo-500/20">{stat.timeDisplay}</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="text-sm text-slate-500 italic p-6 bg-slate-950/20 rounded-xl border border-white/5 text-center">
                          No status timing data is available for tasks. (Ensure active tasks exist or history is fetched).
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* 4. Utilization Section */}
                <div className="mb-8 animate-in fade-in">
                  <div className="flex items-center space-x-2 mb-4">
                      <Activity className="h-5 w-5 text-indigo-400 shrink-0" />
                      <h2 className="text-lg font-semibold text-white">Utilization Breakdown</h2>
                  </div>
                  
                  <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70]">
                    <div className="p-6 md:p-8 flex flex-col lg:flex-row gap-8 lg:gap-12">
                      
                      {/* Left: Overall Utilization Percent */}
                      <div className="flex-shrink-0 lg:w-1/3 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-white/10 pb-6 lg:pb-0 lg:pr-8">
                        <div className="flex items-center space-x-3 mb-3">
                          <div className="bg-indigo-500/10 p-2.5 rounded-lg border border-indigo-500/20 shrink-0">
                            <Target className="h-6 w-6 text-indigo-400" />
                          </div>
                          <h3 className="text-lg font-semibold text-white flex items-center gap-2">
                            Bucket Utilization
                            <MetricTooltip align="left" position="top" text="Calculated based on developer capacity vs total scope demand." formula="(Est Days × 7h) ÷ ((Devs × Sprint Days × 7h) - (Dev Leaves × 7h)) × 100">
                              <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </h3>
                        </div>
                        <p className="text-sm text-slate-400 mb-5 leading-relaxed">
                          Measures the total demand of your planned scope against the capacity of your tagged Developer resources.
                        </p>
                        
                        <div className="flex items-end mb-2">
                          <span className="text-6xl font-extrabold text-white tracking-tight leading-none">{bucketUtilizationPct}%</span>
                        </div>
                        <div className="w-full bg-slate-950 border border-white/5 rounded-full h-3 overflow-hidden shadow-inner mt-2 mb-8">
                          <div 
                            className={`h-full rounded-full transition-all duration-1000 ease-out ${bucketUtilizationPct > 100 ? 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.4)]' : 'bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.4)]'}`}
                            style={{ width: `${Math.min(bucketUtilizationPct, 100)}%` }}
                          ></div>
                        </div>

                        {/* Granular Sub-Bars */}
                        <div className="space-y-4">
                          <div>
                             <div className="flex justify-between items-center mb-1.5">
                               <span className="text-xs font-medium text-slate-400">Developer Util (80% Demand)</span>
                               <span className="text-xs font-bold text-white">{devUtilPct}%</span>
                             </div>
                             <div className="w-full bg-slate-950 border border-white/5 rounded-full h-1.5 overflow-hidden shadow-inner">
                               <div className={`h-full rounded-full transition-all duration-1000 ${devUtilPct > 100 ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(devUtilPct, 100)}%` }}></div>
                             </div>
                          </div>
                          <div>
                             <div className="flex justify-between items-center mb-1.5">
                               <span className="text-xs font-medium text-slate-400">QA Util (20% Demand)</span>
                               <span className="text-xs font-bold text-white">{qaUtilPct}%</span>
                             </div>
                             <div className="w-full bg-slate-950 border border-white/5 rounded-full h-1.5 overflow-hidden shadow-inner">
                               <div className={`h-full rounded-full transition-all duration-1000 ${qaUtilPct > 100 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(qaUtilPct, 100)}%` }}></div>
                             </div>
                          </div>
                        </div>
                      </div>

                      {/* Right: Grouped Stats (Capacity & Scope) */}
                      <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-8">
                        
                        {/* Capacity Group */}
                        <div className="space-y-4">
                          <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            Capacity Limits
                            <MetricTooltip align="center" position="top" text="Available resource limits for the sprint." formula="Resources = Unique Assignees. Duration = Working Days - (Holidays + Events). Click 'Sprint Days' to configure.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </h4>
                          <div className="grid grid-cols-1 gap-3">
                            <div className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between transition-colors hover:bg-slate-900/60">
                              <div className="flex items-center text-slate-300">
                                <Users className="w-4 h-4 mr-2 text-blue-400" />
                                <span className="text-sm">Developers</span>
                              </div>
                              <span className="text-lg font-bold text-white">{devCount}</span>
                            </div>
                            <div className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between transition-colors hover:bg-slate-900/60">
                              <div className="flex items-center text-slate-300">
                                <Users className="w-4 h-4 mr-2 text-emerald-400" />
                                <span className="text-sm">QA Resources</span>
                              </div>
                              <span className="text-lg font-bold text-white">{qaCount}</span>
                            </div>
                            <div 
                              onClick={() => setIsBlockerModalOpen(true)}
                              className="bg-slate-950/30 p-3.5 rounded-xl border border-white/5 flex items-center justify-between transition-colors hover:bg-slate-900/60 cursor-pointer group"
                              title="Configure Sprint Capacity"
                            >
                              <div className="flex items-center text-slate-300 group-hover:text-indigo-300 transition-colors">
                                <Calendar className="w-4 h-4 mr-2 text-sky-400 group-hover:text-indigo-400" />
                                <span className="text-sm">Sprint Days</span>
                              </div>
                              <span className="text-lg font-bold text-white flex items-center gap-2">
                                {bucketDurationDays}
                                <Settings className="w-3.5 h-3.5 text-slate-500 group-hover:text-indigo-400 transition-colors" />
                              </span>
                            </div>
                          </div>
                        </div>

                        {/* Scope Group */}
                        <div className="space-y-4">
                          <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            Scope (Main Tasks)
                            <MetricTooltip align="center" position="top" text="Total workload based on parent tasks." formula="Count of Main Tasks & Sum of their tracked Time Estimates.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </h4>
                          <div className="space-y-3">
                            <div className="bg-slate-950/30 p-3 rounded-xl border border-white/5 flex flex-col transition-colors hover:bg-slate-900/60">
                              <div className="flex justify-between items-center mb-1">
                                <span className="text-sm text-slate-300 flex items-center"><Box className="w-3.5 h-3.5 mr-1.5 text-slate-500"/> Plotted</span>
                                <span className="text-sm font-bold text-white">{plottedScopeCount}</span>
                              </div>
                              <div className="text-xs text-slate-500 text-right">{plottedScopeEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-emerald-500/5 p-3 rounded-xl border border-emerald-500/10 flex flex-col transition-colors hover:bg-emerald-500/10">
                              <div className="flex justify-between items-center mb-1">
                                <span className="text-sm text-emerald-200 flex items-center"><CheckCircle2 className="w-3.5 h-3.5 mr-1.5 text-emerald-400"/> Completed</span>
                                <span className="text-sm font-bold text-white">{completedMotherCount}</span>
                              </div>
                              <div className="text-xs text-emerald-500/70 text-right">{completedMotherEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-amber-500/5 p-3 rounded-xl border border-amber-500/10 flex flex-col transition-colors hover:bg-amber-500/10">
                              <div className="flex justify-between items-center mb-1">
                                <span className="text-sm text-amber-200 flex items-center"><ClockAlert className="w-3.5 h-3.5 mr-1.5 text-amber-400"/> Spill Over</span>
                                <span className="text-sm font-bold text-white">{spillOverCount}</span>
                              </div>
                              <div className="text-xs text-amber-500/70 text-right">{spillOverEstHours} Est. Hours</div>
                            </div>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                </div>

                {/* 5. Team Workload Section */}
                {assigneesList.length > 0 && (
                  <div className="mb-8 animate-in fade-in">
                    <div className="flex items-center flex-wrap space-x-2 mb-4">
                        <Users className="h-5 w-5 text-indigo-400 shrink-0" />
                        <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                          Team Workload & Roles
                          <MetricTooltip align="left" position="top" text="Tag resources to calculate Dev/QA utilization accurately." formula="Change a role below to dynamically update the Bucket Utilization percentages.">
                            <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {assigneesList.map(assignee => {
                        const estHours = Math.round(assignee.totalEstMs / 3600000);
                        const spentHours = Math.round(assignee.totalSpentMs / 3600000);
                        const progressPct = estHours > 0 ? Math.min(100, Math.round((spentHours / estHours) * 100)) : (spentHours > 0 ? 100 : 0);
                        const totalTasksAssigned = Object.values(assignee.statusCounts).reduce((sum, s) => sum + s.count, 0);

                        return (
                          <div key={assignee.username} className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70] flex flex-col justify-between">
                            <div>
                              <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center space-x-4">
                                  <img src={assignee.profilePicture} alt={assignee.username} className="w-10 h-10 rounded-full border border-white/10 object-cover bg-slate-800" />
                                  <div>
                                    <h3 className="text-md font-semibold text-white">{assignee.username}</h3>
                                    <p className="text-xs text-slate-400">{totalTasksAssigned} Assigned Item{totalTasksAssigned !== 1 ? 's' : ''}</p>
                                  </div>
                                </div>
                                <select
                                  value={userRoles[assignee.username] || 'Developer'}
                                  onChange={(e) => setUserRoles(prev => ({...prev, [assignee.username]: e.target.value}))}
                                  className="bg-slate-950 border border-white/10 text-indigo-300 text-[11px] font-semibold tracking-wide uppercase rounded-lg px-2.5 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm cursor-pointer"
                                >
                                  <option value="Developer">Developer</option>
                                  <option value="QA">QA</option>
                                </select>
                              </div>
                              
                              <div className="flex flex-wrap gap-2 mb-6">
                                {Object.entries(assignee.statusCounts).map(([status, {count, color}]) => (
                                  <span key={status} className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border flex items-center" style={{ color: color, backgroundColor: `${color}15`, borderColor: `${color}30` }}>
                                    {status} <span className="ml-1 opacity-75 bg-slate-900/40 px-1.5 py-[1px] rounded-sm">{count}</span>
                                  </span>
                                ))}
                              </div>
                            </div>

                            <div>
                              <div className="flex justify-between text-xs mb-1.5 font-medium">
                                <span className="text-slate-400 flex items-center"><Clock className="h-3 w-3 mr-1" /> Logged Time</span>
                                <span className="text-white">{spentHours}h <span className="text-slate-500 font-normal">/ {estHours}h</span></span>
                              </div>
                              <div className="w-full bg-slate-950 border border-white/5 rounded-full h-2 overflow-hidden shadow-inner">
                                <div 
                                  className="bg-gradient-to-r from-indigo-500 to-violet-500 h-full rounded-full transition-all duration-1000" 
                                  style={{ width: `${progressPct}%`, boxShadow: `0 0 8px rgba(99,102,241,0.5)` }}
                                ></div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 6. Bug Tracking Widgets */}
                {totalBugsCount > 0 && (
                  <div className="mb-8 animate-in fade-in">
                    <div className="flex items-center space-x-2 mb-4">
                        <Bug className="h-5 w-5 text-rose-400 shrink-0" />
                        <h2 className="text-lg font-semibold text-white">Quality & Defects</h2>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 lg:gap-6">
                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-purple-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-[70]">
                        <div className="bg-purple-500/10 p-3 rounded-lg border border-purple-500/20 shrink-0">
                          <Target className="h-6 w-6 text-purple-400" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center flex-wrap gap-1.5 mb-1">
                            <p className="text-sm font-medium text-slate-400">Avg Quality Rate</p>
                            <MetricTooltip align="left" position="top" text="Average quality score across mother tasks." formula="100% minus penalty points for each bug based on complexity/priority. (Critical: -20, High: -15, Normal: -10, Low: -5).">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </div>
                          <p className="text-2xl font-bold text-white mt-1">{avgQualityRate}%</p>
                        </div>
                      </div>

                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-rose-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-[70]">
                        <div className="bg-rose-500/10 p-3 rounded-lg border border-rose-500/20 shrink-0">
                          <Bug className="h-6 w-6 text-rose-400" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center flex-wrap gap-1.5 mb-1">
                            <p className="text-sm font-medium text-slate-400">Active Defects</p>
                            <MetricTooltip align="left" position="top" text="Unresolved bugs or defects." formula="Total identified bugs (in QA/UI Bug lists or tagged 'bug') minus resolved bugs.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </div>
                          <p className="text-2xl font-bold text-white mt-1">{activeBugsCount}</p>
                        </div>
                      </div>
                      
                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-orange-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-[70]">
                        <div className="bg-orange-500/10 p-3 rounded-lg border border-orange-500/20 shrink-0">
                          <ShieldAlert className="h-6 w-6 text-orange-400" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center flex-wrap gap-1.5 mb-1">
                            <p className="text-sm font-medium text-slate-400">High/Critical</p>
                            <MetricTooltip align="center" position="top" text="Urgent defects requiring immediate attention." formula="Active defects with priority set to 'High', 'Urgent', or 'Critical'.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </div>
                          <p className="text-2xl font-bold text-white mt-1">{criticalBugsCount}</p>
                        </div>
                      </div>

                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-emerald-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-[70]">
                        <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 shrink-0">
                          <Activity className="h-6 w-6 text-emerald-400" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center flex-wrap gap-1.5 mb-1">
                            <p className="text-sm font-medium text-slate-400">Resolution Rate</p>
                            <MetricTooltip align="center" position="top" text="Percentage of total identified bugs that have been fixed." formula="(Resolved Bugs / Total Identified Bugs) × 100">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </div>
                          <div className="flex items-end space-x-2 mt-1">
                            <p className="text-2xl font-bold text-white">{bugResolutionRate}%</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-sky-500/10 shadow-xl flex items-start space-x-4 relative z-10 hover:z-[70]">
                        <div className="bg-sky-500/10 p-3 rounded-lg border border-sky-500/20 shrink-0">
                          <Zap className="h-6 w-6 text-sky-400" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center flex-wrap gap-1.5 mb-1">
                            <p className="text-sm font-medium text-slate-400">Avg Fix Velocity</p>
                            <MetricTooltip align="right" position="top" text="Average turnaround time to resolve a defect." formula="Sum of (Date Closed - Date Created) for all resolved bugs / Total number of resolved bugs.">
                              <InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400 transition-colors cursor-help" />
                            </MetricTooltip>
                          </div>
                          <div className="flex items-end space-x-2 mt-1">
                            <p className="text-2xl font-bold text-white">{avgVelocityValue}</p>
                            {avgVelocityUnit && <p className="text-xs text-slate-400 mb-1">{avgVelocityUnit}</p>}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 7. Stalled Tasks Section (Exceptions) */}
                <div className="w-full space-y-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl animate-in slide-in-from-bottom-4 relative z-10 hover:z-[70]">
                    <div className="px-5 py-4 border-b border-white/5 bg-amber-500/5 flex flex-wrap items-center justify-between rounded-t-2xl gap-2">
                      <div className="flex items-center space-x-2 min-w-0">
                        <ClockAlert className="h-5 w-5 text-amber-400 shrink-0" />
                        <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                          Needs Attention
                          <MetricTooltip align="left" position="top" text="Active items where logged/elapsed time exceeds originally estimated time." formula="Elapsed Time (Date Now - Date Created) > Estimated Hours OR Logged Hours > Estimated Hours">
                            <InfoIcon className="h-4 w-4 text-amber-500 hover:text-amber-400 transition-colors cursor-help" />
                          </MetricTooltip>
                        </h2>
                      </div>
                      <span className="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 uppercase tracking-wider shrink-0">Stalled</span>
                    </div>
                    
                    {stalledTasks.length > 0 ? (
                      <ul className="divide-y divide-white/5 rounded-b-2xl">
                        {stalledTasks.map(task => {
                          const themeColor = task.status?.color || '#94a3b8';
                          const createdDate = task.date_created ? parseInt(task.date_created) : Date.now();
                          const daysOld = Math.floor((Date.now() - createdDate) / 86400000);
                          const estimatedHours = Math.round((parseInt(task.time_estimate) || 0) / 3600000);
                          
                          return (
                            <li 
                              key={task.id} 
                              onClick={() => setSelectedTicketForModal(task)}
                              className="p-4 hover:bg-slate-800/50 cursor-pointer transition-colors group flex items-start justify-between gap-3"
                            >
                              <div className="min-w-0">
                                <div className="flex items-center space-x-2 mb-1">
                                  <div 
                                    className="w-2 h-2 rounded-full shrink-0" 
                                    style={{ backgroundColor: themeColor }} 
                                  />
                                  <span className="text-sm font-semibold text-slate-200 truncate group-hover:text-white transition-colors">{task.name}</span>
                                </div>
                                <div className="flex items-center text-xs text-slate-500 ml-4">
                                  <ClockAlert className="h-3 w-3 mr-1 text-amber-500/70" />
                                  Elapsed: {daysOld}d / Est: {estimatedHours}h
                                </div>
                              </div>
                              
                              {task.assignees && task.assignees.length > 0 ? (
                                <img 
                                  src={task.assignees[0].profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(task.assignees[0].username)}&background=random`} 
                                  alt={task.assignees[0].username} 
                                  className="w-6 h-6 rounded-full border border-slate-700 bg-slate-800 object-cover shrink-0 mt-0.5" 
                                  title={`Assigned to ${task.assignees[0].username}`} 
                                />
                              ) : (
                                <div className="flex items-center justify-center w-6 h-6 rounded-full border border-white/5 bg-slate-900 text-slate-500 shrink-0 mt-0.5" title="Unassigned">
                                  <Users className="h-3 w-3" />
                                </div>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                    ) : (
                      <div className="p-8 text-center text-sm text-slate-500 italic rounded-b-2xl">
                          All tasks are running on schedule.
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex flex-col space-y-8 mb-8">
                  {/* 8. Active Tasks Explorer */}
                  <div className="w-full space-y-6">
                    <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70]">
                      <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex items-center justify-between rounded-t-2xl">
                        <h2 className="text-lg font-semibold text-white flex items-center">
                           <ListTodo className="h-5 w-5 mr-2 text-indigo-400" />
                           Active Tasks Explorer
                        </h2>
                      </div>
                      <div className="divide-y divide-white/5 max-h-[600px] overflow-y-auto rounded-b-2xl">
                        {mappedWorkflows.map(workflow => {
                          const currentTab = workflowTabs[workflow.id] || 'all';

                          // Utilize the recursive engine to build a pristine active-only tree, strictly filtering out bug containers
                          const mainTasksOnly = (workflow.tasks || []).filter(t => {
                            const n = t.name?.toLowerCase() || '';
                            return !n.includes('qa bugs') && !n.includes('ui bugs');
                          });
                          const rootTasksByTags = buildFilteredTree(mainTasksOnly, false);

                          const uniqueStatuses = Array.from(new Set(rootTasksByTags.map(t => t.status?.status || 'Open')));

                          const displayedTasks = rootTasksByTags.filter(task => {
                            if (currentTab === 'all') return true;
                            return (task.status?.status || 'Open') === currentTab;
                          });

                          return (
                            <div key={workflow.id} className="p-6 transition-colors">
                              <div className="flex flex-wrap gap-2 mb-4 border-b border-white/5 pb-3">
                                <button
                                  onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: 'all' }))}
                                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                                    currentTab === 'all'
                                      ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30'
                                      : 'bg-slate-900/60 text-slate-400 border border-transparent hover:text-slate-200'
                                  }`}
                                >
                                  All ({rootTasksByTags.length})
                                </button>
                                {uniqueStatuses.map(status => {
                                  const count = rootTasksByTags.filter(t => (t.status?.status || 'Open') === status).length;
                                  const statusColor = rootTasksByTags.find(t => (t.status?.status || 'Open') === status)?.status?.color || '#94a3b8';
                                  const isSelected = currentTab === status;
                                  
                                  return (
                                    <button
                                      key={status}
                                      onClick={() => setWorkflowTabs(prev => ({ ...prev, [workflow.id]: status }))}
                                      className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 capitalize border ${
                                        isSelected
                                          ? 'bg-slate-900 text-white'
                                          : 'bg-slate-900/40 text-slate-400 border-transparent hover:text-slate-200'
                                      }`}
                                      style={isSelected ? { borderColor: `${statusColor}40`, boxShadow: `0 0 8px ${statusColor}15` } : {}}
                                    >
                                      <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: statusColor, boxShadow: `0 0 6px ${statusColor}` }} />
                                      {status} ({count})
                                    </button>
                                  );
                                })}
                              </div>

                              <div className="flex items-center justify-between mb-3">
                                <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Main Tasks</h4>
                                <span className="text-xs bg-slate-900/60 text-slate-400 border border-white/5 px-2.5 py-0.5 rounded-full font-medium">
                                  {currentTab !== 'all'
                                    ? `Showing ${displayedTasks.length} of ${rootTasksByTags.length} tasks`
                                    : `${rootTasksByTags.length} tasks`}
                                </span>
                              </div>
                              
                              {displayedTasks && displayedTasks.length > 0 ? (
                                <div className="space-y-3">
                                  {displayedTasks.map(task => (
                                    <TaskItem 
                                      key={task.id} 
                                      task={task} 
                                      expandedTasks={expandedTasks} 
                                      toggleTaskExpand={toggleTaskExpand} 
                                    />
                                  ))}
                                </div>
                              ) : (
                                <div className="text-sm text-slate-400 italic p-4 bg-slate-950/20 rounded-lg text-center border border-white/5">
                                  No tasks match this status tab filter.
                               </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* 9. Completed Tasks Section */}
                  <div className="w-full space-y-6">
                    <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl relative z-10 hover:z-[70]">
                      <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-t-2xl">
                        <div className="flex items-center space-x-3">
                          <h2 className="text-lg font-semibold text-white flex items-center">
                             <CheckCircle2 className="h-5 w-5 mr-2 text-emerald-400" />
                             Completed Tasks Explorer
                          </h2>
