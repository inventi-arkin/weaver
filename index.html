                                </linearGradient>
                              </defs>
                              <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                              <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                              <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              <line x1="100" y1="0" x2="100" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                              
                              <path d={idealCapacityPath} stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" fill="none" />
                              <path d={plottedPath} stroke="#60a5fa" strokeWidth="2" strokeDasharray="2 4" vectorEffect="non-scaling-stroke" fill="none" />
                              
                              {burnupAreaPath && <path d={burnupAreaPath} fill="url(#burnupGradient)" />}
                              {smoothBurnupLinePath && <path d={smoothBurnupLinePath} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />}
                            </svg>

                            {activeChartHover?.chart === 'burnup' && (
                               <>
                                 <div className="absolute top-0 bottom-0 w-px bg-emerald-500/50 pointer-events-none" style={{ left: `${activeChartHover.xPct}%` }} />
                                 <div className="absolute w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pointer-events-none transform -translate-x-1/2 -translate-y-1/2 border-2 border-slate-900" style={{ left: `${activeChartHover.xPct}%`, top: `${activeChartHover.yPct}%` }} />
                                 <div className="absolute pointer-events-none flex flex-col items-center drop-shadow-lg"
                                      style={{ 
                                        left: `${activeChartHover.xPct}%`, 
                                        top: `${activeChartHover.yPct}%`,
                                        transform: 'translate(-50%, -100%)',
                                        marginTop: '-8px'
                                      }}>
                                    <div className="bg-slate-800 border border-emerald-500/50 text-white rounded-lg px-3 py-1.5 shadow-[0_0_15px_rgba(16,185,129,0.5)] whitespace-nowrap flex flex-col items-center">
                                       <span className="font-bold text-[10px] uppercase tracking-wider text-emerald-400 mb-0.5">{new Date(activeChartHover.dateMs).toLocaleDateString()}</span>
                                       <span className="text-xs font-semibold text-slate-100">{Math.max(0, Math.round(activeChartHover.value / 3600000))}h Logged</span>
                                    </div>
                                    <div className="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[6px] border-t-emerald-500/50"></div>
                                 </div>
                               </>
                            )}
                      </div>

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                        <span className="-ml-3">{dayLabels[0]}</span>
                        <span>{dayLabels[1]}</span>
                        <span>{dayLabels[2]}</span>
                        <span className="-mr-4">{dayLabels[3]}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 3. Utilization Section */}
                <div className="mb-8">
                  <div className="flex items-center space-x-2 mb-4"><Activity className="h-5 w-5 text-indigo-400" /><h2 className="text-lg font-semibold text-white">Utilization Breakdown</h2></div>
                  
                  <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl">
                    <div className="p-6 md:p-8 flex flex-col lg:flex-row gap-8 lg:gap-12">
                      <div className="flex-shrink-0 lg:w-1/3 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-white/5 pb-6 lg:pb-0 lg:pr-8">
                        <div className="flex items-center space-x-3 mb-3">
                          <div className="bg-indigo-500/10 p-2.5 rounded-lg border border-indigo-500/20 shrink-0"><Target className="h-6 w-6 text-indigo-400" /></div>
                          <div className="text-lg font-semibold text-white flex items-center gap-2">
                            Bucket Utilization 
                            <div className="hover:z-[99999]">
                                <MetricTooltip align="left" text="Calculated based on developer capacity vs total scope demand." formula="Total Est Hours ÷ ((Devs × Sprint Days × Dev Hours) - Dev Leaves) × 100"><InfoIcon className="h-4 w-4 text-slate-500 transition-colors" /></MetricTooltip>
                            </div>
                          </div>
                        </div>
                        <p className="text-sm text-slate-400 mb-5 leading-relaxed">Measures the total demand of your planned scope against the capacity of your tagged Developer resources.</p>
                        
                        <div className="flex items-end mb-2"><span className="text-6xl font-extrabold text-white tracking-tight leading-none">{bucketUtilizationPct}%</span></div>
                        <div className="w-full bg-slate-900/60 border border-white/5 rounded-full h-3 overflow-hidden mt-2 mb-8"><div className={`h-full rounded-full transition-all duration-1000 ease-out ${bucketUtilizationPct > 100 ? 'bg-rose-500' : 'bg-indigo-500'}`} style={{ width: `${Math.min(bucketUtilizationPct, 100)}%` }}></div></div>

                        <div className="space-y-4">
                          <div>
                             <div className="flex justify-between items-center mb-1.5">
                               <div className="text-xs font-medium text-slate-400 flex items-center gap-1.5">Developer Util (80% Demand) <div className="hover:z-[99999]"><MetricTooltip align="left" text="Dev workload vs capacity." formula="(Total Est Hours × 80%) ÷ Dev Capacity"><InfoIcon className="h-3 w-3 text-slate-500" /></MetricTooltip></div></div>
                               <span className="text-xs font-bold text-white">{devUtilPct}%</span>
                             </div>
                             <div className="w-full bg-slate-900/60 border border-white/5 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all duration-1000 ${devUtilPct > 100 ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(devUtilPct, 100)}%` }}></div></div>
                          </div>
                          <div>
                             <div className="flex justify-between items-center mb-1.5">
                               <div className="text-xs font-medium text-slate-400 flex items-center gap-1.5">QA Util (20% Demand) <div className="hover:z-[99999]"><MetricTooltip align="left" text="QA workload vs capacity." formula="(Total Est Hours × 20%) ÷ QA Capacity"><InfoIcon className="h-3 w-3 text-slate-500" /></MetricTooltip></div></div>
                               <span className="text-xs font-bold text-white">{qaUtilPct}%</span>
                             </div>
                             <div className="w-full bg-slate-900/60 border border-white/5 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all duration-1000 ${qaUtilPct > 100 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(qaUtilPct, 100)}%` }}></div></div>
                          </div>
                        </div>
                      </div>

                      <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-8">
                        <div className="space-y-4">
                          <div className="flex items-center justify-between">
                            <div className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">Capacity Limits <div className="hover:z-[99999]"><MetricTooltip align="center" text="Available resource limits for the sprint." formula="Resources = Unique Assignees. Duration = Working Days - (Holidays + Events). Click the gear icon to configure."><InfoIcon className="h-3.5 w-3.5 text-slate-500" /></MetricTooltip></div></div>
                            <button onClick={() => setIsBlockerModalOpen(true)} className="p-1.5 rounded-lg bg-slate-900/60 border border-white/5 transition-all neon-border-slate text-slate-400"><Settings className="w-4 h-4" /></button>
                          </div>
                          <div className="grid grid-cols-1 gap-3">
                            <div className="bg-slate-900/60 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                              <div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-blue-400" /><span className="text-sm">Developers</span></div><span className="text-lg font-bold text-white">{devCount}</span>
                            </div>
                            <div className="bg-slate-900/60 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                              <div className="flex items-center text-slate-300"><Users className="w-4 h-4 mr-2 text-emerald-400" /><span className="text-sm">QA Resources</span></div><span className="text-lg font-bold text-white">{qaCount}</span>
                            </div>
                            <div className="bg-slate-900/60 p-3.5 rounded-xl border border-white/5 flex items-center justify-between">
                              <div className="flex items-center text-slate-300"><Calendar className="w-4 h-4 mr-2 text-sky-400" /><span className="text-sm">Sprint Days</span></div><span className="text-lg font-bold text-white">{bucketDurationDays}</span>
                            </div>
                          </div>
                        </div>

                        <div className="space-y-4">
                          <div className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">Scope (Main Tasks) <div className="hover:z-[99999]"><MetricTooltip align="center" text="Total workload based on parent tasks." formula="Count of Main Tasks & Sum of their tracked Time Estimates."><InfoIcon className="h-3.5 w-3.5 text-slate-500" /></MetricTooltip></div></div>
                          <div className="space-y-3">
                            <div className="bg-slate-900/60 p-3 rounded-xl border border-white/5 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-slate-300 flex items-center"><Box className="w-3.5 h-3.5 mr-1.5 text-slate-500"/> Plotted</span><span className="text-sm font-bold text-white">{plottedScopeCount}</span></div>
                              <div className="text-xs text-slate-500 text-right">{plottedScopeEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-emerald-500/5 p-3 rounded-xl border border-emerald-500/10 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-emerald-200 flex items-center"><CheckCircle2 className="w-3.5 h-3.5 mr-1.5 text-emerald-400"/> Completed</span><span className="text-sm font-bold text-white">{completedMotherCount}</span></div>
                              <div className="text-xs text-emerald-500/70 text-right">{completedMotherEstHours} Est. Hours</div>
                            </div>
                            <div className="bg-amber-500/5 p-3 rounded-xl border border-amber-500/10 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-amber-200 flex items-center"><ClockAlert className="w-3.5 h-3.5 mr-1.5 text-amber-400"/> Spill Over</span><span className="text-sm font-bold text-white">{spillOverCount}</span></div>
                              <div className="text-xs text-amber-500/70 text-right">{spillOverEstHours} Est. Hours</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 4. Estimation Accuracy Section */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="p-6 md:p-8 flex flex-col md:flex-row md:items-center gap-8 lg:gap-12">
                    <div className="flex-shrink-0 md:w-1/3">
                      <div className="flex items-center flex-wrap space-x-3 mb-3">
                        <div className="bg-purple-500/10 p-2.5 rounded-lg border border-purple-500/20 shrink-0"><Target className="h-6 w-6 text-purple-400" /></div>
                        <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                          Est. Accuracy <div className="hover:z-[99999]"><MetricTooltip align="left" text="Measures the accuracy of time estimates against actual time spent." formula="100 - (|Actual Duration - Estimated Time| / Estimated Time * 100) for completed tasks."><InfoIcon className="h-4 w-4 text-slate-500 transition-colors" /></MetricTooltip></div>
                        </h2>
                      </div>
                      <p className="text-sm text-slate-400 mb-5 leading-relaxed">Measures how closely the initial time estimates match the actual duration it takes to complete tasks.</p>
                      <div className="flex items-end"><span className="text-6xl font-extrabold text-white tracking-tight leading-none">{estimationAccuracyDisplay}</span></div>
                    </div>

                    <div className="flex-1 border-t md:border-t-0 md:border-l border-white/5 pt-6 md:pt-0 md:pl-8 lg:pl-12">
                      <div className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center flex-wrap gap-2">
                        Average Time in Status <div className="hover:z-[99999]"><MetricTooltip align="center" text="Average time completed tasks spend in intermediate phases." formula="Parses the task's Activity Logs timeline, calculates duration between status changes, and averages it."><InfoIcon className="h-3.5 w-3.5 text-slate-500 transition-colors" /></MetricTooltip></div>
                      </div>
                      
                      {avgTimeInStatusList.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                          {avgTimeInStatusList.map(stat => (
                            <div key={stat.status} className="flex justify-between items-center text-sm p-3 bg-slate-900/60 rounded-xl border border-white/5">
                              <span className="text-slate-300 capitalize truncate pr-4">{stat.status}</span>
                              <span className="text-indigo-300 font-mono font-medium shrink-0 bg-indigo-500/10 px-2 py-1 rounded-md border border-indigo-500/20">{stat.timeDisplay}</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="text-sm text-slate-500 italic p-6 bg-slate-900/60 rounded-xl border border-white/5 text-center">No status timing data is available for completed tasks yet.</div>
                      )}
                    </div>
                  </div>
                </div>

                {/* 5. Team Workload */}
                {assigneesList.length > 0 && (
                  <div className="mb-8">
                    <h2 className="text-lg font-semibold text-white mb-4 flex items-center gap-2"><Users className="h-5 w-5 text-indigo-400" /> Team Workload & Roles</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {assigneesList.map(assignee => {
                        let estHours = Math.round(assignee.totalEstMs / 3600000);
                        const spentHours = Math.round(assignee.totalSpentMs / 3600000);
                        if (spentHours > estHours) estHours = spentHours; 
                        
                        const progressPct = estHours > 0 ? Math.round((spentHours / estHours) * 100) : 0;
                        const totalAssigned = Object.values(assignee.statusCounts).reduce((s, c) => s + c.count, 0);

                        return (
                          <div key={assignee.username} onClick={() => setSelectedDrillDownAssignee(assignee.username)} className="neon-card bg-slate-900/40 backdrop-blur-md p-5 rounded-2xl border border-white/5 flex flex-col justify-between shadow-xl cursor-pointer hover:bg-slate-800/60 transition-all group">
                            <div>
                              <div className="flex justify-between items-start mb-4">
                                <div className="flex items-center gap-3">
                                  <img src={assignee.profilePicture} referrerPolicy="no-referrer" className="w-10 h-10 rounded-full border border-slate-700 group-hover:border-indigo-500 object-cover bg-slate-800 transition-colors" />
                                  <div>
                                    <h3 className="text-sm font-bold text-white group-hover:text-indigo-300 transition-colors">{assignee.username}</h3>
                                    <p className="text-xs text-slate-500">{totalAssigned} Assigned Items</p>
                                  </div>
                                </div>
                                <select value={userRoles[assignee.username] || 'Developer'} onClick={e => e.stopPropagation()} onChange={(e) => { const val = e.target.value; setUserRoles(p => { const n = {...p, [assignee.username]: val}; saveSettings({userRoles: n}); return n;}); }} className="bg-slate-900/60 border border-transparent text-indigo-300 text-[10px] font-bold uppercase rounded px-2 py-1 outline-none neon-input neon-input-indigo">
                                  <option value="Developer">Developer</option><option value="QA">QA</option>
                                </select>
                              </div>
                              <div className="flex flex-wrap gap-1.5 mb-6">
                                {Object.entries(assignee.statusCounts).map(([status, {count, color}]) => (
                                  <span key={status} className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border flex items-center gap-1" style={{ color, backgroundColor: `${color}10`, borderColor: `${color}30` }}>
                                    {status} <span className="opacity-70">{count}</span>
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div>
                              <div className="flex justify-between text-xs mb-1.5 font-medium"><span className="text-slate-500 flex items-center"><Clock className="w-3 h-3 mr-1" /> Logged Time</span><span className="text-white">{spentHours}h <span className="text-slate-600">/ {estHours}h</span></span></div>
                              <div className="w-full bg-slate-900/60 border border-white/5 rounded-full h-1.5"><div className="bg-indigo-500 h-full rounded-full transition-all" style={{ width: `${progressPct}%` }}></div></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 6. Bug Tracking Widgets */}
                {totalBugsCount > 0 && (
                  <div className="mb-8">
                    <div className="flex items-center space-x-2 mb-4"><Bug className="h-5 w-5 text-rose-400" /><h2 className="text-lg font-semibold text-white">Quality & Defects</h2></div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 lg:gap-6">
                      <div className="neon-card transition-all bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-purple-500/10 shadow-xl flex items-start space-x-4 cursor-default group">
                        <div className="bg-purple-500/10 p-3 rounded-lg border border-purple-500/20 group-hover:border-purple-500/50 transition-colors"><Target className="h-6 w-6 text-purple-400" /></div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Avg Quality Rate <div className="hover:z-[99999]"><MetricTooltip align="left" text="Average quality score across mother tasks." formula="100% minus penalty points for each bug based on complexity/priority. (Critical: -20, High: -15, Normal: -10, Low: -5)."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></div></div>
                          <p className="text-2xl font-bold text-white mt-1 group-hover:text-purple-300 transition-colors">{avgQualityRate}%</p>
                        </div>
                      </div>

                      <div className="neon-card transition-all bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-rose-500/10 shadow-xl flex items-start space-x-4 cursor-default group">
                        <div className="bg-rose-500/10 p-3 rounded-lg border border-rose-500/20 group-hover:border-rose-500/50 transition-colors"><Bug className="h-6 w-6 text-rose-400" /></div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Active Defects <div className="hover:z-[99999]"><MetricTooltip align="left" text="Unresolved bugs or defects." formula="Total identified bugs minus resolved bugs."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></div></div>
                          <p className="text-2xl font-bold text-white mt-1 group-hover:text-rose-300 transition-colors">{activeBugsCount}</p>
                        </div>
                      </div>
                      
                      <div className="neon-card transition-all bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-orange-500/10 shadow-xl flex items-start space-x-4 cursor-default group">
                        <div className="bg-orange-500/10 p-3 rounded-lg border border-orange-500/20 group-hover:border-orange-500/50 transition-colors"><ShieldAlert className="h-6 w-6 text-orange-400" /></div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">High/Critical <div className="hover:z-[99999]"><MetricTooltip align="center" text="Urgent defects requiring immediate attention." formula="Active defects with priority set to 'High', 'Urgent', or 'Critical'."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></div></div>
                          <p className="text-2xl font-bold text-white mt-1 group-hover:text-orange-300 transition-colors">{criticalBugsCount}</p>
                        </div>
                      </div>

                      <div className="neon-card transition-all bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-emerald-500/10 shadow-xl flex items-start space-x-4 cursor-default group">
                        <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 group-hover:border-emerald-500/50 transition-colors"><Activity className="h-6 w-6 text-emerald-400" /></div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Resolution Rate <div className="hover:z-[99999]"><MetricTooltip align="center" text="Percentage of total identified bugs that have been fixed." formula="(Resolved Bugs / Total Identified Bugs) × 100"><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></div></div>
                          <div className="flex items-end space-x-2 mt-1"><p className="text-2xl font-bold text-white group-hover:text-emerald-300 transition-colors">{bugResolutionRate}%</p></div>
                        </div>
                      </div>

                      <div className="neon-card transition-all bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-sky-500/10 shadow-xl flex items-start space-x-4 cursor-default group">
                        <div className="bg-sky-500/10 p-3 rounded-lg border border-sky-500/20 group-hover:border-sky-500/50 transition-colors"><Zap className="h-6 w-6 text-sky-400" /></div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Avg Fix Velocity <div className="hover:z-[99999]"><MetricTooltip align="right" text="Average turnaround time to resolve a defect." formula="Sum of (Date Closed - Date Created) for all resolved bugs / Total number of resolved bugs."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></div></div>
                          <div className="flex items-end space-x-2 mt-1"><p className="text-2xl font-bold text-white group-hover:text-sky-300 transition-colors">{avgVelocityValue}</p>{avgVelocityUnit && <p className="text-xs text-slate-400 mb-1">{avgVelocityUnit}</p>}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Stalled Tasks */}
                {stalledTasks.length > 0 && (
                  <div className="mb-8 bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl">
                    <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex justify-between items-center rounded-t-2xl">
                      <div className="text-sm font-bold text-white flex items-center gap-2"><ClockAlert className="h-4 w-4 text-amber-500" /> Needs Attention <div className="hover:z-[99999]"><MetricTooltip text="Tasks exceeding estimate"><InfoIcon className="h-3 w-3 text-slate-500 transition-colors" /></MetricTooltip></div></div>
                      <span className="text-[10px] font-bold text-amber-500 border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 rounded uppercase tracking-wider">Stalled</span>
                    </div>
                    <ul className="divide-y divide-white/5">
                      {stalledTasks.map(task => (
                        <li key={task.id} className="p-5 hover:bg-white/5 flex items-center justify-between transition-colors">
                          <div>
                            <div className="flex items-center gap-2 mb-1"><div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: task.status?.color || '#94a3b8'}}/><span className="text-sm font-bold text-slate-200">{task.name}</span></div>
                            <div className="text-xs text-slate-500 ml-3.5"><ClockAlert className="w-3 h-3 inline mr-1 text-amber-500/50" /> Elapsed: {Math.floor((now - parseInt(task.date_created))/86400000)}d / Est: {Math.round(parseInt(task.time_estimate)/3600000)}h</div>
                          </div>
                          {task.assignees && task.assignees.length > 0 && <img src={task.assignees[0].profilePicture || `https://ui-avatars.com/api/?name=${task.assignees[0].username}`} referrerPolicy="no-referrer" className="w-6 h-6 rounded-full border border-slate-700 bg-slate-800 object-cover" />}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Active Explorer */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 rounded-t-2xl"><h2 className="text-sm font-bold text-white flex items-center gap-2"><ListTodo className="h-4 w-4 text-indigo-400" /> Active Tasks Explorer</h2></div>
                  <div className="p-6 max-h-[500px] overflow-y-auto">
                    {activeWorkflows.map(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      const rootTasksByTags = buildFilteredTree(mainTasksOnly, false);
                      return (
                        <div key={workflow.id}>
                          <div className="space-y-2">
                            {rootTasksByTags.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
                          </div>
                        </div>
                      )
                    })}
                  </div>
                </div>

                {/* Completed Tasks Section */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex items-center justify-between rounded-t-2xl">
                    <h2 className="text-sm font-bold text-white flex items-center gap-2"><CheckCircle2 className="h-4 w-4 text-emerald-400" /> Completed Tasks Explorer</h2>
                    <span className="text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">{completedFilteredTasksCount} Resolved</span>
                  </div>
                  <div className="p-6 max-h-[500px] overflow-y-auto">
                    {activeWorkflows.map(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      const completedTasksTree = buildFilteredTree(mainTasksOnly, true);
                      if (completedTasksTree.length === 0) return null;
                      return (
                        <div key={`completed-${workflow.id}`}>
                          <div className="space-y-2">
                            {completedTasksTree.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={true} />)}
                          </div>
                        </div>
                      );
                    })}
                    {activeWorkflows.every(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      return buildFilteredTree(mainTasksOnly, true).length === 0;
                    }) && <div className="text-center text-sm text-slate-500 italic py-4">No completed tasks match your filters yet.</div>}
                  </div>
                </div>

                {/* Legacy Active Workflows list summary */}
                <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl mb-8">
                  <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-t-2xl">
                    <div className="flex items-center space-x-3">
                      <h2 className="text-lg font-semibold text-white">Active Connections</h2>
                      <span className="flex items-center text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20"><div className="h-2 w-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></div> Linked</span>
                    </div>
                  </div>
                  <ul className="divide-y divide-white/5">
                    {mappedWorkflows.map(workflow => (
                      <li key={workflow.id} className="p-6 hover:bg-white/5 transition-colors">
                        <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                          <div className="flex items-start space-x-4">
                            <div className="bg-indigo-500/10 p-2.5 rounded-lg hidden sm:block mt-1 border border-indigo-500/20"><SpiderNetworkIcon className="h-5 w-5 text-indigo-400" /></div>
                            <div className="flex flex-col space-y-1.5 w-full">
                              <div className="flex flex-wrap items-center text-sm text-slate-300 gap-y-2">
                                <span className="font-semibold text-white flex items-center"><Box className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.team} / {workflow.space}</span>
                                {workflow.folder !== 'No Folder' && <><ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" /><span className="flex items-center text-slate-300"><FolderOpen className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.folder}</span></>}
                                <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                <span className="font-semibold text-indigo-400 flex items-center bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20"><ListTodo className="h-4 w-4 mr-1.5" /> {workflow.list}</span>
                              </div>
                              <div className="flex items-center text-xs text-slate-500"><Clock className="h-3 w-3 mr-1" /> Last synced: {new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(workflow.lastSynced))}</div>
                            </div>
                          </div>
                          <button onClick={() => removeMapping(workflow.id)} className="text-slate-400 p-2 rounded-md neon-border-rose transition-colors"><Trash2 className="h-5 w-5" /></button>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>
              </main>
            )}
          </div>
        );
      }

      // --- STREAMING_CHUNK:Public Landing Page Return ---
      return (
        <div className="min-h-screen bg-slate-900 flex font-sans relative overflow-hidden">
          <WebNestBackground opacity={0.85} />
          <div className="absolute inset-0 bg-radial-vignette pointer-events-none z-10" style={{ background: 'radial-gradient(circle, transparent 30%, rgba(9, 13, 22, 0.4) 100%)' }}></div>
          <div className="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative z-20">
            <div className="max-w-md relative bg-slate-900/40 backdrop-blur-md p-8 rounded-[2rem] border border-white/5 shadow-2xl">
              <div className="flex items-center mb-8"><div className="bg-indigo-600 p-2.5 rounded-xl"><SpiderNetworkIcon className="h-8 w-8 text-white" /></div><span className="ml-3 text-3xl font-extrabold text-white">Weaver</span></div>
              <h1 className="text-4xl font-bold text-white leading-tight mb-6">Thread your support and development together.</h1>
              <p className="text-lg text-slate-300 mb-8 font-medium">Weaver creates a seamless bridge between your front-line ticketing apps and your back-office task managers.</p>
            </div>
          </div>
          <div className="w-full lg:w-1/2 flex items-center justify-center p-8 relative z-20 bg-slate-950/20 backdrop-blur-[4px] border-l border-white/10 shadow-[-20px_0_50px_rgba(0,0,0,0.3)]">
            <div className="w-full max-w-sm space-y-8 bg-slate-900/30 backdrop-blur-2xl p-10 rounded-[2.5rem] border border-white/10 shadow-2xl">
              <div><h2 className="text-3xl font-bold text-white">Welcome back</h2><p className="mt-2 text-sm text-slate-400">Sign in to your account.</p></div>
              <button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full btn-neon btn-neon-indigo mt-4">
                {isLoggingIn ? <span>Connecting...</span> : <span>Sign in with Google</span>}
              </button>
              
              {errorMessage && (
                <div className="mt-4 p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-xs text-rose-300">
                  <AlertTriangle className="h-4 w-4 inline mr-1 mb-0.5" />
                  {errorMessage.includes('auth/unauthorized-domain') 
                    ? "Domain unauthorized. Falling back to Local Offline mode. To enable cross-device sync, please replace the firebaseConfig in the HTML with your own Firebase project credentials."
                    : errorMessage}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
