<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise DashBoard - Requirement Architecture</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Import Maps for React, Lucide, and Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 antialiased overflow-hidden">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, 
      onAuthStateChanged, signInAnonymously, signInWithCustomToken
    } from 'firebase/auth';
    import { 
      getFirestore, collection, onSnapshot, addDoc, 
      deleteDoc, updateDoc, doc, setDoc
    } from 'firebase/firestore';
    import { 
      LayoutDashboard, LogOut, Plus, Trash2, CheckCircle2, Clock, AlertCircle,
      ChevronRight, ChevronLeft, Upload, Folder, FolderOpen, ListTodo,
      Info, ChevronDown, Tag, Code, Box, Layers, BookOpen, FileSearch, 
      ExternalLink, Search, ClipboardList, Zap, Calendar, Target, Maximize2, 
      ArrowRight, Edit3, Save, X, Activity, History, User, Settings2, GripVertical
    } from 'lucide-react';

    const REBUILD_TOKEN = "32.0.0-GH-PAGES";

    // --- FIREBASE CONFIGURATION ---
    const userFirebaseConfig = {
      apiKey: "AIzaSyBTe1dTvzk2UkmNnfSGCg15H_5chiV2-5Q",
      authDomain: "dashboard-19e09.firebaseapp.com",
      projectId: "dashboard-19e09",
      storageBucket: "dashboard-19e09.firebasestorage.app",
      messagingSenderId: "1070124848644",
      appId: "1:1070124848644:web:39b2876e839904e24c0751",
      measurementId: "G-WRCFR73SXH"
    };

    // Environment bridging: Use Canvas config if inside the preview, otherwise use the external config for GitHub Pages
    const isCanvasEnv = typeof __firebase_config !== 'undefined';
    const firebaseConfig = isCanvasEnv ? JSON.parse(__firebase_config) : userFirebaseConfig;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'github-pages-dashboard';

    const logActivity = async (userId, projectId, action, detail, requirementTitle = "") => {
      try {
        const logsRef = collection(db, 'artifacts', appId, 'users', userId, 'audit_logs');
        await addDoc(logsRef, {
          projectId: String(projectId),
          action: String(action),
          detail: String(detail),
          requirementTitle: String(requirementTitle),
          timestamp: Date.now(),
          v: REBUILD_TOKEN
        });
      } catch (err) {
        console.error("Audit log failed:", err);
      }
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loginError, setLoginError] = useState('');

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth init error:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });

        return () => unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        try {
          setLoginError('');
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.error(err);
          setLoginError("Login blocked. Please ensure Google Authentication is enabled in your Firebase Console.");
        }
      };

      const handleLogout = async () => {
        await signOut(auth);
        await signInAnonymously(auth);
      };

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-950 text-slate-200 gap-4 font-mono text-[10px]">
            <LayoutDashboard className="w-10 h-10 animate-pulse text-indigo-500" />
            <p className="uppercase tracking-[0.4em] text-slate-600">Initializing Workspace v{REBUILD_TOKEN}</p>
          </div>
        );
      }

      // Allow bypass in Canvas preview, but require real authentication when deployed on GitHub Pages
      const hasActiveSession = user && (!user.isAnonymous || isCanvasEnv);

      if (!hasActiveSession) {
        return <LoginScreen onLogin={handleGoogleLogin} error={loginError} />;
      }

      return <DashboardLayout user={user} onLogout={handleLogout} />;
    }

    function LoginScreen({ onLogin, error }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center bg-slate-950 text-slate-100 p-4 font-sans">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-[2.5rem] shadow-2xl p-12 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-blue-500"></div>
            <div className="relative z-10 flex flex-col items-center">
              <div className="bg-indigo-500/10 p-5 rounded-3xl mb-8 border border-indigo-500/20 shadow-inner">
                <LayoutDashboard className="w-12 h-12 text-indigo-500" />
              </div>
              <h1 className="text-4xl font-black tracking-tighter mb-2 text-white">Dash <span className="text-indigo-400">Board</span></h1>
              <p className="text-slate-500 text-center mb-10 font-medium italic text-sm leading-relaxed">Enterprise Requirement Architecture & Sprint Delivery Environment</p>
              <button onClick={onLogin} className="w-full flex items-center justify-center space-x-3 bg-white hover:bg-slate-100 text-slate-950 font-black py-4 px-4 rounded-2xl transition-all duration-200 transform active:scale-[0.98] shadow-xl">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                <span className="uppercase tracking-widest text-[11px]">Authorize Deployment</span>
              </button>
              {error && <div className="mt-8 text-[11px] text-amber-400 bg-amber-400/5 p-4 rounded-xl w-full text-center border border-amber-400/20 leading-relaxed font-mono">{error}</div>}
            </div>
          </div>
        </div>
      );
    }

    function DashboardLayout({ user, onLogout }) {
      const [view, setView] = useState('backlog'); 
      const [projects, setProjects] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [sprints, setSprints] = useState([]);
      const [swimlanes, setSwimlanes] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [selectedProjectId, setSelectedProjectId] = useState(null);
      const [activeSprintId, setActiveSprintId] = useState(null);
      const [isCreatingProject, setIsCreatingProject] = useState(false);
      const [newProjectName, setNewProjectName] = useState('');
      const [isCreatingSprint, setIsCreatingSprint] = useState(false);
      const [newSprintName, setNewSprintName] = useState('');

      useEffect(() => {
        if (!user) return;
        const projectsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'projects');
        const unsubscribe = onSnapshot(projectsRef, (snapshot) => {
          const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setProjects(fetched);
          if (fetched.length > 0 && !selectedProjectId) setSelectedProjectId(fetched[0].id);
        });
        return () => unsubscribe();
      }, [user]);

      useEffect(() => {
        if (!user) return;
        const tasksRef = collection(db, 'artifacts', appId, 'users', user.uid, 'tasks');
        const unsubscribe = onSnapshot(tasksRef, (snapshot) => {
          const fetchedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setTasks(fetchedTasks);
        });
        return () => unsubscribe();
      }, [user]);

      useEffect(() => {
        if (!user || !selectedProjectId) return;
        const sprintsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'projects', selectedProjectId, 'sprints');
        const unsubscribe = onSnapshot(sprintsRef, (snapshot) => {
          const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setSprints(fetched);
        });
        return () => unsubscribe();
      }, [user, selectedProjectId]);

      useEffect(() => {
        if (!user || !selectedProjectId) return;
        const lanesRef = collection(db, 'artifacts', appId, 'users', user.uid, 'projects', selectedProjectId, 'swimlanes');
        const unsubscribe = onSnapshot(lanesRef, (snapshot) => {
          let fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          if (fetched.length === 0) {
            const defaults = [
              { id: 'todo', title: 'Backlog', order: 0, color: 'indigo' },
              { id: 'doing', title: 'Execution', order: 1, color: 'amber' },
              { id: 'done', title: 'Shipped', order: 2, color: 'emerald' }
            ];
            defaults.forEach(async (d) => {
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'projects', selectedProjectId, 'swimlanes', d.id), d);
            });
            fetched = defaults;
          }
          fetched.sort((a, b) => (a.order || 0) - (b.order || 0));
          setSwimlanes(fetched);
        });
        return () => unsubscribe();
      }, [user, selectedProjectId]);

      useEffect(() => {
        if (!user || !selectedProjectId) return;
        const logsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'audit_logs');
        const unsubscribe = onSnapshot(logsRef, (snapshot) => {
          const fetched = snapshot.docs
            .map(doc => ({ id: doc.id, ...doc.data() }))
            .filter(log => log.projectId === selectedProjectId);
          setAuditLogs(fetched);
        });
        return () => unsubscribe();
      }, [user, selectedProjectId]);

      const handleCreateProject = async (e) => {
        e.preventDefault();
        if (!newProjectName.trim() || !user) return;
        const projectsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'projects');
        const docRef = await addDoc(projectsRef, { name: newProjectName.trim(), createdAt: Date.now() });
        await logActivity(user.uid, docRef.id, "PROJECT_CREATED", `Workspace "${newProjectName}" successfully initialized.`);
        setSelectedProjectId(docRef.id);
        setNewProjectName('');
        setIsCreatingProject(false);
      };

      const handleCreateSprint = async (e) => {
        e.preventDefault();
        if (!newSprintName.trim() || !user || !selectedProjectId) return;
        const sprintsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'projects', selectedProjectId, 'sprints');
        const docRef = await addDoc(sprintsRef, { name: newSprintName.trim(), createdAt: Date.now(), status: 'active' });
        await logActivity(user.uid, selectedProjectId, "SPRINT_CREATED", `Execution period "${newSprintName}" defined.`);
        setActiveSprintId(docRef.id);
        setView('board');
        setNewSprintName('');
        setIsCreatingSprint(false);
      };

      const activeProject = projects.find(p => p.id === selectedProjectId);
      const activeProjectTasks = tasks.filter(t => t.projectId === selectedProjectId);
      const currentSprintName = activeSprintId ? sprints.find(s => s.id === activeSprintId)?.name || 'Untitled Sprint' : null;

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-950 text-slate-200 font-sans overflow-hidden">
          <aside className="w-full md:w-72 border-b md:border-b-0 md:border-r border-slate-800/60 bg-slate-900/40 flex flex-col shrink-0">
            <div className="py-8 flex-1 overflow-y-auto scrollbar-hide">
              <div className="px-8 flex items-center space-x-3 mb-12">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-600/20 text-white"><LayoutDashboard className="w-5 h-5" /></div>
                <span className="text-lg font-black tracking-tighter uppercase text-white">Dash<span className="text-indigo-400">Board</span></span>
              </div>

              <div className="px-6 mb-4 text-[10px] font-black text-slate-600 uppercase tracking-widest">Global Portfolio</div>
              <div className="px-4 space-y-4 mb-10">
                {projects.map(proj => (
                  <div key={proj.id} className="space-y-1">
                    <button 
                      onClick={() => setSelectedProjectId(proj.id)} 
                      className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-bold transition-all ${selectedProjectId === proj.id ? 'bg-indigo-500/10 text-indigo-400 ring-1 ring-indigo-500/30 shadow-lg shadow-indigo-600/5' : 'text-slate-500 hover:text-slate-300'}`}
                    >
                      <div className="flex items-center space-x-3 truncate">
                        {selectedProjectId === proj.id ? <FolderOpen className="w-4 h-4 shrink-0" /> : <Folder className="w-4 h-4 shrink-0" />}
                        <span className="truncate">{String(proj.name || 'Untitled')}</span>
                      </div>
                      {selectedProjectId === proj.id ? <ChevronDown className="w-3.5 h-3.5" /> : <ChevronRight className="w-3.5 h-3.5 opacity-30" />}
                    </button>

                    {selectedProjectId === proj.id && (
                      <div className="ml-6 border-l border-slate-800/80 pl-4 py-2 space-y-5 animate-in slide-in-from-top-2 duration-300">
                        <div className="space-y-1">
                          <div className="px-2 mb-2 text-[9px] font-black text-slate-700 uppercase tracking-widest flex items-center gap-2">Project Assets</div>
                          <button onClick={() => setView('backlog')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${view === 'backlog' ? 'bg-slate-800 text-indigo-400 border border-slate-700' : 'text-slate-500 hover:text-slate-300'}`}>
                            <ClipboardList className="w-3.5 h-3.5" />
                            <span>Requirement Repo</span>
                          </button>
                          <button onClick={() => setView('audit')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${view === 'audit' ? 'bg-slate-800 text-indigo-400 border border-slate-700' : 'text-slate-500 hover:text-slate-300'}`}>
                            <History className="w-3.5 h-3.5" />
                            <span>Activity Ledger</span>
                          </button>
                          <button onClick={() => setView('config')} className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${view === 'config' ? 'bg-slate-800 text-indigo-400 border border-slate-700' : 'text-slate-500 hover:text-slate-300'}`}>
                            <Settings2 className="w-3.5 h-3.5" />
                            <span>Board Setup</span>
                          </button>
                        </div>

                        <div className="space-y-1">
                          <div className="flex items-center justify-between px-2 mb-2">
                            <span className="text-[9px] font-black text-slate-700 uppercase tracking-widest flex items-center gap-2">Sprints</span>
                            <button onClick={() => setIsCreatingSprint(true)} className="p-1 text-slate-700 hover:text-indigo-400 transition-colors"><Plus className="w-3 h-3" /></button>
                          </div>
                          
                          <button 
                            onClick={() => { setActiveSprintId(null); setView('board'); }}
                            className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${view === 'board' && !activeSprintId ? 'bg-slate-800 text-indigo-400 border border-slate-700' : 'text-slate-500 hover:text-slate-300'}`}
                          >
                            <LayoutDashboard className="w-3.5 h-3.5" />
                            <span>Full Board</span>
                          </button>

                          <div className="space-y-0.5 mt-2 max-h-48 overflow-y-auto scrollbar-hide">
                            {sprints.map(s => (
                              <button key={s.id} onClick={() => { setActiveSprintId(s.id); setView('board'); }} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-[11px] font-bold transition-all ${view === 'board' && activeSprintId === s.id ? 'text-amber-400 bg-amber-500/5' : 'text-slate-600 hover:text-slate-400'}`}>
                                <Target className={`w-3 h-3 ${view === 'board' && activeSprintId === s.id ? 'text-amber-400' : 'text-slate-800'}`} />
                                <span className="truncate">{String(s.name || 'Sprint')}</span>
                              </button>
                            ))}
                          </div>

                          {isCreatingSprint && (
                            <form onSubmit={handleCreateSprint} className="px-2 pt-2">
                              <input autoFocus type="text" value={newSprintName} onChange={e => setNewSprintName(e.target.value)} placeholder="Sprint name..." className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-[11px] text-white focus:outline-none focus:border-indigo-600 shadow-inner" />
                            </form>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                {isCreatingProject ? (
                  <form onSubmit={handleCreateProject} className="px-2 pt-2">
                    <input autoFocus type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Portfolio name..." className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  </form>
                ) : (
                  <button onClick={() => setIsCreatingProject(true)} className="w-full flex items-center space-x-2 px-4 py-3 rounded-2xl text-xs font-black text-slate-700 hover:text-indigo-400 transition-all uppercase tracking-[0.2em] border border-dashed border-slate-800/50 mt-4"><Plus className="w-3.5 h-3.5 shrink-0" /><span>Initialize Portfolio</span></button>
                )}
              </div>
            </div>
            <div className="p-8 border-t border-slate-800/60 bg-slate-900/50 shrink-0">
              <div className="flex items-center space-x-3 mb-6">
                <img src={`https://ui-avatars.com/api/?name=${user?.displayName || 'User'}&background=6366f1&color=fff`} className="w-10 h-10 rounded-2xl border-2 border-slate-800 shadow-lg shadow-indigo-500/5" alt="User" />
                <div className="overflow-hidden"><p className="text-[11px] font-black text-slate-300 truncate tracking-tight">{String(user?.displayName || "System Agent")}</p></div>
              </div>
              <button onClick={onLogout} className="flex items-center space-x-2 text-slate-600 hover:text-red-400 text-[9px] font-black uppercase tracking-widest transition-colors group"><LogOut className="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" /><span>Terminate Session</span></button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950">
            <header className="px-10 py-8 border-b border-slate-800/60 bg-slate-900/10 shrink-0 flex justify-between items-end">
              <div className="animate-in fade-in duration-500">
                <h2 className="text-3xl font-black text-white tracking-tighter">
                  {activeProject ? String(activeProject.name) : "Secure Partition Initialization"}
                </h2>
                <div className="text-[10px] text-slate-500 mt-2 uppercase tracking-[0.4em] font-black flex items-center gap-3">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse"></span>
                  {view === 'backlog' ? 'Core Specification Database' : 
                   view === 'audit' ? 'Project Transaction Ledger' :
                   view === 'config' ? 'Workflow Configuration' :
                   (activeSprintId ? `Deployment / ${String(currentSprintName || 'Target')}` : 'Enterprise Kanban Board')}
                </div>
              </div>
            </header>
            <div className="flex-1 overflow-hidden">
              {activeProject && (
                view === 'backlog' ? <BacklogView tasks={activeProjectTasks} sprints={sprints} user={user} projectId={selectedProjectId} /> :
                view === 'board' ? <SprintBoard tasks={activeProjectTasks} sprints={sprints} swimlanes={swimlanes} user={user} projectId={selectedProjectId} activeSprintId={activeSprintId} setActiveSprintId={setActiveSprintId} /> :
                view === 'config' ? <SwimLaneConfig user={user} projectId={selectedProjectId} swimlanes={swimlanes} /> :
                <AuditLogView logs={auditLogs} />
              )}
              {!activeProject && (
                 <div className="h-full flex flex-col items-center justify-center opacity-30">
                   <Layers className="w-20 h-20 mb-4 text-slate-800 stroke-[0.5]" />
                   <p className="font-black text-slate-700 uppercase tracking-widest text-[10px]">Awaiting Core Selection</p>
                 </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    function SwimLaneConfig({ user, projectId, swimlanes }) {
      const [newLaneTitle, setNewLaneTitle] = useState('');

      const addLane = async (e) => {
        e.preventDefault();
        if (!newLaneTitle.trim()) return;
        const laneId = newLaneTitle.toLowerCase().replace(/\s+/g, '_');
        await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'projects', projectId, 'swimlanes', laneId), {
          id: laneId,
          title: newLaneTitle.trim(),
          order: swimlanes.length,
          color: 'indigo'
        });
        await logActivity(user.uid, projectId, "LANE_CONFIG_ADDED", `New swimlane "${newLaneTitle}" defined.`);
        setNewLaneTitle('');
      };

      const deleteLane = async (id, title) => {
        if (swimlanes.length <= 1) return;
        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'projects', projectId, 'swimlanes', id));
        await logActivity(user.uid, projectId, "LANE_CONFIG_PURGED", `Swimlane "${title}" excised.`);
      };

      return (
        <div className="h-full flex flex-col bg-slate-950 overflow-y-auto animate-in fade-in duration-500 px-10 py-10 scrollbar-hide">
           <div className="max-w-4xl mx-auto w-full space-y-12 pb-20">
              <div className="space-y-4">
                 <h3 className="text-2xl font-black text-white uppercase tracking-tighter">Workflow Orchestration</h3>
                 <p className="text-xs text-slate-500 font-medium leading-relaxed max-w-2xl">Define delivery phases for this portfolio. Boards will automatically sync to this configuration.</p>
              </div>
              <div className="bg-slate-900/30 border border-slate-800 rounded-[2.5rem] p-10 space-y-10 shadow-2xl">
                 <form onSubmit={addLane} className="flex gap-4">
                    <input value={newLaneTitle} onChange={e => setNewLaneTitle(e.target.value)} placeholder="Phase Identity..." className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-6 py-5 text-sm text-white focus:outline-none focus:border-indigo-500 font-bold" />
                    <button className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 shadow-lg">Add Phase</button>
                 </form>
                 <div className="grid gap-3">
                    {swimlanes.map(lane => (
                      <div key={lane.id} className="flex items-center justify-between bg-slate-900 border border-slate-800 p-6 rounded-3xl group hover:border-indigo-500/30 transition-all shadow-lg">
                         <div className="flex items-center space-x-6">
                            <GripVertical className="w-5 h-5 text-slate-800" />
                            <div>
                               <h4 className="text-sm font-black text-slate-200 uppercase tracking-widest">{String(lane.title || 'Lane')}</h4>
                               <span className="text-[9px] font-mono text-slate-700 uppercase">SYS_ID: {String(lane.id)}</span>
                            </div>
                         </div>
                         <button onClick={() => deleteLane(lane.id, lane.title)} className="p-3 text-slate-800 hover:text-red-500 transition-colors"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    ))}
                 </div>
              </div>
           </div>
        </div>
      );
    }

    function BacklogView({ tasks, sprints, user, projectId }) {
      const [searchTerm, setSearchTerm] = useState('');
      const backlogTasks = tasks.filter(t => t.status === 'backlog');

      const filteredTasks = useMemo(() => {
        const lowSearch = searchTerm.toLowerCase();
        return backlogTasks.filter(t => 
          String(t.title)?.toLowerCase().includes(lowSearch) || 
          String(t.moduleName)?.toLowerCase().includes(lowSearch)
        );
      }, [backlogTasks, searchTerm]);

      const hierarchy = useMemo(() => {
        const tree = {};
        filteredTasks.forEach(task => {
          const m = task.moduleName || "General Architecture";
          const s = task.projectSummary || "Overview";
          const spec = task.specName || "Standard Spec";
          const f = task.funcSpec || "Functional Units";
          if (!tree[m]) tree[m] = {};
          if (!tree[m][s]) tree[m][s] = {};
          if (!tree[m][s][spec]) tree[m][s][spec] = {};
          if (!tree[m][s][spec][f]) tree[m][s][spec][f] = [];
          tree[m][s][spec][f].push(task);
        });
        return tree;
      }, [filteredTasks]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file || !user || !projectId) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          const lines = event.target.result.split('\n').filter(l => l.trim() !== '');
          let count = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c?.replace(/"/g, '').trim());
            if (cols[5] || cols[0]) {
              await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'tasks'), {
                moduleName: String(cols[0] || "N/A"),
                projectSummary: String(cols[1] || "N/A"),
                specName: String(cols[2] || "N/A"),
                funcSpec: String(cols[3] || "N/A"),
                category: String(cols[4] || "Item"),
                title: String(cols[5] || "Requirement"),
                type: String(cols[6] || "N/A"),
                required: String(cols[7] || "No"),
                source: String(cols[8] || ""),
                condition: String(cols[9] || ""),
                options: String(cols[10] || ""),
                notes: String(cols[11] || ""),
                status: 'backlog',
                projectId,
                createdAt: Date.now() + i
              });
              count++;
            }
          }
          await logActivity(user.uid, projectId, "CORE_IMPORT", `Successfully mapped ${count} specification nodes.`);
        };
        reader.readAsText(file);
      };

      const assignToSprint = async (taskId, sprintId) => {
        const task = tasks.find(t => t.id === taskId);
        const sprint = sprints.find(s => s.id === sprintId);
        await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', taskId), { status: 'todo', sprintId: sprintId });
        await logActivity(user.uid, projectId, "NODE_DISPATCH", `Requirement mapped to cycle: ${sprint?.name}.`, task?.title);
      };

      const updateNode = async (id, data) => {
        const node = tasks.find(t => t.id === id);
        await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), data);
        await logActivity(user.uid, projectId, "NODE_EDIT", `Attributes adjusted for system definition.`, data.title || node?.title);
      };

      return (
        <div className="h-full flex flex-col bg-slate-950 overflow-hidden">
          <div className="px-10 py-6 border-b border-slate-900 flex items-center justify-between shrink-0">
            <div className="relative w-full max-w-sm">
              <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-700" />
              <input type="text" placeholder="Search architecture..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-indigo-600 transition-all font-medium" />
            </div>
            <label className="flex items-center space-x-2 text-[10px] font-black uppercase bg-indigo-600/10 text-indigo-400 px-6 py-3 rounded-xl border border-indigo-600/20 cursor-pointer shadow-lg active:scale-95 transition-all"><Upload className="w-4 h-4" /><span>Injest Data</span><input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} /></label>
          </div>
          <div className="flex-1 overflow-auto bg-slate-950 scroll-smooth">
            <div className="min-w-[1300px] flex flex-col h-full">
              <div className="sticky top-0 z-30 bg-slate-950 px-10 pt-4 pb-2">
                <div className="grid grid-cols-12 gap-4 px-10 py-4 bg-slate-900/95 border border-slate-800 rounded-2xl shadow-xl backdrop-blur-md">
                  <div className="col-span-5 text-[10px] font-black text-slate-500 pl-16">DEFINITION / ARCHITECTURE</div>
                  <div className="col-span-2 text-[10px] font-black text-slate-500 text-center">CATEGORY</div>
                  <div className="col-span-1 text-[10px] font-black text-slate-500 text-center">DATA</div>
                  <div className="col-span-1 text-[10px] font-black text-slate-500 text-center">PRIORITY</div>
                  <div className="col-span-3 text-[10px] font-black text-slate-500 text-right pr-10">CONTROL</div>
                </div>
              </div>
              <div className="px-10 pb-20">
                <div className="border border-slate-800 bg-slate-900/20 rounded-[2.5rem] divide-y divide-slate-900/50 shadow-2xl overflow-hidden">
                  {Object.entries(hierarchy).map(([mName, summaries]) => (
                    <div key={mName}>
                      <div className="px-10 py-3 bg-indigo-600/5 border-b border-slate-900/50 flex items-center space-x-4"><Box className="w-4 h-4 text-indigo-500" /><span className="text-[12px] font-black text-indigo-400 uppercase tracking-[0.3em] font-black">{String(mName)}</span></div>
                      {Object.entries(summaries).map(([sum, specs]) => (
                        <div key={sum}>
                          {Object.entries(specs).map(([spec, funcs]) => (
                            <div key={spec}>
                              <div className="px-12 py-2 bg-slate-900/40 text-[10px] font-black text-slate-500 border-b border-slate-900/50 flex items-center"><BookOpen className="w-3.5 h-3.5 mr-3 text-slate-700" /> {String(spec)}</div>
                              {Object.entries(funcs).map(([fName, items]) => (
                                <div key={fName}>
                                  <div className="px-16 py-1.5 bg-slate-900/10 text-[10px] font-bold text-slate-700 italic border-b border-slate-900/30 flex items-center gap-2"><ArrowRight className="w-3 h-3 text-indigo-900" /> {String(fName)}</div>
                                  {items.map(item => (
                                    <TableRow key={item.id} task={item} sprints={sprints} onAssign={assignToSprint} onDelete={async () => {
                                      await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', item.id));
                                      await logActivity(user.uid, projectId, "NODE_PURGED", `Requirement permanently excised.`, item.title);
                                    }} onUpdate={updateNode} />
                                  ))}
                                </div>
                              ))}
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TableRow({ task, sprints, onAssign, onDelete, onUpdate }) {
      const [open, setOpen] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [showSprintMenu, setShowSprintMenu] = useState(false);
      const [editData, setEditData] = useState({ title: task.title, condition: task.condition, source: task.source, options: task.options, notes: task.notes });

      const handleSave = async () => { await onUpdate(task.id, editData); setIsEditing(false); };
      const handleCancel = () => { setEditData({ title: task.title, condition: task.condition, source: task.source, options: task.options, notes: task.notes }); setIsEditing(false); };

      return (
        <div className={`hover:bg-slate-900/40 transition-all border-b border-slate-900/30 last:border-0 ${open ? 'bg-indigo-600/5 ring-1 ring-indigo-500/10' : ''}`}>
          <div className="grid grid-cols-12 gap-4 px-10 py-3 items-center">
            <div className="col-span-5 flex items-center space-x-6 pl-16 overflow-hidden pr-10">
              <div className={`w-2.5 h-2.5 rounded-full shrink-0 transition-all duration-500 ${open ? 'bg-indigo-500 scale-125' : 'bg-slate-800'}`}></div>
              <span className="text-[12px] font-bold text-slate-300 truncate cursor-help" title={String(task.title)}>{String(task.title)}</span>
            </div>
            <div className="col-span-2 text-center font-black uppercase text-[9px] text-slate-600">{String(task.category)}</div>
            <div className="col-span-1 text-center font-mono text-[10px] text-indigo-400 uppercase whitespace-nowrap">{String(task.type)}</div>
            <div className="col-span-1 text-center">{task.required?.toLowerCase() === "yes" ? <span className="text-[8px] font-black text-red-500 bg-red-500/5 px-2 py-0.5 rounded border border-red-500/20 shadow-[0_0_8px_rgba(239,68,68,0.2)]">CRITICAL</span> : <span className="text-[8px] font-black text-slate-800 uppercase">Standard</span>}</div>
            <div className="col-span-3 flex items-center justify-end gap-3 relative pr-10">
              <button onClick={() => setOpen(!open)} className={`p-2 rounded-xl transition-all ${open ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:text-indigo-400'}`}><Info className="w-4 h-4" /></button>
              <div className="relative">
                <button onClick={() => setShowSprintMenu(!showSprintMenu)} className={`flex items-center space-x-2 px-4 py-2 rounded-xl text-[9px] font-black uppercase shadow-lg ${sprints.length > 0 ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-700'}`}><Zap className="w-3.5 h-3.5" /><span>Dispatch</span></button>
                {showSprintMenu && sprints.length > 0 && (
                  <div className="absolute right-0 top-full mt-3 w-56 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-50 overflow-hidden backdrop-blur-xl animate-in zoom-in-95 duration-200 origin-top-right ring-1 ring-white/5">
                    {sprints.map(s => (<button key={s.id} onClick={() => { onAssign(task.id, s.id); setShowSprintMenu(false); }} className="w-full text-left px-5 py-4 hover:bg-indigo-600 group text-xs font-black text-slate-400 hover:text-white transition-all">{String(s.name)}</button>))}
                  </div>
                )}
              </div>
              <button onClick={onDelete} className="p-2 text-slate-800 hover:text-red-500 transition-colors"><Trash2 className="w-4 h-4" /></button>
            </div>
          </div>
          {open && (
            <div className="px-24 py-12 bg-slate-950/90 border-t border-slate-900/80 grid grid-cols-5 gap-16 relative shadow-inner">
               <div className="absolute top-8 right-10 flex gap-2">
                  {isEditing ? (
                    <>
                      <button onClick={async () => { await onUpdate(task.id, editData); setIsEditing(false); }} className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase"><Save className="w-3.5 h-3.5 inline mr-1" /> Save</button>
                      <button onClick={() => setIsEditing(false)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Cancel</button>
                    </>
                  ) : (
                    <button onClick={() => setIsEditing(true)} className="bg-slate-900 border border-slate-800 text-slate-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:text-white hover:bg-indigo-600"><Edit3 className="w-3.5 h-3.5 inline mr-1" /> Edit</button>
                  )}
               </div>
               <div className="col-span-3 space-y-10">
                  <div>
                     <div className="flex items-center gap-2 mb-3"><Maximize2 className="w-3.5 h-3.5 text-indigo-500" /><p className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Full Architecture Context</p></div>
                     {isEditing ? <textarea value={editData.title} onChange={e => setEditData({...editData, title: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 text-lg font-bold text-white focus:outline-none" rows={2} /> : <div className="text-2xl font-black text-slate-200 tracking-tighter leading-[1.1]">{task.title}</div>}
                  </div>
                  <div>
                     <p className="text-[10px] font-black text-slate-700 uppercase tracking-widest mb-4">Logic Architecture</p>
                     {isEditing ? <textarea value={editData.condition} onChange={e => setEditData({...editData, condition: e.target.value})} className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-6 text-sm text-slate-400 focus:outline-none font-mono" rows={4} /> : <div className="bg-slate-900/80 p-6 rounded-[2rem] border border-slate-800 text-[13px] text-slate-400 leading-relaxed font-medium shadow-2xl">{task.condition || "Direct implementation logic."}</div>}
                  </div>
               </div>
               <div className="col-span-2 space-y-8">
                  <div className="bg-indigo-600/5 p-8 rounded-[2.5rem] border border-indigo-500/10 space-y-6">
                     <div><span className="text-slate-600 font-black uppercase tracking-widest text-[9px] block mb-2">Spec Source</span>{isEditing ? <input value={editData.source} onChange={e => setEditData({...editData, source: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-indigo-400" /> : <span className="text-indigo-400 font-bold uppercase tracking-tighter text-[11px] px-3 py-1 bg-indigo-500/5 rounded-lg border border-indigo-500/10">{task.source || "Native"}</span>}</div>
                     <div><span className="text-slate-600 font-black uppercase tracking-widest text-[9px] block mb-2">Options</span>{isEditing ? <input value={editData.options} onChange={e => setEditData({...editData, options: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-400 font-mono" /> : <div className="flex flex-wrap gap-2">{String(task.options || "N/A").split(';').map(o => (<span key={o} className="px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] font-bold text-slate-500">{o.trim()}</span>))}</div>}</div>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
    }

    function AuditLogView({ logs }) {
      const sorted = useMemo(() => [...logs].sort((a, b) => b.timestamp - a.timestamp), [logs]);
      return (
        <div className="h-full flex flex-col bg-slate-950 overflow-y-auto px-10 py-10 scrollbar-hide animate-in fade-in duration-500 pb-20">
           <div className="max-w-4xl mx-auto space-y-12">
              {sorted.map((log, i) => (
                <div key={log.id} className="relative flex gap-8 group">
                   <div className="absolute left-6 top-14 bottom-0 w-[1px] bg-slate-900 group-last:hidden"></div>
                   <div className={`shrink-0 w-12 h-12 rounded-2xl flex items-center justify-center border-2 transition-all shadow-2xl ${log.action.includes('CREATED') ? 'bg-indigo-500/10 border-indigo-500/30 text-indigo-400' : log.action.includes('MODIFIED') ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : log.action.includes('PURGED') ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                     <Activity className="w-5 h-5" />
                   </div>
                   <div className="flex-1 pb-10">
                      <div className="flex items-center justify-between mb-1"><span className="text-[10px] font-black uppercase text-slate-500">{new Date(log.timestamp).toLocaleString()}</span><span className="text-[8px] font-mono text-slate-800 uppercase">TX_{String(log.id).slice(0,6)}</span></div>
                      <h4 className="text-[13px] font-black text-slate-200 uppercase tracking-widest">{String(log.action).replace(/_/g, ' ')}</h4>
                      <p className="text-sm text-slate-500 mt-2 font-medium">{String(log.detail)}</p>
                      {log.requirementTitle && <div className="mt-4 bg-slate-900/30 px-5 py-3 rounded-2xl border border-slate-800/80 text-[10px] font-bold text-slate-400 flex items-center gap-3 w-fit"><Target className="w-3.5 h-3.5 text-indigo-600" /> {String(log.requirementTitle)}</div>}
                   </div>
                </div>
              ))}
           </div>
        </div>
      );
    }

    function SprintBoard({ tasks, sprints, swimlanes, user, projectId, activeSprintId, setActiveSprintId }) {
      const filtered = tasks.filter(t => t.sprintId === activeSprintId);
      const updateStatus = async (id, status) => {
        const task = tasks.find(t => t.id === id);
        await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), { status });
        await logActivity(user.uid, projectId, "TASK_TRANSITION", `Cycle moved to phase: ${status.toUpperCase()}`, task?.title);
      };
      return (
        <div className="h-full flex flex-col bg-slate-950 animate-in fade-in duration-700">
          <div className="px-10 py-6 border-b border-slate-900 flex items-center justify-between bg-slate-950 shrink-0 z-20 shadow-lg">
            <div className="flex items-center space-x-6">
              <div className="bg-amber-500/10 p-3 rounded-2xl text-amber-500 border border-amber-500/20"><Target className="w-5 h-5" /></div>
              <div><span className="text-[10px] font-black text-slate-600 uppercase tracking-widest block mb-1">Execution Architecture</span>
                <select value={activeSprintId || ''} onChange={e => setActiveSprintId(e.target.value)} className="bg-transparent text-white font-black text-2xl focus:outline-none tracking-tighter appearance-none cursor-pointer">
                  <option value="" disabled>Select Environment...</option>
                  {sprints.map(s => (<option key={s.id} value={s.id} className="bg-slate-900 font-sans">{String(s.name)}</option>))}
                </select>
              </div>
            </div>
            <div className="text-right border-l border-slate-800 pl-10"><span className="text-[10px] font-black text-slate-700 uppercase tracking-widest block mb-1">Queue Density</span><p className="text-lg font-black text-slate-400 font-mono">{filtered.length} UNITS</p></div>
          </div>
          <div className="flex-1 flex overflow-x-auto gap-8 px-10 py-10 bg-slate-950 scrollbar-hide">
            {!activeSprintId ? <div className="w-full flex flex-col items-center justify-center opacity-10 grayscale py-40"><Calendar className="w-32 h-32 mb-8 stroke-[0.3]" /><h3 className="text-2xl font-black uppercase tracking-[0.5em] text-slate-500 text-center leading-loose">Board Awaiting Context Initialization</h3></div> :
              swimlanes.map((lane, i) => (
                <SprintColumn key={lane.id} title={lane.title} icon={i === 0 ? <AlertCircle className="w-4 h-4" /> : i === swimlanes.length - 1 ? <CheckCircle2 className="w-4 h-4" /> : <Clock className="w-4 h-4" />} tasks={filtered.filter(t => t.status === lane.id)} onFwd={i < swimlanes.length - 1 ? id => updateStatus(id, swimlanes[i + 1].id) : null} onBack={i > 0 ? id => updateStatus(id, swimlanes[i - 1].id) : null} onDelete={async id => {
                  const task = tasks.find(t => t.id === id);
                  await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id));
                  await logActivity(user.uid, projectId, "TASK_EJECT", "Manual removal from cycle pipeline.", task?.title);
                }} />
              ))}
          </div>
        </div>
      );
    }

    function SprintColumn({ title, icon, tasks, onFwd, onBack, onDelete }) {
      return (
        <div className="flex flex-col h-full w-[340px] shrink-0 border border-slate-800/80 bg-slate-900/30 rounded-[3.5rem] overflow-hidden shadow-2xl transition-all">
          <div className="px-8 py-5 border-b border-slate-800/60 bg-slate-900/40 flex items-center justify-between shrink-0">
            <div className="flex items-center space-x-4"><span className="text-indigo-400">{icon}</span><h3 className="text-[11px] font-black uppercase tracking-[0.3em] text-slate-100">{String(title || 'Lane')}</h3></div>
            <span className="bg-slate-950 text-slate-700 px-4 py-1.5 rounded-full text-[10px] font-black border border-slate-800 shadow-inner">{tasks.length}</span>
          </div>
          <div className="p-6 space-y-4 overflow-y-auto flex-1 scrollbar-hide">
            {tasks.map(task => (
              <div key={task.id} className="bg-slate-900 border border-slate-800/60 p-4 rounded-[2rem] hover:border-indigo-500/30 transition-all duration-300 group shadow-lg relative overflow-hidden">
                {task.required?.toLowerCase() === "yes" && <div className="absolute top-2.5 right-2.5 w-1 h-1 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,1)] animate-pulse" />}
                <div className="flex items-center gap-1.5 mb-2.5">
                   <span className="text-[7px] font-black uppercase text-indigo-400 bg-indigo-500/5 px-2 py-0.5 rounded-lg border border-indigo-500/10 truncate max-w-[120px]">{String(task.moduleName)}</span>
                   <span className="text-[7px] font-black uppercase text-slate-700">{String(task.category)}</span>
                </div>
                <p className="text-[12px] font-bold text-slate-300 leading-tight mb-8 tracking-tight line-clamp-2">{String(task.title)}</p>
                <div className="flex items-center justify-between pt-4 border-t border-slate-800/80">
                  <button onClick={() => onDelete(task.id)} className="text-slate-800 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100"><Trash2 className="w-3.5 h-3.5" /></button>
                  <div className="flex space-x-2">
                    {onBack && <button onClick={() => onBack(task.id)} className="p-1.5 hover:bg-slate-800 rounded-xl text-slate-700 hover:text-white transition-all opacity-0 group-hover:opacity-100"><ChevronLeft className="w-4 h-4" /></button>}
                    {onFwd && <button onClick={() => onFwd(task.id)} className="p-1.5 hover:bg-slate-800 rounded-xl text-slate-700 hover:text-white transition-all opacity-0 group-hover:opacity-100"><ChevronRight className="w-4 h-4" /></button>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    
    // Render the Application
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
