                              <InfoIcon className="h-4 w-4 text-slate-500 hover:text-emerald-400 transition-colors" />
                            </MetricTooltip>
                          </h2>
                        </div>
                        <p className="text-sm text-slate-400">Tracking cumulative time entries vs available capacity.</p>
                      </div>
                      <div className="flex flex-row sm:flex-col gap-4 sm:gap-1.5 text-sm bg-[#0f172a] px-3 py-2 rounded-lg border border-slate-800 shrink-0">
                        <div className="flex items-center text-slate-400 font-medium"><div className="w-4 h-0 border-t-2 border-dashed border-slate-500 mr-2"></div> Capacity ({devCapacityHours}h)</div>
                        <div className="flex items-center text-slate-400 font-medium"><div className="w-4 h-0 border-t-2 border-dotted border-blue-400 mr-2"></div> Plotted ({totalEstHours}h)</div>

                      </div>
                    </div>

                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">

                            <linearGradient id="burnupGradient" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stopColor="#10b981" stopOpacity="0.25" />

                          <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          {smoothBurnupLinePath && <path d={smoothBurnupLinePath} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />}
                        </svg>
                      </div>

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">

                        <span>{dayLabels[2]}</span>
                        <span className="-mr-4">{dayLabels[3]}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 3. Utilization Section */}
                <div className="mb-8">

                  <div className="bg-[#0b1120] rounded-2xl border border-slate-800">
                    <div className="p-6 md:p-8 flex flex-col lg:flex-row gap-8 lg:gap-12">
                      <div className="flex-shrink-0 lg:w-1/3 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-slate-800 pb-6 lg:pb-0 lg:pr-8">
                        <div className="flex items-center space-x-3 mb-3">
                          <div className="bg-indigo-500/10 p-2.5 rounded-lg border border-indigo-500/20 shrink-0"><Target className="h-6 w-6 text-indigo-400" /></div>

                               <span className="text-xs font-bold text-white">{devUtilPct}%</span>
                             </div>
                             <div className="w-full bg-[#0f172a] border border-slate-800 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all duration-1000 ${devUtilPct > 100 ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(devUtilPct, 100)}%` }}></div></div>
                          </div>
                          <div>
                             <div className="flex justify-between items-center mb-1.5">
                               <span className="text-xs font-medium text-slate-400 flex items-center gap-1.5">QA Util (20% Demand) <MetricTooltip align="left" text="QA workload vs capacity." formula="(Total Est Hours × 20%) ÷ QA Capacity"><InfoIcon className="h-3 w-3 text-slate-500" /></MetricTooltip></span>
                               <span className="text-xs font-bold text-white">{qaUtilPct}%</span>
                             </div>
                             <div className="w-full bg-[#0f172a] border border-slate-800 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full transition-all duration-1000 ${qaUtilPct > 100 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(qaUtilPct, 100)}%` }}></div></div>

                            <div className="bg-[#0f172a] p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                              <div className="flex items-center text-slate-300"><Calendar className="w-4 h-4 mr-2 text-sky-400" /><span className="text-sm">Sprint Days</span></div><span className="text-lg font-bold text-white">{bucketDurationDays}</span>
                            </div>
                          </div>
                        </div>

                        <div className="space-y-4">
                          <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">Scope (Main Tasks) <MetricTooltip align="center" text="Total workload based on parent tasks." formula="Count of Main Tasks & Sum of their tracked Time Estimates."><InfoIcon className="h-3.5 w-3.5 text-slate-500" /></MetricTooltip></h4>
                          <div className="space-y-3">
                            <div className="bg-[#0f172a] p-3 rounded-xl border border-slate-800 flex flex-col">
                              <div className="flex justify-between items-center mb-1"><span className="text-sm text-slate-300 flex items-center"><Box className="w-3.5 h-3.5 mr-1.5 text-slate-500"/> Plotted</span><span className="text-sm font-bold text-white">{plottedScopeCount}</span></div>
                              <div className="text-xs text-slate-500 text-right">{plottedScopeEstHours} Est. Hours</div>

                              <div className="text-xs text-amber-500/70 text-right">{spillOverEstHours} Est. Hours</div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                      <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center flex-wrap gap-2">
                        Average Time in Status <MetricTooltip align="center" text="Average time completed tasks spend in intermediate phases." formula="Parses the task's Activity Logs timeline, calculates duration between status changes, and averages it."><InfoIcon className="h-3.5 w-3.5 text-slate-500 hover:text-indigo-400" /></MetricTooltip>
                      </h3>
                      
                      {avgTimeInStatusList.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                          {avgTimeInStatusList.map(stat => (
                            <div key={stat.status} className="flex justify-between items-center text-sm p-3 bg-[#0f172a] rounded-xl border border-slate-800">
                              <span className="text-slate-300 capitalize truncate pr-4">{stat.status}</span>
                              <span className="text-indigo-300 font-mono font-medium shrink-0 bg-indigo-500/10 px-2 py-1 rounded-md border border-indigo-500/20">{stat.timeDisplay}</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="text-sm text-slate-500 italic p-6 bg-[#0f172a] rounded-xl border border-slate-800 text-center">No status timing data is available for completed tasks yet.</div>
                      )}
                    </div>
                  </div>
                </div>

                {/* 5. Team Workload */}
                {assigneesList.length > 0 && (
                  <div className="mb-8">
                    <h2 className="text-lg font-semibold text-white mb-4 flex items-center gap-2"><Users className="h-5 w-5 text-indigo-400" /> Team Workload & Roles</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {assigneesList.map(assignee => {
                        let estHours = Math.round(assignee.totalEstMs / 3600000);
                        const spentHours = Math.round(assignee.totalSpentMs / 3600000);
                        if (spentHours > estHours) estHours = spentHours; // Auto-adjust to show true volume processed
                        
                        const progressPct = estHours > 0 ? Math.round((spentHours / estHours) * 100) : 0;
                        const totalAssigned = Object.values(assignee.statusCounts).reduce((s, c) => s + c.count, 0);

                        return (
                          <div key={assignee.username} className="bg-[#0b1120] p-5 rounded-2xl border border-slate-800 flex flex-col justify-between shadow-lg">
                            <div>
                              <div className="flex justify-between items-start mb-4">
                                <div className="flex items-center gap-3">
                                  <img src={assignee.profilePicture} className="w-10 h-10 rounded-full border border-slate-700 object-cover bg-slate-800" />
                                  <div>
                                    <h3 className="text-sm font-bold text-white">{assignee.username}</h3>
                                    <p className="text-xs text-slate-500">{totalAssigned} Assigned Items</p>
                                  </div>
                                </div>
                                <select value={userRoles[assignee.username] || 'Developer'} onChange={(e) => { const val = e.target.value; setUserRoles(p => { const n = {...p, [assignee.username]: val}; saveSettings({userRoles: n}); return n;}); }} className="bg-[#0f172a] border border-slate-700 text-indigo-300 text-[10px] font-bold uppercase rounded px-2 py-1 outline-none">
                                  <option value="Developer">Developer</option><option value="QA">QA</option>
                                </select>
                              </div>
                              <div className="flex flex-wrap gap-1.5 mb-6">
                                {Object.entries(assignee.statusCounts).map(([status, {count, color}]) => (
                                  <span key={status} className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border flex items-center gap-1" style={{ color, backgroundColor: `${color}10`, borderColor: `${color}30` }}>
                                    {status} <span className="opacity-70">{count}</span>
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div>
                              <div className="flex justify-between text-xs mb-1.5 font-medium"><span className="text-slate-500 flex items-center"><Clock className="w-3 h-3 mr-1" /> Logged Time</span><span className="text-white">{spentHours}h <span className="text-slate-600">/ {estHours}h</span></span></div>
                              <div className="w-full bg-[#0f172a] border border-slate-800 rounded-full h-1.5"><div className="bg-indigo-500 h-full rounded-full" style={{ width: `${progressPct}%` }}></div></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 6. Bug Tracking Widgets */}
                {totalBugsCount > 0 && (
                  <div className="mb-8">
                    <div className="flex items-center space-x-2 mb-4"><Bug className="h-5 w-5 text-rose-400" /><h2 className="text-lg font-semibold text-white">Quality & Defects</h2></div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 lg:gap-6">
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-purple-500/10 flex items-start space-x-4">
                        <div className="bg-purple-500/10 p-3 rounded-lg border border-purple-500/20"><Target className="h-6 w-6 text-purple-400" /></div>
                        <div className="min-w-0">
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Avg Quality Rate <MetricTooltip align="left" text="Average quality score across mother tasks." formula="100% minus penalty points for each bug based on complexity/priority. (Critical: -20, High: -15, Normal: -10, Low: -5)."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></p>
                          <p className="text-2xl font-bold text-white mt-1">{avgQualityRate}%</p>
                        </div>
                      </div>

                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-rose-500/10 flex items-start space-x-4">
                        <div className="bg-rose-500/10 p-3 rounded-lg border border-rose-500/20"><Bug className="h-6 w-6 text-rose-400" /></div>
                        <div className="min-w-0">
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Active Defects <MetricTooltip align="left" text="Unresolved bugs or defects." formula="Total identified bugs minus resolved bugs."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></p>
                          <p className="text-2xl font-bold text-white mt-1">{activeBugsCount}</p>
                        </div>
                      </div>
                      
                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-orange-500/10 flex items-start space-x-4">
                        <div className="bg-orange-500/10 p-3 rounded-lg border border-orange-500/20"><ShieldAlert className="h-6 w-6 text-orange-400" /></div>
                        <div className="min-w-0">
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">High/Critical <MetricTooltip align="center" text="Urgent defects requiring immediate attention." formula="Active defects with priority set to 'High', 'Urgent', or 'Critical'."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></p>
                          <p className="text-2xl font-bold text-white mt-1">{criticalBugsCount}</p>
                        </div>
                      </div>

                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-emerald-500/10 flex items-start space-x-4">
                        <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20"><Activity className="h-6 w-6 text-emerald-400" /></div>
                        <div className="min-w-0">
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Resolution Rate <MetricTooltip align="center" text="Percentage of total identified bugs that have been fixed." formula="(Resolved Bugs / Total Identified Bugs) × 100"><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></p>
                          <div className="flex items-end space-x-2 mt-1"><p className="text-2xl font-bold text-white">{bugResolutionRate}%</p></div>
                        </div>
                      </div>

                      <div className="bg-[#0b1120] p-6 rounded-2xl border border-sky-500/10 flex items-start space-x-4">
                        <div className="bg-sky-500/10 p-3 rounded-lg border border-sky-500/20"><Zap className="h-6 w-6 text-sky-400" /></div>
                        <div className="min-w-0">
                          <p className="text-sm font-medium text-slate-400 flex items-center gap-1 flex-wrap">Avg Fix Velocity <MetricTooltip align="right" text="Average turnaround time to resolve a defect." formula="Sum of (Date Closed - Date Created) for all resolved bugs / Total number of resolved bugs."><InfoIcon className="h-3.5 w-3.5" /></MetricTooltip></p>
                          <div className="flex items-end space-x-2 mt-1"><p className="text-2xl font-bold text-white">{avgVelocityValue}</p>{avgVelocityUnit && <p className="text-xs text-slate-400 mb-1">{avgVelocityUnit}</p>}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Stalled Tasks */}
                {stalledTasks.length > 0 && (
                  <div className="mb-8 bg-[#0b1120] rounded-2xl border border-slate-800 shadow-lg overflow-hidden">
                    <div className="px-5 py-4 border-b border-slate-800 flex justify-between items-center">
                      <h2 className="text-sm font-bold text-white flex items-center gap-2"><ClockAlert className="h-4 w-4 text-amber-500" /> Needs Attention <MetricTooltip text="Tasks exceeding estimate"><InfoIcon className="h-3 w-3 text-slate-500" /></MetricTooltip></h2>
                      <span className="text-[10px] font-bold text-amber-500 border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 rounded uppercase tracking-wider">Stalled</span>
                    </div>
                    <ul className="divide-y divide-slate-800/50 bg-[#0f172a]/50">
                      {stalledTasks.map(task => (
                        <li key={task.id} className="p-4 flex items-center justify-between">
                          <div>
                            <div className="flex items-center gap-2 mb-1"><div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: task.status?.color || '#94a3b8'}}/><span className="text-sm font-bold text-slate-200">{task.name}</span></div>
                            <div className="text-xs text-slate-500 ml-3.5"><ClockAlert className="w-3 h-3 inline mr-1 text-amber-500/50" /> Elapsed: {Math.floor((now - parseInt(task.date_created))/86400000)}d / Est: {Math.round(parseInt(task.time_estimate)/3600000)}h</div>
                          </div>
                          {task.assignees && task.assignees.length > 0 && <img src={task.assignees[0].profilePicture || `https://ui-avatars.com/api/?name=${task.assignees[0].username}`} className="w-6 h-6 rounded-full border border-slate-700 bg-slate-800" />}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Active Explorer */}
                <div className="bg-[#0b1120] rounded-2xl border border-slate-800 overflow-hidden shadow-lg mb-8">
                  <div className="px-5 py-4 border-b border-slate-800"><h2 className="text-sm font-bold text-white flex items-center gap-2"><ListTodo className="h-4 w-4 text-indigo-400" /> Active Tasks Explorer</h2></div>
                  <div className="p-5">
                    {activeWorkflows.map(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      const rootTasksByTags = buildFilteredTree(mainTasksOnly, false);
                      return (
                        <div key={workflow.id}>
                          <div className="space-y-2">
                            {rootTasksByTags.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
                          </div>
                        </div>
                      )
                    })}
                  </div>
                </div>

                {/* Completed Tasks Section */}
                <div className="bg-[#0b1120] rounded-2xl border border-slate-800 overflow-hidden shadow-lg mb-8">
                  <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
                    <h2 className="text-sm font-bold text-white flex items-center gap-2"><CheckCircle2 className="h-4 w-4 text-emerald-400" /> Completed Tasks Explorer</h2>
                    <span className="text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">{completedFilteredTasksCount} Resolved</span>
                  </div>
                  <div className="p-5">
                    {activeWorkflows.map(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      const completedTasksTree = buildFilteredTree(mainTasksOnly, true);
                      if (completedTasksTree.length === 0) return null;
                      return (
                        <div key={`completed-${workflow.id}`}>
                          <div className="space-y-2">
                            {completedTasksTree.map(task => <TaskItem key={task.id} task={task} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={true} />)}
                          </div>
                        </div>
                      );
                    })}
                    {activeWorkflows.every(workflow => {
                      const mainTasksOnly = (workflow.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
                      return buildFilteredTree(mainTasksOnly, true).length === 0;
                    }) && <div className="text-center text-sm text-slate-500 italic py-4">No completed tasks match your filters yet.</div>}
                  </div>
                </div>

              </main>
            )}
          </div>
        );
      }

      // Default Login UI Fallback (If user is null)
      return (
        <div className="min-h-screen bg-[#050810] flex font-sans relative overflow-hidden">
          <WebNestBackground opacity={0.5} />
          <div className="w-full flex items-center justify-center p-8 relative z-20">
            <div className="w-full max-w-md bg-[#0b1120] border border-slate-800 p-8 rounded-3xl shadow-2xl">
              <div className="text-center mb-8">
                <SpiderNetworkIcon className="h-10 w-10 text-indigo-500 mx-auto mb-4" />
                <h2 className="text-2xl font-bold text-white">Sign in to Weaver</h2>
                <p className="text-slate-400 text-sm mt-2">Thread your support and development together.</p>
              </div>
              <div className="space-y-4">
                <button onClick={handleGoogleLogin} className="w-full flex items-center justify-center gap-3 px-4 py-3 bg-[#0f172a] border border-slate-700 hover:bg-slate-800 text-white rounded-xl font-medium transition-colors">
                  <svg className="h-5 w-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                  Sign in with Google
                </button>
                <button onClick={handleMockLogin} className="w-full flex items-center justify-center gap-3 px-4 py-3 bg-indigo-500/10 border border-indigo-500/30 hover:bg-indigo-500/20 text-indigo-300 rounded-xl font-medium transition-colors">
                  <Zap className="h-5 w-5" /> Bypass Login (Preview)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
