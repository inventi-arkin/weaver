<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Weaver - Thread Support and Development together</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel Standalone (Compiles JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Custom Styles -->
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.4); }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 12s linear infinite; }

    /* Neon Glowing Buttons */
    .btn-neon {
      padding: 8px 16px;
      text-transform: uppercase;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff80;
      text-shadow: none;
      background: transparent;
      cursor: pointer;
      box-shadow: transparent;
      border: 1px solid #ffffff80;
      transition: 0.5s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
    }

    .btn-neon.btn-neon-sm {
      padding: 6px 12px;
      font-size: 10px;
      border-radius: 6px;
    }

    .btn-neon-indigo:hover, .btn-neon-indigo:focus {
      color: #ffffff;
      background: #6366f1;
      border-color: #6366f1;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #6366f1, 0 0 20px #6366f1, 0 0 50px #6366f1, 0 0 100px #6366f1;
      outline: none;
    }

    .btn-neon-emerald:hover, .btn-neon-emerald:focus {
      color: #ffffff;
      background: #10b981;
      border-color: #10b981;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #10b981, 0 0 20px #10b981, 0 0 50px #10b981, 0 0 100px #10b981;
      outline: none;
    }

    .btn-neon-slate:hover, .btn-neon-slate:focus {
      color: #ffffff;
      background: #64748b;
      border-color: #64748b;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #64748b, 0 0 20px #64748b, 0 0 50px #64748b, 0 0 100px #64748b;
      outline: none;
    }

    .btn-neon:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* General Glowing Interactables (Inputs, Selects, Checkboxes) */
    .neon-input {
      transition: all 0.4s ease;
    }
    .neon-input:focus, .neon-input:hover {
      border-color: #6366f1 !important;
      box-shadow: 0 0 5px #6366f1, 0 0 15px #6366f1, 0 0 30px #6366f1 !important;
      outline: none;
    }

    /* Text & Icon Glow */
    .neon-text-indigo { transition: all 0.3s ease; }
    .neon-text-indigo:hover, .neon-text-indigo:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #6366f1, 0 0 20px #6366f1 !important;
      outline: none;
    }
    
    .neon-text-rose { transition: all 0.3s ease; }
    .neon-text-rose:hover, .neon-text-rose:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #f43f5e, 0 0 20px #f43f5e !important;
      outline: none;
    }

    .neon-text-emerald { transition: all 0.3s ease; }
    .neon-text-emerald:hover, .neon-text-emerald:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #10b981, 0 0 20px #10b981 !important;
      outline: none;
    }
    
    .neon-text-slate { transition: all 0.3s ease; }
    .neon-text-slate:hover, .neon-text-slate:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #64748b, 0 0 20px #64748b !important;
      outline: none;
    }

    /* Neon Border / Background Glow for Badges & Icon Buttons */
    .neon-border-emerald { transition: all 0.3s ease; }
    .neon-border-emerald:hover {
      border-color: #10b981 !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4), inset 0 0 5px rgba(16, 185, 129, 0.2) !important;
      color: #34d399 !important;
    }

    .neon-border-indigo { transition: all 0.3s ease; }
    .neon-border-indigo:hover {
      border-color: #6366f1 !important;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4), inset 0 0 5px rgba(99, 102, 241, 0.2) !important;
      color: #818cf8 !important;
    }

    .neon-border-rose { transition: all 0.3s ease; }
    .neon-border-rose:hover {
      border-color: #f43f5e !important;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.4), inset 0 0 5px rgba(244, 63, 94, 0.2) !important;
      color: #fb7185 !important;
    }

    .neon-border-amber { transition: all 0.3s ease; }
    .neon-border-amber:hover {
      border-color: #f59e0b !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4), inset 0 0 5px rgba(245, 158, 11, 0.2) !important;
      color: #fbbf24 !important;
    }

    .neon-border-slate { transition: all 0.3s ease; }
    .neon-border-slate:hover {
      border-color: #64748b !important;
      box-shadow: 0 0 10px rgba(100, 116, 139, 0.4), inset 0 0 5px rgba(100, 116, 139, 0.2) !important;
      color: #e2e8f0 !important;
    }

    /* Synced Pill Badge Specific Emerald Glow */
    .pill-neon-emerald { transition: all 0.5s ease; }
    .pill-neon-emerald:hover {
      color: #ffffff !important;
      background: #10b981 !important;
      border-color: #10b981 !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff !important;
      box-shadow: 0 0 5px #10b981, 0 0 20px #10b981, 0 0 50px #10b981, 0 0 100px #10b981 !important;
      outline: none;
    }

    /* Floating Card Lift and Glow */
    .neon-card { transition: all 0.3s ease; }
    .neon-card:hover {
      transform: translateY(-5px);
      border-color: rgba(99, 102, 241, 0.4) !important;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2), 0 8px 10px -6px rgba(99, 102, 241, 0.1) !important;
      z-index: 50;
    }

  <script type="text/babel" data-type="module" data-presets="react-classic">
    import React, { useState, useEffect, useRef } from 'react';

    import { initializeApp } from 'firebase/app';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as firebaseSignOut, signInAnonymously, signInWithCustomToken, updateProfile } from 'firebase/auth';

    // --- STREAMING_CHUNK:Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyCzNMczm3bQ_1rnpoxvDswGDy4PE7XXCnI",
      authDomain: "weaver-2b8f6.firebaseapp.com",
      projectId: "weaver-2b8f6",
      storageBucket: "weaver-2b8f6.firebasestorage.app",
      messagingSenderId: "218175480887",
      appId: "1:218175480887:web:3887766b9c54e89edf8bb2",
      measurementId: "G-ZY3SWFL8WV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'weaver-default-app';

    // --- STREAMING_CHUNK:Defining UI Helpers ---
    const SpiderNetworkIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 3 L19 7 L21 14 L17 20 L12 21 L7 20 L3 14 L5 7 Z" strokeWidth="1" strokeDasharray="2 2" opacity="0.3" />
        <path d="M12 7 L16 10 L17 15 L14 18 L12 18.5 L10 18 L7 15 L8 10 Z" strokeWidth="1" opacity="0.2" fill="currentColor" />
        <circle cx="12" cy="14" r="2.5" fill="currentColor" opacity="0.9" />
        <circle cx="12" cy="9.5" r="1.5" fill="currentColor" opacity="0.9" />
        <path d="M11 9 L5 7 L3 14" />
        <path d="M13 9 L19 7 L21 14" />
        <path d="M10.5 15 L7 20" />
        <path d="M13.5 15 L17 20" />
        <circle cx="5" cy="7" r="1" fill="currentColor" />
        <circle cx="19" cy="7" r="1" fill="currentColor" />
        <circle cx="3" cy="14" r="1" fill="currentColor" />
        <circle cx="21" cy="14" r="1" fill="currentColor" />
        <circle cx="7" cy="20" r="1" fill="currentColor" />
        <circle cx="17" cy="20" r="1" fill="currentColor" />
        <circle cx="12" cy="3" r="1" fill="currentColor" opacity="0.5" />
        <path d="M12 3 L12 8" strokeWidth="1" opacity="0.5" />
      </svg>
    );

    const ClockAlert = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 15 15"></polyline>
      </svg>
    );

    const MetricTooltip = ({ text, formula, align = 'center', position = 'top', children }) => {
      let alignClasses = "";
      let pointerAlignClasses = "";
      
      if (align === 'center') {
        alignClasses = "left-1/2 -translate-x-1/2";
        pointerAlignClasses = "left-1/2 -translate-x-1/2";
      } else if (align === 'left') {
        alignClasses = "left-0";
        pointerAlignClasses = "left-4";
      } else if (align === 'right') {
        alignClasses = "right-0";
        pointerAlignClasses = "right-4";
      }

      const verticalClasses = position === 'top' ? "bottom-full mb-3" : "top-full mt-3";
      const pointerVerticalClasses = position === 'top' ? "top-full border-t-slate-800 border-b-transparent" : "bottom-full border-b-slate-800 border-t-transparent";

      return (
        <div className="group relative flex items-center justify-center cursor-help z-50 hover:z-[999999]">
          <div className="p-1 -m-1 flex items-center justify-center neon-text-indigo">{children}</div>
          <div className={`pointer-events-none absolute z-[999999] w-64 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.5)] p-4 ${alignClasses} ${verticalClasses}`}>
            <p className="font-semibold text-white leading-snug">{text}</p>
            {formula && (
              <div className="mt-2.5 pt-2.5 border-t border-slate-700/50">
                <span className="text-indigo-400 font-bold text-[9px] uppercase tracking-widest block mb-1">Formula / Logic</span>
                <p className="font-mono text-[10px] text-slate-400 leading-relaxed break-words">{formula}</p>
              </div>
            )}
            <div className={`absolute border-[6px] border-transparent ${pointerAlignClasses} ${pointerVerticalClasses}`}></div>
          </div>
        </div>
      );
    };

    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false }) => {
      const relevantSubtasks = task.subtasks || [];
      const hasSubtasks = relevantSubtasks.length > 0;
      const isExpanded = !!expandedTasks[task.id];
      const isParent = depth === 0;

      const themeColor = task.status?.color || '#38bdf8';
      const isDoneStatus = ['closed', 'complete', 'done', 'resolved'].includes((task.status?.status || '').toLowerCase());
      
      const estimateMs = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const spentMs = task.time_spent ? parseInt(task.time_spent) : (isDoneStatus ? estimateMs : 0);
      const hasTimeData = estimateMs > 0 || spentMs > 0;
      const displayHours = hasTimeData ? `${Math.round(spentMs / 3600000)}h / ${Math.round(estimateMs / 3600000)}h` : null;
      
      return (
        <div className={`transition-all ${isParent ? 'bg-slate-900/60 border border-white/5 rounded-xl neon-card' : 'bg-slate-900/40 rounded-r-lg border-l-2'}`} style={!isParent ? { borderLeftColor: `${themeColor}40` } : {}}>
          <div className={`flex flex-col p-3 gap-1.5 ${!isParent ? 'pl-4' : ''}`}>
            
            {/* Top Row: Title */}
            <div className="flex items-start space-x-3 w-full group cursor-help relative">
              <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg mt-1.5" style={{ backgroundColor: themeColor, boxShadow: `0 0 8px ${themeColor}` }} />
              <div className="relative min-w-0 flex-1">
                 <span className={`font-semibold block truncate transition-colors group-hover:text-indigo-300 ${isParent ? 'text-slate-100 text-[15px]' : 'text-slate-300 text-sm'}`} title={task.name}>{task.name || 'Unnamed Task'}</span>
              </div>
            </div>
            
            {/* Bottom Row: Metadata */}
            <div className="flex items-center shrink-0 space-x-3 pl-5 overflow-x-auto overflow-y-hidden py-0.5">
              {hasSubtasks && (
                <button onClick={() => toggleTaskExpand(task.id)} className="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-indigo-500/10 text-[10px] text-indigo-300 font-bold border border-transparent transition-all shrink-0 neon-border-indigo">
                  <span>Subtasks ({relevantSubtasks.length})</span>
                  <ChevronRight className={`h-3 w-3 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                </button>
              )}
              {hasTimeData && (
                <div className="flex items-center text-xs text-slate-400 whitespace-nowrap shrink-0">
                  <Clock className="h-3.5 w-3.5 mr-1.5 text-slate-500" /> {displayHours}
                </div>
              )}
              <span className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border shrink-0" style={{ color: themeColor, backgroundColor: `${themeColor}15`, borderColor: `${themeColor}30` }}>
                {task.status?.status || 'Open'}
              </span>
              {isParent && task.tags && task.tags.length > 0 && (
                <div className="flex items-center space-x-1 mr-2 hidden sm:flex shrink-0">
                  <Tag className="h-3 w-3 text-slate-500 mr-1" />
                  {task.tags.map((tag, i) => (
                    <span key={i} className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap" style={{ color: tag.color || '#6366f1', backgroundColor: `${tag.color || '#6366f1'}15`, border: `1px solid ${tag.color || '#6366f1'}30` }}>
                      {tag.name || ''}
                    </span>
                  ))}
                </div>
              )}
              {isParent && (
                task.assignees && task.assignees.length > 0 ? (
                  <div className="flex -space-x-1.5 shrink-0 ml-auto">
                    {task.assignees.map((assignee, i) => (
                      <img key={i} src={assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee.username || 'U')}&background=random`} alt={assignee.username} title={assignee.username} referrerPolicy="no-referrer" className="w-6 h-6 rounded-full border border-slate-900 bg-slate-800 object-cover relative transition-all hover:z-[99] hover:scale-110 neon-border-indigo cursor-help" />
                    ))}
                  </div>
                ) : (
                  <div className="flex items-center justify-center w-6 h-6 rounded-full border border-slate-800 bg-slate-900 text-slate-500 shrink-0 ml-auto" title="Unassigned"><Users className="h-3 w-3" /></div>
                )
              )}
            </div>
          </div>
          {isExpanded && hasSubtasks && (
            <div className="bg-slate-900/40 border-t border-white/5 p-3 space-y-2 ml-4 pl-3 border-l border-dashed border-white/10">
              {relevantSubtasks.map(sub => <TaskItem key={sub.id} task={sub} depth={depth + 1} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={isDoneMode} />)}
            </div>
          )}
        </div>
      );
    };

    // --- STREAMING_CHUNK:Canvas Background ---
    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        
        const setCanvasSize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        
        setCanvasSize();

        const handleResize = () => {
          setCanvasSize();
          initializeWebs();
        };
        
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];

          const vWidth = window.innerWidth;
          const vHeight = window.innerHeight;

          const webConfigs = [
            { cx: vWidth * 0.28, cy: vHeight * 0.5, radius: Math.min(vWidth, vHeight) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: vWidth * 0.72, cy: vHeight * 0.42, radius: Math.min(vWidth, vHeight) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];

            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });
            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                const x = cx + Math.cos(angle) * currentRadius;
                const y = cy + Math.sin(angle) * currentRadius;
                nodes.push({ id: nodes.length, x, y, spoke: s, ring: r, isHub: false });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });

            spiders.push({
              webIdx,
              currentNode: nodes[Math.floor(Math.random() * nodes.length)],
              targetNode: null,
              progress: 0,
              speed: 0.006 + Math.random() * 0.004,
              x: cx, y: cy, size: 7 + webIdx * 3, legCycle: 0, wovenPaths: []
            });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({ webIdx, from: edge.from, to: edge.to, progress: 0, speed: 0.015 + Math.random() * 0.02, size: 1.5 + Math.random() * 1.5 });
        };

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          webs.forEach(web => {
            web.edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${web.color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });
            web.nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${web.color}, 0.25)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) spawnPacket();

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) return packets.splice(idx, 1);
            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${webs[packet.webIdx].color}, 0.6)`;
            ctx.fill();
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];
            if (!spider.targetNode) {
              const neighbors = web.edges.filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id).map(e => e.from.id === spider.currentNode.id ? e.to : e.from);
              if (neighbors.length > 0) {
                spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)];
                spider.progress = 0;
              }
            }
            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;
              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;
              if (spider.progress >= 1) {
                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }
            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.beginPath();
            ctx.arc(0, 0, spider.size * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${web.color})`;
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full block z-0 transition-opacity duration-1000 pointer-events-none" style={{ opacity }} />;
    };

      const fetchClickUp = async (endpoint, token, method = 'GET', body = null) => {
        if (token === 'mock_token') return {};
        
        const targetUrl = `https://api.clickup.com/api/v2/${endpoint}`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`, 
          `https://thingproxy.freeboard.io/fetch/${targetUrl}`
        ];

        for (const proxyUrl of proxies) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            
            const fetchOptions = { 
              method, 
              headers: { 'Authorization': token, 'Content-Type': 'application/json' },
              signal: controller.signal
            };
            if (body) fetchOptions.body = JSON.stringify(body);
            
            const res = await fetch(proxyUrl, fetchOptions);
            clearTimeout(timeoutId);
            
            if (!res.ok) {
              let errText = '';
              try { const d = await res.json(); errText = d.err || d.error || ''; } catch(e){}
              throw new Error(errText || `HTTP ${res.status}`);
            }
            return await res.json();
          } catch (err) {
            if (err.name === 'AbortError' || err.message === 'Failed to fetch' || err.name === 'TypeError') continue;
            throw err; 
          }
        }
        throw new Error('Connection blocked by CORS or timed out.');
      };

      useEffect(() => {

      useEffect(() => {

      const availableLists = selectedFolder ? lists : folderlessLists;

          setClickUpError(err.message);
          setIntegrationStep('entering_token');
        }

      const buildTaskTree = (flatTasks) => {
        const taskMap = {};
        const roots = [];
        flatTasks.forEach(task => { taskMap[task.id] = { ...task, subtasks: [] }; });
        flatTasks.forEach(task => {
          const parentId = task.parent;
          if (parentId && taskMap[parentId]) {
            taskMap[parentId].subtasks.push(taskMap[task.id]);
          } else {
            roots.push(taskMap[task.id]);
          }
        });
        return roots;
      };

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;
        setIntegrationStep('connecting');
        const teamName = teams.find(t => t.id === selectedTeam)?.name || 'Workspace';
        const spaceName = spaces.find(s => s.id === selectedSpace)?.name || 'Space';
        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';

      const runSyncSequence = async () => {
        const workflowsToSync = mappedWorkflowsRef.current;
        if (workflowsToSync.length === 0 || !clickUpToken) return;
        setIsAutoSyncing(true);
        
        const updatedWorkflows = await Promise.all(workflowsToSync.map(async (workflow) => {
          let updatedTasks = workflow.tasks;
          let listStartDate = workflow.listStartDate || null;
          let listDueDate = workflow.listDueDate || null;

          if (clickUpToken === 'mock_token') {
            updatedTasks = buildTaskTree(MOCK_CLICKUP_DATA.tasks[workflow.listId] || MOCK_CLICKUP_DATA.tasks['mock_list_1']);
          } else {
            try {
              const listDetail = await fetchClickUp(`list/${workflow.listId}`, clickUpToken);
              if (listDetail.start_date) listStartDate = listDetail.start_date;
              if (listDetail.due_date) listDueDate = listDetail.due_date;

              let page = 0, hasMore = true, allFetchedTasks = [];
              while (hasMore) {
                  const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=true&include_closed=true&page=${page}`, clickUpToken);
                  const tasksChunk = data.tasks || [];
                  allFetchedTasks.push(...tasksChunk);
                  if (tasksChunk.length === 100) page++; else hasMore = false;
              }
              if (allFetchedTasks.length > 0) {
                  updatedTasks = buildTaskTree(allFetchedTasks);
              }
            } catch (err) { console.error("Sync error:", err); }
          }
          return { ...workflow, tasks: updatedTasks, lastSynced: Date.now(), listStartDate, listDueDate };
        }));
        
        setMappedWorkflows(prev => {
          const nextWorkflows = [...prev];
          updatedWorkflows.forEach(updatedWf => {
             const idx = nextWorkflows.findIndex(w => w.id === updatedWf.id);
             if (idx !== -1) nextWorkflows[idx] = updatedWf;
          });
          
          localStorage.setItem(`weaver_workflows_${appId}`, JSON.stringify(nextWorkflows));

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');

                console.error("Error saving synced workflows:", err);

          return nextWorkflows;

        setIsAutoSyncing(false);

                 try { await signInAnonymously(auth); } catch(fallbackErr) { console.warn(fallbackErr); }

            } else {
              setUser((prev) => prev?.isMock ? prev : null);

            setAuthInitialized(true);
          }
          isInitialAuthCheck = false;

        return () => unsubscribe();

        if (!activeListId) return;

        try {
          const localSettings = JSON.parse(localStorage.getItem(`weaver_settings_${appId}_${activeListId}`) || '{}');
          setDevHoursPerDay(localSettings.devHoursPerDay !== undefined ? localSettings.devHoursPerDay : 7);
          setQaHoursPerDay(localSettings.qaHoursPerDay !== undefined ? localSettings.qaHoursPerDay : 7);
          setDateBlockers(localSettings.dateBlockers || []);

        } catch (e) { console.warn(e); }

        if (!user || user.isMock) return;

        const capRef = doc(db, 'artifacts', appId, 'public', 'data', 'capacity', activeListId);
        const unsubCap = onSnapshot(capRef, (snapshot) => {
          if (snapshot.exists()) {
            const d = snapshot.data();
            setDevHoursPerDay(d.devHoursPerDay !== undefined ? d.devHoursPerDay : 7);
            setQaHoursPerDay(d.qaHoursPerDay !== undefined ? d.qaHoursPerDay : 7);
            setDateBlockers(d.dateBlockers || []);
            setUserRoles(d.userRoles || {});
          } else {
            setDevHoursPerDay(7);
            setQaHoursPerDay(7);
            setDateBlockers([]);
            setUserRoles({});
          }
        }, (error) => console.error("Error fetching capacity settings:", error));

        return () => unsubCap();
      }, [activeListId, user]);

      useEffect(() => {
        if (!user || user.isMock) return;

        const ledgerRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
        const unsubLedger = onSnapshot(ledgerRef, (snapshot) => {
          if (isOfflineFallback.current) return;
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.entries) setGlobalTimeLedger(data.entries);
          }
        }, (error) => console.error("Error fetching global ledger:", error));

        const wfRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'workflows');
        const unsubWf = onSnapshot(wfRef, (snapshot) => {
          if (isOfflineFallback.current) return;
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.mappedWorkflows) setMappedWorkflows(data.mappedWorkflows);
          }
        }, (error) => console.error("Error fetching workflows:", error));

        const txRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'transactions');
        const unsubTx = onSnapshot(txRef, (snapshot) => {
          if (isOfflineFallback.current) return;
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.entries) {
                const sorted = data.entries.sort((a,b) => b.timestamp - a.timestamp).slice(0, 100);
                setTransactions(sorted);
            }
          }
        }, (error) => console.error("Error fetching transactions:", error));

        return () => { unsubLedger(); unsubWf(); unsubTx(); };
      }, [user]);

      const handleMockLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try {
          await signInAnonymously(auth);
        } catch (error) {
          console.warn("Firebase Auth blocked, falling back to fully local isolated session:", error);
          setUser({ name: 'Preview User', email: 'preview@weaver.app', avatar: 'https://ui-avatars.com/api/?name=Preview+User', isMock: true });
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true);
        setErrorMessage(null);
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain' || error.message.includes('iframe') || error.code === 'auth/popup-closed-by-user') {
            setErrorMessage("Domain unauthorized. Falling back to Local Offline mode. To enable cross-device sync, please replace the firebaseConfig in the HTML with your own Firebase project credentials.");
            handleMockLogin();
          } else { 
            setErrorMessage(error.message); 
            handleMockLogin(); 
          }
        } finally { 
          setIsLoggingIn(false); 
        }
      };

      const handleLogout = () => {
        if (auth.currentUser) firebaseSignOut(auth);
        else setUser(null);
        localStorage.removeItem(`weaver_clickup_token_${appId}`);
      };

      const handleProfilePhotoUpdate = async () => {
        if (!auth.currentUser || !newProfilePicUrl) return;
        setProfileUpdateError(null);
        try {
          await updateProfile(auth.currentUser, {
            photoURL: newProfilePicUrl
          });
          setUser(prev => ({ ...prev, avatar: newProfilePicUrl }));
          setIsProfileModalOpen(false);
          setNewProfilePicUrl('');
          logTransaction('Profile Updated', 'User profile picture was manually changed', 'info');
        } catch (err) {
          setProfileUpdateError(err.message);
        }
      };

      const handleLogTime = async () => {
        if (!selectedTaskIdForTime || !timeEntryHours) return;
        const ms = parseFloat(timeEntryHours) * 3600000;
        
        let entryTimestamp = Date.now();
        if (timeEntryDate) {
            const [y, m, d] = timeEntryDate.split('-');
            const dateObj = new Date(y, m - 1, d, 12, 0, 0);
            entryTimestamp = dateObj.getTime();
        }

        const newEntry = {
          id: Date.now().toString(),
          taskId: selectedTaskIdForTime,
          ms: ms,
          timestamp: entryTimestamp,
          userId: timeAssignee || user?.name || 'unknown',
          note: timeEntryNote || 'Manual entry'
        };
        
        setGlobalTimeLedger(prev => {
          const updated = [...prev, newEntry];
          localStorage.setItem(`weaver_ledger_${appId}`, JSON.stringify(updated));
          return updated;
        });
        
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
          try {
            await updateDoc(docRef, { entries: arrayUnion(newEntry) });
          } catch (error) {
            if (error.code === 'not-found') await setDoc(docRef, { entries: [newEntry] });
            else {
                console.error("Error saving time entry:", error);
                isOfflineFallback.current = true;
            }
          }
        }

        logTransaction('Time Logged', `${timeEntryHours}h logged on target task`, 'clock');

        setTimeEntryHours('');
        setTimeEntryNote('');
      };

      const handleDeleteTimeEntry = async (entry) => {
        setGlobalTimeLedger(prev => prev.filter(e => e.id !== entry.id));
        logTransaction('Time Entry Deleted', `Removed time log`, 'trash');
        if (user && !user.isMock) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ledgers', 'global');
          try {
            await updateDoc(docRef, { entries: arrayRemove(entry) });
          } catch (error) {
            console.error("Error deleting time entry:", error);
            isOfflineFallback.current = true;
          }
        }
      };

      // --- STREAMING_CHUNK:Dashboard Processing Engine ---
      if (!authInitialized) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center">
            <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      if (user) {
        const applyLedger = (tasks) => {
          return tasks.map(t => {
            const processedSubtasks = t.subtasks ? applyLedger(t.subtasks) : [];
            const ledgerEntries = globalTimeLedger.filter(e => e.taskId === t.id);
            const directAddedTimeMs = ledgerEntries.reduce((sum, e) => sum + Number(e.ms || 0), 0);
            const rolledUpAddedTimeMs = processedSubtasks.reduce((sum, sub) => sum + Number(sub._totalLocalAddedMs || 0), 0);
            const totalLocalAddedMs = directAddedTimeMs + rolledUpAddedTimeMs;

            const rawNativeSpent = Number(t.time_spent || 0);
            const rolledUpNativeSpent = processedSubtasks.reduce((sum, sub) => sum + Number(sub.rawNativeSpent || 0), 0);
            const directNativeSpent = Math.max(0, rawNativeSpent - rolledUpNativeSpent);

            const rawEstimate = Number(t.time_estimate || 0);
            const rolledUpEstimate = processedSubtasks.reduce((sum, sub) => sum + Number(sub.rawEstimate || 0), 0);
            const directEstimate = Math.max(0, rawEstimate - rolledUpEstimate);

            return {
              ...t,
              rawNativeSpent,
              directNativeSpent,
              rawEstimate,
              directEstimate,
              localLedger: ledgerEntries,
              _totalLocalAddedMs: totalLocalAddedMs,
              _directAddedTimeMs: directAddedTimeMs,
              time_spent: rawNativeSpent + totalLocalAddedMs,
              _direct_time_spent: directNativeSpent + directAddedTimeMs,
              time_estimate: rawEstimate,
              subtasks: processedSubtasks
            };
          });
        };

        const activeWorkflows = mappedWorkflows.map(wf => ({
          ...wf,
          tasks: applyLedger(wf.tasks || [])
        }));

        const flattenTasksDeep = (tasks) => tasks.reduce((acc, task) => {
            acc.push(task);
            if (task.subtasks) acc.push(...flattenTasksDeep(task.subtasks));
            return acc;
        }, []);

        const allFlatTasks = flattenTasksDeep(activeWorkflows.flatMap(wf => wf.tasks || []));

        const getLoggedMsForTask = (taskId) => globalTimeLedger.filter(e => e.taskId === taskId).reduce((acc, curr) => acc + curr.ms, 0);

        const uniqueTags = Array.from(new Set(allFlatTasks.flatMap(t => t.tags?.map(tag => tag.name || '') || [])));
        const uniqueAssignees = Array.from(new Set(allFlatTasks.flatMap(t => [
            ...(t.assignees?.map(a => a.username || '') || []),
            ...(t.localLedger?.map(l => l.userId || '') || [])
        ]).filter(Boolean)));
        const workspaceUsers = Array.from(new Set([user?.name, ...uniqueAssignees])).filter(Boolean);

        const checkGlobalFilter = (t) => {
            if (completionFilterType === 'none') return true;
            if (completionFilterType === 'tags' && selectedTagFilter) return t.tags?.some(tag => (tag.name || '') === selectedTagFilter);
            if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                const nativelyAssigned = t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter);
                const locallyAssigned = t.localLedger?.some(l => (l.userId || '') === selectedAssigneeFilter);
                return nativelyAssigned || locallyAssigned;
            }
            return true;
        };
        
        let filteredTasks = allFlatTasks.filter(checkGlobalFilter);
        const doneStatuses = ['closed', 'complete', 'done', 'resolved'];
        const backlogStatuses = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'new', 'pending'];

        const buildFilteredTree = (tasks, isDoneMode) => {
            let result = [];
            tasks.forEach(task => {
                const isDone = doneStatuses.includes((task.status?.status || '').toLowerCase());
                const matchesMode = isDoneMode ? isDone : !isDone;
                const matchesFilter = checkGlobalFilter(task);
                let filteredSubtasks = task.subtasks ? buildFilteredTree(task.subtasks, isDoneMode) : [];
                if ((matchesMode && matchesFilter) || filteredSubtasks.length > 0) {
                    result.push({ ...task, subtasks: filteredSubtasks });
                }
            });
            return result;
        };

        const extractBugs = (tasks, inBugContext = false) => {
          let bugs = [];
          tasks.forEach(t => {
              const taskNameLower = (t.name || '').toLowerCase();
              const isBugContainer = taskNameLower.includes('qa bugs') || taskNameLower.includes('ui bugs');
              const isContext = inBugContext || isBugContainer;
              const hasBugTag = t.tags?.some(tag => ['bug', 'defect'].includes((tag.name || '').toLowerCase()));
              if ((isContext && !isBugContainer) || hasBugTag) { if (!bugs.find(b => b.id === t.id)) bugs.push(t); }
              if (t.subtasks && t.subtasks.length > 0) bugs.push(...extractBugs(t.subtasks, isContext));
          });
          return bugs;
        };

        let allBugs = extractBugs(activeWorkflows.flatMap(wf => wf.tasks || []));
        if (completionFilterType === 'tags' && selectedTagFilter) allBugs = allBugs.filter(t => t.tags?.some(tag => (tag.name || '') === selectedTagFilter));
        else if (completionFilterType === 'assignees' && selectedAssigneeFilter) allBugs = allBugs.filter(t => t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter));

        const allMotherTaskIds = new Set(activeWorkflows.flatMap(wf => wf.tasks || []).map(t => t.id));

        const getBreakdown = (tasksArray) => {
            const validTasks = tasksArray.filter(t => {
                const n = (t.name || '').toLowerCase();
                return !n.includes('qa bugs') && !n.includes('ui bugs');
            });
            const mothers = validTasks.filter(t => allMotherTaskIds.has(t.id)).length;
            const subs = validTasks.filter(t => !allMotherTaskIds.has(t.id)).length;
            return { total: validTasks.length, mothers, subs };
        };

        const backlogTasks = filteredTasks.filter(t => backlogStatuses.includes((t.status?.status || 'open').toLowerCase()));
        const backlogBreakdown = getBreakdown(backlogTasks);

        const activeMainTasks = filteredTasks.filter(t => {
            const s = (t.status?.status || 'open').toLowerCase();
            return !doneStatuses.includes(s) && !backlogStatuses.includes(s);
        });
        const activeBreakdown = getBreakdown(activeMainTasks);

        const completedTasks = filteredTasks.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase()));
        const completedBreakdown = getBreakdown(completedTasks);
        const completedFilteredTasksCount = completedBreakdown.total;

        const totalDistTasks = backlogBreakdown.total + activeBreakdown.total + completedBreakdown.total;
        const backlogDistPct = totalDistTasks > 0 ? (backlogBreakdown.total / totalDistTasks) * 100 : 0;
        const activeDistPct = totalDistTasks > 0 ? (activeBreakdown.total / totalDistTasks) * 100 : 0;
        const resolvedDistPct = totalDistTasks > 0 ? (completedBreakdown.total / totalDistTasks) * 100 : 0;

        const parseDateMs = (d) => {
            if (!d) return 0;
            const n = Number(d);
            return !isNaN(n) ? n : new Date(d).getTime() || 0;
        };

        const filteredTaskIds = new Set(filteredTasks.map(t => t.id));
        const independentTasks = filteredTasks.filter(t => !t.parent || !filteredTaskIds.has(t.parent));

        const assigneeStats = {};
        workspaceUsers.forEach(u => {
            assigneeStats[u] = {
                username: u,
                profilePicture: `https://ui-avatars.com/api/?name=${encodeURIComponent(u)}&background=random`,
                statusCounts: {}, totalEstMs: 0, totalSpentMs: 0
            };
        });

        filteredTasks.forEach(task => {
          const statusName = task.status?.status || 'Open';
          const statusColor = task.status?.color || '#94a3b8';
          const isDone = doneStatuses.includes(statusName.toLowerCase());
          
          let est = task.directEstimate !== undefined ? task.directEstimate : (task.time_estimate ? parseInt(task.time_estimate) : 0);
          const nativeSpent = task.directNativeSpent !== undefined ? task.directNativeSpent : (task.rawNativeSpent ? parseInt(task.rawNativeSpent) : (isDone ? est : 0));

          if (task.assignees && task.assignees.length > 0) {
            task.assignees.forEach(assignee => {
              const key = assignee.username || `User_${assignee.id}`;
              if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
              
              if (!assigneeStats[key]) {
                assigneeStats[key] = { username: key, profilePicture: assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(key)}&background=random`, statusCounts: {}, totalEstMs: 0, totalSpentMs: 0 };
              }
              if (!assigneeStats[key].statusCounts[statusName]) assigneeStats[key].statusCounts[statusName] = { count: 0, color: statusColor };
              assigneeStats[key].statusCounts[statusName].count++;
              assigneeStats[key].totalEstMs += est;
              assigneeStats[key].totalSpentMs += nativeSpent;
            });
          }

          if (task.localLedger && task.localLedger.length > 0) {
              task.localLedger.forEach(entry => {
                  const key = entry.userId;
                  if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
                  if (assigneeStats[key]) {
                      assigneeStats[key].totalSpentMs += Number(entry.ms);
                  }
              });
          }
        });
        
        const assigneesList = Object.values(assigneeStats).filter(a => a.totalEstMs > 0 || a.totalSpentMs > 0 || Object.keys(a.statusCounts).length > 0).sort((a,b) => b.totalEstMs - a.totalEstMs);
        const devCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'Developer').length;
        const qaCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'QA').length;

        let taskMinDate = Infinity;
        let taskMaxDate = 0;
        independentTasks.forEach(t => {
            if (t.start_date) taskMinDate = Math.min(taskMinDate, parseInt(t.start_date));
            if (t.due_date) taskMaxDate = Math.max(taskMaxDate, parseInt(t.due_date));
        });

        let minDate = Infinity;
        let maxDate = 0;
        activeWorkflows.forEach(wf => {
          if (wf.listStartDate) minDate = Math.min(minDate, parseInt(wf.listStartDate));
          if (wf.listDueDate) maxDate = Math.max(maxDate, parseInt(wf.listDueDate));
        });
        if (minDate === Infinity) minDate = taskMinDate;
        if (maxDate === 0) maxDate = taskMaxDate;
        
        const now = mappedWorkflows[0]?.lastSynced || Date.now();
        if (minDate === Infinity) minDate = now - (7 * 86400000);
        if (maxDate === 0) maxDate = now + (7 * 86400000);
        if (maxDate <= minDate) maxDate = minDate + (14 * 86400000);

        const sprintStart = new Date(minDate);
        sprintStart.setHours(0,0,0,0);
        const sprintEnd = new Date(maxDate);
        sprintEnd.setHours(0,0,0,0);
        
        let sprintWorkingDays = 0;
        let tempDate = new Date(sprintStart);
        while (tempDate <= sprintEnd) {
            const day = tempDate.getDay();
            if (day !== 0 && day !== 6) sprintWorkingDays++;
            tempDate.setDate(tempDate.getDate() + 1);
        }
        
        const globalBlockerDays = dateBlockers.reduce((s, b) => s + (b.remark !== 'Leave' ? b.days : 0), 0);
        const bucketDurationDays = Math.max(0, sprintWorkingDays - globalBlockerDays);
        
        let devLeaveDays = 0, qaLeaveDays = 0;
        dateBlockers.forEach(b => {
          if (b.remark === 'Leave') {
            if ((userRoles[b.assignee] || 'Developer') === 'Developer') devLeaveDays += b.days;
            else qaLeaveDays += b.days;
          }
        });

        const devCapacityHours = Math.max(0, (devCount * bucketDurationDays * devHoursPerDay) - (devLeaveDays * devHoursPerDay));
        const qaCapacityHours = Math.max(0, (qaCount * bucketDurationDays * qaHoursPerDay) - (qaLeaveDays * qaHoursPerDay));

        let totalEstimateMs = 0;
        let totalRemainingMs = 0;
        let totalSpentMs = 0;

        independentTasks.forEach(t => {
          const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
          let estimate = t.time_estimate ? Number(t.time_estimate) : 0; 
          let spent = t.time_spent ? Number(t.time_spent) : (isDone ? estimate : 0);
          
          if (spent > estimate) {
              estimate = spent;
          }
          
          const remaining = isDone ? 0 : Math.max(0, estimate - spent);
          
          totalEstimateMs += estimate;
          totalRemainingMs += remaining;
          totalSpentMs += spent;
        });

        const totalEstHours = Math.round(totalEstimateMs / 3600000) || 1;
        const totalRemHours = Math.round(totalRemainingMs / 3600000);
        
        const burnedHours = totalEstHours - totalRemHours;
        const completionPercentage = Math.min(100, Math.round((burnedHours / totalEstHours) * 100));

        const formatDuration = (ms) => {
            const hrs = Math.floor(ms / 3600000);
            const mins = Math.round((ms % 3600000) / 60000);
            if (hrs === 0 && mins === 0) return '0h';
            if (hrs === 0) return `${mins}m`;
            if (mins === 0) return `${hrs.toLocaleString()}h`;
            return `${hrs.toLocaleString()}h ${mins}m`;
        };

        const handleChartMouseMove = (e, chartType, dataPoints) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const xPct = (mouseX / rect.width) * 100;

            if (!dataPoints || dataPoints.length === 0) return;

            let closest = dataPoints[0];
            let minDiff = Infinity;
            for (const pt of dataPoints) {
                const diff = Math.abs(pt.x - xPct);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = pt;
                }
            }

            if (closest) {
                setActiveChartHover({
                    chart: chartType,
                    xPct: closest.x,
                    yPct: closest.y,
                    dateMs: closest.date,
                    value: closest.value
                });
            }
        };

        const totalDurationMs = maxDate - minDate;
        const elapsedMs = Math.max(0, now - minDate);
        let currentX = totalDurationMs > 0 ? (elapsedMs / totalDurationMs) * 100 : 0;
        currentX = Math.max(0, Math.min(100, currentX));
        
        const formatDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const dayLabels = [
            formatDate(minDate),
            formatDate(minDate + totalDurationMs * 0.33),
            formatDate(minDate + totalDurationMs * 0.66),
            formatDate(maxDate)
        ];
        
        // --- STREAMING_CHUNK:Monotonic Burndown Logic ---
        let initialBurnedMs = 0;
        const validEvents = [];
        
        independentTasks.forEach(t => {
            let est = Number(t.time_estimate) || 0;
            const totalSpent = Number(t.time_spent) || 0;
            if (totalSpent > est) est = totalSpent;
            
            const localAdded = Number(t._totalLocalAddedMs) || 0;
            const nativeSpent = Math.max(0, totalSpent - localAdded);
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            
            if (isDone && est > 0) {
                let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                if (dDate <= minDate) {
                    initialBurnedMs += est;
                } else {
                    validEvents.push({ date: dDate, burned: est });
                }
            } else if (!isDone && nativeSpent > 0) {
                let cDate = parseDateMs(t.date_created) || minDate;
                let uDate = parseDateMs(t.date_updated) || now;
                if (cDate < minDate) cDate = minDate;
                if (uDate > now) uDate = now;
                if (uDate < cDate) uDate = cDate;
                
                const duration = Math.max(1, uDate - cDate);
                const slices = 10;
                for (let i = 1; i <= slices; i++) {
                    const sliceDate = cDate + (duration * (i/slices));
                    if (sliceDate <= minDate) {
                        initialBurnedMs += (nativeSpent / slices);
                    } else {
                        validEvents.push({ date: sliceDate, burned: nativeSpent / slices });
                    }
                }
            }
        });

        const extractBurndownLedgerEntries = (tasks) => {
            tasks.forEach(t => {
                const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
                if (!isDone) {
                    const entries = t.localLedger || [];
                    entries.forEach(entry => {
                        const eDate = parseDateMs(entry.timestamp);
                        if (eDate <= minDate) {
                            initialBurnedMs += Number(entry.ms);
                        } else {
                            validEvents.push({ date: eDate, burned: Number(entry.ms) });
                        }
                    });
                }
                if (t.subtasks) extractBurndownLedgerEntries(t.subtasks);
            });
        };
        extractBurndownLedgerEntries(independentTasks);
        
        validEvents.sort((a,b) => a.date - b.date);

        let historicalBurnedMs = initialBurnedMs;
        const startY = totalEstimateMs > 0 ? (initialBurnedMs / totalEstimateMs) * 100 : 0;
        const burndownPointsData = [{ x: 0, y: Math.max(0, Math.min(100, startY)), date: minDate, value: totalEstimateMs - initialBurnedMs }];

        const oneDayMs = 86400000;
        const endChartDate = Math.min(now, maxDate);
        let currentDayMs = minDate + oneDayMs;

        while (currentDayMs <= endChartDate) {
            while (validEvents.length > 0 && validEvents[0].date <= currentDayMs) {
                historicalBurnedMs += validEvents.shift().burned;
            }
            const stepX = ((currentDayMs - minDate) / totalDurationMs) * 100;
            const stepY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;
            burndownPointsData.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentDayMs, value: totalEstimateMs - historicalBurnedMs });
            currentDayMs += oneDayMs;
        }

        while (validEvents.length > 0) {
            historicalBurnedMs += validEvents.shift().burned;
        }
        const burndownFinalX = now >= maxDate ? 100 : ((now - minDate) / totalDurationMs) * 100;
        const burndownFinalY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;

        if (burndownPointsData.length > 0 && (burndownFinalX - burndownPointsData[burndownPointsData.length - 1].x) < 2) {
            burndownPointsData[burndownPointsData.length - 1].y = Math.max(0, Math.min(100, burndownFinalY));
            burndownPointsData[burndownPointsData.length - 1].x = Math.max(0, Math.min(100, burndownFinalX));
            burndownPointsData[burndownPointsData.length - 1].date = now;
            burndownPointsData[burndownPointsData.length - 1].value = totalEstimateMs - historicalBurnedMs;
        } else {
            burndownPointsData.push({ x: Math.max(0, Math.min(100, burndownFinalX)), y: Math.max(0, Math.min(100, burndownFinalY)), date: now, value: totalEstimateMs - historicalBurnedMs });
        }


        const generateSmoothPath = (points) => {
            if (points.length === 0) return "";
            if (points.length === 1) return `M ${points[0].x},${points[0].y}`;
            if (points.length === 2) return `M ${points[0].x},${points[0].y} L ${points[1].x},${points[1].y}`;
            
            let d = `M ${points[0].x},${points[0].y}`;
            const tension = 0.25;
            
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i !== points.length - 2 ? points[i + 2] : p2;
                
                let cp1x = p1.x + (p2.x - p0.x) * tension;
                let cp1y = p1.y + (p2.y - p0.y) * tension;
                let cp2x = p2.x - (p3.x - p1.x) * tension;
                let cp2y = p2.y - (p3.y - p1.y) * tension;
                
                cp1x = Math.max(p1.x, Math.min(p2.x, cp1x));
                cp2x = Math.max(p1.x, Math.min(p2.x, cp2x));
                const minY = Math.min(p1.y, p2.y);
                const maxY = Math.max(p1.y, p2.y);
                cp1y = Math.max(minY, Math.min(maxY, cp1y));
                cp2y = Math.max(minY, Math.min(maxY, cp2y));
                
                d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
            }
            return d;
        };

        const smoothLinePath = generateSmoothPath(burndownPointsData);
        const latestX = burndownPointsData.length > 0 ? burndownPointsData[burndownPointsData.length-1].x : currentX;
        const areaPath = smoothLinePath ? smoothLinePath + ` L ${latestX},100 L 0,100 Z` : "";

        // --- STREAMING_CHUNK:Daily Burnup Logic ---
        let initialLoggedMs = 0;
        const logEvents = [];
        
        independentTasks.forEach(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            let est = t.time_estimate ? Number(t.time_estimate) : 0;
            let totalSpent = Number(t.time_spent) || 0;
            
            if (isDone && totalSpent === 0) totalSpent = est;
            if (totalSpent > est) est = totalSpent;

            const localAdded = Number(t._totalLocalAddedMs) || 0;
            const nativeSpent = Math.max(0, totalSpent - localAdded);
            
            if (isDone && nativeSpent > 0) {
                let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                if (dDate <= minDate) {
                    initialLoggedMs += nativeSpent;
                } else {
                    logEvents.push({ date: dDate, logged: nativeSpent });
                }
            } else if (!isDone && nativeSpent > 0) {
                let cDate = parseDateMs(t.date_created) || minDate;
                let uDate = parseDateMs(t.date_updated) || now;
                if (cDate < minDate) cDate = minDate;
                if (uDate > now) uDate = now;
                if (uDate < cDate) uDate = cDate;
                
                const duration = Math.max(1, uDate - cDate);
                const slices = 10;
                for (let i = 1; i <= slices; i++) {
                    const sliceDate = cDate + (duration * (i/slices));
                    if (sliceDate <= minDate) {
                        initialLoggedMs += (nativeSpent / slices);
                    } else {
                        logEvents.push({ date: sliceDate, logged: nativeSpent / slices });
                    }
                }
            }
        });

        const extractLedgerEntries = (tasks) => {
            tasks.forEach(t => {
               const entries = t.localLedger || [];
               entries.forEach(entry => {
                   const eDate = parseDateMs(entry.timestamp);
                   if (eDate <= minDate) {
                       initialLoggedMs += Number(entry.ms);
                   } else {
                       logEvents.push({ date: eDate, logged: Number(entry.ms) });
                   }
               });
               if (t.subtasks) extractLedgerEntries(t.subtasks);
            });
        };
        extractLedgerEntries(independentTasks);
        
        logEvents.sort((a,b) => a.date - b.date);

        const maxBurnupMs = Math.max(totalEstimateMs, devCapacityHours * 3600000, totalSpentMs, 3600000);
        const maxBurnupHours = Math.round(maxBurnupMs / 3600000);

        let cumulativeLoggedMs = initialLoggedMs;
        const startBurnupY = 100 - (initialLoggedMs / maxBurnupMs) * 100;
        const burnupPointsData = [{ x: 0, y: Math.max(0, Math.min(100, startBurnupY)), date: minDate, value: initialLoggedMs }];

        let currentBurnupDayMs = minDate + oneDayMs;
        let logEventIdx = 0;

        while (currentBurnupDayMs <= endChartDate) {
            while (logEventIdx < logEvents.length && logEvents[logEventIdx].date <= currentBurnupDayMs) {
                cumulativeLoggedMs += logEvents[logEventIdx].logged;
                logEventIdx++;
            }
            const stepX = ((currentBurnupDayMs - minDate) / totalDurationMs) * 100;
            const stepY = 100 - (cumulativeLoggedMs / maxBurnupMs) * 100;
            burnupPointsData.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentBurnupDayMs, value: cumulativeLoggedMs });
            currentBurnupDayMs += oneDayMs;
        }

        while (logEventIdx < logEvents.length) {
            cumulativeLoggedMs += logEvents[logEventIdx].logged;
            logEventIdx++;
        }
        const burnupFinalX = now >= maxDate ? 100 : ((now - minDate) / totalDurationMs) * 100;
        const burnupFinalY = 100 - (cumulativeLoggedMs / maxBurnupMs) * 100;

        if (burnupPointsData.length > 0 && (burnupFinalX - burnupPointsData[burnupPointsData.length - 1].x) < 2) {
            burnupPointsData[burnupPointsData.length - 1].y = Math.max(0, Math.min(100, burnupFinalY));
            burnupPointsData[burnupPointsData.length - 1].x = Math.max(0, Math.min(100, burnupFinalX));
            burnupPointsData[burnupPointsData.length - 1].date = now;
            burnupPointsData[burnupPointsData.length - 1].value = cumulativeLoggedMs;
        } else {
            burnupPointsData.push({ x: Math.max(0, Math.min(100, burnupFinalX)), y: Math.max(0, Math.min(100, burnupFinalY)), date: now, value: cumulativeLoggedMs });
        }

        const smoothBurnupLinePath = generateSmoothPath(burnupPointsData);
        const latestBurnupX = burnupPointsData.length > 0 ? burnupPointsData[burnupPointsData.length-1].x : currentX;
        const burnupAreaPath = smoothBurnupLinePath ? smoothBurnupLinePath + ` L ${latestBurnupX},100 L 0,100 Z` : "";
        
        const idealCapacityY = 100 - ((devCapacityHours * 3600000) / maxBurnupMs) * 100;
        const clampedIdealY = Math.max(0, Math.min(100, idealCapacityY));
        const idealCapacityPath = `M 0,${clampedIdealY} L 100,${clampedIdealY}`;
        
        const plottedY = 100 - (totalEstimateMs / maxBurnupMs) * 100;
        const clampedPlottedY = Math.max(0, Math.min(100, plottedY));
        const plottedPath = `M 0,${clampedPlottedY} L 100,${clampedPlottedY}`;

        // --- STREAMING_CHUNK:Drill Down Modal Calculation ---
        const renderAssigneeDrillDown = (assigneeUsername) => {
           const assigneeTasks = allFlatTasks.filter(t => t.assignees?.some(a => a.username === assigneeUsername));
           if (!assigneeTasks || assigneeTasks.length === 0) return null;

           let estMs = 0;
           let spentMs = 0;
           let initialDrillLoggedMs = 0;
           const drillLogEvents = [];

           assigneeTasks.forEach(t => {
              const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
              let tEst = t.directEstimate !== undefined ? t.directEstimate : (t.time_estimate ? parseInt(t.time_estimate) : 0);
              let tSpent = t.directNativeSpent !== undefined ? t.directNativeSpent : (t.rawNativeSpent ? parseInt(t.rawNativeSpent) : (isDone ? tEst : 0));
              
              estMs += tEst;
              spentMs += tSpent;

              if (isDone && tSpent > 0) {
                 let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                 if (dDate <= minDate) initialDrillLoggedMs += tSpent;
                 else drillLogEvents.push({ date: dDate, logged: tSpent });
              } else if (!isDone && tSpent > 0) {
                 let cDate = parseDateMs(t.date_created) || minDate;
                 let uDate = parseDateMs(t.date_updated) || now;
                 if (cDate < minDate) cDate = minDate;
                 if (uDate > now) uDate = now;
                 if (uDate < cDate) uDate = cDate;
                 
                 const duration = Math.max(1, uDate - cDate);
                 const slices = 10;
                 for (let i = 1; i <= slices; i++) {
                     const sliceDate = cDate + (duration * (i/slices));
                     if (sliceDate <= minDate) initialDrillLoggedMs += (tSpent / slices);
                     else drillLogEvents.push({ date: sliceDate, logged: tSpent / slices });
                 }
              }

              const entries = t.localLedger || [];
              entries.forEach(entry => {
                 if(entry.userId === assigneeUsername) {
                     const eDate = parseDateMs(entry.timestamp);
                     spentMs += Number(entry.ms);
                     if (eDate <= minDate) initialDrillLoggedMs += Number(entry.ms);
                     else drillLogEvents.push({ date: eDate, logged: Number(entry.ms) });
                 }
              });
           });

           drillLogEvents.sort((a,b) => a.date - b.date);

           const userRole = userRoles[assigneeUsername] || 'Developer';
           const dailyHours = userRole === 'Developer' ? devHoursPerDay : qaHoursPerDay;
           let leaveDays = 0;
           dateBlockers.forEach(b => { if (b.remark === 'Leave' && b.assignee === assigneeUsername) leaveDays += b.days; });
           const individualCapacityMs = Math.max(0, ((bucketDurationDays * dailyHours) - (leaveDays * dailyHours)) * 3600000);

           const drillMaxBurnupMs = Math.max(estMs, individualCapacityMs, spentMs, 3600000);
           const drillMaxBurnupHours = Math.round(drillMaxBurnupMs / 3600000);

           let cumulativeMs = initialDrillLoggedMs;
           const drillStartY = 100 - (initialDrillLoggedMs / drillMaxBurnupMs) * 100;
           const drillPoints = [{ x: 0, y: Math.max(0, Math.min(100, drillStartY)), date: minDate, value: initialDrillLoggedMs }];

           let currentDayMs = minDate + oneDayMs;
           let eventIdx = 0;

           while (currentDayMs <= endChartDate) {
               while (eventIdx < drillLogEvents.length && drillLogEvents[eventIdx].date <= currentDayMs) {
                   cumulativeMs += drillLogEvents[eventIdx].logged;
                   eventIdx++;
               }
               const stepX = ((currentDayMs - minDate) / totalDurationMs) * 100;
               const stepY = 100 - (cumulativeMs / drillMaxBurnupMs) * 100;
               drillPoints.push({ x: Math.max(0, Math.min(100, stepX)), y: Math.max(0, Math.min(100, stepY)), date: currentDayMs, value: cumulativeMs });
               currentDayMs += oneDayMs;
           }

           if (now > minDate && now < maxDate) {
               while (eventIdx < drillLogEvents.length && drillLogEvents[eventIdx].date <= now) {
                   cumulativeMs += drillLogEvents[eventIdx].logged;
                   eventIdx++;
               }
               const finalX = ((now - minDate) / totalDurationMs) * 100;
               const finalY = 100 - (cumulativeMs / drillMaxBurnupMs) * 100;
               if (drillPoints.length > 0 && (finalX - drillPoints[drillPoints.length - 1].x) < 2) {
                   drillPoints[drillPoints.length - 1].y = Math.max(0, Math.min(100, finalY));
                   drillPoints[drillPoints.length - 1].x = Math.max(0, Math.min(100, finalX));
                   drillPoints[drillPoints.length - 1].date = now;
                   drillPoints[drillPoints.length - 1].value = cumulativeMs;
               } else {
                   drillPoints.push({ x: Math.max(0, Math.min(100, finalX)), y: Math.max(0, Math.min(100, finalY)), date: now, value: cumulativeMs });
               }
           }

           const smoothDrillPath = generateSmoothPath(drillPoints);
           const latestDrillX = drillPoints.length > 0 ? drillPoints[drillPoints.length-1].x : currentX;
           const drillAreaPath = smoothDrillPath ? smoothDrillPath + ` L ${latestDrillX},100 L 0,100 Z` : "";
           
           const drillIdealY = 100 - (individualCapacityMs / drillMaxBurnupMs) * 100;
           const drillIdealPath = `M 0,${Math.max(0, Math.min(100, drillIdealY))} L 100,${Math.max(0, Math.min(100, drillIdealY))}`;
           
           const drillPlottedY = 100 - (estMs / drillMaxBurnupMs) * 100;
           const drillPlottedPath = `M 0,${Math.max(0, Math.min(100, drillPlottedY))} L 100,${Math.max(0, Math.min(100, drillPlottedY))}`;

           return (
              <div className="flex flex-col h-[85vh] bg-slate-900 border border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl relative w-full max-w-5xl animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                 <div className="p-6 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between shrink-0">
                     <div className="flex items-center space-x-4">
                       <img src={`https://ui-avatars.com/api/?name=${encodeURIComponent(assigneeUsername)}&background=random`} referrerPolicy="no-referrer" className="w-12 h-12 rounded-full border-2 border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.4)]" />
                       <div>
                           <h2 className="text-xl font-bold text-white">{assigneeUsername}'s Workload Drill-Down</h2>
                           <p className="text-sm text-indigo-300 font-medium uppercase tracking-wider">{userRole}</p>
                       </div>
                     </div>
                     <button onClick={() => setSelectedDrillDownAssignee(null)} className="text-slate-400 p-2 rounded transition-colors neon-border-slate"><X className="w-6 h-6"/></button>
                 </div>
                 
                 <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                    <div className="lg:w-1/2 p-6 border-r border-slate-700/80 bg-slate-900/40 overflow-y-auto space-y-6">
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                         <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                            <div className="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Capacity</div>
                            <div className="text-xl font-bold text-white">{Math.round(individualCapacityMs/3600000)}h</div>
                         </div>
                         <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                            <div className="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Assigned Scope</div>
                            <div className="text-xl font-bold text-white">{Math.round(estMs/3600000)}h</div>
                         </div>
                         <div className="bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20 col-span-2 sm:col-span-1">
                            <div className="text-xs text-emerald-400 font-semibold uppercase tracking-wider mb-1">Logged Time</div>
                            <div className="text-xl font-bold text-emerald-300">{Math.round(spentMs/3600000)}h</div>
                         </div>
                      </div>

                      <div className="bg-slate-800/40 p-6 rounded-2xl border border-slate-700 shadow-inner">
                          <div className="flex items-center justify-between mb-4">
                            <h3 className="text-md font-semibold text-white flex items-center gap-2"><TrendingUp className="w-4 h-4 text-emerald-400" /> Individual Effort Burnup</h3>
                          </div>
                          <div className="flex gap-4 text-xs font-medium text-slate-400 mb-6">
                               <span className="flex items-center"><div className="w-3 h-0 border-t-2 border-dashed border-slate-500 mr-1.5"></div> Capacity</span>
                               <span className="flex items-center"><div className="w-3 h-0 border-t-2 border-dotted border-blue-400 mr-1.5"></div> Scope</span>
                               <span className="flex items-center text-emerald-400"><div className="w-2 h-2 bg-emerald-500 rounded-full mr-1.5"></div> Logged</span>
                          </div>
                          <div className="relative h-48 w-full mt-2 group/chart">
                            <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                              <span>{drillMaxBurnupHours}h</span>
                              <span>{Math.round(drillMaxBurnupHours * 0.5)}h</span>
                              <span>0h</span>
                            </div>
                            <div className="absolute left-10 right-2 top-2 bottom-6 cursor-crosshair z-10 group-hover/chart:z-[999999]"
                                 onMouseMove={(e) => handleChartMouseMove(e, 'drill', drillPoints)}
                                 onMouseLeave={() => setActiveChartHover(null)}>
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                                    <defs>
                                      <linearGradient id="drillGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#10b981" stopOpacity="0.3" />
                                        <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
                                      </linearGradient>
                                    </defs>
                                    <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                                    <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                    <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                                    
                                    <path d={drillIdealPath} stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" fill="none" />
                                    <path d={drillPlottedPath} stroke="#60a5fa" strokeWidth="2" strokeDasharray="2 4" vectorEffect="non-scaling-stroke" fill="none" />
                                    
                                    {drillAreaPath && <path d={drillAreaPath} fill="url(#drillGradient)" />}
                                    {smoothDrillPath && <path d={smoothDrillPath} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />}
                                </svg>
                                
                                {activeChartHover?.chart === 'drill' && (
                                   <>
                                     <div className="absolute top-0 bottom-0 w-px bg-emerald-500/50 pointer-events-none" style={{ left: `${activeChartHover.xPct}%` }} />
                                     <div className="absolute w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] pointer-events-none transform -translate-x-1/2 -translate-y-1/2 border-2 border-slate-900" style={{ left: `${activeChartHover.xPct}%`, top: `${activeChartHover.yPct}%` }} />
                                     <div className="absolute pointer-events-none flex flex-col items-center drop-shadow-lg"
                                          style={{ 
                                            left: `${activeChartHover.xPct}%`, 
                                            top: `${activeChartHover.yPct}%`,
                                            transform: 'translate(-50%, -100%)',
                                            marginTop: '-8px'
                                          }}>
                                        <div className="bg-slate-800 border border-emerald-500/50 text-white rounded-lg px-3 py-1.5 shadow-xl whitespace-nowrap flex flex-col items-center">
                                           <span className="font-bold text-[10px] uppercase tracking-wider text-emerald-400 mb-0.5">{new Date(activeChartHover.dateMs).toLocaleDateString()}</span>
                                           <span className="text-xs font-semibold text-slate-100">{Math.max(0, Math.round(activeChartHover.value / 3600000))}h Logged</span>
                                        </div>
                                        <div className="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[6px] border-t-emerald-500/50"></div>
                                     </div>
                                   </>
                                )}
                            </div>
                            <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                              <span className="-ml-3">{dayLabels[0]}</span>
                              <span>{dayLabels[2]}</span>
                              <span className="-mr-4">{dayLabels[3]}</span>
                            </div>
                          </div>
                      </div>
                    </div>

                    <div className="lg:w-1/2 p-6 overflow-y-auto bg-slate-900/20">
