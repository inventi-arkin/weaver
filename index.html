    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.4); }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 12s linear infinite; }
    @keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
    .animate-tip-in { animation: tip-in .2s ease-out; }
    @media (prefers-reduced-motion: reduce) { .animate-tip-in { animation: none; } }

    /* Neon Glowing Buttons */
    .btn-neon {
      padding: 8px 16px;
      text-transform: uppercase;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff80;
      text-shadow: none;
      background: transparent;
      cursor: pointer;
      box-shadow: transparent;
      border: 1px solid #ffffff80;
      transition: 0.5s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
    }

    .btn-neon.btn-neon-sm {
      padding: 6px 12px;
      font-size: 10px;
      border-radius: 6px;
    }

    .btn-neon-indigo:hover, .btn-neon-indigo:focus {
      color: #ffffff;
      background: #6366f1;
      border-color: #6366f1;

      box-shadow: 0 0 5px #6366f1, 0 0 20px #6366f1, 0 0 50px #6366f1, 0 0 100px #6366f1;
      outline: none;
    }

    .btn-neon-emerald:hover, .btn-neon-emerald:focus {
      color: #ffffff;
      background: #10b981;
      border-color: #10b981;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #10b981, 0 0 20px #10b981, 0 0 50px #10b981, 0 0 100px #10b981;
      outline: none;
    }

    .btn-neon-rose:hover, .btn-neon-rose:focus {
      color: #ffffff;
      background: #f43f5e;
      border-color: #f43f5e;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #f43f5e, 0 0 20px #f43f5e, 0 0 50px #f43f5e, 0 0 100px #f43f5e;
      outline: none;
    }

    .btn-neon-slate:hover, .btn-neon-slate:focus {
      color: #ffffff;
      background: #64748b;
      border-color: #64748b;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 20px #ffffff;
      box-shadow: 0 0 5px #64748b, 0 0 20px #64748b, 0 0 50px #64748b, 0 0 100px #64748b;
      outline: none;
    }

    .btn-neon:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* General Glowing Interactables */
    .neon-input {
      transition: all 0.4s ease;
    }
    .neon-input:focus, .neon-input:hover {
      border-color: #6366f1 !important;
      box-shadow: 0 0 5px #6366f1, 0 0 15px #6366f1, 0 0 30px #6366f1 !important;
      outline: none;
    }

    /* Text & Icon Glow */
    .neon-text-indigo { transition: all 0.3s ease; }
    .neon-text-indigo:hover, .neon-text-indigo:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #6366f1, 0 0 20px #6366f1 !important;

    .neon-text-rose { transition: all 0.3s ease; }
    .neon-text-rose:hover, .neon-text-rose:focus {
      color: #ffffff !important;
      text-shadow: 0 0 5px #ffffff, 0 0 10px #f43f5e, 0 0 20px #f43f5e !important;

    }

    .neon-text-emerald { transition: all 0.3s ease; }

    .pill-neon-emerald { transition: all 0.5s ease; }

    .neon-card { transition: all 0.3s ease; }

    /* Status carousel cards */

    .wv-tasks { overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(99,102,241,.4) transparent; }
  </style>

<body class="bg-slate-950 text-slate-100 overflow-x-hidden min-h-screen selection:bg-indigo-500/30 selection:text-indigo-200">

  <script type="text/babel" data-type="module" data-presets="react-classic">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as firebaseSignOut, signInAnonymously, signInWithCustomToken, updateProfile } from 'firebase/auth';
    import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, onSnapshot, collection, query, orderBy, limit } from 'firebase/firestore';
    import { 
      CheckCircle2, ArrowRight, Ticket, CheckSquare, LogOut, Settings, Bell, Box,
      FolderOpen, ListTodo, Plus, Trash2, ChevronRight, RefreshCw, Key, AlertTriangle,
      Clock, Calendar, Flag, Users, TrendingDown, TrendingUp, Target, Tag, X, Activity, PieChart,
      Bug, ShieldAlert, Zap, Info as InfoIcon, Download, Image as ImageIcon, BarChart2,
      LayoutDashboard, Briefcase, Pencil, Check, PauseCircle, WifiOff, CloudOff, ShieldCheck, ShieldX,
      Archive, CalendarX, Gauge, ChevronLeft, ChevronDown, ArrowRightLeft, Search
    } from 'lucide-react';

    const firebaseConfig = {
      apiKey: "AIzaSyCzNMczm3bQ_1rnpoxvDswGDy4PE7XXCnI",
      authDomain: "weaver-2b8f6.firebaseapp.com",
      projectId: "weaver-2b8f6",
      storageBucket: "weaver-2b8f6.firebasestorage.app",
      messagingSenderId: "218175480887",
      appId: "1:218175480887:web:3887766b9c54e89edf8bb2",
      measurementId: "G-ZY3SWFL8WV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Separate Worker that holds ClickUp tokens (encrypted) and forwards read-only ClickUp calls
    const API_BASE = 'https://weaver-api.arkin-paroan.workers.dev';
    const APP_VERSION = document.querySelector('meta[name="weaver-version"]')?.content || 'dev';
    const REQUEST_TIMEOUT_MS = 20000; // central-sync FR-22: a stuck request ends instead of hanging the sync
    const REJECT_TRIES = 3; // central-sync FR-5: failed ticks before a token is paused
    const OUTAGE_BANNER_MS = 10 * 60 * 1000; // central-sync FR-24
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const isLegacyToken = (t) => !!t && t !== 'mock_token' && !UUID_RE.test(t);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ hd: 'inventi.ph', prompt: 'select_account' }); // team-data FR-2: only a hint; the Firestore rules and weaver-api do the real check
    const TEAM_EMAIL = /^[^@\s]+@inventi\.ph$/; // team-data FR-1, same check as firestore.rules and weaver-api
    const isTeamUser = (u) => !!u && !u.isAnonymous && u.emailVerified === true && TEAM_EMAIL.test(u.email || '') && (u.providerData || []).some(p => p.providerId === 'google.com');
    const NOT_TEAM_MSG = 'Weaver is for inventi.ph accounts. Sign in with your company Google account.';

    // team-data: Firestore paths. Per user: users/{uid} (FR-4, FR-6, FR-7). Per ClickUp list: lists/{listId} (FR-9, FR-10, FR-13).
    const userDoc = (uid) => doc(db, 'users', uid);
    const listDoc = (listId) => doc(db, 'lists', String(listId));
    const listEntriesCol = (listId) => collection(db, 'lists', String(listId), 'timeEntries');
    const listActivityCol = (listId) => collection(db, 'lists', String(listId), 'activity');
    const userActivityCol = (uid) => collection(db, 'users', uid, 'activity');
    // portfolios.md section 7: users/{uid}/portfolios/{portfolioId}; cards hold the weaver-api connection id, never a key
    const portfoliosCol = (uid) => collection(db, 'users', uid, 'portfolios');
    const portfolioDocRef = (uid, id) => doc(db, 'users', uid, 'portfolios', id);
    const PORTFOLIO_NAME_MAX = 60;
    const DEFAULT_PORTFOLIO = 'My Portfolio';
    const cardToDoc = (c) => ({ id: c.id, name: c.name || 'Connection', connId: c.token || '', lists: (c.workflows || []).map(listMeta), savedAt: c.savedAt || null, lastUsed: c.lastUsed || null });
    const cardFromDoc = (c) => ({ id: c.id, name: c.name, token: c.connId || '', workflows: c.lists || [], savedAt: c.savedAt || null, lastUsed: c.lastUsed || null });
    const portfolioToDoc = (p) => ({ name: p.name, order: p.order ?? 0, createdAt: p.createdAt || null, cards: (p.cards || []).map(cardToDoc) });
    const byLastUsed = (a, b) => (b.lastUsed || 0) - (a.lastUsed || 0);
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    // FR-4: a linked list without any task data
    const listMeta = (w) => ({ id: String(w.id), team: w.team || '', space: w.space || '', folder: w.folder || '', list: w.list || '', listId: String(w.listId), listStartDate: w.listStartDate || null, listDueDate: w.listDueDate || null });
    const entryFromDoc = (listId, id, d) => ({ id, listId: String(listId), taskId: d.taskId, ms: Number(d.ms) || 0, timestamp: d.workDate, userId: d.assignee, note: d.note || '', authorUid: d.authorUid || '', authorName: d.authorName || '' });
    const FEED_LIMIT = 50; // FR-19: newest events loaded per list
    const ARCHIVED_EVERY_MS = 10 * 60 * 1000; // FR-24
    const TOAST_MS = 6000; // FR-16
    const fmtHours = (ms) => `${Math.round(ms / 360000) / 10}h`;
    const relTime = (at) => {
      const d = Date.now() - at;
      if (d < 60000) return 'just now';
      if (d < 3600000) return `${Math.floor(d / 60000)} min ago`;
      if (d < 86400000 && new Date(at).toDateString() === new Date().toDateString()) return `${Math.floor(d / 3600000)} h ago`;
      const time = new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (new Date(at).toDateString() === new Date(Date.now() - 86400000).toDateString()) return `Yesterday ${time}`;
      return new Date(at).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
    };
    // design S2/S3: one icon per team event type (words always say what happened)
    const EVENT_STYLE = {
      time_logged: { Icon: Clock, chip: 'bg-emerald-500/10 border-emerald-500/20', icon: 'text-emerald-400' },
      time_deleted: { Icon: Trash2, chip: 'bg-rose-500/10 border-rose-500/20', icon: 'text-rose-400' },
      hours_changed: { Icon: Gauge, chip: 'bg-indigo-500/10 border-indigo-500/20', icon: 'text-indigo-400' },
      blockers_changed: { Icon: CalendarX, chip: 'bg-amber-500/10 border-amber-500/20', icon: 'text-amber-400' },
    };
    const TX_STYLE = {
      clock: EVENT_STYLE.time_logged, trash: EVENT_STYLE.time_deleted, unlink: EVENT_STYLE.time_deleted,
      link: { Icon: Box, chip: 'bg-indigo-500/10 border-indigo-500/20', icon: 'text-indigo-400' },
      info: { Icon: InfoIcon, chip: 'bg-blue-500/10 border-blue-500/20', icon: 'text-blue-400' },
    };
    const ArchivedBadge = () => (
      <span className="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded bg-slate-700/60 text-slate-300 border border-slate-600 shrink-0"><Archive className="w-3 h-3" aria-hidden="true" />Archived</span>
    );
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'weaver-default-app';

    const SpiderNetworkIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 3 L19 7 L21 14 L17 20 L12 21 L7 20 L3 14 L5 7 Z" strokeWidth="1" strokeDasharray="2 2" opacity="0.3" />
        <path d="M12 7 L16 10 L17 15 L14 18 L12 18.5 L10 18 L7 15 L8 10 Z" strokeWidth="1" opacity="0.2" fill="currentColor" />
        <circle cx="12" cy="14" r="2.5" fill="currentColor" opacity="0.9" />
        <circle cx="12" cy="9.5" r="1.5" fill="currentColor" opacity="0.9" />
        <path d="M11 9 L5 7 L3 14" />
        <path d="M13 9 L19 7 L21 14" />
        <path d="M10.5 15 L7 20" />
        <path d="M13.5 15 L17 20" />
        <circle cx="5" cy="7" r="1" fill="currentColor" />
        <circle cx="19" cy="7" r="1" fill="currentColor" />
        <circle cx="3" cy="14" r="1" fill="currentColor" />
        <circle cx="21" cy="14" r="1" fill="currentColor" />
        <circle cx="7" cy="20" r="1" fill="currentColor" />
        <circle cx="17" cy="20" r="1" fill="currentColor" />
        <circle cx="12" cy="3" r="1" fill="currentColor" opacity="0.5" />
        <path d="M12 3 L12 8" strokeWidth="1" opacity="0.5" />
      </svg>
    );

    const ClockAlert = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 15 15"></polyline>
      </svg>
    );

    const MetricTooltip = ({ text, formula, align = 'center', position = 'top', children }) => {
      let alignClasses = "";
      let pointerAlignClasses = "";
      
      if (align === 'center') {
        alignClasses = "left-1/2 -translate-x-1/2";
        pointerAlignClasses = "left-1/2 -translate-x-1/2";
      } else if (align === 'left') {
        alignClasses = "left-0";
        pointerAlignClasses = "left-4";
      } else if (align === 'right') {
        alignClasses = "right-0";
        pointerAlignClasses = "right-4";
      }

      const verticalClasses = position === 'top' ? "bottom-full mb-3" : "top-full mt-3";
      const pointerVerticalClasses = position === 'top' ? "top-full border-t-slate-800 border-b-transparent" : "bottom-full border-b-slate-800 border-t-transparent";

      // The box is display:none until hover: an invisible box still takes layout space and made phones scroll sideways (F-3).
      // When it opens near a screen edge, slide it back inside (8 px margin) and move the arrow the other way so it still points at the icon.
      const boxRef = useRef(null), arrowRef = useRef(null);
      const keepOnScreen = () => requestAnimationFrame(() => {
        const box = boxRef.current, arrow = arrowRef.current;
        if (!box || !arrow) return;
        box.style.marginLeft = arrow.style.marginLeft = '';
        box.style.display = 'none'; // on phones an open box widens the page, so read the screen width without it
        const screenW = document.documentElement.clientWidth;
        box.style.display = '';
        const r = box.getBoundingClientRect();
        if (!r.width) return;
        const shift = Math.max(8 - r.left, Math.min(0, screenW - 8 - r.right));
        if (shift) { box.style.marginLeft = `${shift}px`; arrow.style.marginLeft = `${-shift}px`; }
      });

      return (
        <div className="group relative flex items-center justify-center cursor-help z-50 hover:z-[999999]" onMouseEnter={keepOnScreen} onTouchStart={keepOnScreen}>
          <div className="p-1 -m-1 flex items-center justify-center neon-text-indigo">{children}</div>
          <div ref={boxRef} className={`pointer-events-none absolute z-[999999] w-64 max-w-[calc(100vw-2rem)] hidden group-hover:block animate-tip-in bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl shadow-[0_0_15px_rgba(99,102,241,0.5)] p-4 ${alignClasses} ${verticalClasses}`}>
            <p className="font-semibold text-white leading-snug">{text}</p>
            {formula && (
              <div className="mt-2.5 pt-2.5 border-t border-slate-700/50">
                <span className="text-indigo-400 font-bold text-[9px] uppercase tracking-widest block mb-1">Formula / Logic</span>
                <p className="font-mono text-[10px] text-slate-400 leading-relaxed break-words">{formula}</p>
              </div>
            )}
            <div ref={arrowRef} className={`absolute border-[6px] border-transparent ${pointerAlignClasses} ${pointerVerticalClasses}`}></div>
          </div>
        </div>
      );
    };

    const CollapsibleGroup = ({ title, children, count, color, defaultOpen = true }) => {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      
      return (
        <div className="mb-4 bg-slate-900/40 rounded-xl border border-white/5 overflow-hidden transition-all duration-300">
          <div 
            onClick={() => setIsOpen(!isOpen)} 
            className="flex items-center justify-between p-3 bg-slate-800/40 cursor-pointer hover:bg-slate-800/60 transition-colors border-b border-white/5 select-none"
          >
            <div className="flex items-center gap-2">
              <ChevronRight className={`w-4 h-4 text-slate-400 transition-transform duration-200 ${isOpen ? 'rotate-90' : ''}`} />
              {color && <div className="w-2.5 h-2.5 rounded-full shadow-lg" style={{ backgroundColor: color, boxShadow: `0 0 8px ${color}` }}></div>}
              <h3 className="font-semibold text-slate-200 capitalize tracking-wide">{title}</h3>
            </div>
            {count !== undefined && (
              <span className="text-xs font-medium text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded-full border border-white/5 shadow-inner">
                {count} {count === 1 ? 'Task' : 'Tasks'}
              </span>
            )}
          </div>
          {isOpen && (
            <div className="p-3 space-y-2 bg-slate-900/20">
              {children}
            </div>
          )}
        </div>
      );
    };

    const TaskItem = ({ task, depth = 0, expandedTasks, toggleTaskExpand, isDoneMode = false }) => {
      const relevantSubtasks = task.subtasks || [];
      const hasSubtasks = relevantSubtasks.length > 0;
      const isExpanded = !!expandedTasks[task.id];
      const isParent = depth === 0;

      const themeColor = task.status?.color || '#38bdf8';
      const isDoneStatus = ['closed', 'complete', 'done', 'resolved'].includes((task.status?.status || '').toLowerCase());
      
      const estimateMs = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const spentMs = task.time_spent ? parseInt(task.time_spent) : (isDoneStatus ? estimateMs : 0);
      const hasTimeData = estimateMs > 0 || spentMs > 0;
      const displayHours = hasTimeData ? `${Math.round(spentMs / 3600000)}h / ${Math.round(estimateMs / 3600000)}h` : null;
      
      return (
        <div className={`transition-all ${isParent ? 'bg-slate-900/60 border border-white/5 rounded-xl neon-card' : 'bg-slate-900/40 rounded-r-lg border-l-2'}`} style={!isParent ? { borderLeftColor: `${themeColor}40` } : {}}>
          <div className={`flex flex-col p-3 gap-1.5 ${!isParent ? 'pl-4' : ''}`}>
            
            <div className="flex items-start space-x-3 w-full group cursor-help relative">
              <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg mt-1.5" style={{ backgroundColor: themeColor, boxShadow: `0 0 8px ${themeColor}` }} />
              <div className="relative min-w-0 flex-1">
                 <span className={`font-semibold block truncate transition-colors group-hover:text-indigo-300 ${isParent ? 'text-slate-100 text-[15px]' : 'text-slate-300 text-sm'}`} title={task.name}>{task.name || 'Unnamed Task'}</span>
              </div>
            </div>
            
            <div className="flex items-center shrink-0 space-x-3 pl-5 overflow-x-auto overflow-y-hidden py-0.5">
              {hasSubtasks && (
                <button onClick={() => toggleTaskExpand(task.id)} className="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-indigo-500/10 text-[10px] text-indigo-300 font-bold border border-transparent transition-all shrink-0 neon-border-indigo">
                  <span>Subtasks ({relevantSubtasks.length})</span>
                  <ChevronRight className={`h-3 w-3 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                </button>
              )}
              {hasTimeData && (
                <div className="flex items-center text-xs text-slate-400 whitespace-nowrap shrink-0">
                  <Clock className="h-3.5 w-3.5 mr-1.5 text-slate-500" /> {displayHours}
                </div>
              )}
              <span className="px-2 py-0.5 text-[10px] font-bold rounded capitalize border shrink-0" style={{ color: themeColor, backgroundColor: `${themeColor}15`, borderColor: `${themeColor}30` }}>
                {task.status?.status || 'Open'}
              </span>
              {isParent && task.tags && task.tags.length > 0 && (
                <div className="flex items-center space-x-1 mr-2 hidden sm:flex shrink-0">
                  <Tag className="h-3 w-3 text-slate-500 mr-1" />
                  {task.tags.map((tag, i) => (
                    <span key={i} className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap" style={{ color: tag.color || '#6366f1', backgroundColor: `${tag.color || '#6366f1'}15`, border: `1px solid ${tag.color || '#6366f1'}30` }}>
                      {tag.name || ''}
                    </span>
                  ))}
                </div>
              )}
              {isParent && (
                task.assignees && task.assignees.length > 0 ? (
                  <div className="flex -space-x-1.5 shrink-0 ml-auto">
                    {task.assignees.map((assignee, i) => (
                      <img key={i} referrerPolicy="no-referrer" src={assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee.username || 'U')}&background=random`} alt={assignee.username} title={assignee.username} className="w-6 h-6 rounded-full border border-slate-900 bg-slate-800 object-cover relative transition-all hover:z-[99] hover:scale-110 neon-border-indigo cursor-help" />
                    ))}
                  </div>
                ) : (
                  <div className="flex items-center justify-center w-6 h-6 rounded-full border border-slate-800 bg-slate-900 text-slate-500 shrink-0 ml-auto" title="Unassigned"><Users className="h-3 w-3" /></div>
                )
              )}
            </div>
          </div>
          {isExpanded && hasSubtasks && (
            <div className="bg-slate-900/40 border-t border-white/5 p-3 space-y-2 ml-4 pl-3 border-l border-dashed border-white/10">
              {relevantSubtasks.map(sub => <TaskItem key={sub.id} task={sub} depth={depth + 1} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} isDoneMode={isDoneMode} />)}
            </div>
          )}
        </div>
      );
    };

    // ---- Status carousel: one floating card per status; status tabs can be dragged into a saved order ----
    const PRIORITY_DOT = { urgent: '#f87171', high: '#fb923c', normal: '#38bdf8', low: '#64748b' };
    const DONE_NAMES = ['closed', 'complete', 'done', 'resolved'];

    const taskTimes = (task) => {
      const est = task.time_estimate ? parseInt(task.time_estimate) : 0;
      const isDone = DONE_NAMES.includes((task.status?.status || '').toLowerCase());
      const spent = task.time_spent ? parseInt(task.time_spent) : (isDone ? est : 0);
      return { est, spent };
    };

    const CarouselTask = ({ task, color, depth = 0, expandedTasks, toggleTaskExpand }) => {
      const subs = task.subtasks || [];
      const isOpen = !!expandedTasks[task.id];
      const { est, spent } = taskTimes(task);
      const pct = Math.round(100 * spent / Math.max(est, spent, 1));
      const prio = (task.priority?.priority || '').toLowerCase();
      const due = task.due_date ? new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(new Date(parseInt(task.due_date))) : null;
      const hasTime = est > 0 || spent > 0;
      return (
        <div className={depth ? 'rounded-r-lg bg-slate-800/50 border-l-2 px-2.5 py-2' : 'rounded-lg bg-slate-800/60 border border-white/5 px-2.5 py-2'} style={depth ? { borderLeftColor: `${color}66` } : undefined}>
          <div className="flex items-start gap-2">
            <span className="mt-1.5 h-2 w-2 rounded-full shrink-0" style={{ background: PRIORITY_DOT[prio] || '#475569' }} title={prio ? `Priority: ${prio}` : 'No priority'} />
            <span className={`${depth ? 'text-xs' : 'text-sm'} font-semibold text-slate-100 leading-5 flex-1 min-w-0 break-words`}>{task.name || 'Unnamed Task'}{task._archived && <> <ArchivedBadge /></>}</span>
            {!depth && (
              <span className="flex -space-x-1.5 shrink-0 pl-1">
                {(task.assignees || []).slice(0, 3).map((a, i) => (
                  <img key={i} referrerPolicy="no-referrer" src={a.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.username || 'U')}&background=random`} alt={a.username} title={a.username} className="h-5 w-5 rounded-full border border-slate-900 object-cover" />
                ))}
                {(!task.assignees || task.assignees.length === 0) && <span className="text-[10px] text-slate-600">Unassigned</span>}
              </span>
            )}
          </div>
          <div className="flex flex-wrap items-center gap-x-2.5 gap-y-1 pl-4 mt-1 text-[11px] text-slate-400">
            {hasTime ? <span className="flex items-center"><Clock className="h-3 w-3 mr-1 text-slate-500" />{Math.round(spent / 3600000)}h / {Math.round(est / 3600000)}h</span> : <span className="text-slate-600">No estimate</span>}
            {due && <span className="flex items-center"><Calendar className="h-3 w-3 mr-1 text-slate-500" />{due}</span>}
            {!depth && (task.tags || []).map((tag, i) => (
              <span key={i} className="px-1.5 rounded font-semibold" style={{ color: tag.color || '#818cf8', backgroundColor: `${tag.color || '#818cf8'}15` }}>{tag.name}</span>
            ))}
            {subs.length > 0 && (
              <button onClick={() => toggleTaskExpand(task.id)} aria-expanded={isOpen} className="flex items-center px-1.5 rounded bg-indigo-500/10 text-indigo-300 font-bold hover:bg-indigo-500/20">
                <ChevronRight className={`h-3 w-3 mr-0.5 transition-transform ${isOpen ? 'rotate-90' : ''}`} /> {subs.length} subtask{subs.length > 1 ? 's' : ''}
              </button>
            )}
          </div>
          {!depth && hasTime && <div className="ml-4 mt-1.5 h-1 rounded bg-slate-900 overflow-hidden"><div className="h-full" style={{ width: `${pct}%`, background: color }} /></div>}
          {isOpen && subs.length > 0 && (
            <div className="mt-2 ml-3 pl-2 border-l border-dashed border-white/10 space-y-1.5">
              {subs.map(s => <CarouselTask key={s.id} task={s} color={color} depth={depth + 1} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
            </div>
          )}
        </div>
      );
    };

    // groups: [{ status, color, tasks }]. storageKey: where this user's tab order is saved (per user, list and explorer).
    const StatusCarousel = ({ groups, storageKey, expandedTasks, toggleTaskExpand }) => {
      const SP = 170, EX = 130;
      const keyOf = (g) => g.status.toLowerCase();
      const readSaved = () => { try { const v = JSON.parse(localStorage.getItem(storageKey) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
      const [saved, setSaved] = useState(readSaved);
      const [chipOrder, setChipOrder] = useState(null); // tab order while a tab is being dragged
      const [dragKey, setDragKey] = useState(null);
      const [active, setActive] = useState(0);
      const [scale, setScale] = useState(1);
      const [savedFlash, setSavedFlash] = useState(false);
      const [note, setNote] = useState('');
      const frameRef = useRef(null), chipsRef = useRef(null), cardRefs = useRef([]);
      const pos = useRef(0), target = useRef(0), anim = useRef(null), centerKey = useRef(null), flashTimer = useRef(null);
      const chipDrag = useRef(null), swipe = useRef(null), skipClick = useRef(false), wheelAt = useRef(0), live = useRef({});

      // Saved names first, in saved order; statuses never seen before follow in default order (open statuses A to Z, then done statuses A to Z)
      const orderBy = (list, order) => [...list].sort((x, y) => { const ix = order.indexOf(keyOf(x)), iy = order.indexOf(keyOf(y)); return (ix < 0 ? 1e6 : ix) - (iy < 0 ? 1e6 : iy); });
      const doneFirst = (g) => (DONE_NAMES.includes(keyOf(g)) ? 1 : 0); // done statuses follow the open ones by default
      const byDefault = [...groups].sort((x, y) => (doneFirst(x) - doneFirst(y)) || (x.status < y.status ? -1 : x.status > y.status ? 1 : 0));
      const cardData = orderBy(byDefault, saved);
      const chipData = orderBy(byDefault, chipOrder || saved);
      const isDefault = cardData.every((g, i) => g === byDefault[i]);
      live.current = { cardData, chipData, saved };
      cardRefs.current.length = cardData.length;

      const layout = () => {
        let best = 0, bd = 9;
        cardRefs.current.forEach((el, i) => {
          if (!el) return;
          const o = i - pos.current, a = Math.abs(o), m = Math.min(a, 2), sgn = Math.sign(o) || 1, c = Math.max(0, 1 - a);
          el.style.transform = `translateX(${sgn * (SP * a + EX * Math.min(a, 1))}px) translateZ(${-m * 60}px) rotateY(${-sgn * Math.min(a, 1.4) * 24}deg) scale(${1 - 0.13 * m})`;
          el.style.opacity = Math.max(0.35, 1 - 0.25 * m);
          el.style.zIndex = Math.round(100 - a * 10);
          el.style.boxShadow = `0 ${8 + 28 * c}px ${18 + 36 * c}px rgba(0,0,0,${0.4 + 0.3 * c})`;
          el.style.borderColor = c > 0.5 ? 'rgba(129,140,248,.65)' : 'rgba(255,255,255,.08)';
          el.dataset.center = a < 0.35 ? '1' : '';
          if (a < bd) { bd = a; best = i; }
        });
        const g = live.current.cardData[best];
        if (g) centerKey.current = keyOf(g);
        setActive(prev => (prev === best ? prev : best));
      };
      const goTo = (i) => {
        target.current = Math.max(0, Math.min(live.current.cardData.length - 1, Math.round(i)));
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { pos.current = target.current; layout(); return; }
        if (anim.current) return;
        const step = () => {
          const d = target.current - pos.current;
          if (Math.abs(d) < 0.002) { pos.current = target.current; anim.current = null; layout(); return; }
          pos.current += d * 0.16; layout(); anim.current = requestAnimationFrame(step);
        };
        anim.current = requestAnimationFrame(step);
      };
      const stopAnim = () => { if (anim.current) { cancelAnimationFrame(anim.current); anim.current = null; } };

      // Keep the same status centred when the order or the data changes
      const signature = cardData.map(keyOf).join('|');
      useEffect(() => {
        stopAnim();
        const idx = cardData.findIndex(g => keyOf(g) === centerKey.current);
        const next = idx >= 0 ? idx : Math.min(Math.round(pos.current), Math.max(0, cardData.length - 1));
        pos.current = target.current = next;
        layout();
      }, [signature]);

      useEffect(() => {
        const el = frameRef.current; if (!el) return;
        const fit = () => setScale(Math.min(1, el.clientWidth / 1180));
        fit();
        const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fit) : null;
        if (ro) ro.observe(el);
        const onWheel = (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 20 && Date.now() - wheelAt.current > 350) { wheelAt.current = Date.now(); goTo(target.current + Math.sign(e.deltaX)); e.preventDefault(); } };
        el.addEventListener('wheel', onWheel, { passive: false });
        return () => { if (ro) ro.disconnect(); el.removeEventListener('wheel', onWheel); stopAnim(); clearTimeout(flashTimer.current); };
      }, []);

      const persist = (keys, message) => {
        setSaved(keys); setChipOrder(null); setDragKey(null);
        try { if (keys.length) localStorage.setItem(storageKey, JSON.stringify(keys)); else localStorage.removeItem(storageKey); } catch (e) { console.warn(e); }
        setSavedFlash(true); clearTimeout(flashTimer.current); flashTimer.current = setTimeout(() => setSavedFlash(false), 1800);
        setNote(message);
      };
      const moveKey = (keys, key, to) => { const out = keys.filter(k => k !== key); out.splice(to, 0, key); return out; };

      // Drag a tab: the tab strip reorders live, cards and storage update on drop. Drag the cards: browse.
      useEffect(() => {
        const onMove = (e) => {
          const d = chipDrag.current;
          if (d) {
            if (!d.moved && Math.abs(e.clientX - d.x) > 6) { d.moved = true; document.body.style.userSelect = 'none'; setDragKey(d.key); }
            if (!d.moved) return;
            const box = chipsRef.current; if (!box) return;
            const r = box.getBoundingClientRect();
            if (e.clientX < r.left + 40) box.scrollLeft -= 12; else if (e.clientX > r.right - 40) box.scrollLeft += 12;
            const els = [...box.children];
            let to = els.findIndex(c => { const q = c.getBoundingClientRect(); return e.clientX < q.left + q.width / 2; });
            if (to < 0) to = els.length - 1;
            const keys = live.current.chipData.map(keyOf);
            if (keys.indexOf(d.key) !== to) setChipOrder(moveKey(keys, d.key, to));
            return;
          }
          const s = swipe.current;
          if (s) {
            const dx = e.clientX - s.x;
            if (!s.moved && Math.abs(dx) > 8) { s.moved = true; stopAnim(); }
            if (s.moved) { pos.current = Math.max(0, Math.min(live.current.cardData.length - 1, s.p - dx / (SP * (s.k || 1) * 1.4))); layout(); }
          }
        };
        const onUp = () => {
          const d = chipDrag.current, s = swipe.current;
          chipDrag.current = null; swipe.current = null; document.body.style.userSelect = '';
          if (d && d.moved) {
            skipClick.current = true; setTimeout(() => { skipClick.current = false; }, 0);
            const keys = live.current.chipData.map(keyOf);
            persist(keys, `${d.key} moved to position ${keys.indexOf(d.key) + 1} of ${keys.length}. Order saved.`);
          } else if (d) { setDragKey(null); }
          if (s && s.moved) { skipClick.current = true; setTimeout(() => { skipClick.current = false; }, 0); goTo(pos.current); }
        };
        // Esc or an interrupted pointer abandons a tab drag: the order snaps back and nothing is saved.
        const onCancel = (e) => {
          const d = chipDrag.current;
          if (!d || (e.type === 'keydown' && e.key !== 'Escape')) { if (e.type === 'pointercancel') onUp(); return; }
          chipDrag.current = null; document.body.style.userSelect = '';
          if (d.moved) { skipClick.current = true; setTimeout(() => { skipClick.current = false; }, 0); setNote('Reorder cancelled. Order unchanged.'); }
          setChipOrder(null); setDragKey(null);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onCancel);
        window.addEventListener('keydown', onCancel);
        return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onCancel); window.removeEventListener('keydown', onCancel); };
      }, [storageKey]);

      const onChipKey = (e, g) => {
        if (!e.altKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
        e.preventDefault();
        const keys = chipData.map(keyOf), from = keys.indexOf(keyOf(g)), to = from + (e.key === 'ArrowRight' ? 1 : -1);
        if (to < 0 || to >= keys.length) return;
        persist(moveKey(keys, keyOf(g), to), `${g.status} moved to position ${to + 1} of ${keys.length}. Order saved.`);
        const btn = e.currentTarget;
        setTimeout(() => { const el = chipsRef.current && [...chipsRef.current.children].find(c => c.dataset.key === keyOf(g)); (el || btn).focus(); }, 0);
      };

      if (groups.length === 0) return null;
      const canSort = chipData.length > 1;
      const sumMs = (g, f) => g.tasks.reduce((s, t) => s + f(taskTimes(t)), 0);

      return (
        <div className="relative z-0 isolate">
          <div className="flex items-center justify-end gap-3 px-6 pt-3 min-h-[28px]">
            <span className={`text-[11px] text-emerald-300 transition-opacity duration-300 ${savedFlash ? 'opacity-100' : 'opacity-0'}`}>✓ Order saved</span>
            {!isDefault && <button onClick={() => persist([], 'Status order reset to default.')} className="text-[11px] text-slate-400 hover:text-white underline underline-offset-2">Reset order</button>}
            {canSort && <span className="text-[11px] text-slate-500 hidden md:inline">drag the tabs to reorder · swipe or ← → to browse</span>}
          </div>
          <div className="relative z-10 bg-gradient-to-b from-slate-900/60 to-transparent">
            <div ref={chipsRef} role="tablist" aria-label="Task statuses" className="flex gap-2 overflow-x-auto px-5 pt-2 pb-3"
              onPointerDown={(e) => { const el = e.target.closest('[data-key]'); if (el && canSort) chipDrag.current = { key: el.dataset.key, x: e.clientX, moved: false }; }}>
              {chipData.map((g) => {
                const idx = cardData.findIndex(c => keyOf(c) === keyOf(g));
                const on = idx === active, dragging = dragKey === keyOf(g);
                return (
                  <button key={keyOf(g)} role="tab" data-key={keyOf(g)} aria-selected={on}
                    aria-label={`${g.status}, ${g.tasks.length} tasks${canSort ? '. Alt plus left or right arrow moves it.' : ''}`}
                    onClick={() => { if (!skipClick.current && idx >= 0) goTo(idx); }}
                    onKeyDown={(e) => onChipKey(e, g)}
                    className={`shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs ${canSort ? 'touch-none ' : ''}${dragging ? 'opacity-80 scale-105 ring-2 ring-indigo-400 cursor-grabbing' : canSort ? 'cursor-grab' : ''} ${on ? 'bg-slate-800 text-white' : 'bg-slate-900/60 border-white/10 text-slate-400 hover:text-slate-200'}`}
                    style={on ? { borderColor: g.color, boxShadow: `0 0 14px ${g.color}55` } : undefined}>
                    {canSort && <span className="text-slate-600 select-none -ml-1" aria-hidden="true">⋮⋮</span>}
                    <span className="h-2 w-2 rounded-full" style={{ background: g.color, boxShadow: `0 0 6px ${g.color}` }} />
                    <span className="font-semibold">{g.status}</span>
                    <span className="text-slate-400">{g.tasks.length}</span>
                    <span className="text-slate-500">{Math.round(sumMs(g, t => t.spent) / 3600000)}/{Math.round(sumMs(g, t => t.est) / 3600000)}h</span>
                  </button>
                );
              })}
            </div>
          </div>
          <div className="relative px-2 pt-2">
            <button onClick={() => goTo(target.current - 1)} aria-label="Previous status" className="absolute left-3 top-1/2 -translate-y-1/2 z-[200] h-9 w-9 rounded-full bg-slate-800/90 border border-white/10 text-slate-300 hover:text-white hover:border-indigo-400/50">‹</button>
            <button onClick={() => goTo(target.current + 1)} aria-label="Next status" className="absolute right-3 top-1/2 -translate-y-1/2 z-[200] h-9 w-9 rounded-full bg-slate-800/90 border border-white/10 text-slate-300 hover:text-white hover:border-indigo-400/50">›</button>
            <div ref={frameRef} className="relative overflow-hidden" style={{ touchAction: 'pan-y', height: 520 * scale }}
              onPointerDown={(e) => { if (!e.target.closest('button,a')) swipe.current = { x: e.clientX, p: pos.current, moved: false, k: scale }; }}>
              <div className="relative mx-auto" tabIndex={0} aria-label="Status cards" style={{ width: 1, height: 520, perspective: 1100, transformOrigin: 'top center', transform: `scale(${scale})` }}
                onKeyDown={(e) => { if (e.target !== e.currentTarget) return; if (e.key === 'ArrowRight') { goTo(target.current + 1); e.preventDefault(); } if (e.key === 'ArrowLeft') { goTo(target.current - 1); e.preventDefault(); } }}>
                {cardData.map((g, i) => {
                  const estMs = sumMs(g, t => t.est), spentMs = sumMs(g, t => t.spent), pct = Math.round(100 * spentMs / Math.max(estMs, spentMs, 1));
                  return (
                    <article key={keyOf(g)} ref={el => { cardRefs.current[i] = el; }} aria-label={g.status}
                      onClick={() => { if (!skipClick.current && Math.abs(i - pos.current) >= 0.35) goTo(i); }}
                      className="wv-card rounded-2xl bg-slate-900 border border-white/10 overflow-hidden flex flex-col">
                      <div className="h-1 shrink-0" style={{ background: g.color }} />
                      <header className="relative px-4 pt-3 pb-3 bg-slate-800/40 border-b border-white/5 shrink-0">
                        <div className="flex items-center gap-2">
                          <span className="h-3 w-3 rounded-full" style={{ background: g.color, boxShadow: `0 0 10px ${g.color}` }} />
                          <h3 className="font-bold text-slate-100 capitalize text-base">{g.status}</h3>
                          <span className="ml-auto text-xs text-slate-300 bg-slate-900 px-2 py-0.5 rounded-full border border-white/10">{g.tasks.length} {g.tasks.length === 1 ? 'task' : 'tasks'}</span>
                        </div>
                        <div className="flex items-center gap-2 mt-2 text-[11px] text-slate-400"><span>{Math.round(spentMs / 3600000)}h spent of {Math.round(estMs / 3600000)}h estimated</span><span className="ml-auto">{pct}%</span></div>
                        <span className="absolute left-0 bottom-0 h-0.5" style={{ width: `${pct}%`, background: g.color }} />
                      </header>
                      <div className="wv-tasks flex-1 min-h-0 overflow-y-auto p-3 space-y-2" tabIndex={0} aria-label={`${g.status} tasks`}>
                        {g.tasks.map(t => <CarouselTask key={t.id} task={t} color={g.color} expandedTasks={expandedTasks} toggleTaskExpand={toggleTaskExpand} />)}
                      </div>
                    </article>
                  );
                })}
              </div>
            </div>
            <div className="text-center text-xs text-slate-500 py-3" aria-live="polite">{cardData.length ? `${Math.min(active, cardData.length - 1) + 1} of ${cardData.length} · ${cardData[Math.min(active, cardData.length - 1)].status}` : ''}</div>
            <div className="sr-only" aria-live="polite">{note}</div>
          </div>
        </div>

    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        
        const setCanvasSize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        
        setCanvasSize();

        const handleResize = () => {
          setCanvasSize();
          initializeWebs();
        };
        
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];

          const vWidth = window.innerWidth;
          const vHeight = window.innerHeight;

          const webConfigs = [
            { cx: vWidth * 0.28, cy: vHeight * 0.5, radius: Math.min(vWidth, vHeight) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: vWidth * 0.72, cy: vHeight * 0.42, radius: Math.min(vWidth, vHeight) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];

            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });
            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                const x = cx + Math.cos(angle) * currentRadius;
                const y = cy + Math.sin(angle) * currentRadius;
                nodes.push({ id: nodes.length, x, y, spoke: s, ring: r, isHub: false });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });

            spiders.push({
              webIdx,
              currentNode: nodes[Math.floor(Math.random() * nodes.length)],
              targetNode: null,
              progress: 0,
              speed: 0.006 + Math.random() * 0.004,
              x: cx, y: cy, size: 7 + webIdx * 3, legCycle: 0, wovenPaths: []
            });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({ webIdx, from: edge.from, to: edge.to, progress: 0, speed: 0.015 + Math.random() * 0.02, size: 1.5 + Math.random() * 1.5 });
        };

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          webs.forEach(web => {
            web.edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${web.color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });
            web.nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${web.color}, 0.25)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) spawnPacket();

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) return packets.splice(idx, 1);
            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${webs[packet.webIdx].color}, 0.6)`;
            ctx.fill();
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];
            if (!spider.targetNode) {
              const neighbors = web.edges.filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id).map(e => e.from.id === spider.currentNode.id ? e.to : e.from);
              if (neighbors.length > 0) {
                spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)];
                spider.progress = 0;
              }
            }
            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;
              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;
              if (spider.progress >= 1) {
                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }
            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.beginPath();
            ctx.arc(0, 0, spider.size * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${web.color})`;
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full block z-0 transition-opacity duration-1000 pointer-events-none" style={{ opacity }} />;
    };

      const updateCard = (cardId, fn) => updatePortfolios(prev => prev.map(p => p.cards.some(c => c.id === cardId) ? { ...p, cards: p.cards.map(c => c.id === cardId ? fn(c) : c) } : p));

      const importingRef = useRef(false);
      const importLocalCards = async () => {

      const callApi = async (path, { method = 'GET', connId, body } = {}) => {
          const cu = auth.currentUser;
          if (!cu || cu.isAnonymous) { const e = new Error('Sign in with Google to save a ClickUp connection.'); e.kind = 'auth'; throw e; }

          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS); // a stuck request ends instead of hanging the sync
          try {

                  headers: {
                      'Authorization': `Bearer ${await cu.getIdToken()}`,
                      ...(connId && { 'X-Weaver-Conn': connId }),
                      ...(body && { 'Content-Type': 'application/json' })

          if (res.status === 401 && (code === 'TOKEN_REJECTED' || msg === 'Invalid API Token')) { error = new Error('Invalid API Token. ClickUp rejected the connection.'); error.isDefinitive = true; kind = 'token'; }
          else if (res.status === 401) { error = new Error('Your sign-in expired. Sign in again.'); kind = 'auth'; }
          else if (res.status === 403 && code === 'NOT_TEAM') { error = new Error(NOT_TEAM_MSG); kind = 'auth'; setNotTeam({ email: cu.email || '' }); firebaseSignOut(auth).catch(e => console.warn(e)); } // team-data FR-3
          else if (res.status === 403) { error = new Error('Sign in with Google to save a ClickUp connection.'); kind = 'auth'; }
          else if (res.status === 404 && code === 'CLICKUP_NOT_FOUND') { error = new Error('ClickUp could not find that list or task. It may have been deleted or renamed.'); kind = 'notfound'; }
          else if (res.status === 404) { setNeedsReconnect(true); error = new Error('This connection needs to be reconnected.'); kind = 'unknownconn'; }

          else error = new Error(msg || `HTTP ${res.status}`);
          error.kind = kind; error.code = code; error.status = res.status; error.retryAfter = retryAfter;

      const fetchClickUp = async (endpoint, connId) => {

      const saveConnection = (token) => callApi('connections', { method: 'POST', body: { token } });

      useEffect(() => {
        if (!selectedTeam || !clickUpToken) return;

      const availableLists = selectedFolder ? lists : folderlessLists;

      const canSaveToken = !!user && !user.isMock && !user.isAnonymous;

      // ---- team-data FR-21, FR-27: move the old shared data once, then resolve entries whose list was unknown ----
      const MIGRATION_ID = 'team-data-v1';
      const migrationDoc = () => doc(db, 'migrations', MIGRATION_ID);
      const unmatchedCol = () => collection(db, 'migrations', MIGRATION_ID, 'unmatched');
      const migrationRef = useRef(null); // the running or finished migration (a promise), once per page load
      const unmatchedRanRef = useRef(false);
      const inChunks = async (items, fn, size = 20) => { for (let i = 0; i < items.length; i += size) await Promise.all(items.slice(i, i + size).map(fn)); };

      const runTeamDataMigration = async () => {
        const guard = await getDoc(migrationDoc());
        const g = guard.exists() ? guard.data() : null;
        // done, or another team member is running it right now (a run that stopped half-way is picked up after 10 minutes; every write is idempotent)
        if (g && (g.status === 'done' || Date.now() - (g.startedAt || 0) < 10 * 60 * 1000)) return g;
        await setDoc(migrationDoc(), { status: 'running', startedAt: Date.now(), startedBy: user.uid, capacity: 0, timeEntries: 0, unmatched: 0 }, { merge: true });
        const old = (...p) => doc(db, 'artifacts', appId, 'public', 'data', ...p);
        const [wfSnap, ledgerSnap, capSnap] = await Promise.all([
          getDoc(old('settings', 'workflows')),
          getDoc(old('ledgers', 'global')),
          getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'capacity')),
        ]);
        // which list each task belongs to: the old shared task copy plus this browser's own lists
        const taskList = {};
        const walk = (tasks, listId) => (tasks || []).forEach(t => { taskList[t.id] = String(listId); walk(t.subtasks, listId); });
        ((wfSnap.exists() && wfSnap.data().mappedWorkflows) || []).forEach(w => walk(w.tasks, w.listId));
        mappedWorkflowsRef.current.forEach(w => { walk(w.tasks, w.listId); (w.archivedRaw || []).forEach(t => { taskList[t.id] = String(w.listId); }); });

        let capacity = 0, timeEntries = 0, unmatched = 0;

          if ((await getDoc(listDoc(c.id))).exists()) return; // the new version already uses this list
          const d = c.data();

          await setDoc(listDoc(c.id), { ...fields, updatedAt: Date.now(), updatedBy: user.uid });

      const buildTaskTree = (flatTasks) => {
        const taskMap = {};
        const roots = [];
        flatTasks.forEach(task => { taskMap[task.id] = { ...task, subtasks: [] }; });
        flatTasks.forEach(task => {
          const parentId = task.parent;

      const handleAddMapping = async () => {
        if (!selectedTeam || !selectedSpace || !selectedList) return;

        const folderName = selectedFolder ? (folders.find(f => f.id === selectedFolder)?.name || 'Folder') : 'No Folder';

        let listDueDate = null;

            const listDetail = await fetchClickUp(`list/${selectedList}`, clickUpToken);

      const removeMapping = async (id) => {

      const runSyncSequence = async () => {

      const showPausedHint = (hint) => {

      // FR-13, FR-25: Sync Now on a paused connection asks the Worker to check the token again (once a minute)

      useEffect(() => { applySync({ state: 'idle' }); noteOutage(false); retryLocalRef.current = 0; }, [clickUpToken]);
