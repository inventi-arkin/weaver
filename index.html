      }, []);

      const handleMockLogin = () => {
        setUser({ uid: 'mock_user_' + Date.now(), name: 'Preview User', email: 'preview@weaver.app', avatar: 'https://ui-avatars.com/api/?name=Preview+User', isAnonymous: true, isMock: true });
        setErrorMessage(null);
      };

      const handleGoogleLogin = async () => {
        setIsLoggingIn(true); setErrorMessage(null);
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain' || error.message.includes('iframe') || error.code === 'auth/popup-closed-by-user') {
            try { await auth.signInAnonymously(); } catch (anonErr) { handleMockLogin(); }
          } else { setErrorMessage(error.message); }
        } finally { setIsLoggingIn(false); }
      };

      const handleLogout = () => {
        if (auth.currentUser) auth.signOut(); else setUser(null);
        localStorage.removeItem('weaver_clickup_token');
        setClickUpToken(''); setTeams([]); setMappedWorkflows([]); setIntegrationStep('idle'); setIsSwitchModalOpen(false);
      };

      if (!authInitialized) {
        return <div className="min-h-screen bg-slate-950 flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;
      }

      // -----------------------------------------------------------------------
      // DASHBOARD RENDER LOGIC
      // -----------------------------------------------------------------------
      if (user) {
        // Overlay the Local Time Ledger onto the workflow data before any math
        const applyLedger = (tasks) => {
          return tasks.map(t => {
            const processedSubtasks = t.subtasks ? applyLedger(t.subtasks) : [];
            
            const ledgerEntries = localTimeLedger[t.id] || [];
            const directAddedTime = ledgerEntries.reduce((sum, e) => Number(sum) + Number(e.duration || 0), 0);
            
            const rolledUpAddedTime = processedSubtasks.reduce((sum, sub) => sum + Number(sub._totalLocalAdded || 0), 0);
            const totalLocalAdded = directAddedTime + rolledUpAddedTime;

            const rawNativeSpent = Number(t.time_spent || 0);

            return {
              ...t,
              rawNativeSpent,
              localLedger: ledgerEntries,
              _totalLocalAdded: totalLocalAdded,
              time_spent: rawNativeSpent + totalLocalAdded,
              _direct_time_spent: rawNativeSpent + directAddedTime,
              subtasks: processedSubtasks
            };
          });
        };

        const activeWorkflows = mappedWorkflows.map(wf => ({
          ...wf,
          tasks: applyLedger(wf.tasks || [])
        }));

        const allFlatTasks = flattenTasks(activeWorkflows.flatMap(wf => wf.tasks || []));
        const uniqueTags = Array.from(new Set(allFlatTasks.flatMap(t => t.tags?.map(tag => tag.name || '') || [])));
        
        // Extract assignees from both Native ClickUp assignments AND Local Ledger logs
        const uniqueAssignees = Array.from(new Set(allFlatTasks.flatMap(t => [
            ...(t.assignees?.map(a => a.username || '') || []),
            ...(t.localLedger?.map(l => l.assignee || '') || [])
        ]).filter(Boolean)));

        const workspaceUsers = Array.from(new Set([
           user?.name,
           ...uniqueAssignees
        ])).filter(Boolean);

        const checkGlobalFilter = (t) => {
            if (completionFilterType === 'none') return true;
            if (completionFilterType === 'tags' && selectedTagFilter) return t.tags?.some(tag => (tag.name || '') === selectedTagFilter);
            if (completionFilterType === 'assignees' && selectedAssigneeFilter) {
                const nativelyAssigned = t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter);
                const locallyAssigned = t.localLedger?.some(l => (l.assignee || '') === selectedAssigneeFilter);
                return nativelyAssigned || locallyAssigned;
            }
            return true;
        };
        
        let filteredTasks = allFlatTasks.filter(checkGlobalFilter);

        const doneStatuses = ['closed', 'complete', 'done', 'resolved'];
        const backlogStatuses = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'new', 'pending'];

        const buildFilteredTree = (tasks, isDoneMode) => {
            let result = [];
            tasks.forEach(task => {
                const isDone = doneStatuses.includes((task.status?.status || '').toLowerCase());
                const matchesMode = isDoneMode ? isDone : !isDone;
                const matchesFilter = checkGlobalFilter(task);
                let filteredSubtasks = task.subtasks ? buildFilteredTree(task.subtasks, isDoneMode) : [];
                if ((matchesMode && matchesFilter) || filteredSubtasks.length > 0) {
                    result.push({ ...task, subtasks: filteredSubtasks });
                }
            });
            return result;
        };

        let allBugs = extractBugs(activeWorkflows.flatMap(wf => wf.tasks || []));
        if (completionFilterType === 'tags' && selectedTagFilter) allBugs = allBugs.filter(t => t.tags?.some(tag => (tag.name || '') === selectedTagFilter));
        else if (completionFilterType === 'assignees' && selectedAssigneeFilter) allBugs = allBugs.filter(t => t.assignees?.some(a => (a.username || '') === selectedAssigneeFilter));

        const allMotherTaskIds = new Set(activeWorkflows.flatMap(wf => wf.tasks || []).map(t => t.id));

        const getBreakdown = (tasksArray) => {
            const validTasks = tasksArray.filter(t => {
                const n = (t.name || '').toLowerCase();
                return !n.includes('qa bugs') && !n.includes('ui bugs');
            });
            const mothers = validTasks.filter(t => allMotherTaskIds.has(t.id)).length;
            const subs = validTasks.filter(t => !allMotherTaskIds.has(t.id)).length;
            return { total: validTasks.length, mothers, subs };
        };

        const backlogTasks = filteredTasks.filter(t => backlogStatuses.includes((t.status?.status || 'open').toLowerCase()));
        const backlogBreakdown = getBreakdown(backlogTasks);
        const backlogTasksCount = backlogBreakdown.total;

        const activeTasks = filteredTasks.filter(t => {
            const s = (t.status?.status || 'open').toLowerCase();
            return !doneStatuses.includes(s) && !backlogStatuses.includes(s);
        });
        const activeBreakdown = getBreakdown(activeTasks);
        const activeTasksCount = activeBreakdown.total;

        const completedTasks = filteredTasks.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase()));
        const completedBreakdown = getBreakdown(completedTasks);
        const completedFilteredTasksCount = completedBreakdown.total;

        // Task Distribution classification
        const totalDistTasks = backlogBreakdown.total + activeBreakdown.total + completedBreakdown.total;
        const backlogDistPct = totalDistTasks > 0 ? (backlogBreakdown.total / totalDistTasks) * 100 : 0;
        const activeDistPct = totalDistTasks > 0 ? (activeBreakdown.total / totalDistTasks) * 100 : 0;
        const resolvedDistPct = totalDistTasks > 0 ? (completedBreakdown.total / totalDistTasks) * 100 : 0;

        const parseDateMs = (d) => {
            if (!d) return 0;
            const n = Number(d);
            return !isNaN(n) ? n : new Date(d).getTime() || 0;
        };

        // Isolate tasks to prevent ClickUp's native Parent/Child rollup from double counting
        const filteredTaskIds = new Set(filteredTasks.map(t => t.id));
        const independentTasks = filteredTasks.filter(t => !t.parent || !filteredTaskIds.has(t.parent));

        const allLocalLedgerEntries = Object.entries(localTimeLedger).flatMap(([taskId, entries]) => 
            entries.map(e => ({ ...e, taskId, ms: e.duration, timestamp: e.date, userId: e.assignee, note: e.note || 'Manual Entry' }))
        ).sort((a, b) => a.timestamp - b.timestamp);

        const totalGlobalHours = allLocalLedgerEntries.reduce((sum, entry) => sum + entry.ms, 0) / 3600000;
        const getLoggedMsForTask = (taskId) => {
            const entries = localTimeLedger[taskId] || [];
            return entries.reduce((sum, e) => sum + Number(e.duration || 0), 0);
        };
        const totalNativeMs = allFlatTasks.filter(t => !t.subtasks || t.subtasks.length === 0).reduce((sum, t) => sum + (Number(t.rawNativeSpent) || 0), 0);

        // Workload Map and Base Values needed for Capacity calculations
        const assigneeStats = {};
        workspaceUsers.forEach(u => {
            assigneeStats[u] = {
                username: u,
                profilePicture: `https://ui-avatars.com/api/?name=${encodeURIComponent(u)}&background=random`,
                statusCounts: {}, totalEstMs: 0, totalSpentMs: 0
            };
        });

        filteredTasks.forEach(task => {
          const statusName = task.status?.status || 'Open';
          const statusColor = task.status?.color || '#94a3b8';
          const isDone = doneStatuses.includes(statusName.toLowerCase());
          
          let est = task.directEstimate !== undefined ? task.directEstimate : (task.time_estimate ? parseInt(task.time_estimate) : 0);
          const nativeSpent = task.directNativeSpent !== undefined ? task.directNativeSpent : (task.rawNativeSpent ? parseInt(task.rawNativeSpent) : (isDone ? est : 0));

          if (task.assignees && task.assignees.length > 0) {
            task.assignees.forEach(assignee => {
              const key = assignee.username || `User_${assignee.id}`;
              if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
              
              if (!assigneeStats[key]) {
                assigneeStats[key] = {
                  username: key,
                  profilePicture: assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(key)}&background=random`,
                  statusCounts: {}, totalEstMs: 0, totalSpentMs: 0
                };
              }
              if (!assigneeStats[key].statusCounts[statusName]) assigneeStats[key].statusCounts[statusName] = { count: 0, color: statusColor };
              assigneeStats[key].statusCounts[statusName].count++;
              assigneeStats[key].totalEstMs += est;
              assigneeStats[key].totalSpentMs += nativeSpent;
            });
          }

          // Explicitly add explicitly logged local time to the assigned user's workload card
          if (task.localLedger && task.localLedger.length > 0) {
              task.localLedger.forEach(entry => {
                  const key = entry.assignee;
                  if (completionFilterType === 'assignees' && selectedAssigneeFilter && key !== selectedAssigneeFilter) return;
                  if (assigneeStats[key]) {
                      assigneeStats[key].totalSpentMs += Number(entry.duration);
                  }
              });
          }
        });
        
        // Remove empty templates
        const assigneesList = Object.values(assigneeStats).filter(a => a.totalEstMs > 0 || a.totalSpentMs > 0 || Object.keys(a.statusCounts).length > 0).sort((a,b) => b.totalEstMs - a.totalEstMs);
        const devCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'Developer').length;
        const qaCount = assigneesList.filter(a => (userRoles[a.username] || 'Developer') === 'QA').length;

        // Calculate Global Timelines
        let taskMinDate = Infinity;
        let taskMaxDate = 0;
        independentTasks.forEach(t => {
            if (t.start_date) taskMinDate = Math.min(taskMinDate, parseInt(t.start_date));
            if (t.due_date) taskMaxDate = Math.max(taskMaxDate, parseInt(t.due_date));
        });

        let minDate = Infinity;
        let maxDate = 0;
        activeWorkflows.forEach(wf => {
          if (wf.listStartDate) minDate = Math.min(minDate, parseInt(wf.listStartDate));
          if (wf.listDueDate) maxDate = Math.max(maxDate, parseInt(wf.listDueDate));
        });
        if (minDate === Infinity) minDate = taskMinDate;
        if (maxDate === 0) maxDate = taskMaxDate;
        
        const now = mappedWorkflows[0]?.lastSynced || Date.now();
        if (minDate === Infinity) minDate = now - (7 * 86400000);
        if (maxDate === 0) maxDate = now + (7 * 86400000);
        if (maxDate <= minDate) maxDate = minDate + (14 * 86400000);

        // --- Sprint Working Days & Capacity Logistics ---
        const sprintStart = new Date(minDate);
        sprintStart.setHours(0,0,0,0);
        const sprintEnd = new Date(maxDate);
        sprintEnd.setHours(0,0,0,0);
        
        let sprintWorkingDays = 0;
        let tempDate = new Date(sprintStart);
        while (tempDate <= sprintEnd) {
            const day = tempDate.getDay();
            if (day !== 0 && day !== 6) sprintWorkingDays++;
            tempDate.setDate(tempDate.getDate() + 1);
        }
        
        const globalBlockerDays = dateBlockers.reduce((s, b) => s + (b.remark !== 'Leave' ? b.days : 0), 0);
        const bucketDurationDays = Math.max(0, sprintWorkingDays - globalBlockerDays);
        
        let devLeaveDays = 0, qaLeaveDays = 0;
        dateBlockers.forEach(b => {
          if (b.remark === 'Leave') {
            if ((userRoles[b.assignee] || 'Developer') === 'Developer') devLeaveDays += b.days;
            else qaLeaveDays += b.days;
          }
        });

        const devCapacityHours = Math.max(0, (devCount * bucketDurationDays * devHoursPerDay) - (devLeaveDays * devHoursPerDay));
        const qaCapacityHours = Math.max(0, (qaCount * bucketDurationDays * qaHoursPerDay) - (qaLeaveDays * qaHoursPerDay));


        // --- Core Math Compilation ---
        let totalEstimateMs = 0;
        let totalRemainingMs = 0;
        let totalSpentMs = 0;

        independentTasks.forEach(t => {
          const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
          let estimate = t.time_estimate ? Number(t.time_estimate) : 0; 
          let spent = t.time_spent ? Number(t.time_spent) : (isDone ? estimate : 0);
          
          // Auto-adjust Effective Estimate: If time tracked exceeds the initial estimate (or there was NO estimate),
          // dynamically scale the estimate up so that logged hours appropriately calculate into the progress bar.
          if (spent > estimate) {
              estimate = spent;
          }
          
          const remaining = isDone ? 0 : Math.max(0, estimate - spent);
          
          totalEstimateMs += estimate;
          totalRemainingMs += remaining;
          totalSpentMs += spent;
        });

        const totalEstHours = Math.round(totalEstimateMs / 3600000) || 1;
        const totalRemHours = Math.round(totalRemainingMs / 3600000);
        
        const burnedHours = totalEstHours - totalRemHours;
        const completionPercentage = Math.min(100, Math.round((burnedHours / totalEstHours) * 100));
        const totalFilteredCount = filteredTasks.length;

        const formatDuration = (ms) => {
            const hrs = Math.floor(ms / 3600000);
            const mins = Math.round((ms % 3600000) / 60000);
            if (hrs === 0 && mins === 0) return '0h';
            if (hrs === 0) return `${mins}m`;
            if (mins === 0) return `${hrs.toLocaleString()}h`;
            return `${hrs.toLocaleString()}h ${mins}m`;
        };

        const totalDurationMs = maxDate - minDate;
        const elapsedMs = Math.max(0, now - minDate);
        let currentX = totalDurationMs > 0 ? (elapsedMs / totalDurationMs) * 100 : 0;
        currentX = Math.max(0, Math.min(100, currentX));
        
        const formatDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const dayLabels = [
            formatDate(minDate),
            formatDate(minDate + totalDurationMs * 0.33),
            formatDate(minDate + totalDurationMs * 0.66),
            formatDate(maxDate)
        ];
        
        // --- MONOTONIC BURNDOWN LOGIC ---
        let initialBurnedMs = 0;
        const validEvents = [];
        
        independentTasks.forEach(t => {
            let est = Number(t.time_estimate) || 0;
            const totalSpent = Number(t.time_spent) || 0;
            if (totalSpent > est) est = totalSpent; // Auto-scale chart estimates 
            
            const localAdded = Number(t._totalLocalAdded) || 0;
            const nativeSpent = Math.max(0, totalSpent - localAdded);
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            
            if (isDone && est > 0) {
                let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                if (dDate <= minDate) {
                    initialBurnedMs += est;
                } else {
                    validEvents.push({ date: dDate, burned: est });
                }
            } else if (!isDone && nativeSpent > 0) {
                let cDate = parseDateMs(t.date_created) || minDate;
                let uDate = parseDateMs(t.date_updated) || now;
                if (cDate < minDate) cDate = minDate;
                if (uDate > now) uDate = now;
                if (uDate < cDate) uDate = cDate;
                
                const duration = Math.max(1, uDate - cDate);
                const slices = 10;
                for (let i = 1; i <= slices; i++) {
                    const sliceDate = cDate + (duration * (i/slices));
                    if (sliceDate <= minDate) {
                        initialBurnedMs += (nativeSpent / slices);
                    } else {
                        validEvents.push({ date: sliceDate, burned: nativeSpent / slices });
                    }
                }
            }
        });

        const extractBurndownLedgerEntries = (tasks) => {
            tasks.forEach(t => {
                const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
                if (!isDone) {
                    const entries = t.localLedger || [];
                    entries.forEach(entry => {
                        const eDate = parseDateMs(entry.date);
                        if (eDate <= minDate) {
                            initialBurnedMs += Number(entry.duration);
                        } else {
                            validEvents.push({ date: eDate, burned: Number(entry.duration) });
                        }
                    });
                }
                if (t.subtasks) extractBurndownLedgerEntries(t.subtasks);
            });
        };
        extractBurndownLedgerEntries(independentTasks);
        
        validEvents.sort((a,b) => a.date - b.date);

        let historicalBurnedMs = initialBurnedMs;
        const startY = totalEstimateMs > 0 ? (initialBurnedMs / totalEstimateMs) * 100 : 0;
        const burndownPointsData = [[0, Math.max(0, Math.min(100, startY))]];

        const oneDayMs = 86400000;
        const endChartDate = Math.min(now, maxDate);
        let currentDayMs = minDate + oneDayMs;

        while (currentDayMs <= endChartDate) {
            while (validEvents.length > 0 && validEvents[0].date <= currentDayMs) {
                historicalBurnedMs += validEvents.shift().burned;
            }
            const stepX = ((currentDayMs - minDate) / totalDurationMs) * 100;
            const stepY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;
            burndownPointsData.push([Math.max(0, Math.min(100, stepX)), Math.max(0, Math.min(100, stepY))]);
            currentDayMs += oneDayMs;
        }

        if (now > minDate && now < maxDate) {
            while (validEvents.length > 0 && validEvents[0].date <= now) {
                historicalBurnedMs += validEvents.shift().burned;
            }
            const finalX = ((now - minDate) / totalDurationMs) * 100;
            const finalY = totalEstimateMs > 0 ? (historicalBurnedMs / totalEstimateMs) * 100 : 0;
            
            if (burndownPointsData.length > 0 && (finalX - burndownPointsData[burndownPointsData.length - 1][0]) < 2) {
                burndownPointsData[burndownPointsData.length - 1][1] = Math.max(0, Math.min(100, finalY));
                burndownPointsData[burndownPointsData.length - 1][0] = Math.max(0, Math.min(100, finalX));
            } else {
                burndownPointsData.push([Math.max(0, Math.min(100, finalX)), Math.max(0, Math.min(100, finalY))]);
            }
        }

        const generateSmoothPath = (points) => {
            if (points.length === 0) return "";
            if (points.length === 1) return `M ${points[0][0]},${points[0][1]}`;
            if (points.length === 2) return `M ${points[0][0]},${points[0][1]} L ${points[1][0]},${points[1][1]}`;
            
            let d = `M ${points[0][0]},${points[0][1]}`;
            const tension = 0.25;
            
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[0];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i !== points.length - 2 ? points[i + 2] : p2;
                
                let cp1x = p1[0] + (p2[0] - p0[0]) * tension;
                let cp1y = p1[1] + (p2[1] - p0[1]) * tension;
                let cp2x = p2[0] - (p3[0] - p1[0]) * tension;
                let cp2y = p2[1] - (p3[1] - p1[1]) * tension;
                
                cp1x = Math.max(p1[0], Math.min(p2[0], cp1x));
                cp2x = Math.max(p1[0], Math.min(p2[0], cp2x));
                const minY = Math.min(p1[1], p2[1]);
                const maxY = Math.max(p1[1], p2[1]);
                cp1y = Math.max(minY, Math.min(maxY, cp1y));
                cp2y = Math.max(minY, Math.min(maxY, cp2y));
                
                d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0]},${p2[1]}`;
            }
            return d;
        };

        const smoothLinePath = generateSmoothPath(burndownPointsData);
        const latestX = burndownPointsData.length > 0 ? burndownPointsData[burndownPointsData.length-1][0] : currentX;
        const areaPath = smoothLinePath ? smoothLinePath + ` L ${latestX},100 L 0,100 Z` : "";
        // --- END MONOTONIC BURNDOWN LOGIC ---

        // --- NEW: DAILY SMOOTH BURNUP LOGIC (Logged Hours) ---
        let initialLoggedMs = 0;
        const logEvents = [];
        
        independentTasks.forEach(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            let est = t.time_estimate ? Number(t.time_estimate) : 0;
            let totalSpent = Number(t.time_spent) || 0;
            
            // Mirror the core math: if done with no logged time, assume estimate was fully spent
            if (isDone && totalSpent === 0) totalSpent = est;
            // Auto-scale estimate if exceeded
            if (totalSpent > est) est = totalSpent;

            const localAdded = Number(t._totalLocalAdded) || 0;
            const nativeSpent = Math.max(0, totalSpent - localAdded);
            
            if (isDone && nativeSpent > 0) {
                // If done, log the totality of the remaining native hours exactly on the completion date
                let dDate = parseDateMs(t.date_closed) || parseDateMs(t.date_updated) || parseDateMs(t.date_created) || minDate;
                if (dDate <= minDate) {
                    initialLoggedMs += nativeSpent;
                } else {
                    logEvents.push({ date: dDate, logged: nativeSpent });
                }
            } else if (!isDone && nativeSpent > 0) {
                // If active, distribute the time linearly across its open duration
                let cDate = parseDateMs(t.date_created) || minDate;
                let uDate = parseDateMs(t.date_updated) || now;
                if (cDate < minDate) cDate = minDate;
                if (uDate > now) uDate = now;
                if (uDate < cDate) uDate = cDate;
                
                const duration = Math.max(1, uDate - cDate);
                const slices = 10;
                for (let i = 1; i <= slices; i++) {
                    const sliceDate = cDate + (duration * (i/slices));
                    if (sliceDate <= minDate) {
                        initialLoggedMs += (nativeSpent / slices);
                    } else {
                        logEvents.push({ date: sliceDate, logged: nativeSpent / slices });
                    }
                }
            }
        });

        const extractLedgerEntries = (tasks) => {
            tasks.forEach(t => {
               const entries = t.localLedger || [];
               entries.forEach(entry => {
                   const eDate = parseDateMs(entry.date);
                   if (eDate <= minDate) {
                       initialLoggedMs += Number(entry.duration);
                   } else {
                       logEvents.push({ date: eDate, logged: Number(entry.duration) });
                   }
               });
               if (t.subtasks) extractLedgerEntries(t.subtasks);
            });
        };
        extractLedgerEntries(independentTasks);
        
        logEvents.sort((a,b) => a.date - b.date);

        // Max scaling to accommodate over-logging vs ideal limits
        const maxBurnupMs = Math.max(totalEstimateMs, devCapacityHours * 3600000, totalSpentMs, 3600000);
        const maxBurnupHours = Math.round(maxBurnupMs / 3600000);

        let cumulativeLoggedMs = initialLoggedMs;
        const startBurnupY = 100 - (initialLoggedMs / maxBurnupMs) * 100;
        const burnupPointsData = [[0, Math.max(0, Math.min(100, startBurnupY))]];

        let currentBurnupDayMs = minDate + oneDayMs;
        let logEventIdx = 0;

        while (currentBurnupDayMs <= endChartDate) {
            while (logEventIdx < logEvents.length && logEvents[logEventIdx].date <= currentBurnupDayMs) {
                cumulativeLoggedMs += logEvents[logEventIdx].logged;
                logEventIdx++;
            }
            const stepX = ((currentBurnupDayMs - minDate) / totalDurationMs) * 100;
            const stepY = 100 - (cumulativeLoggedMs / maxBurnupMs) * 100;
            burnupPointsData.push([Math.max(0, Math.min(100, stepX)), Math.max(0, Math.min(100, stepY))]);
            currentBurnupDayMs += oneDayMs;
        }

        if (now > minDate && now < maxDate) {
            while (logEventIdx < logEvents.length && logEvents[logEventIdx].date <= now) {
                cumulativeLoggedMs += logEvents[logEventIdx].logged;
                logEventIdx++;
            }
            const finalX = ((now - minDate) / totalDurationMs) * 100;
            const finalY = 100 - (cumulativeLoggedMs / maxBurnupMs) * 100;
            
            if (burnupPointsData.length > 0 && (finalX - burnupPointsData[burnupPointsData.length - 1][0]) < 2) {
                burnupPointsData[burnupPointsData.length - 1][1] = Math.max(0, Math.min(100, finalY));
                burnupPointsData[burnupPointsData.length - 1][0] = Math.max(0, Math.min(100, finalX));
            } else {
                burnupPointsData.push([Math.max(0, Math.min(100, finalX)), Math.max(0, Math.min(100, finalY))]);
            }
        }

        const smoothBurnupLinePath = generateSmoothPath(burnupPointsData);
        const latestBurnupX = burnupPointsData.length > 0 ? burnupPointsData[burnupPointsData.length-1][0] : currentX;
        const burnupAreaPath = smoothBurnupLinePath ? smoothBurnupLinePath + ` L ${latestBurnupX},100 L 0,100 Z` : "";
        
        const idealCapacityY = 100 - ((devCapacityHours * 3600000) / maxBurnupMs) * 100;
        const clampedIdealY = Math.max(0, Math.min(100, idealCapacityY));
        const idealCapacityPath = `M 0,${clampedIdealY} L 100,${clampedIdealY}`;
        
        const plottedY = 100 - (totalEstimateMs / maxBurnupMs) * 100;
        const clampedPlottedY = Math.max(0, Math.min(100, plottedY));
        const plottedPath = `M 0,${clampedPlottedY} L 100,${clampedPlottedY}`;
        // --- END DAILY SMOOTH BURNUP LOGIC ---


        const allMotherTasks = activeWorkflows.flatMap(wf => wf.tasks || []).filter(t => !(t.name || '').toLowerCase().includes('qa bugs'));
        let filteredMotherTasks = allMotherTasks.filter(checkGlobalFilter);
        const plottedScopeCount = filteredMotherTasks.length;
        
        // Ensure plotted scope dynamically grows with tracked hours
        const plottedScopeEstHours = Math.round(filteredMotherTasks.reduce((sum, t) => {
            const est = parseInt(t.time_estimate) || 0;
            const spent = parseInt(t.time_spent) || 0;
            return sum + Math.max(est, spent);
        }, 0) / 3600000);
        
        const completedMotherTasks = filteredMotherTasks.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase()));
        const completedMotherCount = completedMotherTasks.length;
        const completedMotherEstHours = Math.round(completedMotherTasks.reduce((sum, t) => sum + (parseInt(t.time_estimate) || 0), 0) / 3600000);

        const spillOverTasks = filteredMotherTasks.filter(t => {
            const isDone = doneStatuses.includes((t.status?.status || '').toLowerCase());
            if (isDone) return false;
            if (t.due_date && parseInt(t.due_date) < now) return true;
            if (t.tags?.some(tag => (tag.name || '').toLowerCase().includes('spill over'))) return true;
            return false;
        });
        const spillOverCount = spillOverTasks.length;
        const spillOverEstHours = Math.round(spillOverTasks.reduce((sum, t) => sum + (parseInt(t.time_estimate) || 0), 0) / 3600000);

        const devDemandHours = plottedScopeEstHours * 0.8;
        const qaDemandHours = plottedScopeEstHours * 0.2;

        const devUtilPct = devCapacityHours > 0 ? Math.round((devDemandHours / devCapacityHours) * 100) : 0;
        const qaUtilPct = qaCapacityHours > 0 ? Math.round((qaDemandHours / qaCapacityHours) * 100) : 0;
        const bucketUtilizationPct = devCapacityHours > 0 ? Math.round((plottedScopeEstHours / devCapacityHours) * 100) : 0;

        const totalBugsCount = allBugs.length;
        const resolvedBugsCount = allBugs.filter(t => doneStatuses.includes((t.status?.status || '').toLowerCase())).length;
        const activeBugsCount = totalBugsCount - resolvedBugsCount;
        const criticalBugsCount = allBugs.filter(t => ['high', 'urgent', 'critical'].includes((t.priority?.priority || '').toLowerCase())).length;
        const bugResolutionRate = totalBugsCount === 0 ? 0 : Math.round((resolvedBugsCount / totalBugsCount) * 100);

        let totalQualityScore = 0;
        let evaluatedMotherTasks = 0;
        filteredMotherTasks.forEach(motherTask => {
            evaluatedMotherTasks++;
            const taskBugs = extractBugs([motherTask]);
            if (taskBugs.length === 0) {
                totalQualityScore += 100;
            } else {
                let penalty = 0;
                taskBugs.forEach(bug => {
                    const priority = (bug.priority?.priority || 'normal').toLowerCase();
                    if (['critical', 'urgent'].includes(priority)) penalty += 20;
                    else if (priority === 'high') penalty += 15;
                    else if (priority === 'normal') penalty += 10;
                    else penalty += 5;
                });
                totalQualityScore += Math.max(0, 100 - penalty);
            }
        });
        const avgQualityRate = evaluatedMotherTasks > 0 ? Math.round(totalQualityScore / evaluatedMotherTasks) : 100;

        let fixVelocitySumMs = 0;
        let fixVelocityCount = 0;
        allBugs.forEach(b => {
          const statusName = (b.status?.status || 'open').toLowerCase();
          if (doneStatuses.includes(statusName)) {
            let completedDate = parseDateMs(b.date_closed);
            if (!completedDate && b.activity_logs && Array.isArray(b.activity_logs)) {
               const statusLogs = b.activity_logs.filter(log => log.field === 'status').sort((x, y) => parseDateMs(x.date) - parseDateMs(y.date));
               if (statusLogs.length > 0) {
                   const lastLog = statusLogs[statusLogs.length - 1];
                   const lastLogStatus = (lastLog.after?.status || lastLog.after || '').toString().toLowerCase();
                   if (doneStatuses.includes(lastLogStatus)) completedDate = parseDateMs(lastLog.date);
               }
            }
            if (!completedDate) completedDate = parseDateMs(b.date_updated) || minDate;
            const createdDate = parseDateMs(b.date_created) || minDate;
            if (createdDate > 0 && completedDate >= createdDate) {
              fixVelocitySumMs += (completedDate - createdDate);
              fixVelocityCount++;
            }
          }
        });
        
        let avgVelocityValue = "0";
        let avgVelocityUnit = "Hours";
        if (fixVelocityCount > 0) {
          const avgVelocityMs = fixVelocitySumMs / fixVelocityCount;
          if (avgVelocityMs < 3600000) {
            avgVelocityValue = `${Math.floor(avgVelocityMs / 60000)}`;
            avgVelocityUnit = "Mins"; 
          } else {
            avgVelocityValue = (avgVelocityMs / 3600000).toFixed(1);
            avgVelocityUnit = "Hours";
          }
        }

        let totalEstForAccuracyMs = 0;
        let totalActualForAccuracyMs = 0;
        const timeInStatusStats = {};
        const excludedStatusesForAccuracy = ['open', 'backlog', 'sprint backlog', 'todo', 'to do', 'closed', 'complete', 'done', 'resolved'];

        filteredTasks.forEach(t => {
            const statusName = (t.status?.status || 'open').toLowerCase();
            const isDone = doneStatuses.includes(statusName);
            
            const referenceNow = isDone ? parseDateMs(t.date_closed) || now : now;

            if (!isDone && !excludedStatusesForAccuracy.includes(statusName)) {
                const lastUpdated = t.date_updated ? parseDateMs(t.date_updated) : (t.date_created ? parseDateMs(t.date_created) : referenceNow);
                const timeInCurrent = Math.max(0, referenceNow - lastUpdated);
                if (timeInCurrent > 0) {
                    if (!timeInStatusStats[statusName]) timeInStatusStats[statusName] = { sum: 0, count: 0 };
                    timeInStatusStats[statusName].sum += timeInCurrent;
                    timeInStatusStats[statusName].count++;
                }
            }

            if (isDone) {
                let actualRunningMs = 0;
                let parsedTimeInStatus = {};

                if (t.activity_logs && Array.isArray(t.activity_logs) && t.activity_logs.length > 0) {
                    const statusLogs = t.activity_logs.filter(log => log.field === 'status').sort((a, b) => parseDateMs(a.date) - parseDateMs(b.date));
                    if (statusLogs.length > 0) {
                        let lastDate = parseDateMs(t.start_date) || parseDateMs(t.date_created) || parseDateMs(statusLogs[0]?.date) || 0;
                        let currentStatus = (statusLogs[0]?.before?.status || statusLogs[0]?.before || 'open').toString().toLowerCase();

                        statusLogs.forEach(log => {
                            const changeDate = parseDateMs(log.date);
                            if (lastDate > 0 && changeDate >= lastDate) {
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + (changeDate - lastDate);
                            }
                            currentStatus = (log.after?.status || log.after || currentStatus).toString().toLowerCase();
                            lastDate = changeDate;
                        });

                        if (t.date_closed && lastDate > 0) {
                            const closedDate = parseDateMs(t.date_closed);
                            if (closedDate >= lastDate) {
                                parsedTimeInStatus[currentStatus] = (parsedTimeInStatus[currentStatus] || 0) + (closedDate - lastDate);
                            }
                        }
                    }
                } 
                
                if (Object.keys(parsedTimeInStatus).length === 0 && t.time_in_status) {
                    if (Array.isArray(t.time_in_status)) {
                        t.time_in_status.forEach(item => {
                            const statusStr = (item.status?.status || item.status || 'open').toString().toLowerCase();
                            parsedTimeInStatus[statusStr] = (parsedTimeInStatus[statusStr] || 0) + parseDateMs(item.time || item.duration || item.total_time || 0);
                        });
                    } else if (typeof t.time_in_status === 'object') {
                        Object.entries(t.time_in_status).forEach(([statusStr, durationMs]) => {
                            parsedTimeInStatus[statusStr.toLowerCase()] = (parsedTimeInStatus[statusStr.toLowerCase()] || 0) + parseDateMs(durationMs);
                        });
                    }
                }

                if (Object.keys(parsedTimeInStatus).length > 0) {
                    Object.entries(parsedTimeInStatus).forEach(([statusStr, durationMs]) => {
                        const cleanStatus = statusStr.toLowerCase();
                        if (!excludedStatusesForAccuracy.includes(cleanStatus)) {
                            if (!timeInStatusStats[cleanStatus]) timeInStatusStats[cleanStatus] = { sum: 0, count: 0 };
                            timeInStatusStats[cleanStatus].sum += durationMs;
                            timeInStatusStats[cleanStatus].count++;
                            actualRunningMs += durationMs;
                        }
                    });
                } else {
                    const end_date = t.date_closed ? parseDateMs(t.date_closed) : (t.date_updated ? parseDateMs(t.date_updated) : minDate);
                    const start_date = t.start_date ? parseDateMs(t.start_date) : (t.date_created ? parseDateMs(t.date_created) : end_date);
                    actualRunningMs = Math.max(0, end_date - start_date);
                }

                const estimateMs = t.time_estimate ? parseDateMs(t.time_estimate) : 0;
                if (actualRunningMs > 0 && estimateMs > 0) {
                    totalEstForAccuracyMs += estimateMs;
                    totalActualForAccuracyMs += actualRunningMs;
                }
            }
        });

        let estimationAccuracyDisplay = "N/A";
        if (totalEstForAccuracyMs > 0) {
            const error = Math.abs(totalActualForAccuracyMs - totalEstForAccuracyMs) / totalEstForAccuracyMs;
            estimationAccuracyDisplay = `${Math.max(0, Math.round((1 - error) * 100))}%`;
        }

        const avgTimeInStatusList = Object.entries(timeInStatusStats).map(([status, data]) => {
            const avgMs = data.sum / data.count;
            const days = Math.floor(avgMs / 86400000);
            const hours = Math.floor((avgMs % 86400000) / 3600000);
            const mins = Math.floor((avgMs % 3600000) / 60000);
            let timeDisplay = days > 0 ? `${days}d ${hours}h` : (hours > 0 ? `${hours}h ${mins}m` : `${mins}m`);
            return { status, timeDisplay, avgMs };
        }).sort((a, b) => b.avgMs - a.avgMs);

        const stalledTasksCandidates = filteredTasks.filter(t => {
            const nameLower = (t.name || '').toLowerCase();
            const statusLower = (t.status?.status || '').toLowerCase();
            if (nameLower === 'ui bugs' || nameLower === 'qa bugs' || doneStatuses.includes(statusLower) || statusLower === 'sprint backlog') return false;
            const createdDate = parseInt(t.date_created);
            const estimateMs = parseInt(t.time_estimate);
            if (createdDate && estimateMs > 0 && (now - createdDate > estimateMs)) return true;
            return false;
        });

        const stalledTaskIds = new Set(stalledTasksCandidates.map(t => t.id));
        const hasStalledDescendant = (task) => task.subtasks?.some(sub => stalledTaskIds.has(sub.id) || hasStalledDescendant(sub)) || false;

        const stalledTasks = stalledTasksCandidates
          .filter(t => !hasStalledDescendant(t))
          .sort((a, b) => (now - (parseInt(b.date_created) || now)) - (now - (parseInt(a.date_created) || now)))
          .slice(0, 5);

        // Nested render function for the accordion structure inside Task Management Modal
        const renderMgmtTask = (task, depth = 0) => {
            const hasSubtasks = task.subtasks && task.subtasks.length > 0;
            const isExpanded = !!expandedMgmtTasks[task.id] || (taskSearchQuery.trim() !== '' && hasSubtasks);
            const themeColor = task.status?.color || '#94a3b8';
            return (
              <div key={task.id} className="mb-2">
                 <div className={`flex items-center justify-between p-3 bg-[#0f172a] rounded-xl border border-slate-800 hover:border-slate-700 transition-colors`} style={{ marginLeft: `${depth * 1.5}rem` }}>
                    <div className="flex items-center gap-3 overflow-hidden">
                       {hasSubtasks && (
                          <button onClick={() => setExpandedMgmtTasks(p => ({...p, [task.id]: !p[task.id]}))} className="p-1 text-slate-400 hover:text-white">
                             <ChevronRight className={`w-4 h-4 transition-transform ${isExpanded ? 'rotate-90' : ''}`} />
                          </button>
                       )}
                       {!hasSubtasks && <div className="w-6" />}
                       <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg" style={{backgroundColor: themeColor, boxShadow: `0 0 8px ${themeColor}`}} />
                       <span className="text-sm font-medium text-slate-200 truncate">{task.name}</span>
                    </div>
                    <div className="flex items-center gap-3 shrink-0 ml-4">
                       <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border hidden sm:block" style={{ color: themeColor, backgroundColor: `${themeColor}15`, borderColor: `${themeColor}30` }}>
                          {task.status?.status || 'Open'}
                       </span>
                       <div className="flex items-center gap-1">
                          <button onClick={() => setTimeTrackModalTask(task)} className="text-emerald-400 hover:text-emerald-300 p-1.5 bg-emerald-500/10 rounded-md border border-emerald-500/20 transition-colors" title="Track Time"><Clock className="w-3.5 h-3.5" /></button>
                       </div>
                    </div>
                 </div>
                 {isExpanded && hasSubtasks && (
                    <div className="mt-2 border-l border-slate-800 ml-3 pl-3 border-dashed">
                       {task.subtasks.map(sub => renderMgmtTask(sub, depth + 1))}
                    </div>
                 )}
              </div>
           );
        };

        const integrationUI = (
          <div className="animate-in fade-in duration-500 w-full">
            {integrationStep === 'idle' && mappedWorkflows.length === 0 && (
              <div className="bg-[#0b1120] rounded-xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col md:flex-row items-center justify-between p-8">
                <div className="mb-4 md:mb-0">
                  <h2 className="text-lg font-semibold text-white">Connect your ticketing system</h2>
                  <p className="text-slate-400 mt-1 max-w-xl">To start weaving, connect Weaver to ClickUp.</p>
                </div>
                <button onClick={() => { setIsSwitchModalOpen(true); handleConnectClickUp(); }} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-lg shrink-0">
                  <Settings className="h-4 w-4 mr-2 animate-spin-slow" /> Connect ClickUp
                </button>
              </div>
            )}
            {integrationStep === 'entering_token' && (
              <div className="bg-[#0b1120] rounded-xl border border-slate-800 shadow-2xl p-8">
                <h3 className="text-lg font-semibold text-white mb-4">Enter ClickUp API Token</h3>
                <input type="password" value={tempToken} onChange={(e) => setTempToken(e.target.value)} placeholder="pk_12345..." className="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-3 text-white mb-4" />
                {clickUpError && <div className="text-red-400 text-sm mb-4">{clickUpError} <button onClick={handleMockClickUpData} className="ml-2 underline">Use Mock Data</button></div>}
                <div className="flex justify-end gap-3"><button onClick={() => setIntegrationStep('idle')} className="text-slate-400">Cancel</button><button onClick={handleAuthenticateToken} className="px-5 py-2 bg-indigo-600 text-white rounded-lg">Authenticate</button></div>
              </div>
            )}
            {integrationStep === 'selecting' && (
              <div className="bg-[#0b1120] rounded-xl border border-slate-800 shadow-2xl p-6">
                <h3 className="text-lg font-semibold text-white mb-4">Map ClickUp Destination</h3>
                <select value={selectedTeam} onChange={(e) => setSelectedTeam(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2 text-white mb-4"><option value="">-- Choose Workspace --</option>{teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select>
                {selectedTeam && <select value={selectedSpace} onChange={(e) => setSelectedSpace(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2 text-white mb-4"><option value="">-- Choose Space --</option>{spaces.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select>}
                {selectedSpace && <select value={selectedFolder} onChange={(e) => setSelectedFolder(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2 text-white mb-4"><option value="">-- Choose Folder --</option>{folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}</select>}
                {selectedSpace && <select value={selectedList} onChange={(e) => setSelectedList(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2 text-white mb-4"><option value="">-- Choose List --</option>{availableLists.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select>}
                <div className="flex justify-end gap-3"><button onClick={() => setIntegrationStep('idle')} className="text-slate-400">Cancel</button><button disabled={!selectedList} onClick={handleAddMapping} className="px-4 py-2 bg-indigo-600 text-white rounded-lg">Connect to Weaver</button></div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-[#050810] font-sans text-slate-100 relative">
            
            {/* Nav */}
            <nav className="relative z-30 bg-[#0b1120] border-b border-slate-800 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16 items-center">
                  <div className="flex items-center"><SpiderNetworkIcon className="h-8 w-8 text-indigo-400" /><span className="ml-2 text-xl font-bold text-white">Weaver</span></div>
                  <div className="flex items-center space-x-4"><button onClick={handleLogout} className="text-sm font-medium text-slate-400 hover:text-white flex items-center"><LogOut className="h-4 w-4 mr-1"/> Sign out</button></div>
                </div>
              </div>
            </nav>

            {/* Capacity Settings Blocker Modal */}
            {isBlockerModalOpen && (
              <div className="fixed inset-0 bg-[#050810]/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-[#0b1120] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                   <div className="flex items-center justify-between p-5 border-b border-slate-800 bg-[#0f172a]/50">
                     <h2 className="text-lg font-bold text-white flex items-center gap-2"><Calendar className="w-5 h-5 text-indigo-400" /> Sprint Capacity Settings</h2>
                     <button onClick={() => setIsBlockerModalOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><XIcon className="w-5 h-5" /></button>
                   </div>
                   <div className="p-5 space-y-6">
                     <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Daily Working Hours</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Developers</label><input type="number" min="1" max="24" value={devHoursPerDay} onChange={e => { const val = Number(e.target.value); setDevHoursPerDay(val); saveSettings({ devHoursPerDay: val }); }} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" /></div>
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">QA Resources</label><input type="number" min="1" max="24" value={qaHoursPerDay} onChange={e => { const val = Number(e.target.value); setQaHoursPerDay(val); saveSettings({ qaHoursPerDay: val }); }} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" /></div>
                        </div>
                     </div>
                     <div className="space-y-3">
                       <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">Active Blockers<span className="text-indigo-400">{dateBlockers.length} Items</span></h3>
                       {dateBlockers.length === 0 ? (
                         <div className="text-sm text-slate-400 italic p-4 bg-[#0f172a] rounded-xl text-center border border-slate-800">No blockers added.</div>
                       ) : (
                         <ul className="space-y-2 max-h-40 overflow-y-auto pr-1">
                           {dateBlockers.map(b => (
                             <li key={b.id} className="flex items-center justify-between bg-[#0f172a] p-3 rounded-xl border border-slate-800">
                                <div className="flex flex-col"><span className="text-sm font-semibold text-slate-200">{b.remark} <span className="text-slate-400 font-normal">({b.days} day{b.days > 1 ? 's' : ''})</span></span>{b.remark === 'Leave' && <span className="text-xs text-indigo-400 font-medium mt-0.5">{b.assignee}</span>}</div>
                                <button onClick={() => { const newBlockers = dateBlockers.filter(x => x.id !== b.id); setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); }} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors"><Trash2 className="w-4 h-4" /></button>
                             </li>
                           ))}
                         </ul>
                       )}
                     </div>
                     <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800 space-y-4">
                        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Add New Blocker</h3>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">No. of Days</label><input type="number" min="1" value={newBlockerDays} onChange={e => setNewBlockerDays(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" /></div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Remarks</label>
                            <select value={newBlockerRemark} onChange={e => setNewBlockerRemark(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none cursor-pointer">
                              <option value="Holiday">Holiday</option><option value="Company Event">Company Event</option><option value="Leave">Leave</option>
                            </select>
                          </div>
                        </div>
                        {newBlockerRemark === 'Leave' && (
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Team Member</label>
                            <select value={newBlockerAssignee || (assigneesList[0]?.username || '')} onChange={e => setNewBlockerAssignee(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none cursor-pointer">
                              {assigneesList.map(a => <option key={a.username} value={a.username}>{a.username}</option>)}
                            </select>
                          </div>
                        )}
                        <button onClick={() => { if (!newBlockerDays || newBlockerDays <= 0) return; const newBlocker = { id: Date.now().toString(), days: parseInt(newBlockerDays), remark: newBlockerRemark, assignee: newBlockerRemark === 'Leave' ? (newBlockerAssignee || assigneesList[0]?.username) : null }; const newBlockers = [...dateBlockers, newBlocker]; setDateBlockers(newBlockers); saveSettings({ dateBlockers: newBlockers }); setNewBlockerDays(1); }} className="w-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors">
                          <Plus className="w-4 h-4 mr-1.5" /> Add Date Blocker
                        </button>
                     </div>
                   </div>
                </div>
              </div>
            )}

            {/* Task Management Modal */}
            {isTaskMgmtModalOpen && (
              <div className="fixed inset-0 bg-[#050810]/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-[#0b1120] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                   <div className="flex items-center justify-between p-5 border-b border-slate-800 bg-[#0f172a]/50">
                     <h2 className="text-lg font-bold text-white flex items-center gap-2"><ListTodo className="w-5 h-5 text-indigo-400" /> Task Management</h2>
                     <button onClick={() => { setIsTaskMgmtModalOpen(false); setTaskSearchQuery(''); }} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><XIcon className="w-5 h-5" /></button>
                   </div>
                   <div className="p-5 overflow-y-auto flex-1 space-y-4">
                     <div className="flex flex-col sm:flex-row justify-between sm:items-center mb-4 border-b border-slate-800 pb-3 gap-3">
                        <h3 className="text-sm font-semibold text-slate-300">Workspace Tasks</h3>
                        <div className="flex items-center gap-3 w-full sm:w-auto">
                           <div className="relative w-full sm:w-64">
                             <SearchIcon className="absolute left-2.5 top-2.5 h-4 w-4 text-slate-500" />
                             <input 
                               type="text" 
                               placeholder="Search tasks..." 
                               value={taskSearchQuery}
                               onChange={(e) => setTaskSearchQuery(e.target.value)}
                               className="w-full bg-[#0b1120] border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-sm text-white outline-none focus:border-indigo-500 transition-colors"
                             />
                           </div>
                           <label className="flex items-center space-x-2 text-sm text-indigo-300 hover:text-indigo-200 cursor-pointer bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 transition-colors font-medium shrink-0">
                             <input 
                               type="checkbox" 
                               checked={showMyTasksOnly} 
                               onChange={(e) => setShowMyTasksOnly(e.target.checked)} 
                               className="rounded border-indigo-500/30 bg-slate-900 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer" 
                             />
                             <span>My Tasks Only</span>
                           </label>
                        </div>
                     </div>
                     <div className="space-y-2">
                        {mappedWorkflows.map(wf => {
                           let rootTasks = wf.tasks || [];
                           
                           const filterNode = (node) => {
                               const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                               const isAssigned = !showMyTasksOnly || (user?.name && node.assignees?.some(a => a.username === user.name));
                               
                               const validSubtasks = (node.subtasks || []).map(filterNode).filter(Boolean);
                               if ((matchesSearch && isAssigned) || validSubtasks.length > 0) {
                                   return { ...node, subtasks: validSubtasks };
                               }
                               return null;
                           };
                           
                           rootTasks = rootTasks.map(filterNode).filter(Boolean);

                           if (rootTasks.length === 0) return null;
                           return rootTasks.map(t => renderMgmtTask(t, 0));
                        })}
                        {mappedWorkflows.every(wf => {
                           const filterNode = (node) => {
                               const matchesSearch = taskSearchQuery.trim() === '' || (node.name || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
                               const isAssigned = !showMyTasksOnly || (user?.name && node.assignees?.some(a => a.username === user.name));
                               const validSubtasks = (node.subtasks || []).map(filterNode).filter(Boolean);
                               if ((matchesSearch && isAssigned) || validSubtasks.length > 0) { return { ...node, subtasks: validSubtasks }; }
                               return null;
                           };
                           return (wf.tasks || []).map(filterNode).filter(Boolean).length === 0;
                        }) && (
                          <div className="text-center text-sm text-slate-500 italic p-6 bg-[#0f172a] rounded-xl border border-slate-800">
                            {taskSearchQuery.trim() !== '' ? "No tasks match your search." : (showMyTasksOnly ? "No tasks assigned to you right now." : "No tasks mapped yet.")}
                          </div>
                        )}
                     </div>
                   </div>
                </div>
              </div>
            )}

            {/* Time Track Modal */}
            {timeTrackModalTask && (
              <div className="fixed inset-0 bg-[#050810]/80 backdrop-blur-sm z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
                 <div className="bg-[#0b1120] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-lg flex flex-col overflow-hidden">
                    <div className="flex items-center justify-between p-5 border-b border-slate-800 bg-[#0f172a]/50">
                      <h2 className="text-lg font-bold text-white flex items-center gap-2"><Clock className="w-5 h-5 text-emerald-400" /> Track Time Ledger</h2>
                      <button onClick={() => setTimeTrackModalTask(null)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><XIcon className="w-5 h-5" /></button>
                    </div>
                    
                    <div className="p-5 space-y-6 overflow-y-auto max-h-[70vh]">
                       <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                         <p className="text-xs text-slate-500 uppercase font-semibold mb-1">Logging time for</p>
                         <p className="text-sm text-slate-200 font-medium truncate">{timeTrackModalTask.name}</p>
                       </div>
                       
                       <div className="space-y-4 border border-slate-800 p-4 rounded-xl">
                          <h3 className="text-sm font-semibold text-white">Add New Entry</h3>
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-[10px] text-slate-400 uppercase font-semibold mb-1.5">Hours</label>
                              <input type="number" min="0" value={timeHours} onChange={e=>setTimeHours(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                            </div>
                            <div>
                              <label className="block text-[10px] text-slate-400 uppercase font-semibold mb-1.5">Minutes</label>
                              <input type="number" min="0" max="59" value={timeMinutes} onChange={e=>setTimeMinutes(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                            </div>
                          </div>
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-[10px] text-slate-400 uppercase font-semibold mb-1.5">Date</label>
                              <input type="date" value={timeDate} onChange={e=>setTimeDate(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                            </div>
                            <div>
                              <label className="block text-[10px] text-slate-400 uppercase font-semibold mb-1.5">Assignee</label>
                              <select value={timeAssignee} onChange={e=>setTimeAssignee(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                                 {workspaceUsers.map(u => <option key={u} value={u}>{u}</option>)}
                              </select>
                            </div>
                          </div>
                          <div>
                            <label className="block text-[10px] text-slate-400 uppercase font-semibold mb-1.5">Note / Description</label>
                            <input type="text" value={timeEntryNote} onChange={e=>setTimeEntryNote(e.target.value)} className="w-full bg-[#0b1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none" placeholder="What did you work on?" />
                          </div>
                          <button onClick={handleAddTimeEntry} className="w-full flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors mt-2">
                            <Plus className="w-4 h-4 mr-1.5"/> Add Entry
                          </button>
                       </div>
                       
                       <div className="space-y-3">
                          <h3 className="text-sm font-semibold text-white border-b border-slate-800 pb-2">Time Ledger</h3>
                          {(!localTimeLedger[timeTrackModalTask.id] || localTimeLedger[timeTrackModalTask.id].length === 0) ? (
                             <div className="text-xs text-slate-500 italic p-4 bg-[#0b1120] rounded-lg border border-slate-800 text-center">No local time entries logged yet.</div>
                          ) : (
                             <ul className="space-y-2">
                               {localTimeLedger[timeTrackModalTask.id].map(entry => {
                                  const hrs = Math.floor(entry.duration / 3600000);
                                  const mins = Math.floor((entry.duration % 3600000) / 60000);
                                  const dateStr = new Date(entry.date).toLocaleDateString();
                                  return (
                                    <li key={entry.id} className="flex flex-col p-3 bg-[#0b1120] rounded-xl border border-slate-800">
                                       <div className="flex justify-between items-start mb-1">
                                          <div>
                                             <div className="text-sm font-bold text-slate-200">{hrs}h {mins}m</div>
                                             <div className="text-xs text-slate-500 mt-0.5">{dateStr} • <span className="text-indigo-400 font-medium">{entry.assignee}</span></div>
                                          </div>
                                          <button onClick={() => handleDeleteTimeEntry(timeTrackModalTask.id, entry.id)} className="text-slate-500 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10 transition-colors">
                                             <Trash2 className="w-4 h-4" />
                                          </button>
                                       </div>
                                       <div className="text-xs text-slate-300 italic">"{entry.note}"</div>
                                    </li>
                                  )
                               })}
                             </ul>
                          )}
                       </div>
                    </div>
                 </div>
              </div>
            )}

            {/* Floating Modal for 'Change Connection' */}
            {isSwitchModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#050810]/80 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-[#0b1120] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden relative animate-in zoom-in-95">
                        <button onClick={() => { setIsSwitchModalOpen(false); setIntegrationStep('idle'); }} className="absolute top-5 right-5 text-slate-400 hover:text-white transition-colors z-10"><XIcon className="h-5 w-5"/></button>
                        <div className="p-8">
                            <h2 className="text-2xl font-bold text-white mb-6">Connect New Workflow</h2>
                            {integrationUI}
                        </div>
                    </div>
                </div>
            )}

            {mappedWorkflows.length === 0 ? (
               <main className="relative z-25 max-w-3xl mx-auto px-4 py-16">{integrationUI}</main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 py-8">
                
                {/* Header */}
                <div className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-6">
                  <div>
                    <h1 className="text-2xl font-bold text-white flex items-center gap-3">
                      {mappedWorkflows[0]?.list || 'Your Workspace'}
                      <div className="flex items-center px-3 py-1 rounded-full border bg-emerald-900/30 border-emerald-500/30 text-emerald-400 text-xs font-medium">
                        <div className="h-2 w-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></div> Synced: {new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(mappedWorkflows[0].lastSynced))}
                      </div>
                    </h1>
                    <p className="text-slate-400 text-sm mt-1">Dashboard metrics are dynamically synced and globally filtered.</p>
                  </div>
                  <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <button 
                      onClick={() => { setIsSwitchModalOpen(true); handleConnectClickUp(); }}
                      className="flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-medium rounded-lg shadow-lg shrink-0 transition-colors"
                    >
                      <RefreshCw className="h-4 w-4 mr-2" /> Change Connection
                    </button>
                    <button 
                      onClick={() => setIsTaskMgmtModalOpen(true)}
                      className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-lg shrink-0 transition-colors"
                    >
                      <ListTodo className="h-4 w-4 mr-2" /> Manage Tasks
                    </button>
                    <div className="flex items-center bg-[#0b1120] p-1.5 rounded-lg border border-slate-800">
                      <span className="text-sm text-slate-400 font-medium px-2 shrink-0">Global Filter:</span>
                      <select 
                        value={completionFilterType} 
                        onChange={(e) => {
                          setCompletionFilterType(e.target.value);
                          if (e.target.value === 'tags' && uniqueTags.length > 0) setSelectedTagFilter(uniqueTags[0]);
                          if (e.target.value === 'assignees' && uniqueAssignees.length > 0) setSelectedAssigneeFilter(uniqueAssignees[0]);
                        }} 
                        className={`bg-[#0f172a] border border-slate-700 rounded-md px-3 py-1.5 text-sm text-white outline-none ${completionFilterType !== 'none' ? 'mr-2' : ''}`}
                      >
                        <option value="none">All Data</option><option value="tags">By Tag</option><option value="assignees">By Assignee</option>
                      </select>
                      {completionFilterType === 'tags' && (
                        <select value={selectedTagFilter} onChange={(e) => setSelectedTagFilter(e.target.value)} className="bg-indigo-950/30 border border-indigo-500/30 rounded-md px-3 py-1.5 text-sm text-indigo-100 outline-none max-w-[150px]">
                          {uniqueTags.length === 0 && <option value="">No tags</option>}
                          {uniqueTags.map(tag => <option key={tag} value={tag}>{tag}</option>)}
                        </select>
                      )}
                      {completionFilterType === 'assignees' && (
                        <select value={selectedAssigneeFilter} onChange={(e) => setSelectedAssigneeFilter(e.target.value)} className="bg-indigo-950/30 border border-indigo-500/30 rounded-md px-3 py-1.5 text-sm text-indigo-100 outline-none max-w-[150px]">
                          {uniqueAssignees.length === 0 && <option value="">No assignees</option>}
                          {uniqueAssignees.map(a => <option key={a} value={a}>{a}</option>)}
                        </select>
                      )}
                    </div>
                  </div>
                </div>

                {/* 1. Overall Progress & Distribution Section */}
                <div className="mb-8">
                  <div className="flex items-center space-x-2 mb-4">
                    <Target className="h-5 w-5 text-indigo-400" />
                    <h2 className="text-lg font-semibold text-white">Overall Progress & Distribution</h2>
                  </div>
                  
                  <div className="bg-[#0b1120] rounded-2xl border border-slate-800 shadow-lg overflow-hidden">
                    <div className="flex flex-col lg:flex-row">
                      
                      {/* Left Pane - Task Distribution */}
                      <div className="lg:w-1/2 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-slate-800 p-6 md:p-8">
                        <div className="flex items-center flex-wrap space-x-2 mb-4">
                          <Target className="h-5 w-5 text-indigo-400 shrink-0" />
                          <h2 className="text-lg font-semibold text-white flex items-center flex-wrap gap-2">
                            Overall Progress
                            <MetricTooltip align="left" text="Visual classification of your entire scope into Backlog, Active, and Resolved." formula="Segments represent the proportion of task counts in each status category.">
                              <InfoIcon className="h-4 w-4 text-slate-500 hover:text-indigo-400 transition-colors" />
                            </MetricTooltip>
                          </h2>
                        </div>
                        
                        <div className="flex flex-col gap-4 mb-4">
                          <div className="flex flex-col">
                            <span className="text-5xl font-extrabold text-white leading-none">{Math.round(resolvedDistPct)}%</span>
                          </div>
                          <div className="flex flex-col space-y-1.5 w-full">
                            <div className="flex items-center justify-between text-xs text-slate-400 bg-[#0f172a] px-2.5 py-1 rounded-md border border-slate-800" title="Completed vs Total Items">
                              <div className="flex items-center"><CheckCircle2 className="h-3.5 w-3.5 mr-1.5 text-emerald-400 shrink-0" /> <span className="text-white font-medium mr-1">{completedBreakdown.total}</span> / {totalDistTasks} Items</div>
                            </div>
                            <div className="flex items-center justify-between text-[11px] text-slate-400 bg-[#0f172a] px-2.5 py-1 rounded-md border border-slate-800 whitespace-nowrap" title="Logged vs Estimated Hours">
                              <div className="flex items-center"><Clock className="h-3.5 w-3.5 mr-1.5 text-indigo-400 shrink-0" /> <span className="text-white font-medium mr-1">{formatDuration(totalSpentMs)}</span> / {formatDuration(totalEstimateMs)} Logged</div>
                            </div>
                          </div>
                        </div>
                        
                        <div className="w-full bg-[#0f172a] border border-slate-800 rounded-full h-3 flex overflow-hidden">
                          <div className="bg-emerald-500 h-full transition-all duration-1000 ease-out border-r border-[#0f172a]" style={{ width: `${resolvedDistPct}%` }} title={`Resolved: ${completedBreakdown.total}`}></div>
                          <div className="bg-indigo-500 h-full transition-all duration-1000 ease-out border-r border-[#0f172a]" style={{ width: `${activeDistPct}%` }} title={`Active: ${activeBreakdown.total}`}></div>
                          <div className="bg-blue-500 h-full transition-all duration-1000 ease-out" style={{ width: `${backlogDistPct}%` }} title={`Backlog: ${backlogBreakdown.total}`}></div>
                        </div>
                        
                        <div className="flex items-center justify-between mt-3 text-[10px] font-bold uppercase tracking-wider px-1">
                          <div className="flex items-center text-emerald-400"><div className="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></div>Resolved</div>

                            </div>
                          </div>
                        </div>
                        
                        <div className="bg-[#0f172a] p-4 rounded-xl border border-slate-800 flex items-center justify-between shadow-sm">
                          <div className="flex items-start space-x-4">
                            <div className="bg-emerald-500/10 p-2.5 rounded-lg border border-emerald-500/20"><CheckCircle2 className="h-5 w-5 text-emerald-400" /></div>
                            <div>
                              <p className="text-sm font-medium text-slate-400 flex items-center gap-1">Total Resolved <MetricTooltip text="Completed tasks"><InfoIcon className="h-3 w-3 text-slate-500 hover:text-indigo-400" /></MetricTooltip></p>

                          </div>
                          <div className="flex flex-col gap-1.5">

                              <span className="text-xs font-bold text-white">{completedBreakdown.subs}</span>

                          <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

                              stroke="#6366f1" 
                              strokeWidth="3"

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">

                    </div>
                  </div>

                      <div>
                        <div className="flex items-center flex-wrap space-x-2 mb-1">
                          <TrendingUp className="h-5 w-5 text-emerald-400 shrink-0" />

                            Effort Burnup (Logged Hours)
