    // HTML5 Canvas Web Nest background with spinning/weaving spiders & nodes
    const WebNestBackground = ({ opacity }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initializeWebs();
        };
        window.addEventListener('resize', handleResize);

        let webs = [];
        let spiders = [];
        let packets = [];

        const initializeWebs = () => {
          webs = [];
          spiders = [];
          packets = [];

          const webConfigs = [
            { cx: width * 0.28, cy: height * 0.5, radius: Math.min(width, height) * 0.42, spokes: 8, rings: 5, color: '99, 102, 241' },
            { cx: width * 0.72, cy: height * 0.42, radius: Math.min(width, height) * 0.32, spokes: 6, rings: 4, color: '59, 130, 246' }
          ];

          webConfigs.forEach((config, webIdx) => {
            const { cx, cy, radius, spokes, rings, color } = config;
            const nodes = [];
            const edges = [];

            nodes.push({ id: 0, x: cx, y: cy, spoke: -1, ring: 0, isHub: true });

            for (let r = 1; r <= rings; r++) {
              const currentRadius = (r / rings) * radius;
              for (let s = 0; s < spokes; s++) {
                const angle = (s / spokes) * Math.PI * 2;
                const x = cx + Math.cos(angle) * currentRadius;
                const y = cy + Math.sin(angle) * currentRadius;
                nodes.push({
                  id: nodes.length,
                  x,
                  y,
                  spoke: s,
                  ring: r,
                  isHub: false
                });
              }
            }

            nodes.forEach(node => {
              if (node.isHub) {
                for (let s = 0; s < spokes; s++) {
                  const targetNode = nodes.find(n => n.ring === 1 && n.spoke === s);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 1.0 });
                }
              } else {
                if (node.ring < rings) {
                  const targetNode = nodes.find(n => n.ring === node.ring + 1 && n.spoke === node.spoke);
                  if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.8 });
                }
                const nextSpoke = (node.spoke + 1) % spokes;
                const targetNode = nodes.find(n => n.ring === node.ring && n.spoke === nextSpoke);
                if (targetNode) edges.push({ from: node, to: targetNode, strength: 0.6 });
              }
            });

            webs.push({ nodes, edges, cx, cy, color });

            spiders.push({
              webIdx,
              currentNode: nodes[Math.floor(Math.random() * nodes.length)],
              targetNode: null,
              progress: 0,
              speed: 0.006 + Math.random() * 0.004,
              x: cx,
              y: cy,
              size: 7 + webIdx * 3,
              legCycle: 0,
              wovenPaths: []
            });
          });
        };

        initializeWebs();

        const spawnPacket = () => {
          if (webs.length === 0) return;
          const webIdx = Math.floor(Math.random() * webs.length);
          const web = webs[webIdx];
          if (web.edges.length === 0) return;
          
          const edge = web.edges[Math.floor(Math.random() * web.edges.length)];
          packets.push({
            webIdx,
            from: edge.from,
            to: edge.to,
            progress: 0,
            speed: 0.015 + Math.random() * 0.02,
            size: 1.5 + Math.random() * 1.5
          });
        };

        const animate = () => {
          ctx.clearRect(0, 0, width, height);

          webs.forEach(web => {
            const { nodes, edges, color } = web;
            edges.forEach(edge => {
              ctx.beginPath();
              ctx.moveTo(edge.from.x, edge.from.y);
              ctx.lineTo(edge.to.x, edge.to.y);
              ctx.strokeStyle = `rgba(${color}, ${0.12 * edge.strength})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            });

            nodes.forEach(node => {
              const pulse = Math.sin(Date.now() * 0.002 + node.id) * 2;
              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 3.5 : 2) + pulse * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, 0.25)`;
              ctx.fill();

              ctx.beginPath();
              ctx.arc(node.x, node.y, (node.isHub ? 7 : 4) + pulse, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, 0.05)`;
              ctx.fill();
            });
          });

          if (Math.random() < 0.2 && packets.length < 50) {
            spawnPacket();
          }

          packets.forEach((packet, idx) => {
            packet.progress += packet.speed;
            if (packet.progress >= 1) {
              packets.splice(idx, 1);
              return;
            }

            const x = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
            const y = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
            const color = webs[packet.webIdx].color;

            ctx.beginPath();
            ctx.arc(x, y, packet.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color}, 0.6)`;
            ctx.shadowColor = `rgb(${color})`;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          spiders.forEach(spider => {
            const web = webs[spider.webIdx];

            if (!spider.targetNode) {
              const neighbors = web.edges
                .filter(e => e.from.id === spider.currentNode.id || e.to.id === spider.currentNode.id)
                .map(e => e.from.id === spider.currentNode.id ? e.to : e.from);

              if (neighbors.length > 0) {
                spider.targetNode = neighbors[Math.floor(Math.random() * neighbors.length)];
                spider.progress = 0;
              }
            }

            if (spider.targetNode) {
              spider.progress += spider.speed;
              spider.legCycle += spider.speed * 16;

              spider.x = spider.currentNode.x + (spider.targetNode.x - spider.currentNode.x) * spider.progress;
              spider.y = spider.currentNode.y + (spider.targetNode.y - spider.currentNode.y) * spider.progress;

              if (spider.progress >= 1) {
                spider.wovenPaths.push({
                  from: spider.currentNode,
                  to: spider.targetNode,
                  alpha: 1.0,
                  time: Date.now()
                });

                if (spider.wovenPaths.length > 12) {
                  spider.wovenPaths.shift();
                }

                spider.currentNode = spider.targetNode;
                spider.targetNode = null;
              }
            }

            spider.wovenPaths.forEach((path, pathIdx) => {
              const age = Date.now() - path.time;
              path.alpha = Math.max(0, 1.0 - age / 7000);

              if (path.alpha > 0) {
                ctx.beginPath();
                ctx.moveTo(path.from.x, path.from.y);
                ctx.lineTo(path.to.x, path.to.y);
                ctx.strokeStyle = `rgba(${web.color}, ${path.alpha * 0.35})`;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = `rgb(${web.color})`;
                ctx.shadowBlur = 8 * path.alpha;
                ctx.stroke();
                ctx.shadowBlur = 0;
              } else {
                spider.wovenPaths.splice(pathIdx, 1);
              }
            });

            let angle = 0;
            if (spider.targetNode) {
              angle = Math.atan2(spider.targetNode.y - spider.currentNode.y, spider.targetNode.x - spider.currentNode.x);
            }

            ctx.save();
            ctx.translate(spider.x, spider.y);
            ctx.rotate(angle);

            const spiderColor = `rgb(${web.color})`;
            const legCount = 8;
            for (let i = 0; i < legCount; i++) {
              const side = i < 4 ? -1 : 1;
              const legIdx = i % 4;
              const offset = legIdx * 0.6;
              const cycle = Math.sin(spider.legCycle + offset) * 0.3;

              let angleOffset = 0;
              let legLength = spider.size * 1.7;

              switch (legIdx) {
                case 0: angleOffset = -Math.PI / 3; break;
                case 1: angleOffset = -Math.PI / 8; break;
                case 2: angleOffset = Math.PI / 8; break;
                case 3: angleOffset = Math.PI / 3; break;
              }

              const targetAngle = (angleOffset + cycle) * side;
              const kx1 = Math.cos(targetAngle) * (legLength * 0.5);
              const ky1 = Math.sin(targetAngle) * (legLength * 0.5) * side;

              const kx2 = Math.cos(targetAngle - 0.2 * side) * legLength;
              const ky2 = Math.sin(targetAngle - 0.2 * side) * legLength * side;

              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(kx1, ky1, kx2, ky2);
              ctx.strokeStyle = `rgba(${web.color}, 0.55)`;
              ctx.lineWidth = 1.2;
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(kx2, ky2, 1, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${web.color}, 0.8)`;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.moveTo(-spider.size, 0);
            ctx.lineTo(-spider.size * 2, 0);
            ctx.strokeStyle = `rgba(${web.color}, 0.35)`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(-spider.size * 0.4, 0, spider.size * 0.6, spider.size * 0.45, 0, 0, Math.PI * 2);
            ctx.fillStyle = spiderColor;
            ctx.shadowColor = spiderColor;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(spider.size * 0.35, 0, spider.size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${web.color})`;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(spider.size * 0.55, -spider.size * 0.1, 0.8, 0, Math.PI * 2);
            ctx.arc(spider.size * 0.55, spider.size * 0.1, 0.8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 3;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block z-0 transition-opacity duration-1000" style={{ opacity }} />;
    };

      const fetchClickUp = async (endpoint, token) => {
        const targetUrl = `https://api.clickup.com/api/v2/${endpoint}`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://thingproxy.freeboard.io/fetch/${targetUrl}`
        ];

        for (const proxyUrl of proxies) {
          try {
            const res = await fetch(proxyUrl, {
              headers: { 
                'Authorization': token,
                'Content-Type': 'application/json' 
              }
            });
            if (!res.ok) {
              throw new Error('Invalid Token or unauthorized request. Please verify your token.');
            }
            return await res.json();
          } catch (err) {
            if (err.message === 'Failed to fetch' || err.name === 'TypeError') {
              console.warn(`Proxy failed, trying next backup... (${proxyUrl})`);
              continue;
            }
            throw err;
          }
        }
        throw new Error('Connection blocked. Browsers prevent direct API calls (CORS), and public proxies are being blocked by your network. Please use the Mock Data bypass below to preview the UI.');
      };

            const data = await fetchClickUp(`team/${selectedTeam}/space`, clickUpToken);

            setClickUpError(err.message);

            initialTasks = data.tasks || [];

          }

          id: Date.now().toString(),
          team: teamName,
          space: spaceName,
          folder: folderName,
          list: listName,
          listId: selectedList,
          tasks: initialTasks,
          lastSynced: Date.now()

        setSelectedTeam('');
        setSelectedSpace('');
        setSelectedFolder('');
        setSelectedList('');

      const removeMapping = (id) => {

      // Simulated Auto-Sync Engine
      useEffect(() => {

        const syncInterval = setInterval(async () => {
          setIsAutoSyncing(true);
          const currentWorkflows = mappedWorkflowsRef.current;
          
          const updatedWorkflows = await Promise.all(currentWorkflows.map(async (workflow) => {
            let updatedTasks = workflow.tasks;
            
            if (clickUpToken === 'mock_token') {
              updatedTasks = MOCK_CLICKUP_DATA.tasks[workflow.listId] || [];
            } else {
              try {
                const data = await fetchClickUp(`list/${workflow.listId}/task?subtasks=false`, clickUpToken);
                updatedTasks = data.tasks || [];
              } catch (err) {
                console.error(`Error syncing tasks for list ${workflow.listId}`, err);
              }
            }
            
            return {
              ...workflow,
              tasks: updatedTasks,
              lastSynced: Date.now()
            };
          }));

          setMappedWorkflows(updatedWorkflows);
          setIsAutoSyncing(false);
        }, 15000);

        return () => clearInterval(syncInterval);

        const unsubscribe = auth.onAuthStateChanged((currentUser) => {

        return () => unsubscribe();

          name: 'Preview User',

        setIsLoggingIn(true);

          await auth.signInWithPopup(googleProvider);

                        onChange={(e) => setSelectedList(e.target.value)}
                        className="w-full bg-slate-950/60 border border-slate-700/60 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                      >
                        <option value="" className="bg-slate-900 text-slate-300">-- Choose a List --</option>
                        {availableLists.map(list => (
                          <option key={list.id} value={list.id} className="bg-slate-900 text-white">{list.name}</option>
                        ))}
                      </select>
                      {availableLists.length === 0 && (
                         <p className="text-xs text-amber-500 mt-2">No lists found in this location.</p>
                      )}
                    </div>
                  )}

                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-white/5">
                    <button 
                      onClick={() => {
                        setIntegrationStep('idle');
                        setSelectedTeam('');
                        setSelectedSpace('');
                        setSelectedFolder('');
                        setSelectedList('');
                      }}
                      className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors focus:outline-none rounded-lg"
                    >
                      Cancel
                    </button>
                    <button 
                      disabled={!selectedList}
                      onClick={handleAddMapping}
                      className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                    >
                      <CheckCircle2 className="h-4 w-4 mr-2" />
                      Add to Weaver
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );

        return (
          <div className="min-h-screen bg-slate-950 font-sans text-slate-100 relative">
            <WebNestBackground opacity={0.35} />

            {user.isMock && (
              <div className="relative z-30 bg-amber-950/30 border-b border-amber-900/50 px-4 py-3 text-amber-300 text-sm flex justify-center items-center text-center backdrop-blur-md">
                <span className="font-semibold mr-2">Preview Mode:</span> 
                You are logged in with a mock account because this preview domain is not authorized in your Firebase console.
              </div>
            )}

            <nav className="relative z-30 bg-slate-950/50 backdrop-blur-md border-b border-white/10 sticky top-0">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between h-16">
                  <div className="flex items-center">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400" />
                    <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
                  </div>
                  <div className="flex items-center space-x-4">
                    <button className="text-slate-400 hover:text-white transition-colors">
                      <Bell className="h-5 w-5" />
                    </button>
                    <div className="h-8 w-8 rounded-full bg-indigo-950/50 flex items-center justify-center overflow-hidden border border-white/10 cursor-pointer">
                      <img src={user.avatar} alt={user.name} className="h-full w-full object-cover" />
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="flex items-center text-sm font-medium text-slate-400 hover:text-white transition-colors"
                    >
                      <LogOut className="h-4 w-4 mr-1" />
                      Sign out
                    </button>
                  </div>
                </div>
              </div>
            </nav>

            {mappedWorkflows.length === 0 ? (
              <main className="relative z-25 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 mb-6 border border-indigo-500/20 shadow-inner">
                    <SpiderNetworkIcon className="h-8 w-8 text-indigo-400 animate-pulse" />
                  </div>
                  <h1 className="text-3xl font-bold text-white tracking-tight">Welcome to Weaver, {user.name.split(' ')[0]}!</h1>
                  <p className="text-slate-400 mt-3 text-lg max-w-xl mx-auto">
                    Before we build your dashboard, let's connect your task tracking system to pull in your assignments.
                  </p>
                </div>
                {integrationUI}
              </main>
            ) : (
              <main className="relative z-25 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-in fade-in duration-500">
                <div className="mb-8">
                  <h1 className="text-2xl font-bold text-white">Your Workspace</h1>
                  <p className="text-slate-400 mt-1">Here is your woven workflow for today.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">
                      <Ticket className="h-6 w-6 text-blue-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400">Open Tickets</p>
                      <p className="text-2xl font-bold text-white mt-1">14</p>
                    </div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-indigo-500/10 p-3 rounded-lg border border-indigo-500/20">
                      <CheckSquare className="h-6 w-6 text-indigo-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400">Active Tasks</p>
                      <p className="text-2xl font-bold text-white mt-1">{activeTasksCount}</p>
                    </div>
                  </div>
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex items-start space-x-4">
                    <div className="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20">
                      <CheckCircle2 className="h-6 w-6 text-emerald-400" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-400">Resolved Today</p>
                      <p className="text-2xl font-bold text-white mt-1">5</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl flex flex-col justify-between">
                    <div>
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                        <div>
                          <div className="flex items-center space-x-2 mb-1">
                            <Target className="h-5 w-5 text-indigo-400" />
                            <h2 className="text-lg font-semibold text-white">Completion</h2>
                          </div>
                          <p className="text-sm text-slate-400">Track progress of your mapped tasks.</p>
                        </div>
                        <div className="flex items-center space-x-2 shrink-0">
                          <span className="text-sm text-slate-400 font-medium">Filter:</span>
                          <select
                            value={completionFilterType}
                            onChange={(e) => {
                              setCompletionFilterType(e.target.value);
                              if (e.target.value === 'tags' && uniqueTags.length > 0) {
                                setSelectedTagFilter(uniqueTags[0]);
                              }
                            }}
                            className="border border-white/10 rounded-lg px-2 py-1 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-900"
                          >
                            <option value="none">None</option>
                            <option value="tags">Tags</option>
                          </select>

                          {completionFilterType === 'tags' && (
                            <select
                              value={selectedTagFilter}
                              onChange={(e) => setSelectedTagFilter(e.target.value)}
                              className="border border-white/10 rounded-lg px-2 py-1 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-900 min-w-[100px] max-w-[150px]"
                            >
                              {uniqueTags.length === 0 && <option value="">No tags</option>}
                              {uniqueTags.map(tag => (
                                <option key={tag} value={tag}>{tag}</option>
                              ))}
                            </select>
                          )}
                        </div>
                      </div>
                      
                      <div className="flex items-end justify-between mb-4">
                        <div>
                          <span className="text-5xl font-extrabold text-white">{completionPercentage}%</span>
                        </div>
                        <div className="text-right">
                          <p className="text-sm font-medium text-white">{completedFiltered} of {totalFiltered}</p>
                          <p className="text-xs text-slate-400 uppercase tracking-wider">Tasks Done</p>
                        </div>
                      </div>
                      
                      <div className="w-full bg-slate-950 border border-white/5 rounded-full h-4 overflow-hidden mb-2 shadow-inner">
                        <div 
                          className="bg-gradient-to-r from-indigo-500 to-violet-500 h-4 rounded-full transition-all duration-1000 ease-out shadow-[0_0_12px_rgba(99,102,241,0.4)]" 
                          style={{ width: `${completionPercentage}%` }}
                        ></div>
                      </div>
                    </div>
                    {completionFilterType === 'tags' && uniqueTags.length === 0 && (
                      <div className="mt-4 p-3 bg-amber-950/20 rounded-lg border border-amber-900/40 flex items-start text-sm text-amber-300">
                        <AlertTriangle className="h-4 w-4 mr-2 shrink-0 mt-0.5 text-amber-500" />
                        <span>No tags were found in the tasks you mapped.</span>
                      </div>
                    )}
                  </div>

                  <div className="bg-slate-900/40 backdrop-blur-md p-6 rounded-2xl border border-white/5 shadow-xl">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-6 gap-4">
                      <div>
                        <div className="flex items-center space-x-2 mb-1">
                          <TrendingDown className="h-5 w-5 text-indigo-400" />
                          <h2 className="text-lg font-semibold text-white">Sprint Burndown</h2>
                        </div>
                        <p className="text-sm text-slate-400">Tracking active tasks over the current 14-day sprint cycle.</p>
                      </div>
                      <div className="flex flex-row sm:flex-col gap-4 sm:gap-1.5 text-sm bg-slate-950/40 px-3 py-2 rounded-lg border border-white/5 shrink-0">
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-4 h-0 border-t-2 border-dashed border-slate-500 mr-2"></div>
                          Ideal
                        </div>
                        <div className="flex items-center text-slate-400 font-medium">
                          <div className="w-3 h-3 bg-indigo-500 rounded-full mr-2 shadow-lg shadow-indigo-500/50"></div>
                          Actual
                        </div>
                      </div>
                    </div>
                    
                    <div className="relative h-48 w-full">
                      <div className="absolute left-0 top-0 bottom-6 w-8 flex flex-col justify-between text-xs font-medium text-slate-500 text-right pr-2">
                        <span>50</span>
                        <span>37</span>
                        <span>25</span>
                        <span>12</span>
                        <span>0</span>
                      </div>
                      
                      <div className="absolute left-10 right-2 top-2 bottom-6">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                          <defs>
                            <linearGradient id="burndownGradient" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stopColor="#6366f1" stopOpacity="0.15" />
                              <stop offset="100%" stopColor="#6366f1" stopOpacity="0" />
                            </linearGradient>
                          </defs>
                          <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="25" x2="100" y2="25" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="75" x2="100" y2="75" stroke="#1e293b" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="0" y1="100" x2="100" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
                          <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                          <line x1="100" y1="0" x2="100" y2="100" stroke="#111827" strokeWidth="1" vectorEffect="non-scaling-stroke" />

                          <line x1="0" y1="0" x2="100" y2="100" stroke="#475569" strokeWidth="2" strokeDasharray="6 6" vectorEffect="non-scaling-stroke" />

                          <polygon
                            points="0,100 0,0 10,5 20,15 30,15 40,30 50,35 60,60 70,65 80,80 90,90 100,95 100,100"
                            fill="url(#burndownGradient)"
                          />

                          <polyline
                            points="0,0 10,5 20,15 30,15 40,30 50,35 60,60 70,65 80,80 90,90 100,95"
                            fill="none"
                            stroke="#6366f1"
                            strokeWidth="3"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            vectorEffect="non-scaling-stroke"
                          />
                        </svg>
                      </div>

                      <div className="absolute left-10 right-2 bottom-0 h-6 flex justify-between text-xs font-medium text-slate-500">
                        <span className="-ml-3">Day 1</span>
                        <span>Day 5</span>
                        <span>Day 10</span>
                        <span className="-mr-4">Day 14</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="space-y-6">
                  <div className="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-white/5 shadow-xl overflow-hidden">
                    <div className="px-6 py-4 border-b border-white/5 bg-slate-900/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div className="flex items-center space-x-3">
                        <h2 className="text-lg font-semibold text-white">Active Workflows</h2>
                        {isAutoSyncing ? (
                          <span className="flex items-center text-xs font-medium text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20 transition-all">
                            <RefreshCw className="h-3 w-3 mr-1 animate-spin" /> Syncing...
                          </span>
                        ) : (
                          <span className="flex items-center text-xs font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20 transition-all">
                            <div className="h-2 w-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></div> Auto-sync On
                          </span>
                        )}
                      </div>
                      <button 
                        onClick={handleConnectClickUp}
                        className="text-sm font-medium text-indigo-400 hover:text-white flex items-center shrink-0 transition-colors"
                      >
                        <Plus className="h-4 w-4 mr-1" /> Add Another
                      </button>
                    </div>
                    <ul className="divide-y divide-white/5">
                      {mappedWorkflows.map(workflow => (
                        <li key={workflow.id} className="p-6 hover:bg-white/5 transition-colors">
                          <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                            <div className="flex items-start space-x-4">
                              <div className="bg-indigo-500/10 p-2.5 rounded-lg hidden sm:block mt-1 border border-indigo-500/20">
                                <SpiderNetworkIcon className="h-5 w-5 text-indigo-400" />
                              </div>
                              <div className="flex flex-col space-y-1.5 w-full">
                                <div className="flex flex-wrap items-center text-sm text-slate-300 gap-y-2">
                                  <span className="font-semibold text-white flex items-center">
                                    <Box className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.team} / {workflow.space}
                                  </span>
                                  {workflow.folder !== 'No Folder' && (
                                    <>
                                      <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                      <span className="flex items-center text-slate-300">
                                        <FolderOpen className="h-4 w-4 mr-1.5 text-slate-400" /> {workflow.folder}
                                      </span>
                                    </>
                                  )}
                                  <ChevronRight className="h-4 w-4 mx-2 text-slate-600 hidden sm:block" />
                                  <span className="font-semibold text-indigo-400 flex items-center bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20 shadow-sm">
                                    <ListTodo className="h-4 w-4 mr-1.5" /> {workflow.list}
                                  </span>
                                </div>
                                <div className="flex items-center text-xs text-slate-500">
                                  <Clock className="h-3 w-3 mr-1" />
                                  Last synced: {new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric' }).format(new Date(workflow.lastSynced))}
                                </div>
                              </div>
                            </div>
                            <button 
                              onClick={() => removeMapping(workflow.id)}
                              className="text-slate-400 hover:text-red-400 transition-colors p-2 rounded-md hover:bg-red-950/20 shrink-0 self-end sm:self-start"
                              title="Remove Mapping"
                            >
                              <Trash2 className="h-5 w-5" />
                            </button>
                          </div>

                          <div className="mt-5 pt-4 border-t border-white/5 sm:ml-12 pl-1 sm:pl-0">
                            <div className="flex items-center justify-between mb-3">
                              <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Tasks</h4>
                              <span className="text-xs bg-slate-900/60 text-slate-400 border border-white/5 px-2.5 py-0.5 rounded-full font-medium">
                                {workflow.tasks?.length || 0} items
                              </span>
                            </div>
                            
                            {workflow.tasks && workflow.tasks.length > 0 ? (
                              <div className="space-y-2">
                                {workflow.tasks.map(task => (
                                  <div key={task.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-slate-950/30 border border-white/5 rounded-xl shadow-inner hover:border-indigo-500/20 transition-all gap-3">
                                    <div className="flex items-center space-x-3 overflow-hidden min-w-0">
                                      <div 
                                        className="w-2.5 h-2.5 rounded-full shrink-0 shadow-lg" 
                                        style={{ backgroundColor: task.status?.color || '#cbd5e1', boxShadow: `0 0 8px ${task.status?.color || '#cbd5e1'}` }} 
                                        title={`Status: ${task.status?.status || 'Unknown'}`}
                                      />
                                      <span className="text-sm font-medium text-slate-200 truncate">
                                        {task.name}
                                      </span>
                                    </div>
                                    <div className="flex items-center shrink-0 space-x-3 sm:pl-4 pl-5 overflow-x-auto overflow-y-hidden py-1">
                                      {task.tags && task.tags.length > 0 && (
                                        <div className="flex items-center space-x-1 mr-2 hidden sm:flex">
                                          <Tag className="h-3 w-3 text-slate-500 mr-1" />
                                          {task.tags.map((tag, i) => (
                                            <span 
                                              key={i} 
                                              className="px-1.5 py-0.5 text-[10px] font-semibold rounded whitespace-nowrap"
                                              style={{ color: tag.color, backgroundColor: `${tag.color}15`, border: `1px solid ${tag.color}30` }}
                                            >
                                              {tag.name}
                                            </span>
                                          ))}
                                        </div>
                                      )}
                                      {task.due_date && (
                                        <div className="flex items-center text-xs text-slate-400 whitespace-nowrap" title="Due Date">
                                          <Calendar className="h-3.5 w-3.5 mr-1.5 text-slate-500" />
                                          {new Date(parseInt(task.due_date)).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                                        </div>
                                      )}
                                      {task.priority && (
                                        <div className="flex items-center text-xs text-slate-400 capitalize whitespace-nowrap" title={`Priority: ${task.priority.priority}`}>
                                          <Flag className="h-3.5 w-3.5 mr-1.5" style={{ color: task.priority.color }} />
                                          {task.priority.priority}
                                        </div>
                                      )}
                                      {task.assignees && task.assignees.length > 0 ? (
                                        <div className="flex -space-x-1.5">
                                          {task.assignees.map((assignee, i) => (
                                            <img 
                                              key={i} 
                                              src={assignee.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee.username)}&background=random`} 
                                              alt={assignee.username} 
                                              className="w-6 h-6 rounded-full border border-slate-900 bg-slate-800 object-cover" 
                                              title={`Assigned to ${assignee.username}`} 
                                            />
                                          ))}
                                        </div>
                                      ) : (
                                        <div className="flex items-center justify-center w-6 h-6 rounded-full border border-white/5 bg-slate-900 text-slate-500" title="Unassigned">
                                          <Users className="h-3 w-3" />
                                        </div>
                                      )}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <div className="text-sm text-slate-400 italic p-4 bg-slate-950/20 rounded-lg text-center border border-white/5">
                                No active tasks found in this list.
                              </div>
                            )}
                          </div>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {integrationStep !== 'idle' && (
                    <div className="mt-8 animate-in fade-in slide-in-from-top-4">
                      <h3 className="text-lg font-semibold text-white mb-4">Map Another Workflow</h3>
                      {integrationUI}
                    </div>
                  )}
                </div>
              </main>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 flex font-sans relative overflow-hidden">
          <WebNestBackground opacity={0.85} />
          
          <div className="absolute inset-0 pointer-events-none z-10" style={{ background: 'radial-gradient(circle, transparent 30%, rgba(9, 13, 22, 0.4) 100%)' }}></div>

          <div className="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative z-20">
            <div className="max-w-md relative bg-slate-900/40 backdrop-blur-md p-8 rounded-[2rem] border border-white/5 shadow-2xl">
              <div className="flex items-center mb-8">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                  <SpiderNetworkIcon className="h-8 w-8 text-white" />
                </div>
                <span className="ml-3 text-3xl font-extrabold tracking-tight text-white">Weaver</span>
              </div>
              <h1 className="text-4xl font-bold text-white leading-tight mb-6">
                Thread your support and development together.
              </h1>
              <p className="text-lg text-slate-300 mb-8 leading-relaxed font-medium">
                Weaver creates a seamless bridge between your front-line ticketing apps and your back-office task managers. Resolve faster, together.
              </p>
              
              <div className="space-y-4">
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Native syncing with Zendesk & Jira</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Automated task creation from tickets</span>
                </div>
                <div className="flex items-center text-slate-200 font-medium">
                  <CheckCircle2 className="h-5 w-5 text-indigo-400 mr-3 shrink-0" />
                  <span>Real-time status updates across teams</span>
                </div>
              </div>
            </div>
          </div>

          <div className="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 relative z-20 bg-slate-950/20 backdrop-blur-[4px] border-l border-white/10 shadow-[-20px_0_50px_rgba(0,0,0,0.3)]">
            <div className="absolute top-8 left-8 flex items-center lg:hidden bg-slate-900/60 backdrop-blur-xl px-4 py-2 rounded-2xl shadow-sm border border-white/10">
              <SpiderNetworkIcon className="h-6 w-6 text-indigo-400" />
              <span className="ml-2 text-xl font-bold tracking-tight text-white">Weaver</span>
            </div>

            <div className="w-full max-w-sm space-y-8 bg-slate-900/30 backdrop-blur-2xl p-8 sm:p-10 rounded-[2.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] border border-white/10">
              <div className="text-center lg:text-left">
                <h2 className="text-3xl font-bold text-white tracking-tight">Welcome back</h2>
                <p className="mt-2 text-sm text-slate-400 font-medium">
                  Please sign in to your account to continue.
                </p>
              </div>

              <div className="mt-8 space-y-6">
                <button
                  onClick={handleGoogleLogin}
                  disabled={isLoggingIn}
                  className="w-full flex items-center justify-center px-4 py-3 border border-slate-700/60 shadow-lg bg-slate-800/80 hover:bg-slate-800 text-sm font-medium text-slate-100 hover:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all disabled:opacity-70 disabled:cursor-not-allowed"
                >
                  {isLoggingIn ? (
                    <div className="flex items-center space-x-2">
                      <div className="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                      <span>Connecting...</span>
                    </div>
                  ) : (
                    <>
                      <svg className="h-5 w-5 mr-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                      </svg>
                      Sign in with Google
                    </>
                  )}
                </button>

                {errorMessage && (
                  <div className="mt-4 p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300 animate-in fade-in slide-in-from-top-2">
                    <p className="font-semibold mb-1">{errorMessage}</p>
                  </div>
                )}

                <p className="text-center text-xs text-slate-500 mt-8">
                  By clicking continue, you agree to our{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">
                    Terms of Service
                  </a>{' '}
                  and{' '}
                  <a href="#" className="font-medium text-indigo-400 hover:text-indigo-300">
                    Privacy Policy
                  </a>.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render to Virtual DOM root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
